function calcPurchaseDiscount(){
  var subtotal=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  var discType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var discVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;
  var el=document.getElementById('pu-totals-summary');if(!el)return;
  el.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--success)">Supplier discount</span><span style="color:var(--success)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Net total payable</span><span>'+fmt(finalTotal)+'</span></div>';
}
function submitPurchase(){
  if(!purchaseItems.length){alert('Add at least one item.');return;}
  var supId=document.getElementById('pu-supplier').value;
  var invNum=document.getElementById('pu-invnum').value.trim();
  var payType=document.getElementById('pu-paytype').value;
  var pm=document.getElementById('pu-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('pu-bankid')?document.getElementById('pu-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('pu-posid')?document.getElementById('pu-posid').value:''):null;
  var partAmt=parseFloat(document.getElementById('pu-part-amt')?document.getElementById('pu-part-amt').value:0)||0;
  if(!supId){alert('Supplier is required. Please select a supplier.');return;}
  if(!invNum){alert('Invoice number is required. Please enter the supplier\'s invoice number.');return;}
  if(pm==='transfer'&&DB.banks.length&&!bankId){alert('Select which bank the transfer was made to.');return;}
  if(pm==='pos'&&DB.posTerminals.length&&!posId){alert('Select which POS terminal was used.');return;}
  if(payType==='part'&&partAmt<=0){alert('Enter the amount paid now for part payment.');return;}
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  var subtotalPu=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  // Read purchase-level supplier discount
  var puDiscType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var puDiscVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var puDiscAmt=puDiscType==='pct'?(subtotalPu*puDiscVal/100):puDiscType==='flat'?Math.min(puDiscVal,subtotalPu):0;
  var grandTotal=subtotalPu-puDiscAmt;
  var puDateEl=document.getElementById('pu-date');
  var puDateVal=puDateEl?puDateEl.value:'';
  var date,month;
  if(puDateVal){var dp=puDateVal.split('-');var cd=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));date=cd.toLocaleDateString();month=puDateVal.slice(0,7);}
  else{date=new Date().toLocaleDateString();month=new Date().toISOString().slice(0,7);}
  var purchaseId=uid();
  var creditAmt=payType==='credit'?grandTotal:payType==='part'?(grandTotal-partAmt):0;
  var cashPaid=payType==='cash'?grandTotal:payType==='part'?partAmt:0;
  // Add RECEIVED qty to stock (not ordered qty)
  var belowCostWarnings=[];
  purchaseItems.forEach(function(l){
    var qtyToAdd=l.qtyReceived||l.qty||0; // use received qty
    if(qtyToAdd<=0)return; // nothing received yet for this line
    if(l.itemId){
      var existing=DB.inventory.find(function(i){return i.id==l.itemId;});
      if(existing){
        existing.qty+=qtyToAdd;existing.cost=l.cost;existing.supId=supId||existing.supId;
        if(existing.sell<l.cost){belowCostWarnings.push(existing.name+': sell price '+fmt(existing.sell)+' is now below new cost '+fmt(l.cost));}
      }
    } else {
      var byName=DB.inventory.find(function(i){return i.name.toLowerCase()===l.name.toLowerCase();});
      if(byName){byName.qty+=qtyToAdd;byName.cost=l.cost;if(byName.sell<l.cost)belowCostWarnings.push(byName.name+': sell price '+fmt(byName.sell)+' is now below new cost '+fmt(l.cost));}
      else{DB.inventory.push({id:uid(),name:l.name,qty:qtyToAdd,cost:l.cost,sell:l.cost,minQty:5,supId:supId,cat:''});}
    }
  });

  // Record pending deliveries for items not fully supplied
  var pendingLines=purchaseItems.filter(function(l){return (l.qtyPending||0)>0;});
  if(pendingLines.length){
    if(!DB.pendingDeliveries)DB.pendingDeliveries=[];
    pendingLines.forEach(function(l){
      DB.pendingDeliveries.push({
        id:uid(),
        purchaseId:purchaseId,
        invoiceNum:invNum,
        supId:supId,
        supName:sup?sup.name:'Unknown',
        itemId:l.itemId||null,
        itemName:l.name,
        qtyOrdered:l.qtyOrdered,
        qtyReceived:l.qtyReceived,
        qtyPending:l.qtyPending,
        cost:l.cost,
        dateOrdered:date,
        dateExpected:null,
        status:'pending', // 'pending' | 'partial' | 'complete'
        deliveries:[] // log of partial deliveries received
      });
    });
  }
  // Update supplier
  if(sup){
    sup.totalPurchased+=grandTotal;
    if(creditAmt>0)sup.owedToSupplier+=creditAmt;
    sup.purchases.push({id:purchaseId,desc:purchaseItems.length+' items',invoiceNum:invNum,amount:grandTotal,payment:payType,payMode:pm,bankId:bankId,posId:posId,date:date});
  }
  // Cashflow
  if(cashPaid>0){
    DB.cashflow.push({id:uid(),desc:'Purchase from '+(sup?sup.name:'Supplier')+' Inv#'+invNum,amount:cashPaid,type:'out',cat:'Restock',payMode:pm,bankId:bankId,posId:posId,date:date,month:month});
  }
  // Save purchase record
  DB.purchases.push({id:purchaseId,invoiceNum:invNum,supId:supId,supName:sup?sup.name:'Unknown',items:JSON.parse(JSON.stringify(purchaseItems)),subtotal:subtotalPu,discAmt:puDiscAmt,grandTotal:grandTotal,payType:payType,payMode:pm,bankId:bankId,posId:posId,partAmt:partAmt,creditAmt:creditAmt,cashPaid:cashPaid,date:date,month:month,by:DB.currentUser.name});
  purchaseItems=[];
  saveData();
  var totalReceived=purchaseItems.length; // already cleared so use pendingLines count
  var successMsg='✅ Purchase recorded! Stock updated.\nInvoice #'+invNum+' from '+(sup?sup.name:'supplier')+'.';
  if(pendingLines.length){
    var pendingQty=pendingLines.reduce(function(a,l){return a+l.qtyPending;},0);
    successMsg+='\n\n📦 PENDING DELIVERY: '+pendingLines.length+' item line(s) with '+pendingQty+' unit(s) not yet received.\nThese have been added to the Pending Deliveries tracker. Go to Purchases → Pending Deliveries to record when the supplier brings the remaining items.';
  }
  if(belowCostWarnings.length){
    successMsg+='\n\n⚠️ SELLING PRICE ALERT — '+belowCostWarnings.length+' item(s) now have selling price below new cost:\n'+belowCostWarnings.join('\n')+'\n\nUpdate selling prices in Stock Management before selling.';
  }
  alert(successMsg);
  renderApp();
}
function deletePurchase(id){
  var p=DB.purchases.find(function(x){return x.id===id;});
  if(!p)return;
  showConfirm({
    type:'danger',
    title:'Delete purchase record?',
    msg:'This purchase will be moved to the Recycle Bin. Note: Stock already added to inventory is NOT reversed.',
    detail:'🛒 '+p.supName+' · Invoice #'+(p.invoiceNum||'-')+' · '+fmt(p.grandTotal),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('purchase',p,'Purchases');
    DB.purchases=DB.purchases.filter(function(x){return x.id!==id;});
    saveData();renderApp();
  });
}
function printPurchaseRecord(id){
  var pu=DB.purchases.find(function(p){return p.id==id;});if(!pu)return;

function receiveDelivery(deliveryId){
  var d=DB.pendingDeliveries.find(function(x){return x.id==deliveryId;});
  if(!d){alert('Delivery record not found.');return;}

  var remaining=d.qtyPending;
  var qtyToReceive=parseInt(prompt(
    'Receive delivery for: '+d.itemName+
    '\nSupplier: '+d.supName+
    '\nPending qty: '+remaining+
    '\n\nHow many units are you receiving now?'
    ,remaining));

  if(isNaN(qtyToReceive)||qtyToReceive<=0){return;}
  if(qtyToReceive>remaining){
    alert('Cannot receive more than pending qty ('+remaining+').');return;
  }

  // Update inventory stock
  var invItem=DB.inventory.find(function(i){return i.id==d.itemId;});
  if(invItem){
    var before=invItem.qty;
    invItem.qty+=qtyToReceive;
    DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,
      type:'add',reason:'Pending delivery received — Invoice #'+d.invoiceNum+' from '+d.supName,
      before:before,change:qtyToReceive,after:invItem.qty,
      date:new Date().toLocaleDateString(),by:DB.currentUser.name});
  }

  // Update delivery record
  d.qtyReceived=(d.qtyReceived||0)+qtyToReceive;
  d.qtyPending=d.qtyOrdered-d.qtyReceived;
  d.lastReceivedDate=new Date().toLocaleDateString();
  if(d.qtyPending<=0){
    d.status='complete';
    d.completedDate=new Date().toLocaleDateString();
  }

  // Update original purchase item received qty
  var purchase=DB.purchases.find(function(p){return p.id==d.purchaseId||p.invoiceNum==d.invoiceNum;});
  if(purchase){
    var pItem=purchase.items.find(function(l){return l.name===d.itemName||(l.itemId&&l.itemId==d.itemId);});
    if(pItem){
      pItem.qtyReceived=(pItem.qtyReceived||0)+qtyToReceive;
      pItem.qtyPending=pItem.qtyOrdered-pItem.qtyReceived;
    }
  }

  logActivity('Delivery received',
    d.itemName+' × '+qtyToReceive+' received from '+d.supName+' — Invoice #'+d.invoiceNum+
    (d.qtyPending<=0?' (Fully delivered)':' ('+d.qtyPending+' still pending)'),
    'purchase');

  saveData();
  renderPanel();
  showToast('✅ '+qtyToReceive+' units of '+d.itemName+' added to stock.'+(d.qtyPending<=0?' Delivery complete!':' '+d.qtyPending+' still pending.'));
}

function buildPurchases(){
  if(!canDo('purchases'))return '<div class="empty">Access denied.</div>';

  // ── Purchase KPI date filter ──────────────────────────────────
  var puFilter=window._puKpiFilter||'month';
  var today=new Date();
  var todayStr=today.toLocaleDateString();
  function puInRange(dateStr){
    if(!dateStr)return false;
    var d=parseDate(dateStr);
    if(!d)return false;
    if(puFilter==='today'){
      return d.toDateString()===today.toDateString();
    } else if(puFilter==='week'){
      var wStart=new Date(today);wStart.setDate(today.getDate()-today.getDay());wStart.setHours(0,0,0,0);
      return d>=wStart&&d<=today;
    } else if(puFilter==='month'){
      return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
    } else if(puFilter==='custom'){
      var cf=window._puKpiFrom?parseDate(window._puKpiFrom):null;
      var ct=window._puKpiTo?parseDate(window._puKpiTo):null;
      if(cf)cf.setHours(0,0,0,0);
      if(ct)ct.setHours(23,59,59,999);
      return (!cf||d>=cf)&&(!ct||d<=ct);
    }
    return true;
  }

  // ── Calculate KPIs ───────────────────────────────────────────
  var filtPurch=DB.purchases.filter(function(p){return puInRange(p.date);});
  var totalPurchAmt=filtPurch.reduce(function(a,p){return a+(p.grandTotal||0);},0);
  // Total paid = purchases minus credit owed to suppliers
  var totalCreditOwed=filtPurch.filter(function(p){return p.payType==='credit';}).reduce(function(a,p){return a+(p.grandTotal||0);},0);
  var totalPartPaid=filtPurch.filter(function(p){return p.payType==='part';}).reduce(function(a,p){return a+(p.amtPaid||0);},0);
  var totalPaid=totalPurchAmt-totalCreditOwed+(totalPartPaid-(filtPurch.filter(function(p){return p.payType==='part';}).reduce(function(a,p){return a+(p.grandTotal||0);},0)-totalPartPaid>0?0:0));
  // Simpler: paid = non-credit total + part-paid amounts
  var fullyPaidPurch=filtPurch.filter(function(p){return p.payType==='cash';});
  var creditPurch=filtPurch.filter(function(p){return p.payType==='credit';});
  var partPurch=filtPurch.filter(function(p){return p.payType==='part';});
  var paidAmt=fullyPaidPurch.reduce(function(a,p){return a+(p.grandTotal||0);},0)
    +partPurch.reduce(function(a,p){return a+(p.amtPaid||p.grandTotal||0);},0);
  var outstandingAmt=totalPurchAmt-paidAmt;
  // Pending goods value
  var pendingGoodsVal=(DB.pendingDeliveries||[]).filter(function(d){
    return d.status!=='complete';
  }).reduce(function(a,d){return a+(d.qtyPending||0)*(d.cost||d.unitCost||0);},0);
  var pendingCount=(DB.pendingDeliveries||[]).filter(function(d){return d.status!=='complete';}).length;
  var supplierCount=new Set(filtPurch.map(function(p){return p.supId;})).size;

  // ── KPI HTML ─────────────────────────────────────────────────

  var kpiHtml=
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+

function processPurchaseReturn(purchId){
  var pu=DB.purchases.find(function(p){return p.id==purchId;});
  if(!pu){alert('Purchase not found.');return;}
  var reason=(document.getElementById('pur-reason')||{}).value||'';
  if(!reason.trim()){alert('Please enter a reason for the return.');return;}
  var returnType=document.getElementById('pur-type').value;
  var dateVal=document.getElementById('pur-date').value;
  var date=dateVal?new Date(dateVal).toLocaleDateString():new Date().toLocaleDateString();
  var month=dateVal?dateVal.slice(0,7):new Date().toISOString().slice(0,7);

  // Collect returned items
  var returnedItems=[];
  var totalValue=0;
  pu.items.forEach(function(l,i){
    var qtyInp=document.getElementById('pur-qty-'+i);
    if(!qtyInp)return;
    var qty=parseInt(qtyInp.value)||0;
    if(qty<=0)return;
    var cost=l.cost||0;
    returnedItems.push({name:l.name,qty:qty,cost:cost,total:qty*cost,itemId:l.itemId||null});
    totalValue+=qty*cost;
  });

  if(!returnedItems.length){alert('Select at least one item to return.');return;}

  // Exchange details
  var exchStatus='';
  var exchDesc='';
  if(returnType==='exchange'){
    var exchRadio=document.querySelector('input[name="pur-exch-status"]:checked');
    exchStatus=exchRadio?exchRadio.value:'pending';
    exchDesc=(document.getElementById('pur-exch-desc')||{}).value||'';
  }

  // Deduct returned stock from inventory
  returnedItems.forEach(function(ri){
    var invItem=ri.itemId?DB.inventory.find(function(i){return i.id==ri.itemId;}):
      DB.inventory.find(function(i){return i.name===ri.name;});
    if(invItem){
      var before=invItem.qty;
      invItem.qty=Math.max(0,invItem.qty-ri.qty);
      DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'remove',
        reason:'Purchase return to '+pu.supName+' — '+reason,
        before:before,change:-ri.qty,after:invItem.qty,date:date,by:DB.currentUser.name});
    }
  });

  // Handle supplier account
  var sup=DB.suppliers.find(function(s){return s.id==pu.supId;});
  if(sup){
    if(returnType==='credit'){
      // Reduce what we owe the supplier
      sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-totalValue);
      DB.cashflow.push({id:uid(),desc:'Purchase return credit — '+sup.name+' Invoice #'+(pu.invoiceNum||'-'),
        amount:totalValue,type:'in',cat:'Purchase Return',payMode:'credit',date:date,month:month});
    } else if(returnType==='refund'){
      // Supplier refunds us
      sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-totalValue);
      DB.cashflow.push({id:uid(),desc:'Purchase return refund — '+sup.name+' Invoice #'+(pu.invoiceNum||'-'),
        amount:totalValue,type:'in',cat:'Purchase Return',payMode:'cash',date:date,month:month});
    }
    // Exchange: no immediate credit — goods to be received
  }

  // Save return record
  if(!DB.purchaseReturns)DB.purchaseReturns=[];
  DB.purchaseReturns.push({
    id:uid(),purchaseId:purchId,purchaseInvoice:pu.invoiceNum,
    supId:pu.supId,supName:pu.supName,
    items:returnedItems,totalValue:totalValue,
    returnType:returnType,reason:reason,
    exchangeStatus:returnType==='exchange'?exchStatus:null,
    exchangeDesc:returnType==='exchange'?exchDesc:null,
    date:date,month:month,by:DB.currentUser.name
  });

  logActivity('Purchase return',
    'Returned '+returnedItems.map(function(r){return r.name+' x'+r.qty;}).join(', ')+
    ' to '+pu.supName+' ('+returnType+'). Value: '+fmt(totalValue),returnType);

  document.getElementById('pu-ret-modal').remove();
  saveData();renderApp();
  var typeLabel=returnType==='credit'?'Supplier credit applied':
    returnType==='refund'?'Refund recorded':
    exchStatus==='received'?'Exchange received':'Exchange pending';
  showToast('Return processed — '+typeLabel+'. Value: '+fmt(totalValue));
}

function markPurchReturnReceived(retId){
  var r=(DB.purchaseReturns||[]).find(function(x){return x.id===retId;});
  if(!r){alert('Return record not found.');return;}
  if(!confirm('Mark exchange goods as RECEIVED from '+r.supName+'?\n\nExpected: '+r.exchangeDesc))return;
  r.exchangeStatus='received';
  r.receivedDate=new Date().toLocaleDateString();
  logActivity('Exchange received','Replacement goods received from '+r.supName+' — Return of Invoice #'+r.purchaseInvoice,'exchange');
  saveData();renderApp();
  showToast('Exchange marked as received from '+r.supName);
}

function buildPurchaseReturnsSection(){
  if(!DB.purchaseReturns||!DB.purchaseReturns.length)return '';
  var rows=DB.purchaseReturns.slice().reverse().map(function(r){
    var typeBadge=r.returnType==='refund'?
      '<span class="badge ok">Refund</span>':
      r.returnType==='credit'?
      '<span class="badge" style="background:#7c3aed;color:#fff">Supplier Credit</span>':
      '<span class="badge info">Exchange</span>';
    var exchStatus='';
    if(r.returnType==='exchange'){
      exchStatus=r.exchangeStatus==='received'?
        '<span class="badge ok" style="font-size:10px">&#10003; Received</span>':
        '<span class="badge low" style="font-size:10px;cursor:pointer" onclick="markPurchReturnReceived(\''+r.id+'\')" title="Click to mark as received">Pending &#128466;</span>';
    }
    return '<tr style="background:#fff5f5">'+
      '<td>'+r.date+'</td>'+
      '<td><b>'+(r.purchaseInvoice||'-')+'</b></td>'+
      '<td>'+(r.supName||'-')+'</td>'+
      '<td style="font-size:11px">'+r.items.map(function(i){return i.name+' ×'+i.qty;}).join(', ')+'</td>'+
      '<td>'+typeBadge+'</td>'+
      '<td style="text-align:right;font-weight:700;color:#dc2626">'+fmt(r.totalValue)+'</td>'+
      '<td>'+(r.reason||'-')+'</td>'+
      '<td>'+exchStatus+'</td>'+
      '<td>'+r.by+'</td>'+
    '</tr>';
  }).join('');
  return '<p class="sec-title" style="margin-top:1.5rem;color:#dc2626">&#8617; Purchase Returns ('+DB.purchaseReturns.length+')</p>'+
    '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>Date</th><th>Invoice #</th><th>Supplier</th><th>Items</th><th>Type</th>'+
      '<th style="text-align:right">Value</th><th>Reason</th><th>Exchange Status</th><th>By</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function addExpense(){
  var desc=document.getElementById('ex-desc').value.trim(),amt=parseFloat(document.getElementById('ex-amt').value)||0,cat=document.getElementById('ex-cat').value,pm=document.getElementById('ex-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('ex-bankid')?document.getElementById('ex-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('ex-posid')?document.getElementById('ex-posid').value:''):null;
  if(!desc){alert('Enter a description.');return;}if(amt<=0){alert('Enter a valid amount.');return;}
  var exDateEl=document.getElementById('ex-date');
  var exDateVal=exDateEl?exDateEl.value:'';
  var date,month;
  if(exDateVal){var dp=exDateVal.split('-');var cd=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));date=cd.toLocaleDateString();month=exDateVal.slice(0,7);}
  else{date=new Date().toLocaleDateString();month=new Date().toISOString().slice(0,7);}
  DB.cashflow.push({id:uid(),desc:desc,amount:amt,type:'out',cat:cat,payMode:pm,bankId:bankId,posId:posId,date:date,month:month});
  saveData();renderApp();
}
function deleteExpense(id){
  var e=DB.cashflow.find(function(c){return c.id===id;});
  if(!e)return;
  showConfirm({
    type:'danger',
    title:'Delete expense?',
    msg:'The expense will be moved to the Recycle Bin.',
    detail:'💸 '+e.desc+' — '+fmt(e.amount)+' ('+e.cat+')',
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('expense',e,'Expenses');
    DB.cashflow=DB.cashflow.filter(function(c){return c.id!==id;});
    saveData();renderApp();
  });
}

function buildFinance(){
  if(!canDo('finance'))return '<div class="empty">Access denied.</div>';
  var now=new Date(),curMonth=now.toISOString().slice(0,7);
  var finFilter=window._finFilter||'month';
  var finMonth=window._finMonth||curMonth;
  var finFrom=window._finFrom||'';
  var finTo=window._finTo||'';

  // ── Apply date filter to a record given its stored date string ──
  function inRange(dateStr, monthStr) {
    if(finFilter==='today')  return dateStr===now.toLocaleDateString();
    if(finFilter==='month')  return (monthStr||'')===finMonth;
    if(finFilter==='range'){
      if(!finFrom&&!finTo) return true;
      return dateInRange(dateStr, finFrom, finTo);
    }
    return true; // 'all'
  }

  var salesF  = DB.sales.filter(function(s){ return inRange(s.date, s.month); });
  var expF    = DB.cashflow.filter(function(c){ return c.type==='out'&&c.cat!=='Restock'&&inRange(c.date,c.month); });
  var purchF  = DB.cashflow.filter(function(c){ return c.type==='out'&&c.cat==='Restock'&&inRange(c.date,c.month); });

  var rev           = salesF.reduce(function(a,s){return a+s.total;},0);
  var profit        = salesF.reduce(function(a,s){return a+s.profit;},0);
  var creditOwed    = salesF.filter(function(s){return s.payment==='credit';}).reduce(function(a,s){return a+s.total;},0);
  var pendingSupplyTotal = salesF.filter(function(s){return s.pendingSupply;}).reduce(function(a,s){return a+s.total;},0);
  var cashIn        = rev-creditOwed;
  var expTotal      = expF.reduce(function(a,c){return a+c.amount;},0);
  var purchTotal    = purchF.reduce(function(a,c){return a+c.amount;},0);
  var netCash       = cashIn-expTotal-purchTotal;
  var discTotal     = salesF.reduce(function(a,s){return a+(s.discAmt||0);},0);

  // Month selector options (last 24 months)
  var monthOpts='';
  for(var i=0;i<24;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var mv=d.toISOString().slice(0,7);
    monthOpts+='<option value="'+mv+'"'+(mv===finMonth?' selected':'')+'>'+d.toLocaleString('default',{month:'long',year:'numeric'})+'</option>';
  }

  // Active style helper
  function btnStyle(f){ return finFilter===f?'background:var(--primary);color:#fff;border-color:var(--primary)':''; }

  // Build period label for display
  var periodLabel = finFilter==='today' ? 'Today ('+now.toLocaleDateString()+')' :
                    finFilter==='month' ? (function(){ var d=new Date(finMonth+'-02'); return d.toLocaleString('default',{month:'long',year:'numeric'}); })() :
                    finFilter==='range' && (finFrom||finTo) ? (finFrom||'start')+' → '+(finTo||'today') :
                    'All time';

  var filterBar =
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.875rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)">'+
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:'+(finFilter==='month'||finFilter==='range'?'10px':'0')+'">'+
        '<span style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:4px">Period:</span>'+
        '<button class="btn sm" onclick="window._finFilter=\'today\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('today')+'">Today</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'month\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('month')+'">Month</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'all\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('all')+'">All time</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'range\';renderPanel()" style="'+btnStyle('range')+'">📅 Custom range</button>'+
        (finFilter==='month'?
          '<select onchange="window._finMonth=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">'+monthOpts+'</select>'
        :'')+
      '</div>'+
      (finFilter==='range'?
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">'+
          '<span style="font-size:12px;color:var(--text2);font-weight:600">From:</span>'+
          '<input type="date" value="'+finFrom+'" onchange="window._finFrom=this.value;renderPanel()" style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border)">'+
          '<span style="font-size:12px;color:var(--text2);font-weight:600">To:</span>'+
          '<input type="date" value="'+finTo+'" onchange="window._finTo=this.value;renderPanel()" style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border)">'+
          ((finFrom||finTo)?'<button class="btn sm" onclick="window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="color:var(--danger);border-color:#f5c2c7">✕ Clear</button>':'')+
        '</div>'
      :'')+
      '<div style="margin-top:'+(finFilter==='month'||finFilter==='range'?'8':'4')+'px;font-size:11.5px;color:var(--text3)">'+
        '📊 Showing: <b style="color:var(--dark)">'+periodLabel+'</b> &nbsp;·&nbsp; '+salesF.length+' sale(s) &nbsp;·&nbsp; '+expF.length+' expense(s)'+
      '</div>'+
    '</div>';

  return filterBar+
  '<div class="metrics">'+
    mc('Revenue',fmt(rev),'Total invoiced','')+
    mc('Gross profit',fmt(profit),pct(profit,rev)+' margin',profit>=0?'green':'red')+
    mc('Cash received',fmt(cashIn),'Excl. credit','')+
    mc('Credit owed',fmt(creditOwed),'Not yet paid','amber')+
    mc('Expenses',fmt(expTotal),'Outgoings','red')+
    mc('Restocking',fmt(purchTotal),'Purchases','red')+
    mc('Net cash',fmt(netCash),'In - expenses',netCash>=0?'green':'red')+
    mc('Discounts given',fmt(discTotal),'Total given','amber')+
  '</div>'+
  (pendingSupplyTotal>0?'<div style="background:#fff3cd;border:1px solid #ffe69c;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#664d03"><b>⏳ Goods not yet supplied:</b> '+fmt(pendingSupplyTotal)+' — payment received but stock not yet deducted</div>':'')+
  // ── 7-day Revenue & Profit Chart ─────────────────────────
  (function(){
    var days=[];
    for(var di=6;di>=0;di--){
      var dd=new Date();dd.setDate(dd.getDate()-di);
      var dstr=dd.toLocaleDateString();
      var dlbl=dd.toLocaleDateString('default',{weekday:'short'});
      var dRev=0,dProfit=0;
      DB.sales.forEach(function(s){if(s.date===dstr){dRev+=s.total;dProfit+=s.profit;}});
      days.push({lbl:dlbl,rev:dRev,profit:dProfit});
    }
    var maxD=days.reduce(function(m,d){return Math.max(m,d.rev,d.profit);},1);
    window._finChartDays=days;
    window._finChartMax=maxD;
  })();
  '<div class="card" style="margin-bottom:1.25rem">'+
  '<div class="sec-title">Revenue &amp; Profit — Last 7 Days</div>'+
  '<div style="display:flex;gap:6px;align-items:flex-end;height:120px;padding:0 4px 0">'+
  window._finChartDays.map(function(d){
    var revH=window._finChartMax>0?Math.max(2,Math.round((d.rev/window._finChartMax)*100)):2;
    var proH=window._finChartMax>0?Math.max(d.profit>0?2:0,Math.round((d.profit/window._finChartMax)*100)):0;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%">'+
      '<div style="flex:1;display:flex;align-items:flex-end;gap:2px;width:100%">'+
        '<div title="Revenue: '+fmt(d.rev)+'" style="flex:1;background:#c0392b;border-radius:3px 3px 0 0;height:'+revH+'%;min-height:'+(d.rev>0?'3px':'0')+';transition:height .4s;cursor:pointer"></div>'+
        '<div title="Profit: '+fmt(d.profit)+'" style="flex:1;background:#16a34a;border-radius:3px 3px 0 0;height:'+proH+'%;min-height:'+(d.profit>0?'3px':'0')+';transition:height .4s;cursor:pointer"></div>'+
      '</div>'+
      '<div style="font-size:9px;color:var(--text3);margin-top:3px">'+d.lbl+'</div>'+
    '</div>';
  }).join('')+
  '</div>'+
  '<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;padding-left:4px">'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:#c0392b;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Revenue</span>'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Profit</span>'+
    '<span style="margin-left:auto;font-size:10px;color:var(--text3)">Hover bars for amounts</span>'+
  '</div>'+
  '</div>'+

  '<p class="sec-title">Payment breakdown</p>'+
  (function(){
    var cashTotal=0,posTotal=0,transferTotal=0;
    salesF.forEach(function(s){
      if(s.payMode==='split'&&s.splitPayment){
        var sp=s.splitPayment;
        var ratio=s.total/(sp.amt1+sp.amt2)||1;
        if(sp.mode1==='cash')cashTotal+=sp.amt1*ratio;
        else if(sp.mode1==='pos')posTotal+=sp.amt1*ratio;
        else if(sp.mode1==='transfer')transferTotal+=sp.amt1*ratio;
        if(sp.mode2==='cash')cashTotal+=sp.amt2*ratio;
        else if(sp.mode2==='pos')posTotal+=sp.amt2*ratio;
        else if(sp.mode2==='transfer')transferTotal+=sp.amt2*ratio;
      } else if(s.payment!=='credit'){
        if(s.payMode==='cash')cashTotal+=s.total;
        else if(s.payMode==='pos')posTotal+=s.total;
        else if(s.payMode==='transfer')transferTotal+=s.total;
      }
    });
    return '<div class="metrics" style="grid-template-columns:repeat(3,1fr)">'+
      mc('Cash',fmt(cashTotal),'','')+
      mc('POS',fmt(posTotal),'','')+
      mc('Transfer',fmt(transferTotal),'','')+'</div>';
  })()
}

var supPaySearch='';
var supPayDateFrom='';
var supPayDateTo='';
var supPayFilterSup='';

function buildSupplierPayments(){
  if(!canDo('suppliers'))return '<div class="empty">Access denied.</div>';

  // Summary: total owed to all suppliers
  var totalOwed=DB.suppliers.reduce(function(a,s){return a+(s.owedToSupplier||0);},0);
  var totalPaidEver=(DB.supplierPayments||[]).reduce(function(a,p){return a+p.amount;},0);

  // Supplier selector options
  var supOpts='<option value="">All suppliers</option>'+
    DB.suppliers.map(function(s){return '<option value="'+s.id+'"'+(supPayFilterSup==s.id?' selected':'')+'>'+s.name+(s.owedToSupplier>0?' (owes '+fmt(s.owedToSupplier)+')':'')+'</option>';}).join('');

  // Filter payments
  var filtered=(DB.supplierPayments||[]).filter(function(p){
    if(supPaySearch&&p.supName.toLowerCase().indexOf(supPaySearch.toLowerCase())===-1&&(p.note||'').toLowerCase().indexOf(supPaySearch.toLowerCase())===-1)return false;
    if(supPayFilterSup&&String(p.supId)!==String(supPayFilterSup))return false;
    if(supPayDateFrom&&!dateInRange(p.date,supPayDateFrom,''))return false;
    if(supPayDateTo&&!dateInRange(p.date,'',supPayDateTo))return false;
    return true;
  }).slice().reverse();

  var filteredTotal=filtered.reduce(function(a,p){return a+p.amount;},0);

  // Supplier owed cards
  var owedCards=DB.suppliers.filter(function(s){return (s.owedToSupplier||0)>0;}).map(function(s){
    var paid=(DB.supplierPayments||[]).filter(function(p){return String(p.supId)==String(s.id);}).reduce(function(a,p){return a+p.amount;},0);
    var total=(s.totalPurchased||0);
    var pct=total>0?Math.min(100,Math.round((paid/total)*100)):0;
    return '<div class="card" style="border-left:4px solid #c0392b">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
        '<div>'+
          '<div style="font-size:14px;font-weight:700">'+s.name+'</div>'+
          '<div style="font-size:11px;color:var(--text3)">'+(s.contact||'')+(s.phone?' · '+s.phone:'')+'</div>'+
        '</div>'+
        '<button onclick="paySupplier('+s.id+')" style="padding:7px 14px;background:#15803d;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">💳 Pay now</button>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">'+
        '<div style="text-align:center"><div style="font-size:10px;color:#666">Total purchased</div><div style="font-size:13px;font-weight:700">'+fmt(s.totalPurchased||0)+'</div></div>'+
        '<div style="text-align:center"><div style="font-size:10px;color:#666">Total paid</div><div style="font-size:13px;font-weight:700;color:#15803d">'+fmt(paid)+'</div></div>'+
        '<div style="text-align:center"><div style="font-size:10px;color:#666">Still owed</div><div style="font-size:13px;font-weight:700;color:#c0392b">'+fmt(s.owedToSupplier)+'</div></div>'+
      '</div>'+
      '<div style="background:#f5f5f5;border-radius:4px;height:6px;overflow:hidden">'+
        '<div style="background:#15803d;height:100%;width:'+pct+'%;border-radius:4px;transition:width .5s"></div>'+
      '</div>'+
      '<div style="font-size:10px;color:#666;margin-top:4px">'+pct+'% paid</div>'+
    '</div>';
  }).join('');

  // Payment history rows
  var rows=filtered.map(function(p,i){
    return '<tr>'+
      '<td>'+p.date+'</td>'+
      '<td style="font-weight:700">'+p.supName+'</td>'+
      '<td style="text-align:right;font-weight:700;color:#15803d">'+fmt(p.amount)+'</td>'+
      '<td>'+p.mode+'</td>'+
      '<td>'+(p.note||'—')+'</td>'+
      '<td>'+p.by+'</td>'+
    '</tr>';
  }).join('');

  return '<p class="sec-title">💳 Supplier Payments</p>'+

    // Top metrics
    '<div class="metrics" style="margin-bottom:1rem">'+
      mc('Total owed',fmt(totalOwed),'To all suppliers',totalOwed>0?'red':'')+
      mc('Total paid ever',fmt(totalPaidEver),'All time','green')+
      mc('Suppliers with debt',DB.suppliers.filter(function(s){return (s.owedToSupplier||0)>0;}).length,'','red')+
    '</div>'+

    // Owed cards
    (owedCards?'<p class="sec-title" style="margin-bottom:10px">Suppliers with outstanding balance</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:1.5rem">'+owedCards+'</div>':
    '<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px 16px;font-size:13px;color:#15803d;margin-bottom:1.5rem">✅ No outstanding supplier balances — all suppliers are fully paid!</div>')+

    // Payment history
    '<p class="sec-title" style="margin-bottom:10px">Payment history</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
      '<input type="text" placeholder="Search supplier or reference..." value="'+supPaySearch+'" oninput="supPaySearch=this.value;renderPanel()" style="padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;min-width:200px">'+
      '<select onchange="supPayFilterSup=this.value;renderPanel()" style="padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px">'+supOpts+'</select>'+
      '<input type="date" value="'+supPayDateFrom+'" onchange="supPayDateFrom=this.value;renderPanel()" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px">'+
      '<span style="font-size:12px;color:var(--text3)">to</span>'+
      '<input type="date" value="'+supPayDateTo+'" onchange="supPayDateTo=this.value;renderPanel()" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px">'+
      '<button onclick="supPaySearch=\'\';supPayFilterSup=\'\';supPayDateFrom=\'\';supPayDateTo=\'\';renderPanel()" class="btn sm">Clear</button>'+
      '<button onclick="printSupplierPaymentsReport()" class="btn sm" style="color:#1a237e;border-color:#93c5fd">🖨️ Print</button>'+
    '</div>'+
    (rows?
      '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Supplier</th><th style="text-align:right">Amount paid</th><th>Mode</th><th>Reference</th><th>By</th></tr></thead>'+
      '<tbody>'+rows+
      '<tr style="background:#f0fdf4;font-weight:700;border-top:2px solid #15803d"><td colspan="2">TOTAL — '+filtered.length+' payment(s)</td><td style="text-align:right;color:#15803d">'+fmt(filteredTotal)+'</td><td colspan="3"></td></tr>'+
      '</tbody></table></div>'
    :'<div class="empty">No payments recorded'+(supPaySearch||supPayFilterSup||supPayDateFrom||supPayDateTo?' for this filter.':'.')+'</div>');
}

    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even)td{background:#f0fdf4}'+
    '.tr td{font-weight:700;background:#d1fae5;border-top:2px solid #15803d}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:11px;font-weight:700;color:#15803d;margin-top:4px">SUPPLIER PAYMENTS REPORT</div>'+
      '<div style="font-size:9px;color:#555;margin-top:2px">Period: '+dateRange+' | Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<table><thead><tr><th>#</th><th>Date</th><th>Supplier</th><th style="text-align:right">Amount paid</th><th>Mode</th><th>Reference</th><th>By</th></tr></thead>'+
    '<tbody>'+rows+
    '<tr class="tr"><td colspan="3">TOTAL — '+filtered.length+' payment(s)</td><td style="text-align:right;color:green">'+fmt(total)+'</td><td colspan="3"></td></tr>'+
    '</tbody></table></body></html>';

}

function saveSupplierPayment(supId){
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  if(!sup){alert('Supplier not found.');return;}
  var amt=parseFloat(document.getElementById('sp-amount').value)||0;
  if(amt<=0){alert('Enter a valid amount.');return;}
  var mode=document.getElementById('sp-mode').value;
  var bankId=(document.getElementById('sp-bank')||{}).value||null;
  var posId=(document.getElementById('sp-pos')||{}).value||null;
  var note=(document.getElementById('sp-note')||{}).value||'';
  var dateEl=document.getElementById('sp-date');
  var dateVal=dateEl&&dateEl.value?new Date(dateEl.value).toLocaleDateString():new Date().toLocaleDateString();
  var month=dateEl&&dateEl.value?dateEl.value.slice(0,7):new Date().toISOString().slice(0,7);

  var bank=bankId?(DB.banks||[]).find(function(b){return b.id==bankId;}):null;
  var pos=posId?(DB.posTerminals||[]).find(function(p){return p.id==posId;}):null;
  var modeLabel=mode==='transfer'?'Transfer'+(bank?' ('+(bank.name||bank.bankName)+')':''):mode==='pos'?'POS'+(pos?' ('+pos.name+')':''):mode==='cheque'?'Cheque':'Cash';

  if(!DB.supplierPayments)DB.supplierPayments=[];
  DB.supplierPayments.push({id:uid(),supId:supId,supName:sup.name,amount:amt,
    mode:modeLabel,payMode:mode,bankId:bankId||null,posId:posId||null,
    note:note,date:dateVal,month:month,by:DB.currentUser.name});

  // Record in cashflow as supplier payment outflow
  DB.cashflow.push({id:uid(),desc:'Supplier payment — '+sup.name+(note?' ('+note+')':''),
    amount:amt,type:'out',cat:'Restock',payMode:mode,bankId:bankId||null,posId:posId||null,
    date:dateVal,month:month});

  sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-amt);
  logActivity('Supplier payment','Paid '+fmt(amt)+' to '+sup.name+' via '+modeLabel+'. Remaining: '+fmt(sup.owedToSupplier),mode);
  document.getElementById('sup-pay-form-overlay').remove();
  saveData();renderApp();
  showToast('Payment of '+fmt(amt)+' recorded for '+sup.name+'. Remaining: '+fmt(sup.owedToSupplier));
}

function buildReports(){
  if(!canDo('reports'))return '<div class="empty">Access denied.</div>';
  var staffList=[...new Set(DB.sales.map(function(s){return s.seller;}))].filter(Boolean);
  var staffOpts=staffList.map(function(n){return '<option value="'+n+'"'+(reportStaff===n?' selected':'')+'>'+n+'</option>';}).join('');
  // ── Paid Invoice Summary: one row per invoice, no credit ──────
  // ── Returns Report: one row per invoice, grouped ──────────────
  // ── Income Report ────────────────────────────────────────────
  if(reportTab==='trend'){
    // ── Stock Purchase vs Selling Trend ──────────────────────────
    // Per-item: purchases cost vs sales revenue vs profit
    var itemMap={};
    // Gather purchase costs per item
    DB.purchases.forEach(function(p){
      if(!itemMap[p.itemId])itemMap[p.itemId]={name:p.name,costTotal:0,costQty:0,revTotal:0,revQty:0,profit:0};
      itemMap[p.itemId].costTotal+=(p.cost||0)*(p.qty||0);
      itemMap[p.itemId].costQty+=(p.qty||0);
    });
    // Gather sales revenue per item
    DB.sales.forEach(function(s){
      var key=s.itemId||s.name;
      if(!itemMap[key])itemMap[key]={name:s.name,costTotal:0,costQty:0,revTotal:0,revQty:0,profit:0};
      else if(!itemMap[key].name)itemMap[key].name=s.name;
      itemMap[key].revTotal+=(s.total||0);
      itemMap[key].revQty+=(s.qty||0);
      itemMap[key].profit+=(s.profit||0);
    });
    var items=Object.values(itemMap).filter(function(x){return x.revTotal>0||x.costTotal>0;});
    items.sort(function(a,b){return b.profit-a.profit;});
    var top10=items.slice(0,10);
    var maxVal=top10.reduce(function(m,i){return Math.max(m,i.revTotal,i.costTotal);},1);

    // Monthly revenue vs cost chart (last 6 months)
    var months=[];
    for(var mi=5;mi>=0;mi--){
      var d=new Date();d.setMonth(d.getMonth()-mi);
      months.push({label:d.toLocaleString('default',{month:'short'})+' '+d.getFullYear().toString().slice(2),
        month:d.getMonth(),year:d.getFullYear(),rev:0,cost:0,profit:0});
    }
    DB.sales.forEach(function(s){
      var sd=new Date(s.date);
      var m=months.find(function(x){return x.month===sd.getMonth()&&x.year===sd.getFullYear();});
      if(m){m.rev+=(s.total||0);m.profit+=(s.profit||0);}
    });
    DB.purchases.forEach(function(p){
      var pd=new Date(p.date||p.createdAt||'');
      if(isNaN(pd))return;
      var m=months.find(function(x){return x.month===pd.getMonth()&&x.year===pd.getFullYear();});
      if(m)m.cost+=(p.cost||0)*(p.qty||0);
    });
    var maxMonth=months.reduce(function(mx,m){return Math.max(mx,m.rev,m.cost);},1);

    var monthBars=months.map(function(m){
      var revPct=Math.round((m.rev/maxMonth)*100);
      var costPct=Math.round((m.cost/maxMonth)*100);
      var profitPct=Math.round((m.profit/maxMonth)*100);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">'+
        '<div style="width:100%;display:flex;gap:2px;align-items:flex-end;height:80px">'+
          '<div style="flex:1;background:#c0392b;border-radius:3px 3px 0 0;height:'+revPct+'%;min-height:'+(m.rev>0?'3px':'0')+';transition:height .4s" title="Revenue: '+fmt(m.rev)+'"></div>'+
          '<div style="flex:1;background:#1a237e;border-radius:3px 3px 0 0;height:'+costPct+'%;min-height:'+(m.cost>0?'3px':'0')+';transition:height .4s" title="Cost: '+fmt(m.cost)+'"></div>'+
          '<div style="flex:1;background:#16a34a;border-radius:3px 3px 0 0;height:'+profitPct+'%;min-height:'+(m.profit>0?'3px':'0')+';transition:height .4s" title="Profit: '+fmt(m.profit)+'"></div>'+
        '</div>'+
        '<div style="font-size:9px;color:var(--text3);text-align:center;white-space:nowrap">'+m.label+'</div>'+
        '<div style="font-size:9px;color:#16a34a;font-weight:700">'+fmt(m.profit)+'</div>'+
      '</div>';
    }).join('');

    var itemRows=items.map(function(i,idx){
      var margin=i.revTotal>0?Math.round((i.profit/i.revTotal)*100):0;
      var barW=i.revTotal>0?Math.round((i.revTotal/maxVal)*100):0;
      var costBarW=i.costTotal>0?Math.round((i.costTotal/maxVal)*100):0;
      var marginColor=margin>=30?'#16a34a':margin>=15?'#d97706':'#dc2626';
      return '<tr>'+
        '<td style="font-weight:600;font-size:12px">'+(idx+1)+'. '+i.name+'</td>'+
        '<td style="text-align:right;color:#1a237e">'+fmt(i.costTotal)+'<div style="height:4px;background:#e5e7eb;border-radius:2px;margin-top:3px"><div style="width:'+costBarW+'%;height:100%;background:#1a237e;border-radius:2px"></div></div></td>'+
        '<td style="text-align:right;color:#c0392b">'+fmt(i.revTotal)+'<div style="height:4px;background:#e5e7eb;border-radius:2px;margin-top:3px"><div style="width:'+barW+'%;height:100%;background:#c0392b;border-radius:2px"></div></div></td>'+
        '<td style="text-align:right;color:'+(i.profit>=0?'#16a34a':'#dc2626')+';font-weight:700">'+fmt(i.profit)+'</td>'+
        '<td style="text-align:center"><span style="font-size:11px;font-weight:700;color:'+marginColor+';background:'+(margin>=30?'#f0fdf4':margin>=15?'#fffbeb':'#fff0f0')+';padding:2px 8px;border-radius:99px">'+margin+'%</span></td>'+
        '<td style="text-align:center;color:var(--text3);font-size:12px">'+i.revQty+'</td>'+
      '</tr>';
    }).join('');

    var totCost=items.reduce(function(a,i){return a+i.costTotal;},0);
    var totRev=items.reduce(function(a,i){return a+i.revTotal;},0);
    var totProfit=items.reduce(function(a,i){return a+i.profit;},0);
    var totMargin=totRev>0?Math.round((totProfit/totRev)*100):0;

    var trendContent='<div>'+
      '<div style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)">&#128202; Stock Purchase vs Selling Trend</div>'+
      // Summary cards
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">'+
        '<div class="mc"><div class="ml">Total Cost (Purchases)</div><div class="mv" style="color:#1a237e">'+fmt(totCost)+'</div></div>'+

      if(g.payment==='deposit')return; // fully settled by deposit — already recorded on deposit date, skip
      // For all other payments, subtract any deposit applied so we don't double-count
      var depositUsed=g.depositApplied||0;
      var amtIn=g.payment==='part'?(g.partPayment||0):g.total;
      var newCash=Math.max(0,amtIn-depositUsed); // only the new money received on this invoice date
      if(newCash<=0)return; // nothing new came in — all covered by prior deposit
      var cat=g.payment==='part'?'Part payment':'Sales';
      var desc=g.desc+(depositUsed>0?' (deposit ₦'+Math.round(depositUsed).toLocaleString()+' excluded)':'');

  });

function printIncomeReport(){
  var incEvents=[];
  var saleMap={};
  DB.sales.filter(function(s){
    if(reportDateFrom&&!dateInRange(s.date,reportDateFrom,''))return false;
    if(reportDateTo&&!dateInRange(s.date,'',reportDateTo))return false;
    return true;
  }).forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!saleMap[k])saleMap[k]={date:s.date,desc:'Invoice #'+k+' — '+(s.printName||s.custName),payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,splitPayment:s.splitPayment||null,total:0,partPayment:s.partPayment||0};
    saleMap[k].total+=s.total;
  });
  Object.values(saleMap).forEach(function(g){
    if(g.payment==='credit')return;
    if(g.payment==='deposit')return; // already recorded on deposit date
    var depositUsed=g.depositApplied||0;
    var amtIn=g.payment==='part'?(g.partPayment||0):g.total;
    var newCash=Math.max(0,amtIn-depositUsed);
    if(newCash<=0)return;
    var cat=g.payment==='part'?'Part payment':'Sales';
    var desc=g.desc+(depositUsed>0?' (dep. \u20a6'+Math.round(depositUsed).toLocaleString()+' excl.)':'');
    incEvents.push({date:g.date,desc:desc,cat:cat,amount:newCash,mode:payModeLabel(g)});
  });
  (DB.creditPayments||[]).filter(function(p){
    if(reportDateFrom&&!dateInRange(p.date,reportDateFrom,''))return false;
    if(reportDateTo&&!dateInRange(p.date,'',reportDateTo))return false;
    return true;
  }).forEach(function(p){
    if(p.payMode!=='writeoff')incEvents.push({date:p.date,desc:'Credit payment — '+p.custName,cat:'Credit payment',amount:p.amount,mode:payModeLabel(p)});
  });
  (DB.deposits||[]).filter(function(d){
    if(d.amount<=0)return false;
    if(reportDateFrom&&!dateInRange(d.date,reportDateFrom,''))return false;
    if(reportDateTo&&!dateInRange(d.date,'',reportDateTo))return false;
    return true;
  }).forEach(function(d){
    incEvents.push({date:d.date,desc:'Customer deposit — '+d.custName,cat:'Deposit',amount:d.amount,mode:payModeLabel(d)});
  });
  incEvents.sort(function(a,b){return parseSaleDate(b.date)-parseSaleDate(a.date);});
  var incGrandTotal=incEvents.reduce(function(a,e){return a+e.amount;},0);
  var byCat={};
  incEvents.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  var dateRange=(reportDateFrom||reportDateTo)?(reportDateFrom||'...')+' to '+(reportDateTo||'...'):'All time';
  var rows=incEvents.map(function(e,i){
    return '<tr><td>'+(i+1)+'</td><td>'+e.date+'</td><td>'+e.desc+'</td><td>'+e.cat+'</td><td style="text-align:right;font-weight:700;color:green">'+fmt(e.amount)+'</td><td>'+e.mode+'</td></tr>';
  }).join('');
  var catRows=Object.keys(byCat).map(function(k){return '<tr><td colspan="4" style="font-weight:600">'+k+'</td><td style="text-align:right;font-weight:700;color:green">'+fmt(byCat[k])+'</td><td></td></tr>';}).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Income Report</title>'+
    '<style>@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px}'+
    '.h{text-align:center;border-bottom:2px solid #065f46;padding-bottom:6px;margin-bottom:10px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b}.co2{font-size:16px;font-weight:900;color:#1a237e}'+
    'table{width:100%;border-collapse:collapse}th{background:#065f46;color:#fff;padding:4px 6px;font-size:9px;text-align:left}'+
    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even) td{background:#f0fdf4}'+
    '.tr td{font-weight:700;background:#d1fae5;border-top:2px solid #065f46}'+
    '.sum{margin-top:8px;background:#f0fdf4;border:1px solid #6ee7b7;border-radius:4px;padding:6px 10px}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:11px;font-weight:700;margin-top:4px;color:#065f46">INCOME REPORT — ALL SOURCES</div>'+
      '<div style="font-size:9px;margin-top:2px;color:#555">Period: '+dateRange+' &nbsp;|&nbsp; Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<table><thead><tr><th>#</th><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th>Mode</th></tr></thead><tbody>'+
    rows+
    '<tr class="tr"><td colspan="4">TOTAL INCOME</td><td style="text-align:right;color:green">'+fmt(incGrandTotal)+'</td><td></td></tr>'+
    '</tbody></table>'+
    '<div class="sum"><b>Breakdown by category:</b><table style="margin-top:4px">'+catRows+'</table></div>'+
    '</body></html>';
  var w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(function(){w.print();},400);
}

function writeOffCredit(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amtEl=document.getElementById('cp-amt-'+custId);
  var dateEl=document.getElementById('cp-date-'+custId);
  var balance=cust.creditBalance||0;
  // Use entered amount if available, else offer full balance
  var suggested=amtEl&&amtEl.value?parseFloat(amtEl.value):balance;
  var amt=parseFloat(prompt(
    'Write-off / Discount for '+cust.name+'\nCurrent balance owed: '+fmt(balance)+'\n\nEnter amount to write off as discount:',
    Math.round(suggested)
  ));
  if(isNaN(amt)||amt<=0)return;
  if(amt>balance){alert('Cannot write off more than the outstanding balance ('+fmt(balance)+').');return;}
  if(!confirm('Write off '+fmt(amt)+' from '+cust.name+"'s balance as a discount?\n\nThis will NOT be recorded as cash received.\nRemaining balance after write-off: "+fmt(balance-amt)))return;

  var rawDate=dateEl&&dateEl.value?new Date(dateEl.value):new Date();
  var date=rawDate.toLocaleDateString();
  var month=rawDate.toISOString().slice(0,7);

  // Reduce credit balance
  cust.creditBalance=Math.round((balance-amt)*100)/100;

  // Record as write-off in credit payments (mode = writeoff, not added to cashflow income)
  if(!DB.creditPayments)DB.creditPayments=[];
  DB.creditPayments.push({
    id:uid(),custId:custId,custName:cust.name,
    amount:amt,payMode:'writeoff',
    date:date,month:month,
    note:'Write-off / Discount',
    by:DB.currentUser.name
  });

  logActivity('Credit write-off',
    'Discount of '+fmt(amt)+' applied to '+cust.name+'. Remaining balance: '+fmt(Math.max(0,cust.creditBalance)),
    'writeoff');
  saveData();
  renderApp();
  alert('Write-off of '+fmt(amt)+' applied to '+cust.name+'.\nRemaining balance: '+fmt(Math.max(0,cust.creditBalance)));
}

function recordCreditPayment(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amtEl=document.getElementById('cp-amt-'+custId);
  var modeEl=document.getElementById('cp-mode-'+custId);
  var bankEl=document.getElementById('cp-bank-'+custId);
  var posEl=document.getElementById('cp-pos-'+custId);
  var amt=parseFloat(amtEl?amtEl.value:0)||0;
  var mode=modeEl?modeEl.value:'cash';
  var bankId=mode==='transfer'&&bankEl?bankEl.value:'';
  var posId=mode==='pos'&&posEl?posEl.value:'';
  if(amt<=0){alert('Enter a valid amount.');return;}
  if(amt>cust.creditBalance){
    if(!confirm('Amount ('+fmt(amt)+') is more than what is owed ('+fmt(cust.creditBalance)+'). The excess will be stored as customer credit (overpayment). Continue?'))return;
  }
  if(mode==='transfer'&&DB.banks.length&&!bankId){alert('Select the bank for transfer.');return;}
  if(mode==='pos'&&DB.posTerminals.length&&!posId){alert('Select the POS terminal.');return;}
  var dateEl=document.getElementById('cp-date-'+custId);
  var rawDate=dateEl&&dateEl.value?new Date(dateEl.value):new Date();
  var date=rawDate.toLocaleDateString();
  var month=rawDate.toISOString().slice(0,7);
  // Reduce credit balance
  cust.creditBalance=Math.round((cust.creditBalance-amt)*100)/100;
  // Store payment record
  if(!DB.creditPayments)DB.creditPayments=[];
  DB.creditPayments.push({id:uid(),custId:custId,custName:cust.name,amount:amt,payMode:mode,bankId:bankId,posId:posId,date:date,month:month,by:DB.currentUser.name});
  // Record in cashflow as income
  DB.cashflow.push({id:uid(),desc:'Credit payment — '+cust.name,amount:amt,type:'in',cat:'Credit Payment',payMode:mode,bankId:bankId,posId:posId,date:date,month:month});
  saveData();
  alert('Payment of '+fmt(amt)+' recorded for '+cust.name+'. Remaining balance: '+fmt(Math.max(0,cust.creditBalance)));
  logActivity('Credit payment','Payment of '+fmt(amt)+' from '+cust.name+'. Balance: '+fmt(Math.max(0,cust.creditBalance)),mode);
  renderApp();
}

function supplyNow(invoiceNum, saleId, overrideQty){
  // Use loose == to match whether saleId comes in as string or number
  var sale=DB.sales.find(function(s){return s.id==saleId;});
  if(!sale){
    // Fallback: try matching by invoiceNum if direct id match fails
    var fallback=DB.sales.filter(function(s){
      return (s.invoiceNum==invoiceNum||String(s.invoiceNum)===String(invoiceNum))&&
             (s.supplyStatus==='pending'||s.supplyStatus==='partial')&&
             (s.pendingQty||0)>0;
    });
    if(fallback.length===1){sale=fallback[0];}
    else{alert('Record not found. Try using "Supply all" instead.');return;}
  }
  var pending=sale.pendingQty!==undefined?sale.pendingQty:sale.qty;
  if(pending<=0){alert('This item is already fully supplied.');return;}
  // Check stock
  var invItem=DB.inventory.find(function(i){return i.id==sale.itemId;});
  var available=invItem?Math.max(0,invItem.qty):0;
  if(available<=0){alert('No stock available for '+sale.name+'. Please restock first.');return;}
  var toSupply=overrideQty!==undefined?overrideQty:Math.min(pending,available);
  var detail='Supply '+toSupply+' × '+sale.name+(toSupply<pending?' ('+( pending-toSupply)+' will still be pending)':' (fully supplied)');
  showConfirm({
    type:'success',
    title:'Confirm supply',
    msg:'This will deduct '+toSupply+' from inventory.',
    detail:detail,
    confirmLabel:'✓ Supply now',
    cancelLabel:'Cancel'
  },function(){
  // Deduct stock
  if(invItem)invItem.qty-=toSupply;
  // Update sale record
  var prevSupplied=sale.suppliedQty||0;
  sale.suppliedQty=prevSupplied+toSupply;
  sale.pendingQty=pending-toSupply;
  if(sale.pendingQty<=0){
    sale.supplyStatus='supplied';
    sale.supplyDate=new Date().toLocaleDateString();
    sale.pendingSupply=false;
  } else {
    sale.supplyStatus='partial';
  }
  // Adj log
  if(invItem){DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'remove',reason:'Supplied — Invoice #'+invoiceNum,before:invItem.qty+toSupply,change:-toSupply,after:invItem.qty,date:new Date().toLocaleDateString(),by:DB.currentUser.name});}
  saveData();
  alert(toSupply+' '+sale.name+' supplied successfully!'+(sale.pendingQty>0?' ('+sale.pendingQty+' still pending)':''));
  renderApp();
  }); // end showConfirm
}

function supplyAllNow(invoiceNum){
  var items=DB.sales.filter(function(s){return s.invoiceNum===invoiceNum&&(s.supplyStatus==='pending'||s.supplyStatus==='partial')&&(s.pendingQty||0)>0;});
  if(!items.length){alert('No pending items for this invoice.');return;}
  var msg='Supply all pending items for Invoice #'+invoiceNum+'?\n\n';
  var canSupply=[];
  var noStock=[];
  items.forEach(function(s){
    var pending=s.pendingQty||0;
    var inv=DB.inventory.find(function(i){return i.id==s.itemId;});
    var available=inv?Math.max(0,inv.qty):0;
    var toSupply=Math.min(pending,available);
    if(toSupply>0)canSupply.push({sale:s,inv:inv,toSupply:toSupply,pending:pending});
    else noStock.push(s.name);
  });
  if(canSupply.length===0){alert('No stock available for any pending items. Please restock first.');return;}
  var detail='';
  canSupply.forEach(function(x){detail+=x.sale.name+': '+x.toSupply+(x.toSupply<x.pending?' ('+(x.pending-x.toSupply)+' remain)':'')+'\n';});
  if(noStock.length)detail+='No stock: '+noStock.join(', ');
  showConfirm({
    type:'info',
    title:'Supply all pending items?',
    msg:'Invoice #'+invoiceNum+' — This will deduct stock from inventory.',
    detail:detail.trim(),
    confirmLabel:'✓ Supply all',
    cancelLabel:'Cancel'
  },function(){
  canSupply.forEach(function(x){
    if(x.inv)x.inv.qty-=x.toSupply;
    var prevSupplied=x.sale.suppliedQty||0;
    x.sale.suppliedQty=prevSupplied+x.toSupply;
    x.sale.pendingQty=x.pending-x.toSupply;
    if(x.sale.pendingQty<=0){x.sale.supplyStatus='supplied';x.sale.supplyDate=new Date().toLocaleDateString();x.sale.pendingSupply=false;}
    else{x.sale.supplyStatus='partial';}
    if(x.inv){DB.adjLog.push({id:uid(),itemId:x.inv.id,itemName:x.inv.name,type:'remove',reason:'Supplied — Invoice #'+invoiceNum,before:x.inv.qty+x.toSupply,change:-x.toSupply,after:x.inv.qty,date:new Date().toLocaleDateString(),by:DB.currentUser.name});}
  });
  saveData();
  alert('Supply completed for Invoice #'+invoiceNum+'!');
  renderApp();
  }); // end showConfirm
}

// ============================================================
// STARTUP
// ============================================================
window.onload=function(){
  applyDarkMode();
  loadData();
  // Check backup reminder every minute
  setInterval(function(){
    if(DB.currentUser)checkBackupReminder();
  },60000);

  // ── Offline / Online handling ──────────────────────────────
  window.addEventListener('offline',function(){
    updateSyncStatus('offline');
    showOfflineBanner(true);
  });
  window.addEventListener('online',function(){
    showOfflineBanner(false);
    updateSyncStatus('connecting');
    // Flush any pending local saves to Firebase per-collection
    var pending=localStorage.getItem(STORAGE_KEY+'_pending');
    if(pending){
      GCE_COLLECTIONS.forEach(function(c){ fbDirtyCollections.add(c); });
      fbSyncDirty(function(ok){
        if(ok){
          fbLastSync=new Date();
          updateSyncStatus('synced');
          localStorage.removeItem(STORAGE_KEY+'_pending');
          showToast('✅ Back online — all changes synced to Firebase!');
        } else {
          updateSyncStatus('error');
        }
      });
    } else {
      startFirebaseListener();
    }
  });
};

</script>
</body>
</html>
