// Reminds staff to take a backup at closing time (7pm)
var _backupReminderShown=false;
function checkBackupReminder(){
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes();
  // Trigger between 19:00 and 19:15 (7pm window)
  if(h===19&&m<=15){
    var todayKey=now.toLocaleDateString();
    var shownKey='closingShown_'+todayKey;
    if(localStorage.getItem(shownKey))return;
    localStorage.setItem(shownKey,'1');
    _backupReminderShown=true;
    setTimeout(function(){
      showConfirm({
        type:'info',
        title:'🕖 Closing time!',
        msg:'It\'s 7PM — time to close up.',
        detail:'1. Take a backup of your data\n2. Send daily summary to owner via WhatsApp\n\nChoose an action below.',
        confirmLabel:'⬇ Backup + Send summary',
        cancelLabel:'Just backup'
      },function(){
        exportBackup();
        sendDailySummaryWhatsApp();
      });
    },800);
  }
}

function sendDailySummaryWhatsApp(){
  var today=new Date().toLocaleDateString();
  var daySales=DB.sales.filter(function(s){return dateInRange(s.date,new Date().toISOString().slice(0,10),new Date().toISOString().slice(0,10));});
  var invMap={};
  daySales.forEach(function(s){var k=s.invoiceNum||s.id;if(!invMap[k])invMap[k]={total:0,profit:0,payment:s.payment};invMap[k].total+=s.total;invMap[k].profit+=s.profit;});
  var invList=Object.values(invMap);
  var totalRev=invList.reduce(function(a,g){return a+g.total;},0);
  var totalProfit=invList.reduce(function(a,g){return a+g.profit;},0);
  var creditOwed=invList.filter(function(g){return g.payment==='credit';}).reduce(function(a,g){return a+g.total;},0);
  var totalPaid=totalRev-creditOwed;
  var cpToday=(DB.creditPayments||[]).filter(function(p){return p.payMode!=='writeoff'&&dateInRange(p.date,new Date().toISOString().slice(0,10),new Date().toISOString().slice(0,10));}).reduce(function(a,p){return a+p.amount;},0);
  var _todayIso=new Date().toISOString().slice(0,10);
  var expenses=DB.cashflow.filter(function(c){return c.type==='out'&&!c.isReturn&&c.cat!=='Restock'&&dateInRange(c.date,_todayIso,_todayIso);}).reduce(function(a,e){return a+e.amount;},0);
  var suppPayments=DB.cashflow.filter(function(c){return c.type==='out'&&c.cat==='Restock'&&dateInRange(c.date,_todayIso,_todayIso);}).reduce(function(a,e){return a+e.amount;},0);

  var msg=
    '📊 *DAILY CLOSING REPORT*\n'+
    '📅 '+today+'\n'+
    '🏪 Great Chid Electro / Global Doors Ltd\n\n'+
    '🧾 *Invoices:* '+invList.length+'\n'+
    '💰 *Total Revenue:* '+fmt(totalRev)+'\n'+
    '✅ *Total Paid:* '+fmt(totalPaid)+'\n'+
    (creditOwed>0?'⚠️ *Credit Owed:* '+fmt(creditOwed)+'\n':'')+
    (cpToday>0?'💳 *Credit Payments:* '+fmt(cpToday)+'\n':'')+
    (expenses>0?'💸 *Expenses:* '+fmt(expenses)+'\n':'')+
    (suppPayments>0?'🚛 *Supplier Payments:* '+fmt(suppPayments)+'\n':'')+
    '📈 *Profit:* '+fmt(totalProfit)+' ('+Math.round(totalProfit/Math.max(totalRev,1)*100)+'% margin)\n\n'+
    '💵 *Net cash in:* '+fmt(totalPaid+cpToday-expenses-suppPayments)+'\n\n'+
    '_Sent from Great Chid Business Dashboard_';

  // Ask for owner's phone
  var ownerPhone=(DB.settings&&DB.settings.ownerWhatsApp)||'';
  if(!ownerPhone){
    ownerPhone=prompt('Enter owner\'s WhatsApp number for daily summary:\n(Will be saved for future use)');
    if(!ownerPhone)return;
    if(!DB.settings)DB.settings={};
    DB.settings.ownerWhatsApp=ownerPhone;
    saveData();
  }
  var phone=ownerPhone.replace(/[\s\-\(\)]/g,'');
  if(phone.startsWith('0'))phone='234'+phone.substring(1);
  if(!phone.startsWith('234')&&!phone.startsWith('+'))phone='234'+phone;
  phone=phone.replace(/^\+/,'');
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

function checkNewMonthReminder(){
  var now=new Date();
  if(now.getDate()!==1)return; // only on 1st of month
  var monthKey=now.getFullYear()+'-'+(now.getMonth()+1); // e.g. "2026-6"
  var lastShown=(DB.settings&&DB.settings.newMonthReminderShown)||'';
  if(lastShown===monthKey)return; // already shown this month
  // Mark as shown
  if(!DB.settings)DB.settings={};
  DB.settings.newMonthReminderShown=monthKey;
  saveData();
  // Show reminder after a short delay so the UI loads first
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monthName=months[now.getMonth()];
  setTimeout(function(){
    showConfirm({
      type:'info',
      title:'🎉 Happy '+monthName+'!',
      msg:'It\'s the 1st of '+monthName+' — time to send your monthly greetings!',
      detail:'Send a New Month WhatsApp message to all your customers to show appreciation and keep them engaged.\n\nGo to Customers → Messaging → New Month template.',
      confirmLabel:'Go to Messaging',
      cancelLabel:'Remind me later'
    },function(){
      activeTab='customers';
      activeCustSub='messaging';
      msgTemplateKey='newmonth';
      renderApp();
    });
  },1500);
}

// ── Global keyboard shortcuts ─────────────────────────────
(function(){
  if(window._gceShortcutsActive) return;
  window._gceShortcutsActive = true;
  document.addEventListener('keydown', function(e) {
    // Skip if typing in an input/textarea/select
    var tag = (e.target||{}).tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    // Alt + key shortcuts
    if(e.altKey) {
      switch(e.key.toLowerCase()) {
        case 's': e.preventDefault(); switchTab('sales'); break;
        case 'i': e.preventDefault(); switchTab('inventory'); break;
        case 'r': e.preventDefault(); switchTab('reports'); break;
        case 'c': e.preventDefault(); switchTab('customers'); break;
        case 'f': e.preventDefault(); switchTab('finance'); break;
        case 'n': e.preventDefault();
          switchTab('sales');
          setTimeout(function(){
            var openBtn=document.querySelector('[onclick*="openSaleModal"],[onclick*="showSaleForm"],[onclick*="newSale"]');
            if(openBtn)openBtn.click();
          }, 200);
          break;
      }
    }
    // Escape — close any open modal
    if(e.key==='Escape') {
      var overlays=['fb-diag-overlay','print-dialog-overlay','inv-edit-modal','transfer-modal','confirm-overlay'];
      overlays.forEach(function(id){var el=document.getElementById(id);if(el)el.remove();});
    }
  });
})();

  var waybill=document.getElementById('tr-waybill').value.trim();
  if(!waybill){alert('Please enter a Waybill Number.');return;}
  var date=new Date().toLocaleDateString();
  var transferred=[];
  fromStore.forEach(function(fromItem){
    var inp=document.getElementById('tr-qty-'+fromItem.id);
    var qty=parseInt(inp?inp.value:0)||0;
    if(qty<=0)return;
    if(qty>fromItem.qty)qty=fromItem.qty;
    var toItem=toStore.find(function(i){return i.name.toLowerCase()===fromItem.name.toLowerCase();});
    if(toItem){toItem.qty+=qty;}
    else{toStore.push({id:uid(),name:fromItem.name,qty:qty,cost:fromItem.cost,sell:fromItem.sell,minQty:fromItem.minQty||1,supId:fromItem.supId,cat:fromItem.cat});}
    fromItem.qty=Math.max(0,fromItem.qty-qty);
    transferred.push({name:fromItem.name,qty:qty});
    DB.transferLog.push({id:uid(),date:date,direction:direction,itemName:fromItem.name,itemCat:fromItem.cat||'',qty:qty,waybill:waybill,note:note,by:DB.currentUser.name});
  });
  if(!transferred.length){alert('Enter at least one qty to transfer.');return;}
  saveData();
  document.getElementById('transfer-modal').remove();
  renderApp();
  alert('✅ Transfer complete!\n\n'+transferred.map(function(t){return t.name+' × '+t.qty;}).join('\n')+'\n\n'+fromLabel+' → '+toLabel);
}

function saveAddWarehouseStock(){
  var itemId=document.getElementById('wha-item-id').value;
  var qty=parseInt(document.getElementById('wha-qty').value)||0;
  var minQty=parseInt(document.getElementById('wha-minqty').value)||0;
  var note=(document.getElementById('wha-note').value||'').trim();
  if(!itemId){alert('Please select an item.');return;}
  if(qty<1){alert('Enter a valid quantity.');return;}
  var item=DB.inventory.find(function(i){return i.id==itemId;});
  if(!item){alert('Item not found.');return;}
  var existing=DB.warehouse.find(function(w){return w.id==itemId;});
  if(existing){
    existing.qty+=qty;
    existing.minQty=minQty;
  } else {
    DB.warehouse.push({id:item.id,name:item.name,cat:item.cat||'',qty:qty,minQty:minQty,cost:item.cost||0,supplierId:item.supplierId||''});
  }
  // Log the addition
  DB.transferLog.push({id:uid(),date:new Date().toLocaleDateString(),direction:'to_warehouse',itemId:item.id,itemName:item.name,itemCat:item.cat||'',qty:qty,waybill:'OPENING-STOCK',note:note||'Existing stock added manually',by:DB.currentUser.name});
  saveData();
  document.getElementById('wh-add-modal').remove();
  renderApp();
}
function editWhMinQty(itemId){
  var item=DB.warehouse.find(function(i){return i.id==itemId;});
  if(!item){alert('Item not found.');return;}
  var val=prompt('Set minimum quantity for '+item.name+' (current: '+item.minQty+'):',item.minQty);
  if(val===null)return;
  var num=parseInt(val);
  if(isNaN(num)||num<0){alert('Please enter a valid number (0 or more).');return;}
  item.minQty=num;
  saveData();
  renderApp();
}

// INVENTORY
function getCatOpts(sel){var o=DB.categories.slice().reverse().map(function(c){return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+c+'</option>';}).join('');return '<option value="">-- Category --</option>'+o+'<option value="__new__">+ New category...</option>';}
function handleCatChange(s,nid){var ni=document.getElementById(nid);if(ni)ni.style.display=s==='__new__'?'block':'none';}
function resolveCategory(sid,nid){
  var s=document.getElementById(sid);if(!s)return '';
  if(s.value==='__new__'){
    var ni=document.getElementById(nid);var nc=ni?ni.value.trim():'';
    if(!nc){alert('Enter a name for the new category.');return null;}
    var dup=DB.categories.find(function(c){return c.toLowerCase()===nc.toLowerCase();});
    if(dup){alert('Category "'+dup+'" already exists. Please select it from the list.');return null;}
    DB.categories.push(nc);return nc;
  }
  return s.value;
}
function addItem(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('Item name is required.');return;}
  var dupItem=DB.inventory.find(function(i){return i.name.toLowerCase()===name.toLowerCase();});
  if(dupItem){alert('An item named "'+dupItem.name+'" already exists.\n\nTo add more stock, use Stock Management \u2192 Stock Adjustment instead.');return;}
  var qty=parseInt(document.getElementById('f-qty').value)||0,cost=parseFloat(document.getElementById('f-cost').value)||0,sell=parseFloat(document.getElementById('f-sell').value)||0,minQty=parseInt(document.getElementById('f-minqty').value)||5,supId=document.getElementById('f-supplier').value;
  var cat=resolveCategory('f-cat','f-cat-new');
  if(cat===null)return;
  if(cost<=0){alert('\u274c Cost price is required.');return;}
  if(sell<=0){alert('\u274c Selling price is required.');return;}
  if(sell<cost){alert('\u274c Selling price ('+fmt(sell)+') cannot be less than cost price ('+fmt(cost)+').');return;}
  DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
  ['f-name','f-qty','f-cost','f-sell','f-minqty'].forEach(function(id){document.getElementById(id).value='';});renderApp();
}

function removeItem(id){
  if(!isAdmin()&&!canDo('invdelete')){alert('You do not have permission to delete inventory items. Contact your admin.');return;}
  var item=DB.inventory.find(function(i){return i.id===id;});
  if(!item)return;
  showConfirm({
    type:'danger',
    title:'Delete inventory item?',
    msg:'This item will be moved to the Recycle Bin. You can restore it within 30 days.',
    detail:'📦 '+item.name+' — Qty: '+item.qty+' · Cost: '+fmt(item.cost||0),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('inventory',item,'Inventory');
    DB.inventory=DB.inventory.filter(function(i){return i.id!==id;});
    saveData();renderApp();
  });
}
function filterInventoryTable(){
  var term=invSearch.toLowerCase().trim();
  var tbody=document.querySelector('#inv-stock-table tbody');
  var countEl=document.getElementById('inv-search-count');
  var clearBtn=document.getElementById('inv-clear-btn');
  if(!tbody)return;
  var rows=tbody.querySelectorAll('tr');
  var visible=0;
  rows.forEach(function(row){
    if(row.getAttribute('data-empty')){
      row.style.display=term?'none':'';
      return;
    }
    var name=(row.getAttribute('data-name')||'').toLowerCase();
    var cat=(row.getAttribute('data-cat')||'').toLowerCase();
    var sup=(row.getAttribute('data-sup')||'').toLowerCase();
    var match=!term||name.indexOf(term)>-1||cat.indexOf(term)>-1||sup.indexOf(term)>-1;
    row.style.display=match?'':'none';
    if(match)visible++;
  });
  if(countEl){
    var total=rows.length-(rows[rows.length-1]&&rows[rows.length-1].getAttribute('data-empty')?1:0);
    countEl.textContent=term?(visible+' of '+total+' items'):(total+' item'+(total!==1?'s':''));
  }
  if(clearBtn)clearBtn.style.display=term?'':'none';
  // Show/hide no-results row
  var noRes=tbody.querySelector('tr[data-noresult]');
  if(term&&visible===0){
    if(!noRes){noRes=document.createElement('tr');noRes.setAttribute('data-noresult','1');noRes.innerHTML='<td colspan="11" class="empty">No items match "'+invSearch+'".</td>';tbody.appendChild(noRes);}
    else{noRes.querySelector('td').textContent='No items match "'+invSearch+'".';noRes.style.display='';}
  } else if(noRes){noRes.style.display='none';}
}
function filterSalesTable(){  var term=salesSearch.toLowerCase().trim();

// Dynamically load SheetJS from multiple CDN fallbacks
function loadXLSX(callback){
  if(typeof XLSX!=='undefined'){callback(null);return;}
  var cdns=[
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  var idx=0;
  function tryNext(){
    if(idx>=cdns.length){callback(new Error('Could not load Excel library. Please check your internet connection and try again.'));return;}
    var s=document.createElement('script');
    s.src=cdns[idx++];
    s.onload=function(){callback(null);};
    s.onerror=function(){tryNext();};
    document.head.appendChild(s);
  }
  tryNext();
}

function importInventoryExcel(file){
  if(!file)return;
  loadXLSX(function(err){
    if(err){alert(err.message);return;}
    var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){alert('The file appears empty. Make sure it has a header row and at least one item.');return;}

      // Detect header row — find the row containing "Item Name" or "Name"
      var headerRow=0;
      for(var r=0;r<Math.min(5,rows.length);r++){
        var rStr=rows[r].join('|').toLowerCase();
        if(rStr.indexOf('item')!==-1||rStr.indexOf('name')!==-1){headerRow=r;break;}
      }
      var headers=rows[headerRow].map(function(h){return String(h).toLowerCase().trim();});

      // Map columns flexibly
      function col(keywords){
        for(var i=0;i<headers.length;i++){
          for(var j=0;j<keywords.length;j++){
            if(headers[i].indexOf(keywords[j])!==-1)return i;
          }
        }
        return -1;
      }
      var cName=col(['item name','name','product','description','item']);
      var cCat=col(['category','cat','type','group']);
      var cQty=col(['qty','quantity','stock','units']);
      var cMinQty=col(['min qty','minimum','min stock','reorder','restock']);
      var cCost=col(['cost price','cost','buy price','buying price','purchase price','buying','buy']);
      var cSell=col(['sell price','selling price','sale price','sell','selling','sale']);
      var cSup=col(['supplier','vendor','sup']);

      // If both cost and sell resolve to the same column, try to fix by position
      // Template order: Item Name, Category, Qty, Min Qty, Cost Price, Sell Price, Supplier
      if(cCost===cSell){
        // Find all columns containing 'price' and assign by order
        var priceCols=[];
        for(var pi=0;pi<headers.length;pi++){if(headers[pi].indexOf('price')!==-1)priceCols.push(pi);}
        if(priceCols.length>=2){cCost=priceCols[0];cSell=priceCols[1];}
      }
      var cSup=col(['supplier','vendor','sup']);

      if(cName===-1){alert('Could not find an "Item Name" column. Make sure your Excel file has a column named "Item Name" or "Name".');return;}
      if(cCost===-1){alert('Could not find a "Cost Price" column. Make sure you have a column named "Cost" or "Cost Price".');return;}
      if(cSell===-1){alert('Could not find a "Sell Price" column. Make sure you have a column named "Sell" or "Sell Price".');return;}

      var modeEl=document.querySelector('input[name="inv-import-mode"]:checked');
      var importMode=window._importMode||(modeEl?modeEl.value:'skip');
      window._importMode=null;

      var added=0,skipped=0,updated=0;
      var skippedNames=[];
      var results=[];

      for(var i=headerRow+1;i<rows.length;i++){
        var row=rows[i];
        var name=String(row[cName]||'').trim();
        if(!name)continue; // skip empty rows

        var cost=parseFloat(row[cCost])||0;
        var sell=parseFloat(row[cSell])||0;
        var qty=parseInt(row[cQty])||0;
        var minQty=parseInt(row[cMinQty])||5;
        var cat=cCat>=0?String(row[cCat]||'').trim():'';
        var supName=cSup>=0?String(row[cSup]||'').trim():'';

        if(cost<=0){skipped++;skippedNames.push(name+' (no cost price)');continue;}
        if(sell<=0){skipped++;skippedNames.push(name+' (no sell price)');continue;}

        // Add category if new
        if(cat&&!DB.categories.find(function(c){return c.toLowerCase()===cat.toLowerCase();})){
          DB.categories.push(cat);
        }

        // Find supplier ID by name
        var supId='';
        if(supName){
          var sup=DB.suppliers.find(function(s){return s.name.toLowerCase()===supName.toLowerCase();});
          if(sup)supId=sup.id;
        }

        // Check for duplicate
        var existing=DB.inventory.find(function(inv){return inv.name.toLowerCase()===name.toLowerCase();});
        if(existing){
          if(importMode==='skip'){
            // Leave existing item completely untouched
            skipped++;skippedNames.push(name+' (already exists — skipped)');
          } else if(importMode==='prices'){
            // Only update cost and sell price — never touch qty, minQty, cat, supplier
            existing.cost=cost;existing.sell=sell;
            updated++;results.push({name:name,status:'prices updated'});
          } else {
            // 'full' mode — update everything
            existing.cost=cost;existing.sell=sell;existing.qty=qty;existing.minQty=minQty;
            if(cat)existing.cat=cat;if(supId)existing.supId=supId;
            updated++;results.push({name:name,status:'fully updated'});
          }
        } else {
          DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
          added++;results.push({name:name,status:'added'});
        }
      }

      saveData();
      var modeDesc=importMode==='skip'?'New items added only (existing untouched)':importMode==='prices'?'New items added + prices updated on existing items':'New items added + existing items fully updated';
      var msg='✅ Import complete!\n\n'+
        'Mode: '+modeDesc+'\n\n'+
        '• '+added+' new item(s) added\n'+
        (updated>0?'• '+updated+' existing item(s) '+( importMode==='prices'?'had prices updated':'were fully updated')+'\n':'')+
        (skipped>0?'• '+skipped+' row(s) skipped:\n  '+skippedNames.slice(0,10).join('\n  ')+(skippedNames.length>10?'\n  ...and '+(skippedNames.length-10)+' more':''):'');
      alert(msg);
      // Reset file input so same file can be re-imported with different mode
      var fileInput=document.getElementById('inv-import-file');if(fileInput)fileInput.value='';
      renderApp();
    }catch(ex){
      alert('Failed to read the Excel file.\n\nError: '+ex.message+'\n\nMake sure the file is a valid .xlsx or .csv file.');
    }
  };
  reader.readAsArrayBuffer(file);
  }); // end loadXLSX
}

function startCount(){countSession=DB.inventory.map(function(i){return{id:i.id,name:i.name,systemQty:i.qty,countedQty:null};});countStarted=true;renderApp();}
function saveCount(){if(!countSession.every(function(c){return c.countedQty!==null&&!isNaN(c.countedQty);})){alert('Enter qty for all items.');return;}var date=new Date().toLocaleDateString();var details=[];countSession.forEach(function(c){var item=DB.inventory.find(function(i){return i.id===c.id;});if(!item)return;var diff=parseInt(c.countedQty)-c.systemQty;details.push({id:c.id,name:item.name,systemQty:c.systemQty,countedQty:parseInt(c.countedQty),diff:diff});if(diff!==0){DB.adjLog.push({id:uid(),itemId:c.id,itemName:item.name,type:'count',reason:'Stock count',before:c.systemQty,change:diff,after:parseInt(c.countedQty),date:date,by:DB.currentUser.name});item.qty=parseInt(c.countedQty);}});DB.stockCounts.push({id:uid(),date:date,items:countSession.length,variances:details.filter(function(d){return d.diff!==0;}).length,by:DB.currentUser.name,details:details});countSession=[];countStarted=false;saveData();renderApp();}

function saveCatCount(cat){
  var catItems=DB.inventory.filter(function(i){return (i.cat||'Uncategorised')===cat;});
  var date=new Date().toLocaleDateString();
  var variances=0;
  var details=[];
  catItems.forEach(function(i){
    var inp=document.getElementById('cc-'+i.id);
    if(!inp||inp.value==='')return;
    var counted=parseInt(inp.value);
    if(isNaN(counted))return;
    var diff=counted-i.qty;
    details.push({id:i.id,name:i.name,systemQty:i.qty,countedQty:counted,diff:diff});
    if(diff!==0){
      DB.adjLog.push({id:uid(),itemId:i.id,itemName:i.name,type:'count',reason:'Category count: '+cat,before:i.qty,change:diff,after:counted,date:date,by:DB.currentUser.name});
      i.qty=counted;variances++;
    }
  });
  DB.stockCounts.push({id:uid(),date:date,items:catItems.length,variances:variances,by:DB.currentUser.name,cat:cat,details:details});
  saveData();
  alert('✅ Stock count saved for category "'+cat+'".\n'+catItems.length+' items checked, '+variances+' variance(s) corrected.');
  renderApp();
}
function updateCountVal(id,val){var c=countSession.find(function(x){return x.id==id;});if(c)c.countedQty=val===''?null:parseInt(val);var diff=c&&c.countedQty!==null?c.countedQty-c.systemQty:null;var el=document.getElementById('cst-'+id);if(el){el.innerHTML=diff===null?'<span class="count-status pending">Pending</span>':diff===0?'<span class="count-status match">&#10003; Match</span>':'<span class="count-status diff">'+(diff>0?'+':'')+diff+' variance</span>';}}
function filterAdjLog(){
  var search=(window._adjSearch||'').toLowerCase().trim();
  var typeF=window._adjTypeF||'';
  var dateFrom=window._adjDateFrom||'';
  var dateTo=window._adjDateTo||'';
  var fdMs=dateFrom?(function(){var dp=dateFrom.split('-');return new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).getTime();})():0;
  var tdMs=dateTo?(function(){var dp=dateTo.split('-');return new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).getTime()+(86400000-1);})():Infinity;
  var rows=document.querySelectorAll('#adj-log-table tbody tr[data-name]');
  var visible=0;
  rows.forEach(function(r){
    var name=r.getAttribute('data-name')||'';
    var type=r.getAttribute('data-type')||'';
    var ts=parseInt(r.getAttribute('data-ts'))||0;
    var show=true;
    if(search&&name.indexOf(search)<0)show=false;
    if(typeF&&type!==typeF)show=false;
    if(fdMs&&ts<fdMs)show=false;
    if(tdMs!==Infinity&&ts>tdMs)show=false;
    r.style.display=show?'':'none';
    if(show)visible++;
  });
  var nr=document.getElementById('adj-no-results');
  if(nr)nr.style.display=visible===0?'':'none';
  var cnt=document.getElementById('adj-count');
  if(cnt)cnt.textContent=visible;
}

    '.header{text-align:center;border-bottom:3px solid #343a40;padding-bottom:10px;margin-bottom:14px}'+

    '.stats{display:flex;gap:12px;margin-bottom:14px}'+
    '.stat{flex:1;border:1px solid #dee2e6;border-radius:6px;padding:8px;text-align:center}'+
    '.stat-val{font-size:20px;font-weight:700}.stat-lbl{font-size:9px;color:#666;text-transform:uppercase;margin-top:2px}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:14px}'+
    'th{background:#343a40;color:#fff;font-size:9px;padding:5px 8px;text-align:left;text-transform:uppercase}'+
    'td{border:1px solid #dee2e6;padding:4px 8px;font-size:10px}'+
    'tr:nth-child(even){background:#f8f9fa}'+
    '.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:#343a40;border-left:3px solid #0d6efd;padding-left:7px}'+
    '.footer{margin-top:16px;border-top:1px solid #dee2e6;padding-top:8px;font-size:9px;color:#888;display:flex;justify-content:space-between}'+

      '<div class="stat" style="border-color:#198754"><div class="stat-val" style="color:#198754">'+(sc.items-sc.variances)+'</div><div class="stat-lbl">Matched</div></div>'+
    '</div>'+
    (details.length?

async function sendTwilioWhatsApp(){
  var msgText=document.getElementById('msg-text')?document.getElementById('msg-text').value.trim():'';
  if(!msgText){alert('Please enter a message.');return;}
  if(!msgSelectedCusts.length){alert('Select at least one customer.');return;}
  var token=getTwilioAuthToken(),sid=getTwilioAccountSid();
  if(!token||!sid){alert('Please save your Twilio credentials first.');return;}
  var selected=DB.customers.filter(function(c){return msgSelectedCusts.indexOf(c.id)!==-1&&c.phone;});
  if(!selected.length){alert('No selected customers have phone numbers.');return;}
  if(!confirm('Send WhatsApp to '+selected.length+' customer(s)?\nEstimated cost: $'+(selected.length*0.05).toFixed(2)+' from your Twilio balance.'))return;
  var statusEl=document.getElementById('msg-send-status'),resultsEl=document.getElementById('msg-results');
  if(statusEl)statusEl.textContent='Sending...';if(resultsEl)resultsEl.innerHTML='';
  var results=[],url='https://api.twilio.com/2010-04-01/Accounts/'+sid+'/Messages.json';
  var headers={'Authorization':'Basic '+btoa(sid+':'+token),'Content-Type':'application/x-www-form-urlencoded'};
  for(var i=0;i<selected.length;i++){
    var c=selected[i];
    if(statusEl)statusEl.textContent='Sending '+(i+1)+' of '+selected.length+'...';
    var text=msgText.replace(/\{name\}/g,c.name).replace(/\{balance\}/g,c.creditBalance>0?fmt(c.creditBalance):'₦0');
    var phone=c.phone.replace(/[\s\-\(\)]/g,'');
    if(phone.startsWith('0'))phone='234'+phone.substring(1);
    if(!phone.startsWith('234')&&!phone.startsWith('+'))phone='234'+phone;
    phone=phone.replace(/^\+/,'');
    try{
      var resp=await fetch(url,{method:'POST',headers:headers,body:'From='+encodeURIComponent(TWILIO_FROM)+'&To='+encodeURIComponent('whatsapp:+'+phone)+'&Body='+encodeURIComponent(text)});
      var data=await resp.json();
      results.push({name:c.name,phone:c.phone,status:data.sid?'✅ Sent':'❌ '+(data.message||'Failed')});
    }catch(err){results.push({name:c.name,phone:c.phone,status:'❌ Error: '+err.message});}
    await new Promise(function(r){setTimeout(r,300);});
  }
  var sent=results.filter(function(r){return r.status.startsWith('✅');}).length;
  if(statusEl)statusEl.textContent='Done — '+sent+' sent, '+(results.length-sent)+' failed.';
  if(resultsEl)resultsEl.innerHTML='<div style="font-size:12px;font-weight:700;margin-bottom:6px">Delivery report:</div><div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table><thead><tr><th>Customer</th><th>Phone</th><th>Status</th></tr></thead><tbody>'+results.map(function(r){return '<tr><td>'+r.name+'</td><td>'+r.phone+'</td><td>'+r.status+'</td></tr>';}).join('')+'</tbody></table></div>';
}

async function sendTermiiSMS(){
  var msgText=document.getElementById('msg-text')?document.getElementById('msg-text').value.trim():'';
  if(!msgText){alert('Please enter a message.');return;}
  if(!msgSelectedCusts.length){alert('Select at least one customer.');return;}

  if(!apiKey){alert('Please save your Termii API key first.');return;}
  var selected=DB.customers.filter(function(c){return msgSelectedCusts.indexOf(c.id)!==-1&&c.phone;});
  if(!selected.length){alert('No selected customers have phone numbers.');return;}
  if(!confirm('Send SMS to '+selected.length+' customer(s) via Termii?\nEstimated cost: ₦'+(selected.length*6)+' – ₦'+(selected.length*10)))return;
  var statusEl=document.getElementById('msg-send-status'),resultsEl=document.getElementById('msg-results');
  if(statusEl)statusEl.textContent='Sending...';if(resultsEl)resultsEl.innerHTML='';
  var results=[];
  for(var i=0;i<selected.length;i++){
    var c=selected[i];
    if(statusEl)statusEl.textContent='Sending '+(i+1)+' of '+selected.length+'...';
    var text=msgText.replace(/\{name\}/g,c.name).replace(/\{balance\}/g,c.creditBalance>0?fmt(c.creditBalance):'₦0');
    var phone=c.phone.replace(/[\s\-\(\)]/g,'');
    if(phone.startsWith('0'))phone='234'+phone.substring(1);
    if(!phone.startsWith('234')&&!phone.startsWith('+'))phone='234'+phone;
    phone=phone.replace(/^\+/,'');
    try{
      var resp=await fetch(TERMII_BASE+'/api/sms/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:phone,from:TERMII_SENDER,sms:text,type:'plain',api_key:apiKey,channel:'generic'})});
      var data=await resp.json();
      results.push({name:c.name,phone:c.phone,status:(data.message_id||data.messageId||data.code==='ok'||data.status==='Message Sent')?'✅ Sent':'❌ '+(data.message||'Failed')});
    }catch(err){results.push({name:c.name,phone:c.phone,status:'❌ Error: '+err.message});}
    await new Promise(function(r){setTimeout(r,200);});
  }
  var sent=results.filter(function(r){return r.status.startsWith('✅');}).length;
  if(statusEl)statusEl.textContent='Done — '+sent+' sent, '+(results.length-sent)+' failed.';
  if(resultsEl)resultsEl.innerHTML='<div style="font-size:12px;font-weight:700;margin-bottom:6px">Delivery report:</div><div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table><thead><tr><th>Customer</th><th>Phone</th><th>Status</th></tr></thead><tbody>'+results.map(function(r){return '<tr><td>'+r.name+'</td><td>'+r.phone+'</td><td>'+r.status+'</td></tr>';}).join('')+'</tbody></table></div>';
}

function saveEditCustomer(){
  var id=window._editingCust;
  var cust=DB.customers.find(function(c){return c.id==id;});
  if(!cust){alert('Customer not found.');return;}
  var name=document.getElementById('ec-name').value.trim();
  if(!name){alert('Name is required.');return;}
  cust.name=name;
  cust.phone=document.getElementById('ec-phone').value.trim();
  cust.email=document.getElementById('ec-email').value.trim();
  cust.address=document.getElementById('ec-address').value.trim();
  cust.biz=document.getElementById('ec-biz').value.trim();
  cust.notes=document.getElementById('ec-notes').value.trim();
  cust.type=document.getElementById('ec-type').value;
  var newLimit=parseFloat(document.getElementById('ec-credit-limit').value)||0;
  if(newLimit!==cust.creditLimit){
    logActivity('Credit limit changed',cust.name+' — from '+fmt(cust.creditLimit)+' to '+fmt(newLimit),'Admin: '+DB.currentUser.name);
  }
  cust.creditLimit=newLimit;
  // Opening balance: if changed, adjust creditBalance by the difference
  var newOpeningBal=parseFloat(document.getElementById('ec-opening-bal').value)||0;
  var oldOpeningBal=cust.openingBalance||0;
  if(newOpeningBal!==oldOpeningBal){
    var diff=newOpeningBal-oldOpeningBal;
    cust.creditBalance=(cust.creditBalance||0)+diff;
    cust.openingBalance=newOpeningBal;
  }
  saveData();
  alert('Customer updated successfully.');
  window._viewingCust=id;
  activeCustSub='profile';
  renderApp();
}

// ── Date-aware outstanding balance helper ─────────────────────
// Parses a locale date string (e.g. "5/13/2026") → timestamp for comparison
function parseSaleDate(str){
  if(!str)return 0;
  var t=new Date(str).getTime();
  if(!isNaN(t))return t;
  var parts=str.split('/');
  if(parts.length===3){
    return new Date(parseInt(parts[2]),parseInt(parts[0])-1,parseInt(parts[1])).getTime();
  }
  return 0;
}

// Extract numeric part of invoice number for ordering (handles YYYY/NNNN or plain number)
function parseInvNum(n){
  if(!n)return 0;
  var s=String(n);
  // Handle format YYYY/NNNN — year-prefixed invoices always come after old plain numbers
  // Use year * 1,000,000 + sequence so 2026/0005 = 2026000005 >> 5700 (old format)
  if(s.indexOf('/')!==-1){
    var parts=s.split('/');
    var yr=parseInt(parts[0])||0;
    var seq=parseInt(parts[1])||0;
    return yr*1000000+seq;
  }
  var m=s.match(/\d+/);
  return m?parseInt(m[0]):0;
}

// Generate next invoice number in format YYYY/NNNN, resetting each year
// Uses a pre-claim check to prevent duplicates when two users save simultaneously
function generateInvoiceNum(){
  var now=new Date();
  var currentYear=now.getFullYear();
  // Reset counter if year has changed
  if(!DB.invoiceYear||DB.invoiceYear!==currentYear){
    DB.invoiceCounter=1;
    DB.invoiceYear=currentYear;
  }
  // Gap protection: scan existing invoices to find the true next safe number
  // In case counter drifted (e.g. two users saved at same time), skip ahead
  var prefix=String(currentYear)+'/';
  var usedNums=DB.sales
    .filter(function(s){return s.invoiceNum&&String(s.invoiceNum).indexOf(prefix)===0;})
    .map(function(s){return parseInt(String(s.invoiceNum).split('/')[1])||0;});
  var maxUsed=usedNums.length?Math.max.apply(null,usedNums):0;
  // Always use max(counter, maxUsed+1) so we never re-use a number
  if(DB.invoiceCounter<=maxUsed){
    DB.invoiceCounter=maxUsed+1;
  }
  var seq=String(DB.invoiceCounter).padStart(4,'0');
  return currentYear+'/'+seq;
}

// Returns {prevInvTotal, outstandingAtDate} for a given customer + invoice
// Uses date + invoice number as tiebreaker: lower invoice number on same date = earlier
function calcOutstandingAtDate(custId, invDate, invNum, invNet){
  var invTs=parseSaleDate(invDate);
  var invN=parseInvNum(invNum);

  function isBefore(sDate, sInvNum){
    var sTs=parseSaleDate(sDate);
    if(sTs < invTs) return true;
    if(sTs === invTs) return parseInvNum(sInvNum) < invN;
    return false;
  }

  // Opening balance set at customer setup — always counts as pre-existing debt
  var cust=DB.customers.find(function(c){return c.id==custId;});
  var openingBal=cust?(cust.openingBalance||0):0;

  // Only unpaid (credit) or partially paid invoices before this one
  var prevUnpaid=DB.sales.filter(function(s){
    return s.custId==custId &&
      (s.payment==='credit'||s.payment==='part') &&
      (s.invoiceNum||s.id)!==invNum &&
      isBefore(s.date, s.invoiceNum||s.id);
  });

  // Credit payments made on or before this invoice date
  var prevCreditPayments=(DB.creditPayments||[]).filter(function(p){
    return p.custId==custId && parseSaleDate(p.date)<=invTs;
  });

  var prevOwed=prevUnpaid.reduce(function(a,s){
    var dep=s.depositApplied||0;
    if(s.payment==='credit') return a+Math.max(0,s.total-dep);
    if(s.payment==='part') return a+Math.max(0,s.total-(s.partPayment||0)-dep);
    return a;
  },0);
  var prevPaid=prevCreditPayments.reduce(function(a,p){return a+p.amount;},0);

  // prevInvTotal = opening balance + all prior unpaid invoices - payments made before this date
  var prevInvTotal=Math.max(0,openingBal+prevOwed-prevPaid);
  var outstandingAtDate=prevInvTotal+Math.max(0,invNet);
  return {prevInvTotal:prevInvTotal,outstandingAtDate:outstandingAtDate};
}

function printCustomerStatement(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  // Build all events same as the account statement
  var allEvents=[];
  if(cust.openingBalance>0)allEvents.push({type:'opening',date:'—',label:'Opening balance',amount:cust.openingBalance,mode:'—',by:'Setup'});
  var custInvs={};
  DB.sales.filter(function(s){return String(s.custId)==String(custId)&&(s.payment==='credit'||s.payment==='part');}).forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!custInvs[k])custInvs[k]={type:'invoice',date:s.date,label:'Invoice #'+k,amount:s.total,partPayment:s.partPayment||0,payment:s.payment,mode:s.payment==='credit'?'Credit':'Part payment',by:s.seller};
    else{custInvs[k].amount+=s.total;}
  });
  Object.values(custInvs).forEach(function(e){allEvents.push(e);});
  (DB.creditPayments||[]).filter(function(p){return String(p.custId)==String(custId);}).forEach(function(p){
    var isWO=p.payMode==='writeoff';
    allEvents.push({type:isWO?'writeoff':'payment',date:p.date,
      label:isWO?'✂ Write-off / Discount':'Payment received',
      amount:p.amount,mode:isWO?'Discount':payModeLabel(p),by:p.by});
  });
  var retMap={};
  (DB.salesReturns||[]).filter(function(r){return String(r.custId)==String(custId);}).forEach(function(r){
    var k=r.invoiceNum+'_'+r.date;
    if(!retMap[k])retMap[k]={type:'return',date:r.date,label:'Return \u2014 Invoice #'+r.invoiceNum,amount:0,refundType:r.refundType,mode:r.refundType==='cash'?'Cash refund':r.refundType==='credit'?'Store credit':'Exchange',by:r.by};
    retMap[k].amount+=r.refundAmt||0;
  });
  Object.values(retMap).forEach(function(e){allEvents.push(e);});
  allEvents.sort(function(a,b){if(a.type==='opening')return -1;if(b.type==='opening')return 1;return parseSaleDate(a.date)-parseSaleDate(b.date);});
  var running=0;

    running=Math.round(running*100)/100;
    var dr=e.type==='invoice'||e.type==='opening'?fmt(e.amount):'';
    var cr=(e.type==='payment'||e.type==='writeoff')||(e.type==='return'&&(e.refundType==='credit'||e.refundType==='exchange'))?fmt(e.amount):'';

      '<td>'+e.date+'</td>'+
      '<td>'+e.label+'</td>'+
      '<td style="text-align:right;color:#c0392b">'+dr+'</td>'+
      '<td style="text-align:right;color:#15803d">'+cr+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+(running>0?'#c0392b':'#15803d')+'">'+fmt(Math.max(0,running))+'</td>'+
      '<td>'+e.mode+'</td>'+
      '<td>'+e.by+'</td>'+
    '</tr>';
  }).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Account Statement</title>'+
    '<style>@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px}'+
    '.h{text-align:center;border-bottom:2px solid #065f46;padding-bottom:8px;margin-bottom:12px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b}.co2{font-size:16px;font-weight:900;color:#1a237e}'+
    '.cust-box{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr}'+
    'table{width:100%;border-collapse:collapse}th{background:#065f46;color:#fff;padding:4px 6px;font-size:9px;text-align:left}'+
    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even)td{background:#f0fdf4}'+
    '.bal{font-size:13px;font-weight:700;color:'+(cust.creditBalance>0?'#c0392b':'#15803d')+';text-align:right}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:12px;font-weight:700;color:#065f46;margin-top:4px">CUSTOMER ACCOUNT STATEMENT</div>'+
      '<div style="font-size:9px;color:#555;margin-top:2px">Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<div class="cust-box">'+
      '<div><b>Customer:</b> '+cust.name+'</div>'+
      '<div><b>Phone:</b> '+(cust.phone||'—')+'</div>'+
      '<div><b>Business:</b> '+(cust.biz||'—')+'</div>'+
      '<div><b>Credit limit:</b> '+(cust.creditLimit>0?fmt(cust.creditLimit):'No limit')+'</div>'+
      '<div><b>Member since:</b> '+(cust.joinDate||'—')+'</div>'+
      '<div class="bal">Current balance: '+fmt(Math.max(0,cust.creditBalance||0))+'</div>'+
    '</div>'+

    '</div>'+
    '<div style="margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px">'+

    '</div>'+

  var w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(function(){w.print();},400);

function printCustomerInvoice(invNum,custId){

  var rows=invSales.map(function(s,i){var hasP=(s.suppliedQty!==undefined&&(s.pendingQty||0)>0)||(s.supplyStatus==='partial'||s.supplyStatus==='pending');var sQty=s.suppliedQty!==undefined?s.suppliedQty:s.qty;var pQty=s.pendingQty||0;var qCell=hasP?'<span style="color:#16a34a;font-weight:700">'+sQty+' supplied</span><br><span style="color:#dc2626;font-size:9px">'+pQty+' pending</span>':''+s.qty;return '<tr><td class="center">'+(i+1)+'</td><td>'+s.name+'</td><td class="center">'+qCell+'</td><td class="right">'+fmt(s.salePrice)+'</td><td class="right" style="background:#fff5f5;color:#c0392b">'+(s.discAmt>0?'-'+fmt(s.discAmt):'')+'</td><td class="right"><b>'+fmt(s.total)+'</b></td></tr>';}).join('');
  var grandTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var emptyRows='';var minRI=Math.max(12,invSales.length);for(var i=invSales.length;i<minRI;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  // Date-aware: only count invoices/payments that existed at the time of this invoice
  var partPaid=s0.partPayment||0;

  var invNet=s0.payment==='credit'?Math.max(0,grandTotal-depApplied):s0.payment==='part'?Math.max(0,grandTotal-partPaid-depApplied):0;
  var bal=cust?calcOutstandingAtDate(custId,s0.date,invNum,invNet):{prevInvTotal:0,outstandingAtDate:0};
  var prevInvTotal=bal.prevInvTotal;
  var outstandingBal=bal.outstandingAtDate;
  function doPrint(withOutstanding){
    var _printTotal=s0.depositTotal||grandTotal;var html=buildInvoiceHTML({invoiceNum:invNum,custName:s0.printName||(cust?cust.name:'Unknown'),custAddr:cust?cust.address||'':'',day:day,month:mon,year:yr,rows:rows+emptyRows,itemCount:invSales.length,grandTotal:_printTotal,payment:s0.payment,payMode:s0.payMode,depTopupMode:s0.depTopupMode||null,depositApplied:depApplied||0,bankId:s0.bankId,posId:s0.posId,splitPayment:s0.splitPayment||null,seller:s0.seller,pendingSupply:s0.pendingSupply||false,wasEverPending:s0.wasEverPending||false,supplyDate:s0.supplyDate||null,
      partPayment:partPaid,
      outstandingBal:withOutstanding?outstandingBal:0,prevInvTotal:withOutstanding&&prevInvTotal>0?prevInvTotal:0});
    var w=window.open('','_blank','width=600,height=850');w.document.write(html);w.document.close();setTimeout(function(){w.print();},500);
  }
  if(outstandingBal>0){
    showPrintChoiceModal(cust?cust.name:'Customer',outstandingBal,prevInvTotal,grandTotal,
      function(){doPrint(true);},function(){doPrint(false);});
  } else {

  }
}

var invoiceItems=[]; // current invoice line items being built

function saveDraft(){
  if(!invoiceItems.length){alert('Add at least one item before saving as draft.');return;}
  var invNum=document.getElementById('s-inv-num')?document.getElementById('s-inv-num').value.trim():'';
  var custId=null,custName='Walk-in';
  if(saleCustomerType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)custId=sel.value;var rc=DB.customers.find(function(c){return c.id==custId;});if(rc)custName=rc.name;}
  var draftId=uid();
  var draft={id:draftId,invoiceNum:invNum,custId:custId,custName:custName,custType:saleCustomerType,items:JSON.parse(JSON.stringify(invoiceItems)),savedAt:new Date().toLocaleString()};
  if(!DB.drafts)DB.drafts=[];
  DB.drafts.push(draft);
  invoiceItems=[];
  saveData();
  alert('Draft saved! Invoice items have been saved as a draft. You can load it later from the drafts list below.');
  renderApp();
}

function loadDraft(draftId){
  if(invoiceItems.length){if(!confirm('Loading a draft will clear your current invoice items. Continue?'))return;}
  var draft=DB.drafts.find(function(d){return d.id==draftId;});
  if(!draft){alert('Draft not found.');return;}
  invoiceItems=JSON.parse(JSON.stringify(draft.items));
  saleCustomerType=draft.custType||'walkin';
  DB.drafts=DB.drafts.filter(function(d){return d.id!==draftId;});
  saveData();
  renderApp();
  setTimeout(function(){
    if(draft.invoiceNum){var el=document.getElementById('s-inv-num');if(el)el.value=draft.invoiceNum;}
    if(draft.custId&&draft.custType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)sel.value=draft.custId;}
    renderInvoiceItems();
  },80);
}

function deleteDraft(draftId){
  var d=DB.drafts.find(function(x){return x.id===draftId;});
  showConfirm({
    type:'warning',
    title:'Delete this draft?',
    msg:'The draft invoice will be permanently deleted (it won\'t go to the bin).',
    detail:d?'Invoice '+(d.invoiceNum?'#'+d.invoiceNum:'(no number)')+' — '+d.custName:'Draft',

function addInvoiceItem(){
  var itemId=document.getElementById('inv-item').value;
  var qty=parseFloat(document.getElementById('inv-qty').value)||0;
  var price=parseFloat(document.getElementById('inv-price').value)||0;
  var item=DB.inventory.find(function(i){return i.id==itemId;});
  if(!item){alert('Select an item.');return;}
  // Partial supply warning - don't block, just inform
  if(qty>item.qty&&item.qty>=0){
    var avail=item.qty;
    var short=qty-avail;
    if(!confirm('⚠️ Partial supply alert!\n\nOrdered: '+qty+'\nIn stock: '+avail+'\nShort: '+short+'\n\n'+avail+' will be supplied now.\n'+short+' will be marked as PENDING supply.\n\nContinue?'))return;
  }
  // Enforce cost price exists
  if(!item.cost||item.cost<=0){
    alert('❌ Cannot sell "'+item.name+'"  -  this item has no cost price set.\n\nPlease go to Stock Management → Product Editing and set the cost price first before selling this item.');
    return;
  }
  if(qty<=0){alert('Enter a valid quantity.');return;}
  if(price<=0){alert('Enter a selling price.');return;}
  // Block selling below cost price (no per-item discount anymore  -  checked at invoice level)
  if(price<item.cost){
    var shortfall=item.cost-price;
    alert('❌ Selling price is below cost price!\n\nItem: '+item.name+'\nCost price: '+fmt(item.cost)+'\nYour selling price: '+fmt(price)+'\nShortfall per unit: '+fmt(shortfall)+'\n\nYou cannot sell below cost price. Please increase the selling price.');
    return;
  }
  var subtotal=price*qty;
  var profit=(price-item.cost)*qty;
  invoiceItems.push({lineId:uid(),itemId:item.id,name:item.name,cost:item.cost,qty:qty,price:price,discAmt:0,total:subtotal,profit:profit});
  document.getElementById('inv-qty').value='';document.getElementById('inv-price').value='';
  document.getElementById('inv-item').value='';
  var s=document.getElementById('inv-item-search');if(s)s.value='';
  renderInvoiceItems();
}

var MAX_INVOICE_DISC_PCT=5; // Maximum allowed invoice discount percentage

function calcInvoiceDiscount(){
  var subtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var discType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var discValInput=document.getElementById('inv-disc-val');
  var discVal=parseFloat(discValInput?discValInput.value:0)||0;
  var warningEl=document.getElementById('inv-disc-warning');

  // Enforce 5% cap
  if(discType==='pct'&&discVal>MAX_INVOICE_DISC_PCT){
    // Clamp the input value
    if(discValInput){discValInput.value=MAX_INVOICE_DISC_PCT;discVal=MAX_INVOICE_DISC_PCT;}
    if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'%</strong>. Value has been capped automatically.</div>';
  } else if(discType==='flat'&&subtotal>0){
    var maxFlatAmt=subtotal*MAX_INVOICE_DISC_PCT/100;
    if(discVal>maxFlatAmt){
      if(discValInput){discValInput.value=Math.round(maxFlatAmt*100)/100;discVal=maxFlatAmt;}
      if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'% ('+fmt(maxFlatAmt)+')</strong> of the subtotal. Value has been capped automatically.</div>';
    } else {
      if(warningEl)warningEl.innerHTML='';
    }
  } else {
    if(warningEl)warningEl.innerHTML='';
  }

  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;

  // Also check below-cost warning
  if(discAmt>0){
    var totalCost=invoiceItems.reduce(function(a,l){return a+(l.cost*l.qty);},0);
    if(finalTotal<totalCost&&warningEl){
      warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">⚠️ Even with this discount, the invoice total ('+fmt(finalTotal)+') is below total cost ('+fmt(totalCost)+'). The sale will be at a loss.</div>';
    }
  }

  // Update summary
  var sumEl=document.getElementById('inv-totals-summary');if(!sumEl)return;
  var totalProfit=invoiceItems.reduce(function(a,l){return a+l.profit;},0)-discAmt;
  sumEl.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--danger)">Invoice discount</span><span style="color:var(--danger)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Grand total</span><span>'+fmt(finalTotal)+'</span></div>'+
    '<div class="sale-summary-row"><span style="color:var(--text2)">Total profit</span><span style="color:'+(totalProfit>=0?'var(--success)':'var(--danger)')+'">'+fmt(totalProfit)+'</span></div>';
}

function updateInvoiceTotals(){
  var el=document.getElementById('inv-totals');if(!el)return;
  if(!invoiceItems.length){el.innerHTML='';return;}
  var subtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var totalProfit=invoiceItems.reduce(function(a,l){return a+l.profit;},0);
  el.innerHTML=
    '<div style="background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-top:.75rem;margin-bottom:1rem">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start">'+
    '<div>'+
      '<p style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Invoice discount <span style="font-weight:500;color:var(--danger);font-size:10px">(max '+MAX_INVOICE_DISC_PCT+'%)</span></p>'+
      '<div style="display:flex;gap:8px;align-items:end">'+
        '<div class="form-group" style="margin:0;flex:0 0 140px">'+
          '<label>Discount type</label>'+
          '<select id="inv-disc-type" onchange="calcInvoiceDiscount()" style="margin-top:4px">'+
            '<option value="none">No discount</option>'+
            '<option value="pct">Percentage (max '+MAX_INVOICE_DISC_PCT+'%)</option>'+
            '<option value="flat">Flat amount (₦)</option>'+
          '</select>'+
        '</div>'+
        '<div class="form-group" style="margin:0;flex:0 0 120px">'+
          '<label>Value</label>'+
          '<input type="number" id="inv-disc-val" placeholder="0" min="0" oninput="calcInvoiceDiscount()" style="margin-top:4px">'+
        '</div>'+
      '</div>'+
      '<div id="inv-disc-warning"></div>'+
    '</div>'+
    '<div>'+
      '<p style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Invoice summary</p>'+
      '<div class="sale-summary" id="inv-totals-summary">'+
        '<div class="sale-summary-row total"><span>Grand total</span><span>'+fmt(subtotal)+'</span></div>'+
        '<div class="sale-summary-row"><span style="color:var(--text2)">Total profit</span><span style="color:var(--success)">'+fmt(totalProfit)+'</span></div>'+
      '</div>'+
    '</div>'+
    '</div></div>';
}
