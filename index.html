function selectWhaItem(id){
  var item=DB.inventory.find(function(i){return i.id==id;});if(!item)return;
  var inWh=DB.warehouse.find(function(w){return w.id===id;});
  document.getElementById('wha-item-id').value=item.id;
  document.getElementById('wha-search').value=item.name;
  document.getElementById('wha-item-info').innerHTML=
    '<span style="color:#15803d;font-weight:600">Shop stock: '+item.qty+'</span>'+
    (inWh?' &nbsp;·&nbsp; <span style="color:#1a237e;font-weight:600">Already in warehouse: '+inWh.qty+'</span>':'');
  document.getElementById('wha-dropdown').style.display='none';
  var mq=document.getElementById('wha-minqty');
  if(mq&&inWh)mq.value=inWh.minQty||0;
  document.getElementById('wha-qty').focus();
}
function saveAddWarehouseStock(){
  var itemId=document.getElementById('wha-item-id').value;
  var qty=parseInt(document.getElementById('wha-qty').value)||0;
  var minQty=parseInt(document.getElementById('wha-minqty').value)||0;
  var note=(document.getElementById('wha-note').value||'').trim();
  if(!itemId){alert('Please select an item.');return;}
  if(qty<1){alert('Enter a valid quantity.');return;}
  var item=DB.inventory.find(function(i){return i.id==itemId;});
  if(!item){alert('Item not found.');return;}
  var existing=DB.warehouse.find(function(w){return w.id==itemId;});
  if(existing){
    existing.qty+=qty;
    existing.minQty=minQty;
  } else {
    DB.warehouse.push({id:item.id,name:item.name,cat:item.cat||'',qty:qty,minQty:minQty,cost:item.cost||0,supplierId:item.supplierId||''});
  }
  // Log the addition
  DB.transferLog.push({id:uid(),date:new Date().toLocaleDateString(),direction:'to_warehouse',itemId:item.id,itemName:item.name,itemCat:item.cat||'',qty:qty,waybill:'OPENING-STOCK',note:note||'Existing stock added manually',by:DB.currentUser.name});
  saveData();
  document.getElementById('wh-add-modal').remove();
  renderApp();
}
function editWhMinQty(itemId){
  var item=DB.warehouse.find(function(i){return i.id==itemId;});
  if(!item){alert('Item not found.');return;}
  var val=prompt('Set minimum quantity for '+item.name+' (current: '+item.minQty+'):',item.minQty);
  if(val===null)return;
  var num=parseInt(val);
  if(isNaN(num)||num<0){alert('Please enter a valid number (0 or more).');return;}
  item.minQty=num;
  saveData();
  renderApp();
}

var whSearch='';
function buildWarehouse(){
  if(!canDo('warehouse'))return '<div class="empty">Access denied. Ask admin to grant Warehouse permission.</div>';
  var totalVal=0,outStock=0,lowStock=0,totalIn=0,totalOut=0;
  DB.warehouse.forEach(function(i){totalVal+=i.qty*i.cost;if(i.qty===0)outStock++;else if(i.qty<=i.minQty)lowStock++;});
  DB.transferLog.forEach(function(t){if(t.direction==='to_warehouse')totalIn+=t.qty;else totalOut+=t.qty;});
  var wsTerm=whSearch.toLowerCase();
  var filteredWh=wsTerm?DB.warehouse.filter(function(i){return i.name.toLowerCase().indexOf(wsTerm)>-1||(i.cat||'').toLowerCase().indexOf(wsTerm)>-1;}):DB.warehouse;
  var rows=filteredWh.length?filteredWh.map(function(i){
    var status=i.qty===0?'<span class="badge out">Out</span>':i.qty<=i.minQty?'<span class="badge low">Low</span>':'<span class="badge ok">OK</span>';
    return '<tr data-wh-name="'+i.name.toLowerCase()+'" data-wh-cat="'+(i.cat||'').toLowerCase()+'">'+
      '<td>'+esc(i.name)+'</td><td>'+(i.cat||'-')+'</td><td>'+i.qty+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:5px">'+i.minQty+
        '<button onclick="editWhMinQty(\''+i.id+'\')" style="background:none;border:none;cursor:pointer;font-size:11px;color:#6c757d;padding:1px 4px" title="Edit min qty">✏️</button>'+
      '</div></td>'+
      '<td>'+fmt(i.cost)+'</td><td>'+fmt(i.qty*i.cost)+'</td><td>'+status+'</td></tr>';
  }).join(''):(wsTerm?'<tr><td colspan="7" class="empty">No items match "'+whSearch+'".</td></tr>':'<tr><td colspan="7" class="empty">Warehouse is empty. Transfer goods from the Shop to get started.</td></tr>');

  // Transfer history with filter
  var filterDir=window._whDirFilter||'all';
  var filteredLog=DB.transferLog.slice().reverse().filter(function(t){
    return filterDir==='all'||(filterDir==='in'&&t.direction==='to_warehouse')||(filterDir==='out'&&t.direction==='to_shop');
  });
  var logRows=filteredLog.length?filteredLog.map(function(t){
    var isIn=t.direction==='to_warehouse';
    return '<tr>'+
      '<td>'+t.date+'</td>'+
      '<td><b>'+(t.waybill||'-')+'</b></td>'+
      '<td>'+t.itemName+'</td>'+
      '<td>'+(t.itemCat||'-')+'</td>'+
      '<td style="text-align:center;font-weight:700;color:'+(isIn?'var(--success)':'var(--danger)')+'">'+t.qty+'</td>'+
      '<td><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:'+(isIn?'var(--success-bg)':'var(--danger-bg)')+';color:'+(isIn?'var(--success)':'var(--danger)')+'">'+
        (isIn?'⬇ Shop → Warehouse':'⬆ Warehouse → Shop')+'</span></td>'+
      '<td style="font-size:11px">'+(t.note||'-')+'</td>'+
      '<td>'+t.by+'</td>'+
    '</tr>';
  }).join(''):'<tr><td colspan="7" class="empty">No transfers'+(filterDir!=='all'?' for this filter.':'.')+'</td></tr>';

  return '<div class="metrics">'+
    mc('Warehouse Items',filteredWh.length+(wsTerm?' / '+DB.warehouse.length:''),'','')+
    mc('Stock Value',fmt(totalVal),'At cost','')+
    mc('Total In',totalIn,'Units transferred in','green')+
    mc('Total Out',totalOut,'Units transferred out',totalOut>0?'amber':'')+
    '</div>'+
    '<div style="display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">'+
      '<button class="btn primary" onclick="showTransferModal(\'to_warehouse\')" style="font-size:13px;padding:10px 20px">📦 → 🏭 &nbsp;Shop to Warehouse</button>'+
      '<button class="btn" onclick="showTransferModal(\'to_shop\')" style="font-size:13px;padding:10px 20px;color:var(--primary);border-color:#b6d4fe">🏭 → 📦 &nbsp;Warehouse to Shop</button>'+
      '<button class="btn" onclick="showAddWarehouseStockModal()" style="font-size:13px;padding:10px 20px;color:#15803d;border-color:#86efac;font-weight:700">➕ Add Existing Stock</button>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">'+
      '<p class="sec-title" style="margin:0">Warehouse Stock</p>'+
      '<div style="position:relative;max-width:300px;flex:1">'+
        '<span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3)">&#128269;</span>'+
        '<input type="text" id="wh-search" placeholder="Search warehouse items..." value="'+whSearch+'" oninput="whSearch=this.value;filterWhTable()" style="padding-left:32px;width:100%;font-size:13px">'+
      '</div>'+
      (whSearch?'<button class="btn sm" onclick="whSearch=\'\';renderApp()" style="color:var(--danger);border-color:#f5c2c7">✕ Clear</button>':'')+
    '</div>'+
    '<div class="tbl-wrap"><table id="wh-stock-table"><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Min Qty</th><th>Cost</th><th>Value</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:1.5rem 0 8px">'+
      '<p class="sec-title" style="margin:0">Transfer History ('+DB.transferLog.length+' records)</p>'+
      '<div style="display:flex;gap:6px">'+
        '<button class="btn sm" onclick="window._whDirFilter=\'all\';renderApp()" style="'+(filterDir==='all'?'background:var(--primary);color:#fff;border-color:var(--primary)':'')+'">All</button>'+
        '<button class="btn sm" onclick="window._whDirFilter=\'in\';renderApp()" style="'+(filterDir==='in'?'background:var(--success);color:#fff;border-color:var(--success)':'')+'">⬇ In</button>'+
        '<button class="btn sm" onclick="window._whDirFilter=\'out\';renderApp()" style="'+(filterDir==='out'?'background:var(--danger);color:#fff;border-color:var(--danger)':'')+'">⬆ Out</button>'+
      '</div>'+
    '</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Waybill No.</th><th>Item</th><th>Category</th><th style="text-align:center">Qty</th><th>Direction</th><th>Notes</th><th>By</th></tr></thead><tbody>'+logRows+'</tbody></table></div>';
}
function filterWhTable(){
  var term=whSearch.toLowerCase().trim();
  var tbody=document.querySelector('#wh-stock-table tbody');
  if(!tbody)return;
  tbody.querySelectorAll('tr[data-wh-name]').forEach(function(row){
    var name=row.getAttribute('data-wh-name')||'';
    var cat=row.getAttribute('data-wh-cat')||'';
    row.style.display=(!term||name.indexOf(term)>-1||cat.indexOf(term)>-1)?'':'none';
  });
}

function renderPanel(){
  var scrollY=window.scrollY||window.pageYOffset;
  var p=document.getElementById('panel-root');if(!p)return;
  var map={inventory:buildInventory,stockmgmt:buildStockMgmt,warehouse:buildWarehouse,sales:buildSales,demosales:buildDemoSales,purchases:buildPurchases,expenses:buildExpenses,finance:buildFinance,suppliers:buildSuppliers,suppayments:buildSupplierPayments,customers:buildCustomers,creditcust:buildCreditCust,reports:buildReports,closing:buildClosingReport,activitylog:buildActivityLog,recyclebin:buildRecycleBin,settings:buildSettings,users:buildUsers,supplieroverview:buildSupplierOverview,customeroverview:buildCustomerOverview,inventoryval:buildInventoryVal,pandl:buildPandL,returnstrack:buildReturnsTracker,proformas:buildProformas,productreport:buildProductReport,monthlysummary:(typeof buildMonthlyReport==='function'?buildMonthlyReport:function(){return '<div class="empty">Monthly Summary loading...</div>';})};
  var content='';
  try{
    content=(map[activeTab]||function(){return '';})();
    if(!content)content='<div class="empty">Nothing to show here yet.</div>';
  }catch(e){
    content='<div class="card" style="border-left:4px solid var(--danger);padding:16px"><b>⚠️ Panel error ('+activeTab+'):</b><br><code style="font-size:11px;white-space:pre-wrap">'+e.message+'</code></div>';
    console.error('renderPanel error:',e);
  }
  // Show version notes only on inventory (home) or when explicitly navigating to it
  var vnHtml='';
  var footer='<div style="text-align:center;padding:1.5rem 1rem;margin-top:2rem;border-top:1px solid var(--border);font-size:11px;color:var(--text3)">'+
    '&copy; 2026 Great Chid Electro (Nig.) &nbsp;&middot;&nbsp; Built by <span style="color:var(--primary);font-weight:600">Vibkings</span>'+
    '</div>';
  p.innerHTML=vnHtml+content+footer;
  if(activeTab==='inventory'&&invSearch){window._invPage=0;}
  if(activeTab==='sales'&&salesSearch){window._salesPage=0;}
  if(activeTab==='purchases'&&purchaseSearch){setTimeout(function(){window._purchPage=0;},0);}
  // Event delegation for expense edit/delete buttons
  if(activeTab==='expenses'){
    p.querySelectorAll('.exp-edit-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.closest('tr').getAttribute('data-expid');
        editExpense(id);
      });
    });
    p.querySelectorAll('.exp-del-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.closest('tr').getAttribute('data-expid');
        deleteExpense(id);
      });
    });
  }
  // Event delegation for demo sales print/delete buttons
  if(activeTab==='demosales'){
    p.querySelectorAll('.demo-print-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.closest('tr').getAttribute('data-demoid');
        reprintDemoInvoice(id);
      });
    });
    p.querySelectorAll('.demo-del-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.closest('tr').getAttribute('data-demoid');
        deleteDemoSale(id);
      });
    });
  }
  // Restore focus and cursor position for search inputs after re-render
  var activeSearch=null;
  if(activeTab==='inventory'&&invSearch)activeSearch='inv-search';
  if(activeTab==='sales'&&salesSearch)activeSearch='sales-search';
  if(activeTab==='purchases'&&purchaseSearch)activeSearch='purch-search-input';
  if(activeSearch){
    var el=document.getElementById(activeSearch);
    if(el){el.focus();var v=el.value;el.value='';el.value=v;}
  }
  window.scrollTo(0,scrollY);
}

// INVENTORY
function getCatOpts(sel){var o=DB.categories.slice().reverse().map(function(c){return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+c+'</option>';}).join('');return '<option value="">-- Category --</option>'+o+'<option value="__new__">+ New category...</option>';}
function handleCatChange(s,nid){var ni=document.getElementById(nid);if(ni)ni.style.display=s==='__new__'?'block':'none';}
function resolveCategory(sid,nid){
  var s=document.getElementById(sid);if(!s)return '';
  if(s.value==='__new__'){
    var ni=document.getElementById(nid);var nc=ni?ni.value.trim():'';
    if(!nc){alert('Enter a name for the new category.');return null;}
    var dup=DB.categories.find(function(c){return c.toLowerCase()===nc.toLowerCase();});
    if(dup){alert('Category "'+dup+'" already exists. Please select it from the list.');return null;}
    DB.categories.push(nc);return nc;
  }
  return s.value;
}
function addItem(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('Item name is required.');return;}
  var dupItem=DB.inventory.find(function(i){return i.name.toLowerCase()===name.toLowerCase();});
  if(dupItem){alert('An item named "'+dupItem.name+'" already exists.\n\nTo add more stock, use Stock Management \u2192 Stock Adjustment instead.');return;}
  var qty=parseInt(document.getElementById('f-qty').value)||0,cost=parseFloat(document.getElementById('f-cost').value)||0,sell=parseFloat(document.getElementById('f-sell').value)||0,minQty=parseInt(document.getElementById('f-minqty').value)||5,supId=document.getElementById('f-supplier').value;
  var cat=resolveCategory('f-cat','f-cat-new');
  if(cat===null)return;
  if(cost<=0){alert('\u274c Cost price is required.');return;}
  if(sell<=0){alert('\u274c Selling price is required.');return;}
  if(sell<cost){alert('\u274c Selling price ('+fmt(sell)+') cannot be less than cost price ('+fmt(cost)+').');return;}
  DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
  ['f-name','f-qty','f-cost','f-sell','f-minqty'].forEach(function(id){document.getElementById(id).value='';});renderApp();
}

function removeItem(id){
  if(!isAdmin()&&!canDo('invdelete')){alert('You do not have permission to delete inventory items. Contact your admin.');return;}
  var item=DB.inventory.find(function(i){return i.id===id;});
  if(!item)return;
  showConfirm({
    type:'danger',
    title:'Delete inventory item?',
    msg:'This item will be moved to the Recycle Bin. You can restore it within 30 days.',
    detail:'📦 '+esc(item.name)+' — Qty: '+item.qty+' · Cost: '+fmt(item.cost||0),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('inventory',item,'Inventory');
    DB.inventory=DB.inventory.filter(function(i){return i.id!==id;});
    saveData();renderApp();
  });
}
function filterInventoryTable(){
  var term=invSearch.toLowerCase().trim();
  var tbody=document.querySelector('#inv-stock-table tbody');
  var countEl=document.getElementById('inv-search-count');
  var clearBtn=document.getElementById('inv-clear-btn');
  if(!tbody)return;
  var rows=tbody.querySelectorAll('tr');
  var visible=0;
  rows.forEach(function(row){
    if(row.getAttribute('data-empty')){
      row.style.display=term?'none':'';
      return;
    }
    var name=(row.getAttribute('data-name')||'').toLowerCase();
    var cat=(row.getAttribute('data-cat')||'').toLowerCase();
    var sup=(row.getAttribute('data-sup')||'').toLowerCase();
    var match=!term||name.indexOf(term)>-1||cat.indexOf(term)>-1||sup.indexOf(term)>-1;
    row.style.display=match?'':'none';
    if(match)visible++;
  });
  if(countEl){
    var total=rows.length-(rows[rows.length-1]&&rows[rows.length-1].getAttribute('data-empty')?1:0);
    countEl.textContent=term?(visible+' of '+total+' items'):(total+' item'+(total!==1?'s':''));
  }
  if(clearBtn)clearBtn.style.display=term?'':'none';
  // Show/hide no-results row
  var noRes=tbody.querySelector('tr[data-noresult]');
  if(term&&visible===0){
    if(!noRes){noRes=document.createElement('tr');noRes.setAttribute('data-noresult','1');noRes.innerHTML='<td colspan="11" class="empty">No items match "'+invSearch+'".</td>';tbody.appendChild(noRes);}
    else{noRes.querySelector('td').textContent='No items match "'+invSearch+'".';noRes.style.display='';}
  } else if(noRes){noRes.style.display='none';}
}

// Dynamically load SheetJS from multiple CDN fallbacks
function loadXLSX(callback){
  if(typeof XLSX!=='undefined'){callback(null);return;}
  var cdns=[
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  var idx=0;
  function tryNext(){
    if(idx>=cdns.length){callback(new Error('Could not load Excel library. Please check your internet connection and try again.'));return;}
    var s=document.createElement('script');
    s.src=cdns[idx++];
    s.onload=function(){callback(null);};
    s.onerror=function(){tryNext();};
    document.head.appendChild(s);
  }
  tryNext();
}

function exportInventoryTemplate(){
  loadXLSX(function(err){
    if(err){alert(err.message);return;}
  var headers=[['Item Name*','Category','Qty','Min Qty','Cost Price (₦)*','Sell Price (₦)*','Supplier']];
  var examples=[
    ['2.5mm Single Cable Reel','Cables',10,5,4500,6500,'Dangote Supplies'],
    ['Switch Socket (2 gang)','Sockets',50,10,350,600,'Lagos Electricals'],
    ['LED Bulb 9W','Bulbs',100,20,250,450,''],
  ];

  ws['!cols']=[{wch:30},{wch:16},{wch:8},{wch:8},{wch:18},{wch:18},{wch:20}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Inventory');

  });

function exportInventoryExcel(){

  var rows=DB.inventory.map(function(i){
    return [i.name,i.cat||'',i.qty,i.minQty,i.cost,i.sell,getSupName(i.supId),i.qty*i.cost];

function importInventoryExcel(file){
  if(!file)return;
  loadXLSX(function(err){
    if(err){alert(err.message);return;}
    var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){alert('The file appears empty. Make sure it has a header row and at least one item.');return;}

      // Detect header row — find the row containing "Item Name" or "Name"
      var headerRow=0;
      for(var r=0;r<Math.min(5,rows.length);r++){
        var rStr=rows[r].join('|').toLowerCase();
        if(rStr.indexOf('item')!==-1||rStr.indexOf('name')!==-1){headerRow=r;break;}
      }
      var headers=rows[headerRow].map(function(h){return String(h).toLowerCase().trim();});

      // Map columns flexibly
      function col(keywords){
        for(var i=0;i<headers.length;i++){
          for(var j=0;j<keywords.length;j++){
            if(headers[i].indexOf(keywords[j])!==-1)return i;
          }
        }
        return -1;
      }
      var cName=col(['item name','name','product','description','item']);
      var cCat=col(['category','cat','type','group']);
      var cQty=col(['qty','quantity','stock','units']);
      var cMinQty=col(['min qty','minimum','min stock','reorder','restock']);
      var cCost=col(['cost price','cost','buy price','buying price','purchase price','buying','buy']);
      var cSell=col(['sell price','selling price','sale price','sell','selling','sale']);
      var cSup=col(['supplier','vendor','sup']);

      // If both cost and sell resolve to the same column, try to fix by position
      // Template order: Item Name, Category, Qty, Min Qty, Cost Price, Sell Price, Supplier
      if(cCost===cSell){
        // Find all columns containing 'price' and assign by order
        var priceCols=[];
        for(var pi=0;pi<headers.length;pi++){if(headers[pi].indexOf('price')!==-1)priceCols.push(pi);}
        if(priceCols.length>=2){cCost=priceCols[0];cSell=priceCols[1];}
      }
      var cSup=col(['supplier','vendor','sup']);

      if(cName===-1){alert('Could not find an "Item Name" column. Make sure your Excel file has a column named "Item Name" or "Name".');return;}
      if(cCost===-1){alert('Could not find a "Cost Price" column. Make sure you have a column named "Cost" or "Cost Price".');return;}
      if(cSell===-1){alert('Could not find a "Sell Price" column. Make sure you have a column named "Sell" or "Sell Price".');return;}

      var modeEl=document.querySelector('input[name="inv-import-mode"]:checked');
      var importMode=window._importMode||(modeEl?modeEl.value:'skip');
      window._importMode=null;

      var added=0,skipped=0,updated=0;
      var skippedNames=[];
      var results=[];

      for(var i=headerRow+1;i<rows.length;i++){
        var row=rows[i];
        var name=String(row[cName]||'').trim();
        if(!name)continue; // skip empty rows

        var cost=parseFloat(row[cCost])||0;
        var sell=parseFloat(row[cSell])||0;
        var qty=parseInt(row[cQty])||0;
        var minQty=parseInt(row[cMinQty])||5;
        var cat=cCat>=0?String(row[cCat]||'').trim():'';
        var supName=cSup>=0?String(row[cSup]||'').trim():'';

        if(cost<=0){skipped++;skippedNames.push(name+' (no cost price)');continue;}
        if(sell<=0){skipped++;skippedNames.push(name+' (no sell price)');continue;}

        // Add category if new
        if(cat&&!DB.categories.find(function(c){return c.toLowerCase()===cat.toLowerCase();})){
          DB.categories.push(cat);
        }

        // Find supplier ID by name
        var supId='';
        if(supName){
          var sup=DB.suppliers.find(function(s){return s.name.toLowerCase()===supName.toLowerCase();});
          if(sup)supId=sup.id;
        }

        // Check for duplicate
        var existing=DB.inventory.find(function(inv){return inv.name.toLowerCase()===name.toLowerCase();});
        if(existing){
          if(importMode==='skip'){
            // Leave existing item completely untouched
            skipped++;skippedNames.push(name+' (already exists — skipped)');
          } else if(importMode==='prices'){
            // Only update cost and sell price — never touch qty, minQty, cat, supplier
            existing.cost=cost;existing.sell=sell;
            updated++;results.push({name:name,status:'prices updated'});
          } else {
            // 'full' mode — update everything
            existing.cost=cost;existing.sell=sell;existing.qty=qty;existing.minQty=minQty;
            if(cat)existing.cat=cat;if(supId)existing.supId=supId;
            updated++;results.push({name:name,status:'fully updated'});
          }
        } else {
          DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
          added++;results.push({name:name,status:'added'});
        }
      }

      saveData();
      var modeDesc=importMode==='skip'?'New items added only (existing untouched)':importMode==='prices'?'New items added + prices updated on existing items':'New items added + existing items fully updated';
      var msg='✅ Import complete!\n\n'+
        'Mode: '+modeDesc+'\n\n'+
        '• '+added+' new item(s) added\n'+
        (updated>0?'• '+updated+' existing item(s) '+( importMode==='prices'?'had prices updated':'were fully updated')+'\n':'')+
        (skipped>0?'• '+skipped+' row(s) skipped:\n  '+skippedNames.slice(0,10).join('\n  ')+(skippedNames.length>10?'\n  ...and '+(skippedNames.length-10)+' more':''):'');
      alert(msg);
      // Reset file input so same file can be re-imported with different mode
      var fileInput=document.getElementById('inv-import-file');if(fileInput)fileInput.value='';
      renderApp();
    }catch(ex){
      alert('Failed to read the Excel file.\n\nError: '+ex.message+'\n\nMake sure the file is a valid .xlsx or .csv file.');
    }
  };
  reader.readAsArrayBuffer(file);
  }); // end loadXLSX
}

  // ── Supplier Reorder Alerts ───────────────────────────────

    if(!reorderBySupplier[supId])reorderBySupplier[supId]={supId:supId,items:[]};

          '<td style="text-align:center">'+i.minQty+'</td>'+
          '<td style="text-align:center;color:#7c3aed;font-weight:700">'+shortage+'</td>'+
          '<td style="text-align:right;font-size:11px">'+( lp?fmt(lp.cost)+' on '+lp.date:'No record')+'</td>'+
          '<td><button class="btn sm" onclick="switchTab(\'purchases\')" style="font-size:10px;color:#1a237e;border-color:#93c5fd">&#128230; Restock</button></td>'+
        '</tr>';
      }).join('');
      return '<div style="margin-bottom:12px">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
          '<div>'+
            '<span style="font-size:13px;font-weight:700;color:var(--dark)">'+supName+'</span>'+
            (supPhone?'<span style="font-size:11px;color:var(--text3);margin-left:8px">📞 '+supPhone+'</span>':'')+
          '</div>'+
          '<span style="font-size:11px;color:#dc2626;font-weight:600">'+g.items.length+' item'+(g.items.length>1?'s':'')+' low/out</span>'+
        '</div>'+
        '<div class="tbl-wrap" style="margin-bottom:0"><table>'+
          '<thead><tr><th>Item</th><th style="text-align:center">Stock</th><th style="text-align:center">Min</th><th style="text-align:center">Need</th><th style="text-align:right">Last Cost</th><th></th></tr></thead>'+
          '<tbody>'+itemHtml+'</tbody>'+
        '</table></div>'+
      '</div>';
    }).join('');

    var isCollapsed=window._reorderCollapsed||false;
    reorderAlert='<div id="reorder-alert-wrap" style="background:var(--white);border:2px solid #f59e0b;border-radius:var(--radius-lg);margin-bottom:1.25rem;box-shadow:var(--shadow-card);overflow:hidden">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:#fffbeb" onclick="window._reorderCollapsed=!window._reorderCollapsed;var body=document.getElementById(\'reorder-body\');var arrow=document.getElementById(\'reorder-arrow\');if(body){body.style.display=window._reorderCollapsed?\'none\':\'block\';}if(arrow){arrow.textContent=window._reorderCollapsed?\'▶\':\'▼\';}" >'+
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<span style="font-size:18px">🔔</span>'+
          '<div>'+
            '<div style="font-size:14px;font-weight:700;color:#92400e">Reorder Alerts — '+reorderItems.length+' item'+(reorderItems.length>1?'s':'')+' need restocking</div>'+
            '<div style="font-size:11px;color:#b45309;margin-top:1px">Items at or below minimum stock level, grouped by supplier</div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<span id="reorder-arrow" style="font-size:12px;color:#92400e;font-weight:700">'+(isCollapsed?'▶':'▼')+'</span>'+

  }
  var totalVal=0,lowStock=0,outStock=0;
  DB.inventory.forEach(function(i){totalVal+=i.qty*i.cost;if(i.qty===0)outStock++;else if(i.qty<=i.minQty)lowStock++;});
  var outItems=[],lowItems=[],noCostItems=[],belowCostItems=[];

function saveCount(){if(!countSession.every(function(c){return c.countedQty!==null&&!isNaN(c.countedQty);})){alert('Enter qty for all items.');return;}var date=new Date().toLocaleDateString();var details=[];countSession.forEach(function(c){var item=DB.inventory.find(function(i){return i.id===c.id;});if(!item)return;var diff=parseInt(c.countedQty)-c.systemQty;details.push({id:c.id,name:item.name,systemQty:c.systemQty,countedQty:parseInt(c.countedQty),diff:diff});if(diff!==0){DB.adjLog.push({id:uid(),itemId:c.id,itemName:item.name,type:'count',reason:'Stock count',before:c.systemQty,change:diff,after:parseInt(c.countedQty),date:date,by:DB.currentUser.name});item.qty=parseInt(c.countedQty);}});DB.stockCounts.push({id:uid(),date:date,items:countSession.length,variances:details.filter(function(d){return d.diff!==0;}).length,by:DB.currentUser.name,details:details});countSession=[];countStarted=false;saveData();renderApp();}

function saveCatCount(cat){
  var catItems=DB.inventory.filter(function(i){return (i.cat||'Uncategorised')===cat;});
  var date=new Date().toLocaleDateString();
  var variances=0;
  var details=[];
  catItems.forEach(function(i){
    var inp=document.getElementById('cc-'+i.id);
    if(!inp||inp.value==='')return;
    var counted=parseInt(inp.value);
    if(isNaN(counted))return;
    var diff=counted-i.qty;
    details.push({id:i.id,name:i.name,systemQty:i.qty,countedQty:counted,diff:diff});
    if(diff!==0){
      DB.adjLog.push({id:uid(),itemId:i.id,itemName:i.name,type:'count',reason:'Category count: '+cat,before:i.qty,change:diff,after:counted,date:date,by:DB.currentUser.name});
      i.qty=counted;variances++;
    }
  });
  DB.stockCounts.push({id:uid(),date:date,items:catItems.length,variances:variances,by:DB.currentUser.name,cat:cat,details:details});
  saveData();
  alert('✅ Stock count saved for category "'+cat+'".\n'+catItems.length+' items checked, '+variances+' variance(s) corrected.');
  renderApp();
}

function filterAdjLog(){
  var search=(window._adjSearch||'').toLowerCase().trim();
  var typeF=window._adjTypeF||'';
  var dateFrom=window._adjDateFrom||'';
  var dateTo=window._adjDateTo||'';
  var fdMs=dateFrom?(function(){var dp=dateFrom.split('-');return new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).getTime();})():0;
  var tdMs=dateTo?(function(){var dp=dateTo.split('-');return new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).getTime()+(86400000-1);})():Infinity;
  var rows=document.querySelectorAll('#adj-log-table tbody tr[data-name]');
  var visible=0;
  rows.forEach(function(r){
    var name=r.getAttribute('data-name')||'';
    var type=r.getAttribute('data-type')||'';
    var ts=parseInt(r.getAttribute('data-ts'))||0;
    var show=true;
    if(search&&name.indexOf(search)<0)show=false;
    if(typeF&&type!==typeF)show=false;
    if(fdMs&&ts<fdMs)show=false;
    if(tdMs!==Infinity&&ts>tdMs)show=false;
    r.style.display=show?'':'none';
    if(show)visible++;
  });
  var nr=document.getElementById('adj-no-results');
  if(nr)nr.style.display=visible===0?'':'none';
  var cnt=document.getElementById('adj-count');
  if(cnt)cnt.textContent=visible;
}

    'th{background:#343a40;color:#fff;font-size:9px;padding:5px 8px;text-align:left;text-transform:uppercase}'+

    '.footer{margin-top:16px;border-top:1px solid #dee2e6;padding-top:8px;font-size:9px;color:#888;display:flex;justify-content:space-between}'+

      '<div class="stat" style="border-color:#198754"><div class="stat-val" style="color:#198754">'+(sc.items-sc.variances)+'</div><div class="stat-lbl">Matched</div></div>'+

// CUSTOMERS
function addCustomer(){
  var name=document.getElementById('cust-name').value.trim();if(!name){alert('Enter name.');return;}
  var creditLimit=parseFloat(document.getElementById('cust-credit-limit').value)||0;
  var openingBal=parseFloat(document.getElementById('cust-opening-bal').value)||0;
  DB.customers.push({id:uid(),name:name,phone:document.getElementById('cust-phone').value.trim(),email:document.getElementById('cust-email').value.trim(),address:document.getElementById('cust-address').value.trim(),biz:document.getElementById('cust-biz').value.trim(),notes:document.getElementById('cust-notes').value.trim(),type:document.getElementById('cust-type').value,creditLimit:creditLimit,creditBalance:openingBal,openingBalance:openingBal,joinDate:new Date().toLocaleDateString(),totalPurchases:0,totalSpent:0,lastSeen:null,salesHistory:[]});
  ['cust-name','cust-phone','cust-email','cust-address','cust-biz','cust-notes','cust-credit-limit','cust-opening-bal'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});activeCustSub='list';renderApp();
}
function removeCustomer(id){
  if(!isAdmin()){alert('Admin only.');return;}
  var c=DB.customers.find(function(x){return x.id===id;});
  if(!c)return;
  showConfirm({
    type:'danger',
    title:'Delete customer?',
    msg:'The customer will be moved to the Recycle Bin.',
    detail:'👥 '+esc(c.name)+(c.phone?' · '+c.phone:'')+(c.biz?' · '+c.biz:''),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('customer',c,'Customers');
    DB.customers=DB.customers.filter(function(x){return x.id!==id;});
    saveData();renderApp();
  });
}

function generateAIMessage(){
  var custName=(document.getElementById('ai-msg-cust')||{}).value||'';
  var msgType=(document.getElementById('ai-msg-type')||{}).value||'greeting';
  var context=(document.getElementById('ai-msg-context')||{}).value||'';
  var btn=document.getElementById('ai-gen-btn');
  var status=document.getElementById('ai-gen-status');
  var result=document.getElementById('ai-msg-result');
  var textEl=document.getElementById('ai-msg-text');
  if(!btn)return;
  btn.disabled=true;btn.textContent='⏳ Generating...';
  if(status)status.textContent='Connecting to Claude...';
  if(result)result.style.display='none';

  var typeLabels={
    credit_reminder:'a professional but friendly WhatsApp credit payment reminder',
    promo:'an exciting promotional offer message',
    new_stock:'a new stock arrival announcement',
    greeting:'a warm general greeting',
    thank_you:'a thank you message after purchase',
    follow_up:'a follow-up message after a recent purchase',
    custom:'a WhatsApp business message based on this context: '+context
  };
  var prompt='You are a business messaging assistant for Great Chid Electro, a Nigerian electrical materials and doors shop in Ogbomoso. Write '+typeLabels[msgType]+' for a customer'+(custName?' named '+custName:'')+'. '+(context&&msgType!=='custom'?'Additional context: '+context+'. ':'')+
    'Requirements: Professional but warm Nigerian business tone. WhatsApp-ready format. Use relevant emojis. 3-5 sentences max. Sign off with "Great Chid Electro". Write ONLY the message, no explanation or preamble.';

  var geminiUrl='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
  fetch('https://greatchid-inventory.valentineahize.workers.dev?url='+encodeURIComponent(geminiUrl),{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{maxOutputTokens:800,temperature:0.8}
    })
  }).then(function(r){
    return r.text().then(function(raw){
      if(!r.ok){
        var errMsg='API error '+r.status;
        try{var e=JSON.parse(raw);errMsg=e.error&&e.error.message?e.error.message:errMsg;}catch(x){}
        console.error('Gemini API raw error:',raw);
        throw new Error(errMsg);
      }
      try{return JSON.parse(raw);}catch(x){throw new Error('Invalid JSON from Gemini: '+raw.substring(0,120));}
    });
  }).then(function(data){
    var msg=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text.trim():'';
    if(!msg)throw new Error('Empty response from Gemini');
    if(textEl)textEl.textContent=msg;
    if(result)result.style.display='block';
    if(status)status.textContent='✅ Done';
  }).catch(function(e){
    var fallback=generateFallbackMessage(custName,msgType,context);
    if(textEl)textEl.textContent=fallback;
    if(result)result.style.display='block';
    if(status)status.textContent='⚠️ Used local template — Gemini error: '+e.message;
    console.warn('Gemini API error:',e.message);
  }).finally(function(){
    btn.disabled=false;btn.textContent='✨ Generate message';
  });
}

async function sendTwilioWhatsApp(){
  var msgText=document.getElementById('msg-text')?document.getElementById('msg-text').value.trim():'';
  if(!msgText){alert('Please enter a message.');return;}
  if(!msgSelectedCusts.length){alert('Select at least one customer.');return;}
  var token=getTwilioAuthToken(),sid=getTwilioAccountSid();
  if(!token||!sid){alert('Please save your Twilio credentials first.');return;}
  var selected=DB.customers.filter(function(c){return msgSelectedCusts.indexOf(c.id)!==-1&&c.phone;});
  if(!selected.length){alert('No selected customers have phone numbers.');return;}
  if(!confirm('Send WhatsApp to '+selected.length+' customer(s)?\nEstimated cost: $'+(selected.length*0.05).toFixed(2)+' from your Twilio balance.'))return;
  var statusEl=document.getElementById('msg-send-status'),resultsEl=document.getElementById('msg-results');
  if(statusEl)statusEl.textContent='Sending...';if(resultsEl)resultsEl.innerHTML='';
  var results=[],url='https://api.twilio.com/2010-04-01/Accounts/'+sid+'/Messages.json';
  var proxyUrl='https://greatchid-inventory.valentineahize.workers.dev?url='+encodeURIComponent(url);
  var headers={'Authorization':'Basic '+btoa(sid+':'+token),'Content-Type':'application/x-www-form-urlencoded'};
  for(var i=0;i<selected.length;i++){
    var c=selected[i];
    if(statusEl)statusEl.textContent='Sending '+(i+1)+' of '+selected.length+'...';
    var text=msgText.replace(/\{name\}/g,c.name).replace(/\{balance\}/g,c.creditBalance>0?fmt(c.creditBalance):'₦0');
    var phone=c.phone.replace(/[\s\-\(\)]/g,'');
    if(phone.startsWith('0'))phone='234'+phone.substring(1);
    if(!phone.startsWith('234')&&!phone.startsWith('+'))phone='234'+phone;
    phone=phone.replace(/^\+/,'');
    try{
      var resp=await fetch(proxyUrl,{method:'POST',headers:headers,body:'From='+encodeURIComponent(TWILIO_FROM)+'&To='+encodeURIComponent('whatsapp:+'+phone)+'&Body='+encodeURIComponent(text)});
      var rawText=await resp.text();
      var data={};try{data=JSON.parse(rawText);}catch(e){data={_raw:rawText};}
      results.push({name:c.name,phone:c.phone,status:data.sid?'✅ Sent':'❌ '+(data.message||data.error_message||rawText.substring(0,80)||'Failed')});
    }catch(err){results.push({name:c.name,phone:c.phone,status:'❌ Error: '+err.message});}
    await new Promise(function(r){setTimeout(r,300);});
  }
  var sent=results.filter(function(r){return r.status.startsWith('✅');}).length;
  if(statusEl)statusEl.textContent='Done — '+sent+' sent, '+(results.length-sent)+' failed.';
  if(resultsEl)resultsEl.innerHTML='<div style="font-size:12px;font-weight:700;margin-bottom:6px">Delivery report:</div><div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table><thead><tr><th>Customer</th><th>Phone</th><th>Status</th></tr></thead><tbody>'+results.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+r.phone+'</td><td>'+r.status+'</td></tr>';}).join('')+'</tbody></table></div>';
}

  var selected=DB.customers.filter(function(c){return msgSelectedCusts.indexOf(c.id)!==-1&&c.phone;});
  if(!selected.length){alert('No selected customers have phone numbers.');return;}
  if(!confirm('Send SMS to '+selected.length+' customer(s) via Termii?\nEstimated cost: ₦'+(selected.length*6)+' – ₦'+(selected.length*10)))return;
  var statusEl=document.getElementById('msg-send-status'),resultsEl=document.getElementById('msg-results');
  if(statusEl)statusEl.textContent='Sending...';if(resultsEl)resultsEl.innerHTML='';
  var results=[];
  for(var i=0;i<selected.length;i++){
    var c=selected[i];
    if(statusEl)statusEl.textContent='Sending '+(i+1)+' of '+selected.length+'...';
    var text=msgText.replace(/\{name\}/g,c.name).replace(/\{balance\}/g,c.creditBalance>0?fmt(c.creditBalance):'₦0');
    var phone=c.phone.replace(/[\s\-\(\)]/g,'');
    if(phone.startsWith('0'))phone='234'+phone.substring(1);
    if(!phone.startsWith('234')&&!phone.startsWith('+'))phone='234'+phone;
    phone=phone.replace(/^\+/,'');
    try{
      var resp=await fetch('https://greatchid-inventory.valentineahize.workers.dev?url='+encodeURIComponent(TERMII_BASE+'/api/sms/send'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:phone,from:TERMII_SENDER,sms:text,type:'plain',api_key:apiKey,channel:'generic'})});
      var rawText=await resp.text();
      console.log('Termii raw ['+c.name+'] HTTP '+resp.status+':', rawText);
      var data={};try{data=JSON.parse(rawText);}catch(e){console.warn('Termii JSON parse failed:',rawText);data={_raw:rawText,httpStatus:resp.status};}
      var success=resp.status===200&&!!(data.message_id||data.messageId||data.code==='ok'||data.status==='Message Sent');
      var errDetail=data.message||data.error||data.description||(data._raw?data._raw.substring(0,100):'HTTP '+resp.status);
      results.push({name:c.name,phone:c.phone,status:success?'✅ Sent':'❌ '+errDetail});
    }catch(err){console.error('Termii fetch error ['+c.name+']:',err);results.push({name:c.name,phone:c.phone,status:'❌ Error: '+err.message});}
    await new Promise(function(r){setTimeout(r,200);});
  }
  var sent=results.filter(function(r){return r.status.startsWith('✅');}).length;
  if(statusEl)statusEl.textContent='Done — '+sent+' sent, '+(results.length-sent)+' failed.';
  if(resultsEl)resultsEl.innerHTML='<div style="font-size:12px;font-weight:700;margin-bottom:6px">Delivery report:</div><div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table><thead><tr><th>Customer</th><th>Phone</th><th>Status</th></tr></thead><tbody>'+results.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+r.phone+'</td><td>'+r.status+'</td></tr>';}).join('')+'</tbody></table></div>';
}

function saveEditCustomer(){
  var id=window._editingCust;
  var cust=DB.customers.find(function(c){return c.id==id;});
  if(!cust){alert('Customer not found.');return;}
  var name=document.getElementById('ec-name').value.trim();
  if(!name){alert('Name is required.');return;}
  cust.name=name;
  cust.phone=document.getElementById('ec-phone').value.trim();
  cust.email=document.getElementById('ec-email').value.trim();
  cust.address=document.getElementById('ec-address').value.trim();
  cust.biz=document.getElementById('ec-biz').value.trim();
  cust.notes=document.getElementById('ec-notes').value.trim();
  cust.type=document.getElementById('ec-type').value;
  var newLimit=parseFloat(document.getElementById('ec-credit-limit').value)||0;
  if(newLimit!==cust.creditLimit){
    logActivity('Credit limit changed',cust.name+' — from '+fmt(cust.creditLimit)+' to '+fmt(newLimit),'Admin: '+DB.currentUser.name);
  }
  cust.creditLimit=newLimit;
  // Opening balance: if changed, adjust creditBalance by the difference
  var newOpeningBal=parseFloat(document.getElementById('ec-opening-bal').value)||0;
  var oldOpeningBal=cust.openingBalance||0;
  if(newOpeningBal!==oldOpeningBal){
    var diff=newOpeningBal-oldOpeningBal;
    cust.creditBalance=(cust.creditBalance||0)+diff;
    cust.openingBalance=newOpeningBal;
  }
  saveData();
  alert('Customer updated successfully.');
  window._viewingCust=id;
  activeCustSub='profile';
  renderApp();
}

// ── Date-aware outstanding balance helper ─────────────────────
// Parses a locale date string (e.g. "5/13/2026") → timestamp for comparison
function parseSaleDate(str){
  if(!str)return 0;
  // Try ISO format first (YYYY-MM-DD)
  var t=new Date(str).getTime();
  if(!isNaN(t)&&str.indexOf('-')>=0)return t;
  // Nigerian DD/MM/YYYY format
  var parts=str.split('/');
  if(parts.length===3){
    var day=parseInt(parts[0]),mon=parseInt(parts[1]),yr=parseInt(parts[2]);
    // If year looks like a 4-digit year it's DD/MM/YYYY
    if(yr>1000)return new Date(yr,mon-1,day).getTime();
    // Fallback: try MM/DD/YYYY
    return new Date(parseInt(parts[2]),parseInt(parts[0])-1,parseInt(parts[1])).getTime();
  }
  // Try generic parse as last resort
  var t2=new Date(str).getTime();
  return isNaN(t2)?0:t2;
}

// Extract numeric part of invoice number for ordering (handles YYYY/NNNN or plain number)
function parseInvNum(n){
  if(!n)return 0;
  var s=String(n);
  // Handle format YYYY/NNNN — year-prefixed invoices always come after old plain numbers
  // Use year * 1,000,000 + sequence so 2026/0005 = 2026000005 >> 5700 (old format)
  if(s.indexOf('/')!==-1){
    var parts=s.split('/');
    var yr=parseInt(parts[0])||0;
    var seq=parseInt(parts[1])||0;
    return yr*1000000+seq;
  }
  var m=s.match(/\d+/);
  return m?parseInt(m[0]):0;
}

// Generate next invoice number in format YYYY/NNNN, resetting each year
// Uses a pre-claim check to prevent duplicates when two users save simultaneously
function generateInvoiceNum(){
  var now=new Date();
  var currentYear=now.getFullYear();
  if(!DB.invoiceYear||DB.invoiceYear!==currentYear){
    DB.invoiceCounter=1;
    DB.invoiceYear=currentYear;
  }
  // Scan to find true max used
  var prefix=String(currentYear)+'/';
  var allNums=DB.sales
    .filter(function(s){return s.invoiceNum&&String(s.invoiceNum).indexOf(prefix)===0;})
    .map(function(s){return parseInt(String(s.invoiceNum).split('/')[1])||0;});
  var maxUsed=allNums.length?Math.max.apply(null,allNums):0;
  // Use whichever is higher — do NOT modify DB.invoiceCounter here
  // Counter is only incremented by saveSale() after successful save
  var next=Math.max(DB.invoiceCounter,maxUsed+1);
  var seq=String(next).padStart(4,'0');
  return currentYear+'/'+seq;
}

// Returns {prevInvTotal, outstandingAtDate} for a given customer + invoice
// Uses date + invoice number as tiebreaker: lower invoice number on same date = earlier
function calcOutstandingAtDate(custId, invDate, invNum, invNet){
  var invTs=parseSaleDate(invDate);
  var invN=parseInvNum(invNum);
  var sCustId=String(custId);

  function isBefore(sDate, sInvNum){
    var sTs=parseSaleDate(sDate);
    if(sTs < invTs) return true;
    if(sTs === invTs) return parseInvNum(sInvNum) < invN;
    return false;
  }

  // Opening balance set at customer setup — always counts as pre-existing debt
  var cust=DB.customers.find(function(c){return String(c.id)==sCustId;});
  var openingBal=cust?(cust.openingBalance||0):0;

  // Only unpaid (credit) or partially paid invoices BEFORE this one
  var prevInvMap={};
  DB.sales.filter(function(s){
    return String(s.custId)==sCustId &&
      (s.payment==='credit'||s.payment==='part') &&
      String(s.invoiceNum||s.id)!==String(invNum) &&
      isBefore(s.date, s.invoiceNum||s.id);
  }).forEach(function(s){
    var k=String(s.invoiceNum||s.id);
    if(!prevInvMap[k])prevInvMap[k]={total:0,partPayment:s.partPayment||0,depositApplied:s.depositApplied||0,payment:s.payment};
    prevInvMap[k].total+=s.total;
  });

  // Credit payments made BEFORE this invoice (by timestamp)
  var prevCreditPayments=(DB.creditPayments||[]).filter(function(p){
    return String(p.custId)==sCustId && parseSaleDate(p.date)<=invTs;
  });

  // Returns that reduced balance before this invoice
  var prevReturns=(DB.salesReturns||[]).filter(function(r){
    return String(r.custId)==sCustId &&
      (r.refundType==='credit'||r.refundType==='exchange') &&
      parseSaleDate(r.date)<=invTs &&
      String(r.invoiceNum)!==String(invNum);
  });

  var prevOwed=Object.values(prevInvMap).reduce(function(a,inv){
    var dep=inv.depositApplied||0;
    if(inv.payment==='credit') return a+Math.max(0,inv.total-dep);
    if(inv.payment==='part') return a+Math.max(0,inv.total-(inv.partPayment||0)-dep);
    return a;
  },0);
  var prevPaid=prevCreditPayments.reduce(function(a,p){return a+(p.amount||0);},0);
  var prevReturnCredit=prevReturns.reduce(function(a,r){return a+(r.refundAmt||0);},0);

  // prevInvTotal = opening balance + prior unpaid − payments − return credits
  var prevInvTotal=Math.max(0,openingBal+prevOwed-prevPaid-prevReturnCredit);
  var outstandingAtDate=prevInvTotal+Math.max(0,invNet);
  return {prevInvTotal:prevInvTotal,outstandingAtDate:outstandingAtDate};
}

function printCustomerStatement(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  // Build all events same as the account statement
  var allEvents=[];
  if(cust.openingBalance>0)allEvents.push({type:'opening',date:'—',label:'Opening balance',amount:cust.openingBalance,mode:'—',by:'Setup'});
  var custInvs={};
  DB.sales.filter(function(s){return String(s.custId)==String(custId)&&(s.payment==='credit'||s.payment==='part');}).forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!custInvs[k])custInvs[k]={type:'invoice',date:s.date,label:'Invoice #'+k,amount:s.total,partPayment:s.partPayment||0,payment:s.payment,mode:s.payment==='credit'?'Credit':'Part payment',by:s.seller};
    else{custInvs[k].amount+=s.total;}
  });
  Object.values(custInvs).forEach(function(e){
    allEvents.push(e);
    // For part payments, add a credit line for the upfront amount paid
    if(e.payment==='part'&&e.partPayment>0){
      allEvents.push({type:'payment',date:e.date,label:'Part payment — Invoice #'+(e.label.replace('Invoice #','')),amount:e.partPayment,mode:'Part payment (upfront)',by:e.by});
    }
  });
  var allPayments=(DB.creditPayments||[]).filter(function(p){return String(p.custId)==String(custId);});
  console.log('Statement payments for custId='+custId+':', allPayments.length, allPayments.map(function(p){return p.amount+' ('+p.payMode+') on '+p.date;}));
  allPayments.forEach(function(p){
    var isWO=p.payMode==='writeoff';
    allEvents.push({type:isWO?'writeoff':'payment',date:p.date,
      label:isWO?'✂ Write-off / Discount':'Payment received',
      amount:p.amount,mode:isWO?'Discount':payModeLabel(p),by:p.by});

  var retMap={};

    retMap[k].amount+=r.refundAmt||0;

  Object.values(retMap).forEach(function(e){allEvents.push(e);});
  allEvents.sort(function(a,b){if(a.type==='opening')return -1;if(b.type==='opening')return 1;return parseSaleDate(a.date)-parseSaleDate(b.date);});
  var running=0;

  var rows=allEvents.map(function(e,i){
    if(e.type==='opening'||e.type==='invoice')running+=e.amount;
    else if(e.type==='payment'||e.type==='writeoff'||e.type==='return')running-=e.amount;
    running=Math.round(running*100)/100;

      '<td style="text-align:right;color:#c0392b">'+dr+'</td>'+
      '<td style="text-align:right;color:#15803d">'+cr+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+(running>0?'#c0392b':'#15803d')+'">'+fmt(Math.max(0,running))+'</td>'+
      '<td>'+e.mode+'</td>'+
      '<td>'+e.by+'</td>'+
    '</tr>';
  }).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Account Statement</title>'+
    '<style>@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px}'+
    '.h{text-align:center;border-bottom:2px solid #065f46;padding-bottom:8px;margin-bottom:12px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b}.co2{font-size:16px;font-weight:900;color:#1a237e}'+
    '.cust-box{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr}'+
    'table{width:100%;border-collapse:collapse}th{background:#065f46;color:#fff;padding:4px 6px;font-size:9px;text-align:left}'+
    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even)td{background:#f0fdf4}'+
    '.bal{font-size:13px;font-weight:700;color:'+(cust.creditBalance>0?'#c0392b':'#15803d')+';text-align:right}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+

function printCustomerInvoice(invNum,custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum&&s.custId==custId;});
  if(!invSales.length){alert('Invoice not found.');return;}
  var s0=invSales[0];
  var d=new Date(s0.date);var day=isNaN(d.getTime())?new Date().getDate():d.getDate();var mon=isNaN(d.getTime())?new Date().getMonth()+1:d.getMonth()+1;var yr=isNaN(d.getTime())?new Date().getFullYear():d.getFullYear();
  var rows=invSales.map(function(s,i){var hasP=s.pendingSupply&&((s.suppliedQty!==undefined&&(s.pendingQty||0)>0)||(s.supplyStatus==='partial'||s.supplyStatus==='pending'));var sQty=s.suppliedQty!==undefined?s.suppliedQty:s.qty;var pQty=s.pendingQty||0;var qCell=hasP?'<span style="color:#16a34a;font-weight:700">'+sQty+' supplied</span><br><span style="color:#dc2626;font-size:9px">'+pQty+' pending</span>':''+s.qty;return '<tr><td class="center">'+(i+1)+'</td><td>'+esc(s.name)+'</td><td class="center">'+qCell+'</td><td class="right">'+fmt(s.salePrice)+'</td><td class="right" style="background:var(--danger-bg);color:#c0392b">'+(s.discAmt>0?'-'+fmt(s.discAmt):'')+'</td><td class="right"><b>'+fmt(s.total)+'</b></td></tr>';}).join('');
  var grandTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var emptyRows='';var minRI=Math.max(12,invSales.length);for(var i=invSales.length;i<minRI;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  // Date-aware: only count invoices/payments that existed at the time of this invoice
  var partPaid=s0.partPayment||0;
  var depApplied=invSales.reduce(function(a,s){return a+(s.depositApplied||0);},0);
  var invNet=s0.payment==='credit'?Math.max(0,grandTotal-depApplied):s0.payment==='part'?Math.max(0,grandTotal-partPaid-depApplied):0;
  // Use live creditBalance — most accurate source of truth
  var liveCredit2=cust?Math.max(0,cust.creditBalance||0):0;
  // liveCredit2 = current creditBalance (already includes this invoice's contribution)
  // If s0.prevCreditBalance was stamped at sale time, use it for accurate previous balance
  var prevInvTotal=s0.prevCreditBalance!=null?Math.max(0,s0.prevCreditBalance):Math.max(0,liveCredit2-invNet);
  var outstandingBal=prevInvTotal>0?prevInvTotal+invNet:liveCredit2;
  function doPrint(withOutstanding){
    var _printTotal=s0.depositTotal||grandTotal;var html=buildInvoiceHTML({invoiceNum:invNum,custName:s0.printName||(cust?cust.name:'Unknown'),custAddr:cust?cust.address||'':'',day:day,month:mon,year:yr,rows:rows+emptyRows,itemCount:invSales.length,grandTotal:_printTotal,payment:s0.payment,payMode:s0.payMode,depTopupMode:s0.depTopupMode||null,depositApplied:depApplied||0,bankId:s0.bankId,posId:s0.posId,splitPayment:s0.splitPayment||null,seller:s0.seller,pendingSupply:s0.pendingSupply||false,wasEverPending:s0.wasEverPending||false,supplyDate:s0.supplyDate||null,
      partPayment:partPaid,
      outstandingBal:withOutstanding?outstandingBal:0,prevInvTotal:withOutstanding&&prevInvTotal>0?prevInvTotal:0,showInvLine:withOutstanding&&invNet>0});
    var w=window.open('','_blank','width=600,height=850');
    w.document.write(html);
    w.document.close();
    // Wait for QR image to load before printing
    var _printed=false;
    function _doPrint(){if(!_printed){_printed=true;w.print();}}
    w.onload=function(){setTimeout(_doPrint,400);};
    setTimeout(_doPrint,2500);
  }
  if(outstandingBal>0){
    showPrintChoiceModal(cust?cust.name:'Customer',outstandingBal,prevInvTotal,grandTotal,
      function(){doPrint(true);},function(){doPrint(false);});
  } else {
    doPrint(false);
  }
}

function saveDraft(){
  if(!invoiceItems.length){alert('Add at least one item before saving as draft.');return;}
  var invNum=document.getElementById('s-inv-num')?document.getElementById('s-inv-num').value.trim():'';
  var custId=null,custName='Walk-in';
  if(saleCustomerType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)custId=sel.value;var rc=DB.customers.find(function(c){return c.id==custId;});if(rc)custName=rc.name;}
  var draftId=uid();
  var draft={id:draftId,invoiceNum:invNum,custId:custId,custName:custName,custType:saleCustomerType,items:JSON.parse(JSON.stringify(invoiceItems)),savedAt:new Date().toLocaleString()};
  if(!DB.drafts)DB.drafts=[];
  DB.drafts.push(draft);
  invoiceItems=[];
  saveData();
  alert('Draft saved! Invoice items have been saved as a draft. You can load it later from the drafts list below.');
  renderApp();
}

function loadDraft(draftId){
  if(invoiceItems.length){if(!confirm('Loading a draft will clear your current invoice items. Continue?'))return;}
  var draft=DB.drafts.find(function(d){return d.id==draftId;});
  if(!draft){alert('Draft not found.');return;}
  invoiceItems=JSON.parse(JSON.stringify(draft.items));
  saleCustomerType=draft.custType||'walkin';
  DB.drafts=DB.drafts.filter(function(d){return d.id!==draftId;});
  saveData();
  renderApp();
  setTimeout(function(){
    if(draft.invoiceNum){var el=document.getElementById('s-inv-num');if(el)el.value=draft.invoiceNum;}
    if(draft.custId&&draft.custType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)sel.value=draft.custId;}
    renderInvoiceItems();
  },80);
}

function deleteDraft(draftId){

    type:'warning',
    title:'Delete this draft?',

    detail:d?'Invoice '+(d.invoiceNum?'#'+d.invoiceNum:'(no number)')+' — '+d.custName:'Draft',

  },function(){

}

function addInvoiceItem(){
  var itemId=document.getElementById('inv-item').value;
  var qty=parseFloat(document.getElementById('inv-qty').value)||0;
  var price=parseFloat(document.getElementById('inv-price').value)||0;
  var item=DB.inventory.find(function(i){return i.id==itemId;});
  if(!item){alert('Select an item.');return;}
  // Partial supply warning - don't block, just inform
  if(qty>item.qty&&item.qty>=0){
    var avail=item.qty;
    var short=qty-avail;
    if(!confirm('⚠️ Partial supply alert!\n\nOrdered: '+qty+'\nIn stock: '+avail+'\nShort: '+short+'\n\n'+avail+' will be supplied now.\n'+short+' will be marked as PENDING supply.\n\nContinue?'))return;
  }
  // Enforce cost price exists
  if(!item.cost||item.cost<=0){
    alert('❌ Cannot sell "'+item.name+'"  -  this item has no cost price set.\n\nPlease go to Stock Management → Product Editing and set the cost price first before selling this item.');
    return;
  }
  if(qty<=0){alert('Enter a valid quantity.');return;}
  if(price<=0){alert('Enter a selling price.');return;}
  // Block selling below cost price (no per-item discount anymore  -  checked at invoice level)
  if(price<item.cost){
    var shortfall=item.cost-price;
    alert('❌ Selling price is below cost price!\n\nItem: '+item.name+'\nCost price: '+fmt(item.cost)+'\nYour selling price: '+fmt(price)+'\nShortfall per unit: '+fmt(shortfall)+'\n\nYou cannot sell below cost price. Please increase the selling price.');
    return;
  }
  var subtotal=price*qty;
  var profit=(price-item.cost)*qty;
  // Auto-merge: if same item + same price already in invoice, just add qty
  var existing=invoiceItems.find(function(l){return l.itemId==item.id&&l.price===price;});
  if(existing){
    existing.qty+=qty;
    existing.total=existing.price*existing.qty;
    existing.profit=(existing.price-existing.cost)*existing.qty;
    showToast('✅ '+item.name+' quantity updated to '+existing.qty);
  } else {
    invoiceItems.push({lineId:uid(),itemId:item.id,name:item.name,cost:item.cost,qty:qty,price:price,discAmt:0,total:subtotal,profit:profit});
  }
  document.getElementById('inv-qty').value='';document.getElementById('inv-price').value='';
  document.getElementById('inv-item').value='';
  var s=document.getElementById('inv-item-search');if(s)s.value='';
  renderInvoiceItems();
}

function removeInvoiceItem(lineId){
  invoiceItems=invoiceItems.filter(function(l){return l.lineId!==lineId;});
  renderInvoiceItems();
}

function renderInvoiceItems(){
  var el=document.getElementById('inv-items-table');if(!el)return;
  if(!invoiceItems.length){
    el.innerHTML='<div style="text-align:center;padding:1.5rem;color:#888;font-size:13px;border:1px dashed #ced4da;border-radius:8px;background:#f8f9fa">No items added yet. Select an item above and click + Add.</div>';
    updateInvoiceTotals();return;
  }
  var rows=invoiceItems.map(function(l,i){
    var subtotal=l.price*l.qty;
    var invItem=DB.inventory.find(function(inv){return inv.id==l.itemId;});
    var stockQty=invItem?invItem.qty:0;
    var willSupply=Math.min(l.qty,Math.max(0,stockQty));
    var willPend=l.qty-willSupply;
    var supplyCell=willPend>0
      ?'<span style="color:#16a34a;font-weight:700">'+willSupply+'</span>'
      +'<br><span style="font-size:10px;color:#dc2626">⏳ '+willPend+' pending</span>'
      :'<span style="color:#16a34a;font-weight:700">'+willSupply+'</span><br><span style="font-size:10px;color:#16a34a">✅ Full</span>';
    return '<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td><b>'+esc(l.name)+'</b></td>'+
      '<td style="text-align:center;font-weight:700">'+l.qty+'</td>'+
      '<td style="text-align:center">'+supplyCell+'</td>'+
      '<td style="text-align:right">'+fmt(l.price)+'</td>'+
      '<td style="text-align:right"><b>'+fmt(subtotal)+'</b></td>'+
      '<td style="text-align:right;color:var(--success);font-size:11px">'+fmt(l.profit)+'</td>'+
      '<td><button class="btn danger" onclick="removeInvoiceItem('+l.lineId+')">✕</button></td>'+
    '</tr>';
  }).join('');
  el.innerHTML='<div class="tbl-wrap"><table>'+
    '<thead><tr>'+
      '<th style="width:32px">#</th>'+
      '<th>Item</th>'+
      '<th style="text-align:center;width:60px">Ordered</th>'+
      '<th style="text-align:center;width:80px">Supply / Pending</th>'+
      '<th style="text-align:right;width:100px">Unit price</th>'+
      '<th style="text-align:right;width:110px">Subtotal</th>'+

      '<th style="width:40px"></th>'+

  '</table></div>';

}

var MAX_INVOICE_DISC_PCT=5; // Maximum allowed invoice discount percentage

function calcInvoiceDiscount(){
  var subtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var discType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var discValInput=document.getElementById('inv-disc-val');
  var discVal=parseFloat(discValInput?discValInput.value:0)||0;
  var warningEl=document.getElementById('inv-disc-warning');

  // Enforce 5% cap
  if(discType==='pct'&&discVal>MAX_INVOICE_DISC_PCT){
    // Clamp the input value
    if(discValInput){discValInput.value=MAX_INVOICE_DISC_PCT;discVal=MAX_INVOICE_DISC_PCT;}
    if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'%</strong>. Value has been capped automatically.</div>';
  } else if(discType==='flat'&&subtotal>0){
    var maxFlatAmt=subtotal*MAX_INVOICE_DISC_PCT/100;
    if(discVal>maxFlatAmt){
      if(discValInput){discValInput.value=Math.round(maxFlatAmt*100)/100;discVal=maxFlatAmt;}
      if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'% ('+fmt(maxFlatAmt)+')</strong> of the subtotal. Value has been capped automatically.</div>';
    } else {
      if(warningEl)warningEl.innerHTML='';
    }
  } else {
    if(warningEl)warningEl.innerHTML='';
  }

  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;

  // Also check below-cost warning
  if(discAmt>0){
    var totalCost=invoiceItems.reduce(function(a,l){return a+(l.cost*l.qty);},0);
    if(finalTotal<totalCost&&warningEl){
      warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">⚠️ Even with this discount, the invoice total ('+fmt(finalTotal)+') is below total cost ('+fmt(totalCost)+'). The sale will be at a loss.</div>';
    }
  }

  // Update summary
  var sumEl=document.getElementById('inv-totals-summary');if(!sumEl)return;
  var totalProfit=invoiceItems.reduce(function(a,l){return a+l.profit;},0)-discAmt;
  sumEl.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--danger)">Invoice discount</span><span style="color:var(--danger)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Grand total</span><span>'+fmt(finalTotal)+'</span></div>'+
    '<div class="sale-summary-row"><span style="color:var(--text2)">Total profit</span><span style="color:'+(totalProfit>=0?'var(--success)':'var(--danger)')+'">'+fmt(totalProfit)+'</span></div>';
}

function confirmDepositTopup(){
  var mode=document.getElementById('dep-topup-mode').value;
  var bankId=(document.getElementById('dep-topup-bank')||{}).value||'';
  var posId=(document.getElementById('dep-topup-pos')||{}).value||'';

  document.getElementById('dep-topup-overlay').remove();
