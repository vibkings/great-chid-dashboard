  var old=document.getElementById('dep-topup-overlay');if(old)old.remove();
  var overlay=document.createElement('div');
  overlay.id='dep-topup-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:1rem';
  var bankOpts=(DB.banks||[]).map(function(b){return '<option value="'+b.id+'">'+(b.name||b.bankName||'')+(b.acct||b.acctName?' - '+(b.acct||b.acctName):'')+'</option>';}).join('');
  var posOpts=(DB.posTerminals||[]).map(function(p){return '<option value="'+p.id+'">'+p.name+(p.tid?' ('+p.tid+')':'')+'</option>';}).join('');
  var creditOpt=creditLimit>0&&availableCredit>=shortfall?'<option value="credit">Add to credit balance</option>':'';
  overlay.innerHTML=
    '<div style="background:#fff;border-radius:14px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden">'+
      '<div style="background:#f59e0b;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
          '<div style="font-size:15px;font-weight:800;color:#fff">Deposit Shortfall</div>'+
          '<div style="font-size:11px;color:rgba(255,255,255,.9);margin-top:2px">'+cust.name+' - deposit not enough to cover invoice</div>'+
        '</div>'+
        '<button onclick="document.getElementById(\'dep-topup-overlay\').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer">&times;</button>'+
      '</div>'+
      '<div style="padding:16px 18px">'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'+
          '<div style="background:#f0f9ff;border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;margin-bottom:4px">Invoice Total</div><div style="font-size:15px;font-weight:800;color:#111">'+fmt(invoiceTotal)+'</div></div>'+
          '<div style="background:#f0fdf4;border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;margin-bottom:4px">Deposit Available</div><div style="font-size:15px;font-weight:800;color:#15803d">'+fmt(depBal)+'</div></div>'+
          '<div style="background:#fef2f2;border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;margin-bottom:4px">Balance Needed</div><div style="font-size:15px;font-weight:800;color:#dc2626">'+fmt(shortfall)+'</div></div>'+
        '</div>'+
        '<div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:10px">How will the customer pay the balance of '+fmt(shortfall)+'?</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">'+
          '<select id="dep-topup-mode" onchange="depTopupModeChange()" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-weight:600">'+
            '<option value="cash">Cash</option>'+
            '<option value="pos">POS</option>'+
            '<option value="transfer">Bank Transfer</option>'+
            creditOpt+
          '</select>'+
          '<div id="dep-topup-bank-row" style="display:none"><select id="dep-topup-bank" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px"><option value="">-- Select bank --</option>'+bankOpts+'</select></div>'+
          '<div id="dep-topup-pos-row" style="display:none"><select id="dep-topup-pos" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px"><option value="">-- Select POS --</option>'+posOpts+'</select></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px">'+
          '<button onclick="confirmDepositTopup()" style="flex:1;padding:11px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">&#10003; Complete Sale</button>'+
          '<button onclick="document.getElementById(\'dep-topup-overlay\').remove()" style="padding:11px 16px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
}

function depTopupModeChange(){
  var mode=document.getElementById('dep-topup-mode').value;
  var bankRow=document.getElementById('dep-topup-bank-row');
  var posRow=document.getElementById('dep-topup-pos-row');
  if(bankRow)bankRow.style.display=mode==='transfer'?'block':'none';
  if(posRow)posRow.style.display=mode==='pos'?'block':'none';
}

function confirmDepositTopup(){
  var mode=document.getElementById('dep-topup-mode').value;
  var bankId=(document.getElementById('dep-topup-bank')||{}).value||'';
  var posId=(document.getElementById('dep-topup-pos')||{}).value||'';
  window._depTopup={mode:mode,bankId:bankId,posId:posId};
  document.getElementById('dep-topup-overlay').remove();
  submitInvoice();
}


function submitInvoice(){
  if(!invoiceItems.length){alert('Add at least one item to the invoice.');return;}
  // Capture depTopup choice (set by confirmDepositTopup) then immediately clear global
  var _localDepTopup=window._depTopup||null;
  window._depTopup=null;
  var invNum=document.getElementById('s-inv-num')?document.getElementById('s-inv-num').value.trim():'';
  if(!invNum){alert('Invoice number is required. Please enter an invoice number.');return;}
  // Hard block duplicate invoice numbers
  var existingInv=DB.sales.find(function(s){return String(s.invoiceNum)===String(invNum);});
  if(existingInv){
    alert(
      '⛔ DUPLICATE INVOICE NUMBER!\n\n'+
      'Invoice #'+invNum+' has already been posted.\n\n'+
      'Existing record:\n'+
      '• Date: '+existingInv.date+'\n'+
      '• Customer: '+existingInv.custName+'\n'+
      '• Item: '+existingInv.name+'\n'+
      '• Amount: ₦'+Math.round(existingInv.total).toLocaleString()+'\n'+
      '• Seller: '+existingInv.seller+'\n\n'+
      'Please use a different invoice number to avoid double posting.'
    );
    // Highlight the invoice number field in red
    var invEl=document.getElementById('s-inv-num');
    if(invEl){invEl.style.borderColor='#dc3545';invEl.style.background='#fff5f5';invEl.focus();}
    return;
  }
  // Clear any previous error styling
  var invEl2=document.getElementById('s-inv-num');
  if(invEl2){invEl2.style.borderColor='';invEl2.style.background='';}
  var payment=document.getElementById('s-payment').value;
  var payMode,bankId=null,posId=null,splitPayment=null;
  if(payment==='split'){
    // Split payment mode
    var sm1=document.getElementById('s-split-mode1').value;
    var sm2=document.getElementById('s-split-mode2').value;
    var sa1=parseFloat(document.getElementById('s-split-amt1').value)||0;
    var sa2=parseFloat(document.getElementById('s-split-amt2').value)||0;
    if(sa1<=0||sa2<=0){alert('Enter amounts for both payment modes in split payment.');return;}
    var splitTotal=sa1+sa2;
    var _tempSubtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
    var _tempDiscType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
    var _tempDiscVal=parseFloat(document.getElementById('inv-disc-val')?document.getElementById('inv-disc-val').value:0)||0;
    var _tempDiscAmt=_tempDiscType==='pct'?(_tempSubtotal*_tempDiscVal/100):_tempDiscType==='flat'?Math.min(_tempDiscVal,_tempSubtotal):0;
    var _tempTotal=_tempSubtotal-_tempDiscAmt;
    if(Math.abs(splitTotal-_tempTotal)>1){alert('Split amounts ('+fmt(splitTotal)+') do not match invoice total ('+fmt(_tempTotal)+').\n\nPlease make sure the two amounts add up exactly to the invoice total.');return;}
    var splitBankId=(sm1==='transfer'||sm2==='transfer')?(document.getElementById('s-split-bankid')?document.getElementById('s-split-bankid').value:''):null;
    var splitPosId=(sm1==='pos'||sm2==='pos')?(document.getElementById('s-split-posid')?document.getElementById('s-split-posid').value:''):null;
    if((sm1==='transfer'||sm2==='transfer')&&DB.banks.length&&!splitBankId){alert('Select the bank for transfer.');return;}
    if((sm1==='pos'||sm2==='pos')&&DB.posTerminals.length&&!splitPosId){alert('Select the POS terminal.');return;}
    payMode='split';
    bankId=splitBankId;
    posId=splitPosId;
    splitPayment={mode1:sm1,amt1:sa1,mode2:sm2,amt2:sa2,bankId:splitBankId,posId:splitPosId};
    payment='split'; // keep as split for display; treated as fully paid for stock/credit logic
  } else {
    payMode=document.getElementById('s-paymode').value;
    // Enforce: credit payment → credit mode automatically
    if(payment==='credit'){payMode='credit';}
    bankId=(payMode==='transfer')?(document.getElementById('s-bankid')?document.getElementById('s-bankid').value:''):null;
    posId=(payMode==='pos')?(document.getElementById('s-posid')?document.getElementById('s-posid').value:''):null;
    if(payMode==='transfer'&&DB.banks.length&&!bankId){alert('Select the bank for transfer.');return;}
    if(payMode==='pos'&&DB.posTerminals.length&&!posId){alert('Select the POS terminal.');return;}
  }
  var custId=null,custName='Walk-in customer',custAddr='',printName='';
  // No walk-in on credit or part payment
  if(payment==='credit'&&saleCustomerType==='walkin'){alert('Walk-in customers cannot buy on credit. Please select a registered customer with a credit limit.');return;}
  if(payment==='part'&&saleCustomerType==='walkin'){alert('Walk-in customers must pay in full.\n\nPart payment is only allowed for registered customers.\nPlease select a registered customer or use Cash / Split payment.');return;}
  if(saleCustomerType==='walkin'){
    var walkPrintEl=document.getElementById('s-print-name');
    printName=(walkPrintEl&&walkPrintEl.value.trim())||'';
  }
  if(saleCustomerType==='registered'||saleCustomerType==='credit'){
    var selEl=document.getElementById('s-reg-customer');
    if(selEl)custId=selEl.value;
    if(!custId){alert('Please select a registered customer.');return;}
    var rc=DB.customers.find(function(c){return c.id==custId;});
    if(rc){custName=rc.name;custAddr=rc.address||'';
      // Read optional print-as name
      var printNameEl=document.getElementById('s-print-name');
      printName=(printNameEl&&printNameEl.value.trim())||'';
      // Check credit limit
      if(payment==='credit'){
        var currentOwed=rc.creditBalance||0;
        var creditLimit=rc.creditLimit||0;
        var custDepBal=(DB.deposits||[]).filter(function(d){return String(d.custId)===String(custId);}).reduce(function(a,d){return a+d.amount;},0);
        if(custDepBal>0&&creditLimit===0){
          if(finalGrandTotal>custDepBal){
            alert('\u26d4 Sale blocked.\n\nCustomer: '+rc.name+'\nDeposit balance: '+fmt(custDepBal)+'\nThis purchase: '+fmt(finalGrandTotal)+'\nShortfall: '+fmt(finalGrandTotal-custDepBal)+'\n\nDeposit does not cover the full amount and there is no credit limit set.');
            return;
          }
        } else if(custDepBal>0&&creditLimit>0){
          var effectiveLimit=creditLimit+custDepBal;
          if((currentOwed+finalGrandTotal)>effectiveLimit){
            alert('\u26d4 Credit + Deposit limit exceeded.\n\nCustomer: '+rc.name+'\nDeposit: '+fmt(custDepBal)+'\nCredit limit: '+fmt(creditLimit)+'\nEffective limit: '+fmt(effectiveLimit)+'\nCurrently owes: '+fmt(currentOwed)+'\nThis purchase: '+fmt(finalGrandTotal)+'\nOver by: '+fmt((currentOwed+finalGrandTotal)-effectiveLimit));
            return;
          }
        } else {
          if(creditLimit>0&&(currentOwed+finalGrandTotal)>creditLimit){
            alert('\u26d4 Credit limit exceeded!\nCustomer: '+rc.name+'\nCredit limit: '+fmt(creditLimit)+'\nCurrently owes: '+fmt(currentOwed)+'\nThis purchase: '+fmt(finalGrandTotal)+'\nOver by: '+fmt((currentOwed+finalGrandTotal)-creditLimit)+'\n\nReduce the purchase or increase the credit limit.');
            return;
          }
          if(creditLimit===0){alert('This customer has no credit limit set. Please set a credit limit in the Customers tab before allowing credit purchases.');return;}
        }
      }
      // Deposit payment validation moved to AFTER finalGrandTotal is calculated below
    }
  }
  var partPayEl=document.getElementById('s-part-payment');
  var partPayment=partPayEl?parseFloat(partPayEl.value)||0:0;
  // Read invoice-level discount
  var invDiscType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var invDiscVal=parseFloat(document.getElementById('inv-disc-val')?document.getElementById('inv-disc-val').value:0)||0;
  var subtotalAll=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);

  // Hard enforce 5% cap before saving
  if(invDiscType==='pct'&&invDiscVal>MAX_INVOICE_DISC_PCT){
    alert('❌ Discount exceeds the maximum allowed limit.\n\nMaximum invoice discount: '+MAX_INVOICE_DISC_PCT+'%\nYou entered: '+invDiscVal+'%\n\nPlease reduce the discount to '+MAX_INVOICE_DISC_PCT+'% or less.');
    return;
  }
  if(invDiscType==='flat'){
    var maxFlat=subtotalAll*MAX_INVOICE_DISC_PCT/100;
    if(invDiscVal>maxFlat){
      alert('❌ Discount exceeds the maximum allowed limit.\n\nMaximum invoice discount: '+MAX_INVOICE_DISC_PCT+'% = '+fmt(maxFlat)+'\nYou entered: '+fmt(invDiscVal)+'\n\nPlease reduce the discount.');
      return;
    }
  }

  var pendingSupply=document.getElementById('s-pending-supply')&&document.getElementById('s-pending-supply').checked;

  var invoiceDiscAmt=invDiscType==='pct'?(subtotalAll*invDiscVal/100):invDiscType==='flat'?Math.min(invDiscVal,subtotalAll):0;
  var finalGrandTotal=subtotalAll-invoiceDiscAmt;

  // ── Deposit payment validation (now finalGrandTotal is known) ──────────

  if(payment==='deposit'&&saleCustomerType==='registered'){
    var _rc2=DB.customers.find(function(c){return c.id==custId;});
    if(_rc2){
      var depBal2=Math.round((DB.deposits||[]).filter(function(d){return String(d.custId)===String(custId);}).reduce(function(a,d){return a+(d.amount||0);},0)*100)/100;
      console.log('[Deposit] Customer: '+_rc2.name+', Balance: '+depBal2+', Invoice: '+finalGrandTotal+', TopupSet: '+(!!_localDepTopup));
      if(depBal2<=0){
        alert('Cannot process deposit payment.\n\nCustomer: '+_rc2.name+'\nDeposit balance: '+fmt(depBal2)+'\n\nNo deposit balance available. Please top up first or use another payment method.');
        return;
      }
      if(depBal2<finalGrandTotal){
        if(_localDepTopup){
          // User chose topup — proceed with deposit + topup
          console.log('[Deposit] Using topup: '+JSON.stringify(_localDepTopup));
        } else {
          // Show topup dialog
          showDepositTopupDialog(_rc2,depBal2,finalGrandTotal,finalGrandTotal-depBal2,_rc2.creditLimit||0,_rc2.creditBalance||0);
          return;
        }
      }
    }
  }


  // Use custom date if set, otherwise today
  var invDateEl=document.getElementById('s-inv-date');
  var invDateVal=invDateEl?invDateEl.value:'';
  var date,month;
  if(invDateVal){
    var dp=invDateVal.split('-');
    var customDate=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
    date=customDate.toLocaleDateString();
    month=invDateVal.slice(0,7);
  } else {
    date=new Date().toLocaleDateString();
    month=new Date().toISOString().slice(0,7);
  }
  var invoiceId=uid();
  var grandTotal=finalGrandTotal,grandProfit=0;

  // ── Partial supply check ──
  // For each item, check how many can be supplied now vs pending
  var partialItems=[]; // {lineId, name, itemId, ordered, supplied, pending, price, cost}
  var hasPartial=false;
  if(!pendingSupply){
    invoiceItems.forEach(function(l){
      var invItem=DB.inventory.find(function(i){return i.id==l.itemId;});
      var available=invItem?Math.max(0,invItem.qty):0;
      var supplied=Math.min(l.qty,available);
      var pending=l.qty-supplied;
      partialItems.push({lineId:l.lineId,name:l.name,itemId:l.itemId,ordered:l.qty,supplied:supplied,pending:pending,price:l.price,cost:l.cost});
      if(pending>0)hasPartial=true;
    });
  } else {
    invoiceItems.forEach(function(l){partialItems.push({lineId:l.lineId,name:l.name,itemId:l.itemId,ordered:l.qty,supplied:0,pending:l.qty,price:l.price,cost:l.cost});});
  }

  // If partial, ask user
  if(hasPartial&&!pendingSupply){
    var msg='WARNING: Some items have insufficient stock:\n\n';
    partialItems.forEach(function(p){
      if(p.pending>0)msg+=p.name+': ordered '+p.ordered+', available '+p.supplied+', short '+p.pending+'\n';
    });
    msg+='\nChoose:\n- OK = Supply what is available now, mark rest as Pending\n- Cancel = Do not save yet';
    if(!confirm(msg))return;
  }

  // Distribute discount proportionally across items
  invoiceItems.forEach(function(l){
    var pi=partialItems.find(function(p){return p.lineId===l.lineId;})||{supplied:l.qty,pending:0,ordered:l.qty};
    var itemSubtotal=l.price*l.qty;
    var itemDisc=subtotalAll>0?(invoiceDiscAmt*(itemSubtotal/subtotalAll)):0;
    var itemTotal=itemSubtotal-itemDisc;
    var itemProfit=(l.price-l.cost)*l.qty-itemDisc;
    grandProfit+=itemProfit;
    // Deduct only supplied qty from stock
    if(!pendingSupply&&pi.supplied>0){
      var invItem=DB.inventory.find(function(i){return i.id==l.itemId;});
      if(invItem)invItem.qty-=pi.supplied;
    }
    DB.sales.push({
      id:uid(),invoiceId:invoiceId,invoiceNum:invNum,
      name:l.name,qty:l.qty,itemId:l.itemId,
      salePrice:l.price,cost:l.cost,
      discAmt:Math.round(itemDisc*100)/100,
      total:itemTotal,profit:itemProfit,
      payment:payment,payMode:payMode,bankId:bankId,posId:posId,
      splitPayment:splitPayment||null,
      custId:custId,custName:custName,printName:printName,custAddr:custAddr,
      custType:saleCustomerType,date:date,month:month,
      seller:DB.currentUser.name,partPayment:partPayment,
      depositApplied:0,  // will be updated below after deposit logic
      pendingSupply:pendingSupply||(pi.pending>0),
      suppliedQty:pendingSupply?0:pi.supplied,
      pendingQty:pendingSupply?l.qty:pi.pending,
      supplyStatus:(pendingSupply||pi.pending===l.qty)?'pending':pi.pending>0?'partial':'supplied',
      supplyDate:(pendingSupply||pi.pending>0)?null:date
    });
  });
  var cashReceived = (payment==='cash'||payment==='split'||payment==='deposit') ? grandTotal : (payment==='part' ? partPayment : 0);
  // creditAmount = how much the customer still owes us after this payment
  // If partPayment > grandTotal → negative = we owe them (overpayment / store credit)
  var creditAmount = payment==='credit' ? grandTotal : (payment==='part' ? (grandTotal - partPayment) : 0); // split/deposit/cash=0 credit
  var overpayment = (payment==='part' && partPayment > grandTotal) ? (partPayment - grandTotal) : 0;

  if(cashReceived > 0){
    if(splitPayment){
      DB.cashflow.push({id:uid(),desc:'Invoice #'+invNum+' [split 1/2] - '+custName,amount:splitPayment.amt1,type:'in',cat:'Sales',payMode:splitPayment.mode1,bankId:splitPayment.bankId,posId:splitPayment.posId,date:date,month:month});
      DB.cashflow.push({id:uid(),desc:'Invoice #'+invNum+' [split 2/2] - '+custName,amount:splitPayment.amt2,type:'in',cat:'Sales',payMode:splitPayment.mode2,bankId:splitPayment.bankId,posId:splitPayment.posId,date:date,month:month});
    } else if(payment!=='deposit'){
      // Deposit invoices: cashflow is handled by deposit-applied + topup entries below
      // Skip initial push for deposit to avoid double-counting
      DB.cashflow.push({id:uid(),desc:'Invoice #'+invNum+(invoiceDiscAmt>0?' [disc: '+fmt(invoiceDiscAmt)+']':'')+'  - '+custName,amount:cashReceived,type:'in',cat:'Sales',payMode:payMode==='credit'?'cash':payMode,bankId:bankId,posId:posId,date:date,month:month});
    }
  }
  // Update registered customer
  if(custId){
    var regC=DB.customers.find(function(c){return c.id==custId;});
    if(regC){
      regC.totalPurchases+=invoiceItems.length;
      regC.totalSpent+=grandTotal;
      regC.lastSeen=date;

      // ── Auto-apply deposit balance toward this invoice ──
      var depBal=(DB.deposits||[]).filter(function(d){return String(d.custId)==String(custId);}).reduce(function(a,d){return a+d.amount;},0);
      var depositApplied=0;
      if(depBal>0&&grandTotal>0){
        depositApplied=Math.min(depBal,grandTotal);
        if(!DB.deposits)DB.deposits=[];
  if(!DB.purchaseReturns)DB.purchaseReturns=[];
        DB.deposits.push({id:uid(),custId:custId,custName:regC.name,amount:-depositApplied,payMode:'deposit',note:'Auto-applied to Invoice #'+invNum,date:date,month:month,by:'System'});
        DB.cashflow.push({id:uid(),desc:'Deposit applied — '+regC.name+' Invoice #'+invNum,amount:depositApplied,type:'in',cat:'Sales',payMode:'deposit',date:date,month:month,isDepositApplied:true});
        // Reduce grandTotal by deposit used
        grandTotal=Math.max(0,grandTotal-depositApplied);
        cashReceived=Math.max(0,cashReceived-depositApplied);
        creditAmount=Math.max(0,creditAmount-depositApplied);
        // Capture topup mode BEFORE the if block clears _localDepTopup
        var _savedTopupMode=_localDepTopup?_localDepTopup.mode:null;
        // If user selected a topup payment mode to cover the shortfall
        if(_localDepTopup&&grandTotal>0){
          var tu=_localDepTopup;
          if(tu.mode==='credit'){
            regC.creditBalance=(regC.creditBalance||0)+grandTotal;
            creditAmount=0;grandTotal=0;cashReceived=0;
          } else {
            DB.cashflow.push({id:uid(),desc:'Deposit shortfall paid ('+tu.mode+') — '+regC.name+' Invoice #'+invNum,
              amount:grandTotal,type:'in',cat:'Sales',payMode:tu.mode,bankId:tu.bankId||null,posId:tu.posId||null,date:date,month:month});
            cashReceived=0;creditAmount=0;grandTotal=0;
          }
          _localDepTopup=null;
        }
        // Stamp depositApplied on all saved sale items
        var invOrigTotal=DB.sales.filter(function(s){return s.invoiceNum===invNum;}).reduce(function(a,s){return a+s.total;},0);
        var _topupMode=_savedTopupMode; // captured before _localDepTopup was cleared
        DB.sales.filter(function(s){return s.invoiceNum===invNum;}).forEach(function(s){
          s.depositApplied=invOrigTotal>0?Math.round((s.total/invOrigTotal)*depositApplied*100)/100:0;
          s.depositTotal=invOrigTotal; // preserve original total for invoice print
          if(creditAmount===0){
            s.payment='deposit';
            // If topup was used, record the combined payment mode
            s.payMode=_topupMode?'deposit+'+_topupMode:'deposit';
            s.depTopupMode=_topupMode||null;
          }
        });
      }


      if(overpayment > 0){
        // Customer paid MORE than the invoice — excess becomes store credit (we owe them)
        // Invoice is fully settled; full partPayment already recorded as cash-in above
        // No cashflow entry needed — this is a liability (store credit), not an expense
        regC.creditBalance = (regC.creditBalance||0) - overpayment; // negative = we owe them
      } else if(creditAmount > 0){
        // Customer still owes us the remaining amount
        var existingCredit=Math.abs(Math.min(0,regC.creditBalance||0)); // store credit we already owe them
        if(existingCredit > 0){
          // Apply their existing store credit first to reduce the new debt
          var appliedCredit=Math.min(existingCredit,creditAmount);
          var remainingCreditDebt=creditAmount-appliedCredit;
          regC.creditBalance=(regC.creditBalance||0)+appliedCredit;
          if(remainingCreditDebt>0){regC.creditBalance=(regC.creditBalance||0)+remainingCreditDebt;}
          if(appliedCredit>0){
            DB.cashflow.push({id:uid(),desc:'Store credit applied — '+custName+' Invoice #'+invNum,amount:appliedCredit,type:'in',cat:'Sales',payMode:'credit',date:date,month:month});
          }
        } else {
          regC.creditBalance=(regC.creditBalance||0)+creditAmount;
        }
      }
      // creditAmount === 0 and no overpayment = exact payment, balance unchanged
      invoiceItems.forEach(function(l){regC.salesHistory.push({date:date,item:l.name,qty:l.qty,total:l.price*l.qty,payMode:payMode});});
    }
  }
  // Enrich lastInvoice items with supply status from saved DB.sales
  var lastInvItems=JSON.parse(JSON.stringify(invoiceItems));
  lastInvItems.forEach(function(li){
    var saved=DB.sales.find(function(s){return s.invoiceId===invoiceId&&s.itemId===li.itemId;});
    if(saved){li.suppliedQty=saved.suppliedQty;li.pendingQty=saved.pendingQty;li.supplyStatus=saved.supplyStatus;}
  });
  // For deposit invoices, grandTotal may be reduced to 0 — use subtotalAll-invoiceDiscAmt for print
  var _printGrandTotal=(payment==='deposit'&&subtotalAll>0)?(subtotalAll-invoiceDiscAmt):grandTotal;
  var _lastDepApplied=DB.sales.filter(function(s){return s.invoiceNum===invNum;}).reduce(function(a,s){return a+(s.depositApplied||0);},0);
  var _lastDepTopupMode=(DB.sales.find(function(s){return s.invoiceNum===invNum&&s.depTopupMode;})||{}).depTopupMode||null;
  console.log('[Invoice Print] depositApplied:',_lastDepApplied,'depTopupMode:',_lastDepTopupMode);
  DB._lastInvoice={invoiceId:invoiceId,invoiceNum:invNum,custName:custName,custAddr:custAddr,printName:printName,date:date,items:lastInvItems,invoiceDiscAmt:invoiceDiscAmt,invoiceDiscType:invDiscType,invoiceDiscVal:invDiscVal,payment:payment,payMode:payMode,depTopupMode:_lastDepTopupMode,depositApplied:_lastDepApplied,bankId:bankId,posId:posId,seller:DB.currentUser.name,grandTotal:_printGrandTotal,grandProfit:grandProfit,subtotalAll:subtotalAll,partPayment:partPayment,pendingSupply:pendingSupply};
  invoiceItems=[];
  logActivity('Invoice saved','Invoice #'+invNum+' — '+custName+' — '+fmt(grandTotal),payment);
  // Gap protection: re-check for duplicates right before incrementing
  // (catches race condition where another user saved same number while this form was open)
  var dupCheck=DB.sales.filter(function(s){return String(s.invoiceNum)===String(invNum);});
  if(dupCheck.length>0){
    // This number was already used — regenerate a new one and patch the saved records
    var newNum=generateInvoiceNum();
    DB.sales.filter(function(s){return String(s.invoiceNum)===String(invNum)&&s.invoiceId===invoiceId;})
            .forEach(function(s){s.invoiceNum=newNum;});
    DB._lastInvoice.invoiceNum=newNum;
    invNum=newNum;
    console.warn('Invoice number collision detected — reassigned to '+newNum);
  }
  // Increment invoice counter for next invoice
  DB.invoiceCounter=(DB.invoiceCounter||0)+1;
  DB.invoiceYear=new Date().getFullYear();
  // ── CRITICAL: Force immediate Firebase sync to prevent data loss on power cut ──
  saveData(true); // urgent=true bypasses 400ms delay
  // Also save a quick-recovery copy of last invoice in localStorage
  try{
    var _recovery=JSON.parse(localStorage.getItem('gce_last_invoices')||'[]');
    _recovery.unshift({invNum:invNum,custName:custName,total:grandTotal,date:new Date().toLocaleDateString(),ts:Date.now()});
    if(_recovery.length>10)_recovery=_recovery.slice(0,10); // keep last 10
    localStorage.setItem('gce_last_invoices',JSON.stringify(_recovery));
  }catch(e){}
  var saveMsg='Invoice #'+invNum+' saved!';
  if(pendingSupply){
    saveMsg+='\n\n⏳ GOODS NOT YET SUPPLIED\nPayment recorded. Stock will NOT be deducted until you mark the goods as supplied from the sales ledger.';
  }
  if(overpayment>0){
    saveMsg+='\n\n⚠️ OVERPAYMENT RECORDED\nCustomer paid '+fmt(partPayment)+' but invoice total was '+fmt(grandTotal)+'.\nExcess of '+fmt(overpayment)+' has been saved as store credit on '+custName+'\'s account.\n(You now owe the customer '+fmt(overpayment)+')';
  }
  if(confirm(saveMsg+'\n\nPrint invoice now?')){
    printInvoice(DB._lastInvoice);
  } else {renderApp();}
}

function printInvoice(inv){
  if(!inv)inv=DB._lastInvoice;
  if(!inv){alert('No invoice to print.');return;}
  var d=new Date(inv.date),day=d.getDate(),month2=d.getMonth()+1,year=d.getFullYear();
  var rows=inv.items.map(function(l,i){
    var hasPartial=(l.suppliedQty!==undefined&&l.pendingQty>0)||(l.supplyStatus==='partial'||l.supplyStatus==='pending');
    var suppliedQty=l.suppliedQty!==undefined?l.suppliedQty:l.qty;
    var pendingQty=l.pendingQty!==undefined?l.pendingQty:0;
    var qtyCell=hasPartial
      ?'<span style="color:#16a34a;font-weight:700">'+suppliedQty+' supplied</span><br><span style="color:#dc2626;font-size:9px">'+pendingQty+' pending</span>'
      :''+l.qty;
    return '<tr><td class="center">'+(i+1)+'</td><td>'+l.name+'</td><td class="center">'+qtyCell+'</td><td class="right">'+fmt(l.price)+'</td>'+
           '<td class="right" style="background:#fff5f5;color:#c0392b">'+(l.discAmt>0?'-'+fmt(l.discAmt):'')+'</td>'+
           '<td class="right"><b>'+fmt(l.total)+'</b></td></tr>';
  }).join('');
  var minRows=Math.max(12,inv.items.length);
  var emptyRows='';for(var i=inv.items.length;i<minRows;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  // Get current outstanding balance for this customer from DB
  var invCust = inv.custId ? DB.customers.find(function(c){return c.id==inv.custId;}) : null;
  var liveOutstanding = invCust ? Math.max(0, invCust.creditBalance||0) : 0;
  // For deposit invoices use subtotalAll-invoiceDiscAmt as the true invoice total
  var _invPrintTotal=inv.payment==='deposit'?(inv.subtotalAll||(inv.grandTotal||0))-(inv.invoiceDiscAmt||0):inv.grandTotal;
  var _invSales=DB.sales.filter(function(s){return s.invoiceNum===inv.invoiceNum;});
  var _invDepApplied=inv.depositApplied||_invSales.reduce(function(a,s){return a+(s.depositApplied||0);},0);
  var html=buildInvoiceHTML({invoiceNum:inv.invoiceNum,custName:inv.printName||inv.custName,custAddr:inv.custAddr,day:day,month:month2,year:year,rows:rows+emptyRows,itemCount:inv.items.length,subtotalAll:inv.subtotalAll||inv.grandTotal,invoiceDiscAmt:inv.invoiceDiscAmt||0,grandTotal:_invPrintTotal,payment:inv.payment,payMode:inv.payMode,depTopupMode:inv.depTopupMode||null,depositApplied:_invDepApplied,bankId:inv.bankId,posId:inv.posId,splitPayment:inv.splitPayment||null,seller:inv.seller,pendingSupply:inv.pendingSupply,supplyDate:inv.supplyDate||null,partPayment:inv.partPayment||0,outstandingBal:liveOutstanding,prevInvTotal:0});
  // Show print mode dialog
  showPrintDialog(inv, html);
}

function doPrint(mode, inv) {
  var overlay=document.getElementById('print-dialog-overlay');if(overlay)overlay.remove();
  var html;
  if(mode==='thermal'){
    html=buildThermalHTML(inv);
  } else {
    // rebuild with forced page size
    var itemCount=inv.items?inv.items.length:1;
    var forcedSize=mode==='a4'?'A4':'A5';
    var d=new Date(inv.date),day=d.getDate(),month2=d.getMonth()+1,year=d.getFullYear();
    var rows=inv.items.map(function(l,i){
      var hasPartial=(l.suppliedQty!==undefined&&l.pendingQty>0)||(l.supplyStatus==='partial'||l.supplyStatus==='pending');
      var suppliedQty=l.suppliedQty!==undefined?l.suppliedQty:l.qty;
      var pendingQty=l.pendingQty!==undefined?l.pendingQty:0;
      var qtyCell=hasPartial?'<span style="color:#16a34a;font-weight:700">'+suppliedQty+' supplied</span><br><span style="color:#dc2626;font-size:9px">'+pendingQty+' pending</span>':''+l.qty;
      return '<tr><td class="center">'+(i+1)+'</td><td>'+l.name+'</td><td class="center">'+qtyCell+'</td><td class="right">'+fmt(l.price)+'</td>'+
             '<td class="right" style="background:#fff5f5;color:#c0392b">'+(l.discAmt>0?'-'+fmt(l.discAmt):'')+'</td>'+
             '<td class="right"><b>'+fmt(l.total)+'</b></td></tr>';
    }).join('');
    var minRows=Math.max(12,inv.items.length);
    var emptyRows='';for(var i=inv.items.length;i<minRows;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
    var invCust=inv.custId?DB.customers.find(function(c){return c.id==inv.custId;}):null;
    var liveOutstanding=invCust?Math.max(0,invCust.creditBalance||0):0;
    // Temporarily override pageSize in buildInvoiceHTML by passing forced size
    html=buildInvoiceHTMLSized(inv,rows+emptyRows,forcedSize,liveOutstanding);
  }
  var w=window.open('','_blank','width=700,height=900');
  w.document.write(html);w.document.close();
  setTimeout(function(){w.print();},500);
}

function printSaleLedger(){
  var today=new Date().toLocaleDateString();
  var filterMode=window._salesLedgerFilter||'today';
  var filterDate=window._salesLedgerDate||'';
  var filteredSales=DB.sales.slice().reverse().filter(function(s){
    if(filterMode==='today')return s.date===today;
    if(filterMode==='date'&&filterDate){var dp=filterDate.split("-");var ds=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).toLocaleDateString();return s.date===ds;}
    return true;

function onPaymentTypeChange(){
  // For walk-in customers, hide credit and part payment options
  var paySelEl=document.getElementById('s-payment');
  if(paySelEl){
    var isWalkin=saleCustomerType==='walkin';
    Array.from(paySelEl.options).forEach(function(o){
      if(o.value==='credit'||o.value==='part'){o.disabled=isWalkin;o.style.display=isWalkin?'none':'';}
    });
    // If walk-in and a blocked option is currently selected, reset to cash
    if(isWalkin&&(paySelEl.value==='credit'||paySelEl.value==='part')){paySelEl.value='cash';}
    // Hide deposit option if customer has no deposit balance
    var depOptEl=Array.from(paySelEl.options).find(function(o){return o.value==='deposit';});
    if(depOptEl){
      var custId=saleCustomerType==='walkin'?'':(document.getElementById('s-reg-customer')?document.getElementById('s-reg-customer').value:'');
      var depBal=custId?(DB.deposits||[]).filter(function(d){return String(d.custId)==String(custId);}).reduce(function(a,d){return a+d.amount;},0):0;
      depOptEl.disabled=depBal<=0;
      depOptEl.style.color=depBal>0?'':'#aaa';
      depOptEl.text='Deposit (use customer deposit balance'+(depBal>0?' — ₦'+Math.round(depBal).toLocaleString()+' available':'— no balance available')+')';
    }
  }
  var payType=document.getElementById('s-payment');
  var payMode=document.getElementById('s-paymode');
  var partWrap=document.getElementById('s-part-wrap');
  var splitWrap=document.getElementById('s-split-wrap');
  var payModeWrap=document.getElementById('s-paymode-wrap');
  if(!payType||!payMode)return;
  if(payType.value==='credit'){
    payMode.value='credit';payMode.disabled=true;
    if(partWrap)partWrap.style.display='none';
    if(splitWrap)splitWrap.style.display='none';
    if(payModeWrap)payModeWrap.style.display='block';
    togglePaySubFields('credit','s');
  } else if(payType.value==='deposit'){
    payMode.value='deposit';payMode.disabled=true;
    if(partWrap)partWrap.style.display='none';
    if(splitWrap)splitWrap.style.display='none';
    if(payModeWrap)payModeWrap.style.display='none';
  } else if(payType.value==='part'){
    payMode.value='cash';payMode.disabled=false;
    if(partWrap)partWrap.style.display='block';
    if(splitWrap)splitWrap.style.display='none';
    if(payModeWrap)payModeWrap.style.display='block';
    togglePaySubFields('cash','s');
  } else if(payType.value==='split'){
    payMode.disabled=false;
    if(partWrap)partWrap.style.display='none';
    if(splitWrap)splitWrap.style.display='block';
    if(payModeWrap)payModeWrap.style.display='none';
    onSplitModeChange();
  } else {
    payMode.value='cash';payMode.disabled=false;
    if(partWrap)partWrap.style.display='none';
    if(splitWrap)splitWrap.style.display='none';
    if(payModeWrap)payModeWrap.style.display='block';
    togglePaySubFields('cash','s');
  }
}
function onSplitModeChange(){
  var m1=document.getElementById('s-split-mode1');
  var m2=document.getElementById('s-split-mode2');
  var bankWrap=document.getElementById('s-split-bank-wrap');
  var posWrap=document.getElementById('s-split-pos-wrap');
  if(!m1||!m2)return;
  var modes=[m1.value,m2.value];
  if(bankWrap)bankWrap.style.display=modes.indexOf('transfer')>-1?'block':'none';
  if(posWrap)posWrap.style.display=modes.indexOf('pos')>-1?'block':'none';
}
function onSplitAmtChange(){
  var amt1=parseFloat(document.getElementById('s-split-amt1').value)||0;
  var amt2=parseFloat(document.getElementById('s-split-amt2').value)||0;
  var total=amt1+amt2;
  var el=document.getElementById('s-split-total-check');
  if(!el)return;
  var _sub=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var _dt=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var _dv=parseFloat(document.getElementById('inv-disc-val')?document.getElementById('inv-disc-val').value:0)||0;
  var _da=_dt==='pct'?(_sub*_dv/100):_dt==='flat'?Math.min(_dv,_sub):0;
  var grandTotal=Math.round((_sub-_da)*100)/100;
  if(total>0){
    var diff=Math.abs(total-grandTotal);
    if(diff<1){el.innerHTML='<span style="color:#198754;font-weight:700">✅ Total matches: '+fmt(total)+'</span>';}
    else if(total<grandTotal){el.innerHTML='<span style="color:#dc3545;font-weight:700">⚠ Short by '+fmt(grandTotal-total)+' (invoice total: '+fmt(grandTotal)+')</span>';}
    else{el.innerHTML='<span style="color:#856404;font-weight:700">⚠ Over by '+fmt(total-grandTotal)+' (invoice total: '+fmt(grandTotal)+')</span>';}
  } else {el.innerHTML='';}
}
function onPurchasePayTypeChange(){
  var payType=document.getElementById('pu-paytype');
  var payMode=document.getElementById('pu-paymode');
  var partWrap=document.getElementById('pu-part-wrap');
  if(!payType||!payMode)return;
  if(payType.value==='credit'){
    payMode.value='credit';
    payMode.disabled=true;
    if(partWrap)partWrap.style.display='none';
    togglePaySubFields('credit','pu');
  } else if(payType.value==='part'){
    payMode.value='cash';
    payMode.disabled=false;
    if(partWrap)partWrap.style.display='block';
    togglePaySubFields('cash','pu');
  } else {
    payMode.value='cash';
    payMode.disabled=false;
    if(partWrap)partWrap.style.display='none';
    togglePaySubFields('cash','pu');
  }
}

function markAsSupplied(invoiceRef){
  showConfirm({
    type:'warning',
    title:'Mark as supplied?',
    msg:'This will deduct the quantities from inventory. This cannot be undone.',
    detail:'Invoice #'+invoiceRef,
    confirmLabel:'✓ Mark supplied',
    cancelLabel:'Cancel'
  },function(){
  var supplyDate=new Date().toLocaleDateString();
  // Find all sales items belonging to this invoice using any matching field
  var items=DB.sales.filter(function(s){
    return String(s.invoiceId)===String(invoiceRef)||
           String(s.invoiceNum)===String(invoiceRef)||
           String(s.id)===String(invoiceRef);
  });
  if(!items.length){
    items=DB.sales.filter(function(s){
      return s.pendingSupply&&(
        String(s.invoiceId)===String(invoiceRef)||
        String(s.invoiceNum)===String(invoiceRef)
      );
    });
  }
  if(!items.length){alert('Invoice not found.');return;}
  if(!items[0].pendingSupply){alert('This invoice is already marked as supplied.');return;}
  items.forEach(function(s){
    var item=DB.inventory.find(function(i){return i.id==s.itemId;});
    if(item)item.qty-=s.qty;
    s.pendingSupply=false;
    s.wasEverPending=true;
    s.supplyStatus='supplied';
    s.supplyDate=supplyDate;
  });
  saveData();
  renderApp();
  alert('✅ Goods marked as supplied on '+supplyDate+'. Stock has been deducted from inventory.');
  }); // end showConfirm
}

function retExchSearch(inp, rowId, showAll){
  var dd=document.getElementById(rowId+'-dd');
  if(!dd)return;
  var val=(inp.value||'').toLowerCase().trim();
  var matches=DB.inventory.filter(function(i){
    return showAll||!val||i.name.toLowerCase().indexOf(val)>=0||(i.cat||'').toLowerCase().indexOf(val)>=0;
  }).slice(0,30);
  if(!matches.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML=matches.map(function(i){
    var stockColor=i.qty===0?'#dc2626':i.qty<=i.minQty?'#d97706':'#16a34a';
    var stockLabel=i.qty===0?'Out':''+i.qty+' left';
    var safeName=i.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
    return '<div onmousedown="event.preventDefault();retExchSelectItem(\''+rowId+'\','+i.id+',\''+safeName+'\','+i.sell+','+i.qty+')"'+

function retExchSelectItem(rowId, itemId, itemName, itemPrice, itemStock){
  var row=document.getElementById(rowId);
  if(!row)return;
  row.setAttribute('data-itemid', itemId);
  var searchInp=document.getElementById(rowId+'-search');
  var dd=document.getElementById(rowId+'-dd');
  var selectedLabel=document.getElementById(rowId+'-selected');
  var priceInp=document.getElementById(rowId+'-price');
  var qtyInp=document.getElementById(rowId+'-qty');
  if(searchInp)searchInp.value=itemName;
  if(dd)dd.style.display='none';
  if(selectedLabel){
    selectedLabel.style.display='block';
    selectedLabel.textContent='✓ '+itemName+' — Stock: '+itemStock+' @ '+fmt(itemPrice);
  }

  if(qtyInp)qtyInp.setAttribute('max', itemStock);
  retUpdateExchangeTotal();
}

function retUpdateExchangeTotal(){
  // Calculate current total return value from filled qty inputs
  var retTotal=0;
  // Re-calculate from the current return qty + adj price inputs
  var allQtyInps=document.querySelectorAll('[id^="ret-qty-"]');
  allQtyInps.forEach(function(inp){
    var sId=inp.id.replace('ret-qty-','');
    var qty=parseInt(inp.value)||0;
    if(qty<=0)return;
    var priceInp=document.getElementById('ret-price-'+sId);
    // We need the original unit price — stored as placeholder
    var origPrice=parseFloat(priceInp?priceInp.placeholder:0)||0;
    var adjPrice=priceInp&&priceInp.value?parseFloat(priceInp.value):0;
    var unitPrice=adjPrice>0?adjPrice:origPrice;
    retTotal+=unitPrice*qty;
  });
  // Calculate exchange total
  var exchTotal=0;
  var cont=document.getElementById('ret-exch-items');
  if(cont){
    Array.from(cont.children).forEach(function(row){
      var itemId=row.getAttribute('data-itemid');
      if(!itemId)return;
      var qtyInp=row.querySelector('[id$="-qty"]');
      var priceInp=row.querySelector('[id$="-price"]');
      var qty=parseInt(qtyInp?qtyInp.value:1)||1;
      var price=parseFloat(priceInp?priceInp.value:0)||0;
      exchTotal+=qty*price;
    });
  }
  var balance=exchTotal-retTotal;
  var retValEl=document.getElementById('ret-exch-return-val');
  var exchTotalEl=document.getElementById('ret-exch-total');
  var balEl=document.getElementById('ret-exch-balance');
  var payRow=document.getElementById('ret-exch-payment-row');
  var payAmtInp=document.getElementById('ret-exch-payamt');
  if(retValEl)retValEl.textContent='₦'+Math.round(retTotal).toLocaleString();
  if(exchTotalEl)exchTotalEl.textContent='₦'+Math.round(exchTotal).toLocaleString();
  if(balEl){
    if(balance>0){
      balEl.textContent='Customer pays ₦'+Math.round(balance).toLocaleString()+' extra';
      balEl.style.color='#dc2626';
    } else if(balance<0){
      balEl.textContent='Shop refunds ₦'+Math.round(Math.abs(balance)).toLocaleString()+' change';
      balEl.style.color='#15803d';
    } else {
      balEl.textContent='Even exchange';
      balEl.style.color='#374151';
    }
  }
  if(payRow)payRow.style.display=balance>0?'block':'none';
  if(payAmtInp)payAmtInp.value=balance>0?Math.round(balance):'';
}

function processReturn(invoiceId){
  var items=DB.sales.filter(function(s){return s.invoiceId===invoiceId||s.invoiceNum===invoiceId||s.invoiceNum===String(invoiceId)||String(s.invoiceId)===String(invoiceId)||s.id===invoiceId||String(s.id)===String(invoiceId);});
  var reason=document.getElementById('ret-reason').value.trim();
  var refundType=document.getElementById('ret-refund').value;
  if(!reason){alert('Please enter a return reason.');return;}
  var retDateEl=document.getElementById('ret-date');
  var retDateVal=retDateEl?retDateEl.value:'';
  var date,month;
  if(retDateVal){
    var dp=retDateVal.split('-');
    var cd=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
    // Validate: return date must not be before the original sale date
    var s0=items[0];
    var saleDate=parseDate(s0.date);
    if(saleDate){
      // Compare at day level
      saleDate.setHours(0,0,0,0);
      cd.setHours(0,0,0,0);
      if(cd<saleDate){
        alert('Return date cannot be before the original sale date ('+s0.date+'). Please choose a later date.');
        return;
      }
    }
    // Validate: return date must not be in the future
    var today=new Date();today.setHours(0,0,0,0);
    if(cd>today){
      alert('Return date cannot be in the future.');
      return;
    }
    date=cd.toLocaleDateString();
    month=retDateVal.slice(0,7);
  } else {
    date=new Date().toLocaleDateString();
    month=new Date().toISOString().slice(0,7);
  }
  var totalRefund=0;
  var returnedItems=[];
  items.forEach(function(s){
    var inp=document.getElementById('ret-qty-'+s.id);
    var qty=parseInt(inp?inp.value:0)||0;
    if(qty<=0)return;
    var prev=DB.salesReturns.filter(function(r){return r.invoiceId===invoiceId&&r.itemId===s.id;}).reduce(function(a,r){return a+r.qty;},0);
    var max=s.qty-prev;
    if(qty>max){alert('Cannot return more than '+max+' for "'+s.name+'".');return;}
    // Use adjusted price if entered, else fall back to original unit price
    var priceInp=document.getElementById('ret-price-'+s.id);
    var adjPrice=priceInp&&priceInp.value?parseFloat(priceInp.value):0;
    var origUnitPrice=s.qty>0?s.total/s.qty:s.salePrice||0;
    var finalUnitPrice=adjPrice>0?adjPrice:origUnitPrice;
    var refundAmt=finalUnitPrice*qty;
    totalRefund+=refundAmt;
    returnedItems.push({name:s.name,qty:qty,refund:refundAmt,adjPrice:adjPrice>0?adjPrice:null,itemId:s.id});
    // Add back to inventory
    var invItem=DB.inventory.find(function(i){return i.id==s.itemId;});
    if(invItem)invItem.qty+=qty;
    // Log adjustment
    if(invItem){DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'add',reason:'Sales return — Invoice #'+items[0].invoiceNum,before:invItem.qty-qty,change:qty,after:invItem.qty,date:date,by:DB.currentUser.name});}
    // Save return record (exchangeItems added after exchange processing below)
    DB.salesReturns.push({id:uid(),invoiceId:invoiceId,invoiceNum:items[0].invoiceNum||invoiceId,itemId:s.id,itemName:s.name,qty:qty,refundAmt:refundAmt,adjPrice:adjPrice>0?adjPrice:null,origUnitPrice:origUnitPrice,refundType:refundType,reason:reason,custId:items[0].custId,custName:items[0].custName||'Walk-in customer',date:date,month:month,by:DB.currentUser.name,exchangeItems:null});
  });
  if(!returnedItems.length){alert('Enter at least one item quantity to return.');return;}

  // ── Handle exchange goods ─────────────────────────────────────
  var exchangeItems=[];
  var exchTotal=0;
  if(refundType==='exchange'){
    var exchCont=document.getElementById('ret-exch-items');
    if(exchCont){
      var valid=true;
      Array.from(exchCont.children).forEach(function(row){
        var itemId=row.getAttribute('data-itemid');
        if(!itemId)return;
        var qtyInp=row.querySelector('[id$="-qty"]');
        var priceInp=row.querySelector('[id$="-price"]');
        var invItem=DB.inventory.find(function(i){return i.id==itemId;});
        if(!invItem)return;
        var qty=parseInt(qtyInp?qtyInp.value:1)||1;
        var price=parseFloat(priceInp?priceInp.value:0)||invItem.sell;
        if(qty>invItem.qty){
          alert('Not enough stock for "'+invItem.name+'". Available: '+invItem.qty+', requested: '+qty);
          valid=false;return;
        }
        exchTotal+=qty*price;
        exchangeItems.push({invItem:invItem,qty:qty,price:price,total:qty*price});
      });
      if(!valid)return;
      if(exchangeItems.length===0){alert('Please add at least one item for exchange.');return;}
      // Deduct exchanged items from inventory
      exchangeItems.forEach(function(e){
        var before=e.invItem.qty;
        e.invItem.qty-=e.qty;
        DB.adjLog.push({id:uid(),itemId:e.invItem.id,itemName:e.invItem.name,type:'remove',
          reason:'Exchange — Return Invoice #'+items[0].invoiceNum,
          before:before,change:-e.qty,after:e.invItem.qty,date:date,by:DB.currentUser.name});
      });
      // ── Save exchange items to the return records ──────────────
      // Update ALL return records from this invoice to include exchangeItems on the first one
      var exchStoreData=exchangeItems.map(function(e){
        return {name:e.invItem?e.invItem.name:e.name,qty:e.qty,price:e.price,total:e.total,itemId:e.invItem?e.invItem.id:e.itemId};
      });
      var thisInvReturns=DB.salesReturns.filter(function(r){
        return r.invoiceNum===items[0].invoiceNum&&r.date===date&&r.refundType==='exchange';
      });
      if(thisInvReturns.length>0){
        thisInvReturns[0].exchangeItems=exchStoreData; // store on first record only
      }
      // Handle balance payment if exchange > return
      var balance=Math.round(exchTotal-totalRefund);
      if(balance>0){
        var exchPayMode=(document.getElementById('ret-exch-paymode')||{}).value||'cash';
        DB.cashflow.push({id:uid(),
          desc:'Exchange balance payment — Return of Invoice #'+items[0].invoiceNum+' ('+items[0].custName+')',
          amount:balance,type:'in',cat:'Sales',payMode:exchPayMode,date:date,month:month,isExchange:true});
      } else if(balance<0){
        // Shop owes change back
        DB.cashflow.push({id:uid(),
          desc:'Exchange change given — Return of Invoice #'+items[0].invoiceNum+' ('+items[0].custName+')',
          amount:Math.abs(balance),type:'out',cat:'Sales Return',payMode:'cash',date:date,month:month,isExchange:true});
      }
    }
  }

  // ── Handle cash/transfer/credit refund ───────────────────────
  var retBankId=document.getElementById('ret-bank-id')?document.getElementById('ret-bank-id').value:'';
  if(refundType==='cash'){
    DB.cashflow.push({id:uid(),desc:'Sales return refund — Invoice #'+items[0].invoiceNum+' ('+items[0].custName+')',amount:totalRefund,type:'out',cat:'Sales Return',payMode:'cash',date:date,month:month,isReturn:true});
  } else if(refundType==='transfer'){
    var retBank=retBankId?(DB.banks||[]).find(function(b){return b.id==retBankId;}):null;
    var retBankName=retBank?(retBank.bankName||'Bank'):'Bank';
    DB.cashflow.push({id:uid(),desc:'Sales return refund (Transfer) — Invoice #'+items[0].invoiceNum+' ('+items[0].custName+')',amount:totalRefund,type:'out',cat:'Sales Return',payMode:'transfer',bankId:retBankId||null,bankName:retBankName,date:date,month:month,isReturn:true});
  } else if(refundType==='credit'&&items[0].custId){
    var cust=DB.customers.find(function(c){return c.id==items[0].custId;});
    if(cust)cust.creditBalance=Math.max(0,(cust.creditBalance||0)-totalRefund);
  }

  saveData();
  var exchSummary=exchangeItems.length?'\n\n🔄 Exchanged for:\n'+exchangeItems.map(function(e){return e.invItem.name+' × '+e.qty+' @ ₦'+Math.round(e.price).toLocaleString();}).join('\n'):'';
  var balance2=Math.round(exchTotal-totalRefund);
  var balMsg=refundType==='exchange'&&exchangeItems.length?(balance2>0?'\n💰 Balance collected: ₦'+Math.round(balance2).toLocaleString():balance2<0?'\n💵 Change given: ₦'+Math.round(Math.abs(balance2)).toLocaleString():'\n✅ Even exchange'):'';
  logActivity('Sales return','Invoice #'+(items[0].invoiceNum||invoiceId)+' — '+returnedItems.map(function(r){return r.name+' ×'+r.qty;}).join(', ')+(totalRefund>0?' — Refund: '+fmt(totalRefund):'')+exchSummary,refundType);
  document.getElementById('return-modal').remove();
  renderApp();
  var refundModeLabel=refundType==='cash'?'Cash':refundType==='transfer'?'Bank Transfer':refundType==='credit'?'Store Credit':'Exchange';
  alert('✅ Return processed!\n\n'+returnedItems.map(function(r){return r.name+' × '+r.qty+(r.adjPrice?' @ ₦'+Math.round(r.adjPrice).toLocaleString()+' (adjusted)':'');}).join('\n')+'\n\nStock added back to inventory.'+(totalRefund>0&&refundType!=='exchange'?'\nTotal Refund: ₦'+Math.round(totalRefund).toLocaleString()+' via '+refundModeLabel:'')+exchSummary+balMsg);
}

function checkDupInvoice(val){
  var warn=document.getElementById('s-inv-dup-warn');
  var inp=document.getElementById('s-inv-num');
  if(!warn||!val)return;
  var exists=DB.sales.find(function(s){return String(s.invoiceNum)===String(val.trim());});
  if(exists){
    warn.style.display='block';
    warn.innerHTML='⛔ Invoice #'+val.trim()+' already posted on '+exists.date+' for '+exists.custName+' — ₦'+Math.round(exists.total).toLocaleString();
    if(inp){inp.style.borderColor='#dc3545';inp.style.background='#fff5f5';}
  } else {
    warn.style.display='none';
    if(inp){inp.style.borderColor='';inp.style.background='';}
  }
}
function voidInvoice(invoiceKey){
  var items=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invoiceKey;});
  if(!items.length){alert('Invoice not found.');return;}
  var s0=items[0];
  var total=items.reduce(function(a,s){return a+s.total;},0);
  showConfirm({
    type:'danger',
    title:'Void invoice?',
    msg:'This invoice will be moved to the Recycle Bin. Stock deducted at sale time is NOT automatically restored.',
    detail:'🧾 Invoice #'+invoiceKey+' · '+s0.custName+' · '+fmt(total)+' · '+s0.date,
    confirmLabel:'🗑️ Void invoice',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('invoice',items,'Sales');
    DB.sales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)!=invoiceKey;});
    saveData();renderApp();
    alert('Invoice #'+invoiceKey+' voided and moved to Recycle Bin.');
    logActivity('Invoice voided','Invoice #'+invoiceKey+' voided and moved to Recycle Bin','');
  });
}

  // ── Partial/Pending supply section ──
  var partialSales=DB.sales.filter(function(s){return s.supplyStatus==='partial'||s.supplyStatus==='pending';});
  var pendingByInvoice={};
  partialSales.forEach(function(s){
    if(!pendingByInvoice[s.invoiceNum])pendingByInvoice[s.invoiceNum]={invoiceNum:s.invoiceNum,custName:s.printName||s.custName,date:s.date,items:[]};
    pendingByInvoice[s.invoiceNum].items.push(s);
  });
  var pendingInvoices=Object.keys(pendingByInvoice).map(function(k){return pendingByInvoice[k];});
  var pendingSupplySection='';
  if(pendingInvoices.length){
    var pRows=pendingInvoices.map(function(g){
      var iRows=g.items.map(function(s){
        var supplied=s.suppliedQty||0;
        var pending=s.pendingQty!==undefined?s.pendingQty:s.qty;
        var total=s.qty;
        var pct=total>0?Math.round((supplied/total)*100):0;
        var bc=pct===0?'#dc2626':pct<100?'#f59e0b':'#16a34a';

          '<td><div style="background:#e5e7eb;border-radius:4px;height:8px;width:80px;overflow:hidden;display:inline-block;vertical-align:middle"><div style="width:'+pct+'%;background:'+bc+';height:100%;border-radius:4px"></div></div> '+pct+'%</td>'+
          '<td>'+(pending>0?'<button class="btn sm" onclick="showSupplyQtyModal(\''+g.invoiceNum+'\',\''+s.id+'\')" style="color:#16a34a;border-color:#86efac;font-size:11px">&#10003; Supply</button>':'<span style="color:#16a34a;font-size:11px">&#10003; Done</span>')+'</td>'+
        '</tr>';
      }).join('');
      return '<tr style="background:#fef3c7">'+
        '<td><b>Inv #'+g.invoiceNum+'</b></td>'+
        '<td colspan="4" style="color:#92400e;font-weight:700;font-size:12px">'+g.custName+' &middot; '+g.date+'</td>'+
        '<td><button class="btn sm" onclick="supplyAllNow(\''+g.invoiceNum+'\')" style="color:#1a237e;border-color:#93c5fd;font-size:11px">&#128230; Supply all</button></td>'+
      '</tr>'+iRows;
    }).join('');
    pendingSupplySection='<div style="background:#fff;border:2px solid #f59e0b;border-radius:10px;padding:14px;margin-bottom:1.5rem">'+
      '<div style="font-size:14px;font-weight:700;color:#92400e;margin-bottom:10px">&#9200; Pending Supply ('+pendingInvoices.length+' invoice'+(pendingInvoices.length>1?'s':'')+')</div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Item</th><th style="text-align:center">Ordered</th><th style="text-align:center">Supplied</th><th style="text-align:center">Pending</th><th>Progress</th><th></th></tr></thead><tbody>'+pRows+'</tbody></table></div></div>';
  }
  var totalRev=0,totalProfit=0,creditTotal=0,cashS=0,posS=0,transS=0;
  // Group by invoice to avoid double-counting split amounts across line items
  var _salesInvMap={};
  DB.sales.forEach(function(s){
    totalRev+=s.total;totalProfit+=s.profit;
    var k=s.invoiceNum||s.id;
    if(!_salesInvMap[k])_salesInvMap[k]={payment:s.payment,payMode:s.payMode,splitPayment:s.splitPayment||null,total:0};
    _salesInvMap[k].total+=s.total;
  });

    (invoiceKeys.length?'<div class="tbl-wrap"><table id="sales-ledger-table"><thead><tr><th>Date</th><th>Invoice #</th><th>Customer</th><th>Pay type</th><th>Items</th><th style="text-align:right">Total</th><th style="text-align:right">Profit</th><th>Mode</th><th style="text-align:right;color:#15803d">Deposit bal.</th><th>Seller</th><th></th></tr></thead><tbody>'+ledger+'</tbody></table></div>':'<div class="empty">'+(salesLedgerFilter==='today'?'No invoices recorded today yet.':salesLedgerFilter==='date'&&salesLedgerDate?'No invoices found for that date.':'No invoices yet.')+'</div>')+
    // Returns history — filtered by the same date as the sales ledger
    (function(){
      if(!DB.salesReturns||!DB.salesReturns.length) return '';
      // Apply the same date filter used by the ledger
      var filteredReturns=DB.salesReturns.filter(function(r){
        if(salesLedgerFilter==='today') return r.date===today;
        if(salesLedgerFilter==='date'&&salesLedgerDate){
          var dp=salesLedgerDate.split('-');
          var ds=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).toLocaleDateString();
          return r.date===ds;
        }
        return true; // 'all'
      });
      var filterLabel=salesLedgerFilter==='today'?'Today':salesLedgerFilter==='date'&&salesLedgerDate?(function(){var dp=salesLedgerDate.split('-');return new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2])).toLocaleDateString();})():'All time';
      // Group returns by invoiceId+date so each return event shows as one row
      var retGroups={};
      filteredReturns.slice().reverse().forEach(function(r){
        var gKey=(r.invoiceNum||r.invoiceId||r.id)+'__'+r.date+'__'+r.by;
        if(!retGroups[gKey])retGroups[gKey]={key:gKey,invoiceNum:r.invoiceNum||r.invoiceId,custName:r.custName,date:r.date,reason:r.reason,refundType:r.refundType,refundAmt:0,by:r.by,items:[],id:r.id};
        retGroups[gKey].refundAmt+=r.refundAmt||0;
        retGroups[gKey].items.push(r);
      });
      var rows=Object.values(retGroups).map(function(g){
        var badge=g.refundType==='cash'?'<span class="badge ok">Cash refund</span>':
          g.refundType==='transfer'?'<span class="badge" style="background:#0d6efd;color:#fff">Transfer</span>':
          g.refundType==='credit'?'<span class="badge low">Store credit</span>':
          g.refundType==='exchange'?'<span class="badge info">Exchange</span>':
          '<span class="badge">'+g.refundType+'</span>';
        var itemSummary=g.items.length===1?g.items[0].itemName+' ×'+g.items[0].qty:
          g.items.length+' items';
        return '<tr style="background:#fff5f5">'+
          '<td>'+g.date+'</td>'+
          '<td><b>'+(g.invoiceNum||'-')+'</b></td>'+
          '<td>'+(g.custName||'Walk-in customer')+'</td>'+
          '<td style="font-size:12px">'+itemSummary+'</td>'+
          '<td>'+badge+'</td>'+
          '<td style="font-size:11px;max-width:120px">'+g.reason+'</td>'+
          '<td style="text-align:right;color:var(--danger);font-weight:700">'+fmt(g.refundAmt)+'</td>'+
          '<td>'+g.by+'</td>'+
          '<td style="white-space:nowrap">'+
            '<button class="btn sm" onclick="viewReturnDetail(\''+g.key+'\')" style="color:#1a237e;border-color:#93c5fd;font-size:11px;margin-right:3px">&#128065; View</button>'+
            '<button class="btn sm" onclick="printReturnRecord(\''+g.key+'\')" style="color:#15803d;border-color:#86efac;font-size:11px">&#128438; Print</button>'+
          '</td>'+
        '</tr>';
      }).join('');
      // Store grouped returns globally for modal access
      window._retGroups=retGroups;
      return '<p class="sec-title" style="margin-top:1.5rem">&#8617; Sales Returns — '+filterLabel+' ('+(filteredReturns.length)+' item'+(filteredReturns.length!==1?'s':'')+' in '+(Object.keys(retGroups).length)+' return'+(Object.keys(retGroups).length!==1?'s':'')+')</p>'+
        (rows?
          '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Invoice #</th><th>Customer</th><th>Items returned</th><th>Refund type</th><th>Reason</th><th style="text-align:right">Refund amt</th><th>By</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        :'<div class="empty" style="padding:1.25rem">No returns for this period.</div>');
    })();
}

function printReturnRecord(gKey){
  var groups=window._retGroups||{};
  var g=groups[gKey];
  if(!g){alert('Return record not found.');return;}

  var exchCashflow=(DB.cashflow||[]).filter(function(c){
    return c.isExchange&&(c.desc||'').indexOf(g.invoiceNum)>=0&&c.date===g.date;
  });

  var bizName=settings.bizName||'Great Chid Electro';
  var bizAddr=settings.address||'';
  var bizPhone=settings.phone||'';

  var retItemRows=g.items.map(function(r,i){
    return '<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td>'+r.itemName+'</td>'+
      '<td style="text-align:center">'+r.qty+'</td>'+

      '<td style="text-align:right;font-weight:700">₦'+Math.round(r.refundAmt).toLocaleString()+'</td>'+

    '<style>@page{size:A5;margin:8mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:11px;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.hd{text-align:center;border-bottom:2px solid #dc3545;padding-bottom:8px;margin-bottom:10px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b;letter-spacing:1px}'+
    '.sub{font-size:9px;color:#555;margin-top:2px}'+

    '.info-cell{background:#f9fafb;border-radius:4px;padding:7px 10px}'+
    '.info-label{font-size:9px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:2px}'+
    '.info-val{font-size:12px;font-weight:700}'+
    '.ft{text-align:center;font-size:9px;color:#888;margin-top:12px;border-top:1px solid #eee;padding-top:6px;font-style:italic}'+

      (bizPhone?'<div class="sub">'+bizPhone+'</div>':'')+

      '<div class="info-cell"><div class="info-label">Date</div><div class="info-val">'+g.date+'</div></div>'+

      '<span>Return method: <b>'+refundTypeLabel+'</b></span>'+
    '</div>'+
    '<div class="ft">This is an official return record — '+bizName+'</div>'+
    '</body></html>';

  var w=window.open('','_blank','width=650,height=850');

function eiCustSearch(val, showAll){
  var dd=document.getElementById('ei-cust-dd');
  if(!dd)return;
  var q=(val||'').toLowerCase().trim();
  var matches=(DB.customers||[]).filter(function(c){
    return showAll||!q||c.name.toLowerCase().indexOf(q)>=0||(c.phone&&c.phone.indexOf(q)>=0);
  }).slice(0,20);
  // Always show Walk-in option
  var walkIn='<div onmousedown="event.preventDefault();document.getElementById(\'ei-custname\').value=\'Walk-in customer\';document.getElementById(\'ei-custid\').value=\'\';document.getElementById(\'ei-cust-dd\').style.display=\'none\';" style="padding:8px 10px;cursor:pointer;border-bottom:1px solid #f3f4f6;font-size:12px;color:#6b7280;font-style:italic" onmouseover="this.style.background=\'#f9fafb\'" onmouseout="this.style.background=\'\'">Walk-in customer (no account)</div>';
  if(!matches.length&&!showAll){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML=walkIn+matches.map(function(c){
    var safeName=c.name.replace(/'/g,"\'").replace(/"/g,'&quot;');
    var bal=c.creditBalance>0?'<span style="color:#dc2626;font-size:10px"> ₦'+Math.round(c.creditBalance).toLocaleString()+' owed</span>':'';
    return '<div onmousedown="event.preventDefault();document.getElementById(\'ei-custname\').value=\''+safeName+'\';document.getElementById(\'ei-custid\').value=\''+c.id+'\';document.getElementById(\'ei-cust-dd\').style.display=\'none\';" style="padding:8px 10px;cursor:pointer;border-bottom:1px solid #f3f4f6;font-size:12px" onmouseover="this.style.background=\'#f0f4ff\'" onmouseout="this.style.background=\'\'">'+
      '<div style="font-weight:600">'+c.name+bal+'</div>'+
      '<div style="font-size:10px;color:#6b7280">'+(c.phone||'No phone')+'</div>'+
    '</div>';
  }).join('');
}

function saveInvoiceEdit(invNum){
  var reason=document.getElementById('ei-reason').value.trim();
  if(!reason){alert('Please enter a reason for this edit.');return;}
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum;});
  var custName=document.getElementById('ei-custname').value.trim();
  var newCustId=document.getElementById('ei-custid')?document.getElementById('ei-custid').value:'';
  var oldTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var stockChanges=[];
  // Read invoice-level discount
  var eiInvDisc=parseFloat((document.getElementById('ei-inv-disc')||{}).value)||0;

  // Read payment changes
  var eiPayVal=document.getElementById('ei-payment').value;
  var eiBankId=(document.getElementById('ei-bankid')||{}).value||null;
  var eiPosId=(document.getElementById('ei-posid')||{}).value||null;
  var eiPartAmt=parseFloat((document.getElementById('ei-partamt')||{}).value)||0;
  // Map payment select value to payment + payMode
  var newPayment,newPayMode,newBankId=null,newPosId=null,newPartPayment=null;
  if(eiPayVal==='cash'){newPayment='cash';newPayMode='cash';}
  else if(eiPayVal==='pos'){newPayment='cash';newPayMode='pos';newPosId=eiPosId;}
  else if(eiPayVal==='transfer'){newPayment='cash';newPayMode='transfer';newBankId=eiBankId;}
  else if(eiPayVal==='split'){newPayment='split';newPayMode='split';}
  else if(eiPayVal==='part'){newPayment='part';newPayMode='cash';newPartPayment=eiPartAmt;}
  else if(eiPayVal==='credit'){newPayment='credit';newPayMode='credit';}
  else if(eiPayVal==='deposit'){newPayment='deposit';newPayMode='deposit';}
  else{newPayment=eiPayVal;newPayMode=eiPayVal;}

  // Read new date if changed
  var eiDateEl=document.getElementById('ei-date');
  var newDate=null,newMonth=null;
  if(eiDateEl&&eiDateEl.value){
    var dp=eiDateEl.value.split('-');
    var eiDateObj=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
    newDate=eiDateObj.toLocaleDateString();
    newMonth=eiDateEl.value.slice(0,7);
  }

  invSales.forEach(function(s,i){
    var oldQty=s.qty;
    var qty=parseInt(document.getElementById('ei-qty-'+i).value)||s.qty;
    var price=parseFloat(document.getElementById('ei-price-'+i).value)||s.salePrice;
    var disc=parseFloat(document.getElementById('ei-disc-'+i).value)||0;
    var newTotal=Math.max(0,(price*qty)-disc);
    // Auto stock adjustment if qty changed and goods were supplied
    if(qty!==oldQty&&s.supplyStatus!=='pending'){
      var diff=oldQty-qty;
      var invItem=DB.inventory.find(function(it){return it.id==s.itemId;});
      if(invItem){
        var before=invItem.qty;
        invItem.qty=Math.max(0,invItem.qty+diff);
        stockChanges.push({name:s.name,before:before,after:invItem.qty,diff:diff});
        DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:diff>0?'add':'remove',
          reason:'Invoice edit — #'+invNum+'. Qty: '+oldQty+' → '+qty+'. '+reason,
          before:before,change:diff,after:invItem.qty,
          date:new Date().toLocaleDateString(),by:DB.currentUser.name});
      }
    }
    s.qty=qty;s.salePrice=price;s.discAmt=disc;s.total=newTotal;
    s.profit=Math.round((newTotal-(s.cost*qty))*100)/100;
    if(custName){s.printName=custName;s.custName=custName;}
    if(newCustId!==undefined){s.custId=newCustId||null;}
    // Apply payment changes to all line items
    s.payment=newPayment;s.payMode=newPayMode;
    if(newBankId!==null)s.bankId=newBankId;
    if(newPosId!==null)s.posId=newPosId;
    if(newPartPayment!==null)s.partPayment=newPartPayment;
    if(newDate){s.date=newDate;s.month=newMonth;}
    // Save invoice-level discount on all items (for invoice display)
    s.invoiceDiscAmt=eiInvDisc;
  });
  // Apply invoice-level discount — store on first item, subtract from total
  if(eiInvDisc>0){
    var preDiscTotal=invSales.reduce(function(a,s){return a+s.total;},0);
    var actualDisc=Math.min(eiInvDisc,preDiscTotal); // can't discount more than total
    if(preDiscTotal>0){
      var remaining=actualDisc;
      invSales.forEach(function(s,idx){
        // Apply proportional share of discount to each item's total
        var share=idx<invSales.length-1?Math.round((s.total/preDiscTotal)*actualDisc*100)/100:remaining;
        remaining=Math.round((remaining-share)*100)/100;
        s.total=Math.max(0,Math.round((s.total-share)*100)/100);
        s.profit=Math.round((s.total-(s.cost*s.qty))*100)/100;
        // Store full invoiceDiscAmt on first item for display on invoice print
        s.invoiceDiscAmt=idx===0?actualDisc:0;
      });
    }
  }
  var newTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  saveData();
  // Recalculate totalSpent on affected customer(s)
  var _affIds=[s0.custId, newCustId].filter(Boolean);
  _affIds.forEach(function(aid){
    var affCust=DB.customers.find(function(c){return String(c.id)===String(aid);});
    if(affCust){
      var affSales=DB.sales.filter(function(s){return String(s.custId)===String(aid);});
      affCust.totalSpent=affSales.reduce(function(a,s){return a+s.total;},0);
      affCust.totalPurchases=[...new Set(affSales.map(function(s){return s.invoiceNum||s.id;}))].length;
    }
  });
  logActivity('Invoice edited','Invoice #'+invNum+' — total: '+fmt(oldTotal)+' → '+fmt(newTotal)+'. Reason: '+reason,'Admin: '+DB.currentUser.name);
  document.getElementById('inv-edit-modal').remove();
  var stockMsg=stockChanges.length?'\n\n📦 Stock adjusted:\n'+stockChanges.map(function(c){return c.name+': '+c.before+' → '+c.after+(c.diff>0?' (+'+c.diff+' added back)':' ('+Math.abs(c.diff)+' deducted)');}).join('\n'):'';
  showToast('Invoice #'+invNum+' updated.'+(stockChanges.length?' Stock auto-adjusted.':''));
  if(stockMsg)alert('Invoice #'+invNum+' saved.'+stockMsg);
  var old=document.getElementById('inv-detail-modal');if(old)old.remove();
}

    '</div>';

  // Close on backdrop click
  modal.addEventListener('click',function(e){if(e.target===modal)modal.remove();});
  document.body.appendChild(modal);
}

function shareInvoiceWhatsApp(invNum){
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum;});

  var custId=s0.custId;
  var cust=custId?DB.customers.find(function(c){return c.id==custId;}):null;
  var phone=cust?cust.phone:'';
  // Build text summary of invoice
  var itemLines=[];
  var invMap={};
  invSales.forEach(function(s){
    invMap[s.name]=(invMap[s.name]||0)+s.total;
  });
  Object.keys(invMap).forEach(function(name){
    itemLines.push('  • '+name+' — '+fmt(invMap[name]));
  });
  var payLabel=s0.payment==='credit'?'Credit (amount owed)':s0.payment==='part'?'Part payment (paid: '+fmt(s0.partPayment||0)+')':s0.payment==='deposit'?'Deposit':s0.payment==='split'?'Split payment':s0.payMode==='pos'?'POS':s0.payMode==='transfer'?'Bank Transfer':'Cash';

    '🧾 *INVOICE #'+invNum+'*\n'+
    '📅 Date: '+s0.date+'\n'+
    '🏪 Great Chid Electro / Global Doors Ltd\n\n'+
    '*Items:*\n'+itemLines.join('\n')+'\n\n'+
    '*Total: '+fmt(grandTotal)+'*\n'+
    'Payment: '+payLabel+'\n'+
    'Staff: '+s0.seller+'\n\n'+
    'Thank you for your patronage! 🙏';
  // Ask for phone if not on record
  if(!phone){
    phone=prompt('Enter customer WhatsApp number:');
    if(!phone)return;
  }
  phone=phone.replace(/[\s\-\(\)]/g,'');
  if(phone.startsWith('0'))phone='234'+phone.substring(1);

      partPayment:partPaid,

    var w=window.open('','_blank','width=600,height=850');w.document.write(html);w.document.close();setTimeout(function(){w.print();},500);

var purchaseItems=[];
function onPurchaseItemSelect(){
  var sel=document.getElementById('pi-select');
  var nameWrap=document.getElementById('pi-name-wrap');
  var nameInput=document.getElementById('pi-name');
  var costInput=document.getElementById('pi-cost');
  if(!sel)return;
  if(sel.value==='__new__'){
    if(nameWrap)nameWrap.style.display='block';
    if(nameInput)nameInput.value='';
    if(costInput)costInput.value='';
  } else if(sel.value===''){
    if(nameWrap)nameWrap.style.display='none';
    if(costInput)costInput.value='';
  } else {
    // existing item selected  -  auto-fill cost
    if(nameWrap)nameWrap.style.display='none';
    var item=DB.inventory.find(function(i){return i.id==sel.value;});
    if(item&&costInput)costInput.value=item.cost;

function addPurchaseItem(){
  var sel=document.getElementById('pi-select');
  var qtyOrdered=parseInt(document.getElementById('pi-qty-ordered').value)||0;
  var qtyReceived=parseInt(document.getElementById('pi-qty-received').value)||0;
  var cost=parseFloat(document.getElementById('pi-cost').value)||0;
  if(!sel){alert('Item selector not found.');return;}
  var itemId=null,name='';
  if(sel.value==='__new__'){
    name=document.getElementById('pi-name')?document.getElementById('pi-name').value.trim():'';
    if(!name){alert('Enter a name for the new item.');return;}
  } else if(sel.value===''){
    alert('Please select an existing item or choose "Create new item".');return;
  } else {
    itemId=sel.value;
    var item=DB.inventory.find(function(i){return i.id==itemId;});
    if(!item){alert('Item not found.');return;}
    name=item.name;
  }
  if(qtyOrdered<=0){alert('Enter the quantity ordered (on the invoice).');return;}
  if(qtyReceived<0||qtyReceived>qtyOrdered){alert('Qty received cannot be more than qty ordered ('+qtyOrdered+').');return;}
  if(cost<=0){alert('❌ Cost price is required.');return;}
  var qtyPending=qtyOrdered-qtyReceived;
  purchaseItems.push({
    lineId:uid(),itemId:itemId,name:name,
    qtyOrdered:qtyOrdered,
    qtyReceived:qtyReceived,
    qtyPending:qtyPending,
    qty:qtyReceived, // qty = what goes to stock immediately
    cost:cost,
    total:qtyOrdered*cost, // invoice total based on ordered qty
    totalReceived:qtyReceived*cost,
    isNew:!itemId
  });
  // Reset form
  sel.value='';
  var ps=document.getElementById('pi-search');if(ps)ps.value='';
  document.getElementById('pi-qty-ordered').value='';
  document.getElementById('pi-qty-received').value='';
  document.getElementById('pi-cost').value='';
  var ni=document.getElementById('pi-name');if(ni)ni.value='';
  var nw=document.getElementById('pi-name-wrap');if(nw)nw.style.display='none';
  renderPurchaseItems();
}
