  logActivity('Invoice note','Note added/edited on Invoice #'+invNum,note.substring(0,50));
  alert('Note saved on Invoice #'+invNum);
  var old=document.getElementById('inv-detail-modal');if(old)old.remove();
  viewInvoiceDetail(invNum);
}

function reprintInvoice(invNum){
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum;});
  if(!invSales.length){alert('Invoice not found.');return;}
  var s0=invSales[0];var d=new Date(s0.date),day=d.getDate(),mon=d.getMonth()+1,yr=d.getFullYear();
  var rows=invSales.map(function(s,i){var hasP=s.pendingSupply&&((s.suppliedQty!==undefined&&(s.pendingQty||0)>0)||(s.supplyStatus==='partial'||s.supplyStatus==='pending'));var sQty=s.suppliedQty!==undefined?s.suppliedQty:s.qty;var pQty=s.pendingQty||0;var qCell=hasP?'<span style="color:#16a34a;font-weight:700">'+sQty+' supplied</span><br><span style="color:#dc2626;font-size:9px">'+pQty+' pending</span>':''+s.qty;return '<tr><td class="center">'+(i+1)+'</td><td>'+esc(s.name)+'</td><td class="center">'+qCell+'</td><td class="right">'+fmt(s.salePrice)+'</td><td class="right" style="background:var(--danger-bg);color:#c0392b">'+(s.discAmt>0?'-'+fmt(s.discAmt):'')+'</td><td class="right"><b>'+fmt(s.total)+'</b></td></tr>';}).join('');
  var grandTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var subtotalAll=invSales.reduce(function(a,s){return a+(s.salePrice*s.qty);},0);
  var invoiceDiscAmt=subtotalAll-grandTotal;
  var emptyRows='';var minR=Math.max(12,invSales.length);for(var i=invSales.length;i<minR;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  var custId=s0.custId;
  var cust=custId?DB.customers.find(function(c){return c.id==custId;}):null;
  // Use live creditBalance as source of truth — reconstruct prevInvTotal from it
  var partPaid=s0.partPayment||0;
  var depApplied=invSales.reduce(function(a,s){return a+(s.depositApplied||0);},0);
  var invNet=s0.payment==='credit'?Math.max(0,grandTotal-depApplied):s0.payment==='part'?Math.max(0,grandTotal-partPaid-depApplied):0;
  // Live outstanding = what customer owes RIGHT NOW
  var liveCredit=cust?Math.max(0,cust.creditBalance||0):0;
  // Previous balance = live balance minus this invoice's unpaid portion
  var prevInvTotal=Math.max(0,liveCredit-invNet);
  var outstandingBal=liveCredit;
  function doPrint(withOutstanding){
    // For deposit invoices use original total (before deposit applied)
    var _reprintTotal=s0.payment==='deposit'?(s0.depositTotal||grandTotal):grandTotal;
    var html=buildInvoiceHTML({invoiceNum:invNum,custName:s0.printName||s0.custName,custAddr:s0.custAddr||'',day:day,month:mon,year:yr,rows:rows+emptyRows,itemCount:invSales.length,subtotalAll:subtotalAll,invoiceDiscAmt:invoiceDiscAmt>0.01?invoiceDiscAmt:0,grandTotal:_reprintTotal,payment:s0.payment,payMode:s0.payMode,depTopupMode:s0.depTopupMode||null,depositApplied:depApplied||0,bankId:s0.bankId,posId:s0.posId,splitPayment:s0.splitPayment||null,seller:s0.seller,pendingSupply:s0.pendingSupply||false,wasEverPending:s0.wasEverPending||false,supplyDate:s0.supplyDate||null,
      partPayment:partPaid,
      outstandingBal:withOutstanding?outstandingBal:0,prevInvTotal:withOutstanding&&prevInvTotal>0?prevInvTotal:0,showInvLine:withOutstanding&&invNet>0});
    var w=window.open('','_blank','width=600,height=850');
    w.document.write(html);
    w.document.close();
    // Wait for QR image to load before printing
    var _printed=false;
    function _doPrint(){if(!_printed){_printed=true;w.print();}}
    w.onload=function(){setTimeout(_doPrint,400);};
    setTimeout(_doPrint,2500);
  }
  if(outstandingBal>0){
    showPrintChoiceModal(cust?cust.name:(s0.printName||s0.custName||'Customer'),outstandingBal,prevInvTotal,grandTotal,
      function(){doPrint(true);},function(){doPrint(false);});
  } else {
    doPrint(false);
  }
}


// PURCHASES
var purchaseItems=[];
function onPurchaseItemSelect(){
  var sel=document.getElementById('pi-select');
  var nameWrap=document.getElementById('pi-name-wrap');
  var nameInput=document.getElementById('pi-name');
  var costInput=document.getElementById('pi-cost');
  if(!sel)return;
  if(sel.value==='__new__'){
    if(nameWrap)nameWrap.style.display='block';
    if(nameInput)nameInput.value='';
    if(costInput)costInput.value='';
  } else if(sel.value===''){
    if(nameWrap)nameWrap.style.display='none';
    if(costInput)costInput.value='';
  } else {
    // existing item selected  -  auto-fill cost
    if(nameWrap)nameWrap.style.display='none';
    var item=DB.inventory.find(function(i){return i.id==sel.value;});
    if(item&&costInput)costInput.value=item.cost;
  }
}

function addPurchaseItem(){
  var sel=document.getElementById('pi-select');
  var qtyOrdered=parseInt(document.getElementById('pi-qty-ordered').value)||0;
  var qtyReceived=parseInt(document.getElementById('pi-qty-received').value)||0;
  var cost=parseFloat(document.getElementById('pi-cost').value)||0;
  if(!sel){alert('Item selector not found.');return;}
  var itemId=null,name='',sell=0,cat='';
  if(sel.value==='__new__'){
    name=document.getElementById('pi-name')?document.getElementById('pi-name').value.trim():'';
    if(!name){alert('Enter a name for the new item.');return;}
    sell=parseFloat(document.getElementById('pi-sell')?document.getElementById('pi-sell').value:0)||0;
    if(sell<=0){alert('Enter a selling price for the new item.');return;}
    if(sell<cost){alert('Selling price ('+fmt(sell)+') cannot be less than cost price ('+fmt(cost)+').');return;}
    var catSel=document.getElementById('pi-cat');
    var catNew=document.getElementById('pi-cat-new');
    cat=catSel?catSel.value==='__new__'?(catNew?catNew.value.trim():''):catSel.value:'';
    if(catSel&&catSel.value==='__new__'&&cat&&!DB.categories.includes(cat))DB.categories.push(cat);
  } else if(sel.value===''){
    alert('Please select an existing item or choose "Create new item".');return;
  } else {
    itemId=sel.value;
    var item=DB.inventory.find(function(i){return i.id==itemId;});
    if(!item){alert('Item not found.');return;}
    name=item.name;
    sell=item.sell||0;
    cat=item.cat||'';
  }
  if(qtyOrdered<=0){alert('Enter the quantity ordered (on the invoice).');return;}
  if(qtyReceived<0||qtyReceived>qtyOrdered){alert('Qty received cannot be more than qty ordered ('+qtyOrdered+').');return;}
  if(cost<=0){alert('❌ Cost price is required.');return;}
  var qtyPending=qtyOrdered-qtyReceived;
  purchaseItems.push({
    lineId:uid(),itemId:itemId,name:name,
    qtyOrdered:qtyOrdered,
    qtyReceived:qtyReceived,
    qtyPending:qtyPending,
    qty:qtyReceived,
    cost:cost,
    sell:sell,
    cat:cat,
    total:qtyOrdered*cost,
    totalReceived:qtyReceived*cost,
    isNew:!itemId
  });
  // Reset form
  sel.value='';
  var ps=document.getElementById('pi-search');if(ps)ps.value='';
  document.getElementById('pi-qty-ordered').value='';
  document.getElementById('pi-qty-received').value='';
  document.getElementById('pi-cost').value='';
  var ni=document.getElementById('pi-name');if(ni)ni.value='';
  var nw=document.getElementById('pi-name-wrap');if(nw)nw.style.display='none';
  var piSell=document.getElementById('pi-sell');if(piSell)piSell.value='';
  var piCat=document.getElementById('pi-cat');if(piCat)piCat.value='';
  var piCatNew=document.getElementById('pi-cat-new');if(piCatNew)piCatNew.value='';
  var piCatNewWrap=document.getElementById('pi-cat-new-wrap');if(piCatNewWrap)piCatNewWrap.style.display='none';
  renderPurchaseItems();
}

function calcPurchaseDiscount(){
  var subtotal=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  var discType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var discVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;
  var el=document.getElementById('pu-totals-summary');if(!el)return;
  el.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--success)">Supplier discount</span><span style="color:var(--success)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Net total payable</span><span>'+fmt(finalTotal)+'</span></div>';
}
function submitPurchase(){
  if(!purchaseItems.length){alert('Add at least one item.');return;}
  var supId=document.getElementById('pu-supplier').value;
  var invNum=document.getElementById('pu-invnum').value.trim();
  var payType=document.getElementById('pu-paytype').value;
  var pm=document.getElementById('pu-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('pu-bankid')?document.getElementById('pu-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('pu-posid')?document.getElementById('pu-posid').value:''):null;
  var partAmt=parseFloat(document.getElementById('pu-part-amt')?document.getElementById('pu-part-amt').value:0)||0;
  if(!supId){alert('Supplier is required. Please select a supplier.');return;}
  if(!invNum){alert('Invoice number is required. Please enter the supplier\'s invoice number.');return;}
  if(pm==='transfer'&&DB.banks.length&&!bankId){alert('Select which bank the transfer was made to.');return;}
  if(pm==='pos'&&DB.posTerminals.length&&!posId){alert('Select which POS terminal was used.');return;}
  if(payType==='part'&&partAmt<=0){alert('Enter the amount paid now for part payment.');return;}
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  var subtotalPu=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  // Read purchase-level supplier discount
  var puDiscType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var puDiscVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var puDiscAmt=puDiscType==='pct'?(subtotalPu*puDiscVal/100):puDiscType==='flat'?Math.min(puDiscVal,subtotalPu):0;
  var grandTotal=subtotalPu-puDiscAmt;
  var puDateEl=document.getElementById('pu-date');
  var puDateVal=puDateEl?puDateEl.value:'';
  var date,month;
  if(puDateVal){var dp=puDateVal.split('-');var cd=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));date=cd.toLocaleDateString();month=puDateVal.slice(0,7);}
  else{date=new Date().toLocaleDateString();month=new Date().toISOString().slice(0,7);}
  var purchaseId=uid();
  var creditAmt=payType==='credit'?grandTotal:payType==='part'?(grandTotal-partAmt):0;
  var cashPaid=payType==='cash'?grandTotal:payType==='part'?partAmt:0;
  // Add RECEIVED qty to stock (not ordered qty)
  var belowCostWarnings=[];
  purchaseItems.forEach(function(l){
    var qtyToAdd=l.qtyReceived||l.qty||0; // use received qty
    if(qtyToAdd<=0)return; // nothing received yet for this line
    if(l.itemId){
      var existing=DB.inventory.find(function(i){return i.id==l.itemId;});
      if(existing){
        existing.qty+=qtyToAdd;existing.cost=l.cost;existing.supId=supId||existing.supId;
        if(existing.sell<l.cost){belowCostWarnings.push(existing.name+': sell price '+fmt(existing.sell)+' is now below new cost '+fmt(l.cost));}
      }
    } else {
      var byName=DB.inventory.find(function(i){return i.name.toLowerCase()===l.name.toLowerCase();});
      if(byName){byName.qty+=qtyToAdd;byName.cost=l.cost;if(byName.sell<l.cost)belowCostWarnings.push(byName.name+': sell price '+fmt(byName.sell)+' is now below new cost '+fmt(l.cost));}
      else{var newId=uid();DB.inventory.push({id:newId,name:l.name,qty:qtyToAdd,cost:l.cost,sell:l.sell||l.cost,minQty:5,supId:supId,cat:l.cat||''});l.itemId=newId;}
    }
  });

  // Record pending deliveries for items not fully supplied
  var pendingLines=purchaseItems.filter(function(l){return (l.qtyPending||0)>0;});
  if(pendingLines.length){
    if(!DB.pendingDeliveries)DB.pendingDeliveries=[];
    pendingLines.forEach(function(l){
      DB.pendingDeliveries.push({
        id:uid(),
        purchaseId:purchaseId,
        invoiceNum:invNum,
        supId:supId,
        supName:sup?sup.name:'Unknown',
        itemId:l.itemId||null,
        itemName:l.name,
        qtyOrdered:l.qtyOrdered,
        qtyReceived:l.qtyReceived,
        qtyPending:l.qtyPending,
        cost:l.cost,
        sell:l.sell||l.cost||0,
        cat:l.cat||'',
        dateOrdered:date,
        dateExpected:null,
        status:'pending', // 'pending' | 'partial' | 'complete'
        deliveries:[] // log of partial deliveries received
      });
    });
  }
  // Update supplier
  if(sup){
    sup.totalPurchased+=grandTotal;
    if(creditAmt>0)sup.owedToSupplier+=creditAmt;
    sup.purchases.push({id:purchaseId,desc:purchaseItems.length+' items',invoiceNum:invNum,amount:grandTotal,payment:payType,payMode:pm,bankId:bankId,posId:posId,date:date});
  }
  // ── Apply supplier deposit if available and checkbox ticked ──
  var depApplied=0;
  var useDepChk=document.getElementById('pu-use-deposit');
  if(useDepChk&&useDepChk.checked&&supId){
    var depBal=getSupDepositBalance(supId);
    if(depBal>0){
      depApplied=Math.min(depBal,grandTotal);
      applySupplierDepositToPurchase(supId,depApplied,purchaseId,invNum);
      // Record the applied deposit as cashflow in (offsets the purchase cost)
      DB.cashflow.push({id:uid(),desc:'Deposit applied — '+(sup?sup.name:'Supplier')+' Inv#'+invNum,amount:depApplied,type:'in',cat:'Supplier Deposit Applied',payMode:'deposit',date:date,month:month});
      // Reduce the amount owed to supplier by the deposit applied
      if(sup&&depApplied>0){
        sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-depApplied);
      }
    }
  }
  var netCashPaid=Math.max(0,cashPaid-depApplied);
  // Cashflow
  if(netCashPaid>0){
    DB.cashflow.push({id:uid(),desc:'Purchase from '+(sup?sup.name:'Supplier')+' Inv#'+invNum+(depApplied>0?' (deposit applied: '+fmt(depApplied)+')':''),amount:netCashPaid,type:'out',cat:'Restock',payMode:pm,bankId:bankId,posId:posId,date:date,month:month});
  }
  // Save purchase record
  DB.purchases.push({id:purchaseId,invoiceNum:invNum,supId:supId,supName:sup?sup.name:'Unknown',items:JSON.parse(JSON.stringify(purchaseItems)),subtotal:subtotalPu,discAmt:puDiscAmt,grandTotal:grandTotal,payType:payType,payMode:pm,bankId:bankId,posId:posId,partAmt:partAmt,creditAmt:creditAmt,cashPaid:cashPaid,depApplied:depApplied,date:date,month:month,by:DB.currentUser.name});
  purchaseItems=[];
  saveData();
  var totalReceived=purchaseItems.length; // already cleared so use pendingLines count
  var successMsg='✅ Purchase recorded! Stock updated.\nInvoice #'+invNum+' from '+(sup?sup.name:'supplier')+'.';
  if(depApplied>0){
    successMsg+='\n\n💰 DEPOSIT APPLIED: '+fmt(depApplied)+' deducted from '+sup.name+'\'s deposit balance.\nRemaining deposit: '+fmt(getSupDepositBalance(supId));
  }
  if(pendingLines.length){
    var pendingQty=pendingLines.reduce(function(a,l){return a+l.qtyPending;},0);
    successMsg+='\n\n📦 PENDING DELIVERY: '+pendingLines.length+' item line(s) with '+pendingQty+' unit(s) not yet received.\nThese have been added to the Pending Deliveries tracker. Go to Purchases → Pending Deliveries to record when the supplier brings the remaining items.';
  }
  if(belowCostWarnings.length){
    successMsg+='\n\n⚠️ SELLING PRICE ALERT — '+belowCostWarnings.length+' item(s) now have selling price below new cost:\n'+belowCostWarnings.join('\n')+'\n\nUpdate selling prices in Stock Management before selling.';
  }
  alert(successMsg);
  renderApp();
}
function deletePurchase(id){
  var p=DB.purchases.find(function(x){return x.id===id;});
  if(!p)return;
  showConfirm({
    type:'danger',
    title:'Delete purchase record?',
    msg:'This purchase will be moved to the Recycle Bin. Note: Stock already added to inventory is NOT reversed.',
    detail:'🛒 '+esc(p.supName)+' · Invoice #'+(p.invoiceNum||'-')+' · '+fmt(p.grandTotal),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('purchase',p,'Purchases');
    DB.purchases=DB.purchases.filter(function(x){return x.id!==id;});
    saveData();renderApp();
  });
}

function repairMissingInventory(){
  var missing=(DB.pendingDeliveries||[]).filter(function(d){
    if(d.qtyReceived<=0)return false;
    return !DB.inventory.find(function(i){return i.id==d.itemId;});
  });
  if(!missing.length){alert('No missing items found.');return;}
  var created=[];
  missing.forEach(function(d){
    // Double-check by name in case it exists with different id
    var byName=DB.inventory.find(function(i){return i.name.toLowerCase()===d.itemName.toLowerCase();});
    if(byName){
      // Item exists by name — just update the itemId reference and add qty
      if(!byName.qty)byName.qty=0;
      byName.qty+=d.qtyReceived;
      d.itemId=byName.id; // fix the reference
      created.push(d.itemName+' — added '+d.qtyReceived+' units to existing record');
    } else {
      // Truly new — create inventory item
      var newId=d.itemId||uid();
      var newItem={id:newId,name:d.itemName,qty:d.qtyReceived,
        cost:d.cost||0,sell:d.sell||d.cost||0,minQty:5,
        supId:d.supId||null,cat:d.cat||''};
      DB.inventory.push(newItem);
      d.itemId=newId;
      DB.adjLog.push({id:uid(),itemId:newId,itemName:d.itemName,type:'add',
        reason:'Repair: item created from completed delivery — Invoice #'+d.invoiceNum+' from '+d.supName,
        before:0,change:d.qtyReceived,after:d.qtyReceived,
        date:new Date().toLocaleDateString(),by:DB.currentUser.name});
      created.push(d.itemName+' — created with '+d.qtyReceived+' units');
    }
  });
  saveData();
  renderPanel();
  alert('✅ Repair complete!\n\n'+created.join('\n')+'\n\nCheck your inventory to confirm.');
}

function receiveAllDeliveries(invoiceNum){
  var pending=(DB.pendingDeliveries||[]).filter(function(d){return d.status!=='complete'&&(d.invoiceNum||d.id)==invoiceNum;});
  if(!pending.length){alert('No pending items for this invoice.');return;}
  var itemList=pending.map(function(d){return d.itemName+' × '+d.qtyPending;}).join('\n');
  if(!confirm('Receive ALL remaining items for Invoice #'+invoiceNum+'?\n\n'+itemList))return;
  var now=new Date();
  var date=now.toLocaleDateString();
  pending.forEach(function(d){
    var qtyToReceive=d.qtyPending;
    if(qtyToReceive<=0)return;
    var invItem=DB.inventory.find(function(i){return i.id==d.itemId;});
    if(invItem){
      var before=invItem.qty;
      invItem.qty+=qtyToReceive;
      DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'add',
        reason:'Full delivery received — Invoice #'+d.invoiceNum+' from '+d.supName,
        before:before,change:qtyToReceive,after:invItem.qty,date:date,by:DB.currentUser.name});
    } else {
      var newItem={id:d.itemId||uid(),name:d.itemName,qty:qtyToReceive,
        cost:d.cost||0,sell:d.sell||d.cost||0,minQty:5,supId:d.supId||null,cat:d.cat||''};
      DB.inventory.push(newItem);
      DB.adjLog.push({id:uid(),itemId:newItem.id,itemName:newItem.name,type:'add',
        reason:'New item created from delivery — Invoice #'+d.invoiceNum+' from '+d.supName,
        before:0,change:qtyToReceive,after:qtyToReceive,date:date,by:DB.currentUser.name});
    }
    d.qtyReceived=(d.qtyReceived||0)+qtyToReceive;
    d.qtyPending=0;
    d.lastReceivedDate=date;
    d.status='complete';
    d.completedDate=date;
    var purchase=DB.purchases.find(function(p){return p.id==d.purchaseId||p.invoiceNum==d.invoiceNum;});
    if(purchase){
      var pItem=purchase.items.find(function(l){return l.name===d.itemName||(l.itemId&&l.itemId==d.itemId);});
      if(pItem){pItem.qtyReceived=(pItem.qtyReceived||0)+qtyToReceive;pItem.qtyPending=0;}
    }
  });
  logActivity('Full delivery received','Invoice #'+invoiceNum+' — all items received from '+pending[0].supName,'purchase');
  saveData();renderPanel();
  showToast('✅ All items for Invoice #'+invoiceNum+' received and added to stock.');
}

function receiveDelivery(deliveryId){
  var d=DB.pendingDeliveries.find(function(x){return x.id==deliveryId;});
  if(!d){alert('Delivery record not found.');return;}

  var remaining=d.qtyPending;
  var qtyToReceive=parseInt(prompt(
    'Receive delivery for: '+esc(d.itemName)+
    '\nSupplier: '+esc(d.supName)+
    '\nPending qty: '+remaining+
    '\n\nHow many units are you receiving now?'
    ,remaining));

  if(isNaN(qtyToReceive)||qtyToReceive<=0){return;}
  if(qtyToReceive>remaining){
    alert('Cannot receive more than pending qty ('+remaining+').');return;
  }

  // Update inventory stock
  var invItem=DB.inventory.find(function(i){return i.id==d.itemId;});
  if(invItem){
    var before=invItem.qty;
    invItem.qty+=qtyToReceive;
    DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,
      type:'add',reason:'Pending delivery received — Invoice #'+d.invoiceNum+' from '+d.supName,
      before:before,change:qtyToReceive,after:invItem.qty,
      date:new Date().toLocaleDateString(),by:DB.currentUser.name});
  } else {
    // Item not in inventory yet — create it from pending delivery data
    var newItem={id:d.itemId||uid(),name:d.itemName,qty:qtyToReceive,
      cost:d.cost||0,sell:d.sell||d.cost||0,minQty:5,
      supId:d.supId||null,cat:d.cat||''};
    DB.inventory.push(newItem);
    DB.adjLog.push({id:uid(),itemId:newItem.id,itemName:newItem.name,
      type:'add',reason:'New item created from pending delivery — Invoice #'+d.invoiceNum+' from '+d.supName,
      before:0,change:qtyToReceive,after:qtyToReceive,
      date:new Date().toLocaleDateString(),by:DB.currentUser.name});
    showToast('📦 New inventory item created: '+d.itemName);
  }

  // Update delivery record
  d.qtyReceived=(d.qtyReceived||0)+qtyToReceive;
  d.qtyPending=d.qtyOrdered-d.qtyReceived;
  d.lastReceivedDate=new Date().toLocaleDateString();
  if(d.qtyPending<=0){
    d.status='complete';
    d.completedDate=new Date().toLocaleDateString();
  }

  // Update original purchase item received qty
  var purchase=DB.purchases.find(function(p){return p.id==d.purchaseId||p.invoiceNum==d.invoiceNum;});
  if(purchase){
    var pItem=purchase.items.find(function(l){return l.name===d.itemName||(l.itemId&&l.itemId==d.itemId);});
    if(pItem){
      pItem.qtyReceived=(pItem.qtyReceived||0)+qtyToReceive;
      pItem.qtyPending=pItem.qtyOrdered-pItem.qtyReceived;
    }
  }

  logActivity('Delivery received',
    d.itemName+' × '+qtyToReceive+' received from '+esc(d.supName)+' — Invoice #'+d.invoiceNum+
    (d.qtyPending<=0?' (Fully delivered)':' ('+d.qtyPending+' still pending)'),
    'purchase');

  saveData();
  renderPanel();
  showToast('✅ '+qtyToReceive+' units of '+d.itemName+' added to stock.'+(d.qtyPending<=0?' Delivery complete!':' '+d.qtyPending+' still pending.'));
}

function buildPurchases(){
  if(!canDo('purchases'))return '<div class="empty">Access denied.</div>';

  // ── Purchase KPI date filter ──────────────────────────────────
  var puFilter=window._puKpiFilter||'month';
  var today=new Date();
  var todayStr=today.toLocaleDateString();
  function puInRange(dateStr){
    if(!dateStr)return false;
    var d=parseDate(dateStr);
    if(!d)return false;
    if(puFilter==='today'){
      return d.toDateString()===today.toDateString();
    } else if(puFilter==='week'){
      var wStart=new Date(today);wStart.setDate(today.getDate()-today.getDay());wStart.setHours(0,0,0,0);
      return d>=wStart&&d<=today;
    } else if(puFilter==='month'){
      return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
    } else if(puFilter==='custom'){
      var cf=window._puKpiFrom?parseDate(window._puKpiFrom):null;
      var ct=window._puKpiTo?parseDate(window._puKpiTo):null;
      if(cf)cf.setHours(0,0,0,0);
      if(ct)ct.setHours(23,59,59,999);
      return (!cf||d>=cf)&&(!ct||d<=ct);
    }
    return true;
  }

  // ── Calculate KPIs ───────────────────────────────────────────
  var filtPurch=DB.purchases.filter(function(p){return puInRange(p.date);});
  var totalPurchAmt=filtPurch.reduce(function(a,p){return a+(p.grandTotal||0);},0);
  // Total paid = purchases minus credit owed to suppliers
  var totalCreditOwed=filtPurch.filter(function(p){return p.payType==='credit';}).reduce(function(a,p){return a+(p.grandTotal||0);},0);
  var totalPartPaid=filtPurch.filter(function(p){return p.payType==='part';}).reduce(function(a,p){return a+(p.amtPaid||0);},0);
  var totalPaid=totalPurchAmt-totalCreditOwed+(totalPartPaid-(filtPurch.filter(function(p){return p.payType==='part';}).reduce(function(a,p){return a+(p.grandTotal||0);},0)-totalPartPaid>0?0:0));
  // Simpler: paid = non-credit total + part-paid amounts
  var fullyPaidPurch=filtPurch.filter(function(p){return p.payType==='cash';});
  var creditPurch=filtPurch.filter(function(p){return p.payType==='credit';});
  var partPurch=filtPurch.filter(function(p){return p.payType==='part';});
  var paidAmt=fullyPaidPurch.reduce(function(a,p){return a+(p.grandTotal||0);},0)
    +partPurch.reduce(function(a,p){return a+(p.amtPaid||p.grandTotal||0);},0);
  var outstandingAmt=totalPurchAmt-paidAmt;
  // Pending goods value
  var pendingGoodsVal=(DB.pendingDeliveries||[]).filter(function(d){
    return d.status!=='complete';
  }).reduce(function(a,d){return a+(d.qtyPending||0)*(d.cost||d.unitCost||0);},0);
  var pendingCount=(DB.pendingDeliveries||[]).filter(function(d){return d.status!=='complete';}).length;
  var supplierCount=new Set(filtPurch.map(function(p){return p.supId;})).size;

  // ── KPI HTML ─────────────────────────────────────────────────
  var filterLabel=puFilter==='today'?'Today':puFilter==='week'?'This Week':puFilter==='month'?'This Month':'Custom Range';
  var kpiHtml=
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<div style="font-size:13px;font-weight:700;color:var(--text1)">&#128722; Purchase Overview</div>'+
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
          ['today','week','month','custom'].map(function(f){
            return '<button onclick="window._puKpiFilter=\''+f+'\';renderPanel()" style="padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid '+(puFilter===f?'#1a237e':'#cbd5e1')+';background:'+(puFilter===f?'#1a237e':'transparent')+';color:'+(puFilter===f?'#fff':'var(--text2)')+'">'+
              (f==='today'?'Today':f==='week'?'This Week':f==='month'?'This Month':'Custom')+
            '</button>';
          }).join('')+
        '</div>'+
      '</div>'+
      // Custom date range row
      (puFilter==='custom'?
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">'+
          '<span style="font-size:11px;color:var(--text2)">From:</span>'+
          '<input type="date" value="'+(window._puKpiFrom||'')+'" onchange="window._puKpiFrom=this.value;renderPanel()" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px">'+
          '<span style="font-size:11px;color:var(--text2)">To:</span>'+
          '<input type="date" value="'+(window._puKpiTo||'')+'" onchange="window._puKpiTo=this.value;renderPanel()" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px">'+
        '</div>'

      // KPI grid
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">'+
        // Row 1: Financial KPIs
        kpiCard('Total Purchases','₦'+Math.round(totalPurchAmt).toLocaleString(),filtPurch.length+' invoices','#1a237e')+
        kpiCard('Total Paid','₦'+Math.round(paidAmt).toLocaleString(),fullyPaidPurch.length+' fully paid','#15803d')+
        kpiCard('Outstanding','₦'+Math.round(DB.suppliers.reduce(function(a,s){return a+(s.owedToSupplier||0);},0)).toLocaleString(),creditPurch.length+' credit + '+partPurch.length+' part','#dc2626')+
        kpiCard('Pending Goods','₦'+Math.round(pendingGoodsVal).toLocaleString(),pendingCount+' pending items','#f59e0b')+
        kpiCard('Suppliers',''+supplierCount,'Active this period','#0891b2')+
        kpiCard('Credit Purchases','₦'+Math.round(totalCreditOwed).toLocaleString(),creditPurch.length+' invoices','#7c3aed')+
      '</div>'+
    '</div>';

  function kpiCard(label,value,sub,color){
    return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px">'+
      '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">'+label+'</div>'+
      '<div style="font-size:18px;font-weight:800;color:'+color+';margin-bottom:2px">'+value+'</div>'+

    '</div>';
  }

  var supOpts=DB.suppliers.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join('');
  var bankSubField=DB.banks.length?'<div class="form-group" id="pu-bank-wrap" style="display:none"><label>Which bank? <span style="color:var(--danger)">*</span></label><select id="pu-bankid"><option value="">Select bank...</option>'+bankOpts()+'</select></div>':'';
  var posSubField=DB.posTerminals.length?'<div class="form-group" id="pu-pos-wrap" style="display:none"><label>Which POS terminal? <span style="color:var(--danger)">*</span></label><select id="pu-posid"><option value="">Select terminal...</option>'+posOpts()+'</select></div>':'';
  var _allPuRows=DB.purchases.slice().reverse().filter(function(p){
    if(!purchaseSearch)return true;
    var t=purchaseSearch.toLowerCase();
    return (p.invoiceNum||'').toLowerCase().indexOf(t)>-1||(p.supName||'').toLowerCase().indexOf(t)>-1||(p.items||[]).some(function(l){return l.name.toLowerCase().indexOf(t)>-1;});

      '<td style="font-size:11px">'+p.items.map(function(l){return l.name+' x'+(l.qtyReceived||l.qty);}).join(', ')+'</td>'+

      '<td><div style="display:flex;gap:4px;flex-wrap:wrap">'+

    '</tr>';

  var _purchPage=window._purchPage||0;
  if(_purchPage>0&&_allPuRows.length<=_purchPage*PAGE_SIZE){_purchPage=0;window._purchPage=0;}
  var puRows=pgSlice(_allPuRows,_purchPage).join('');
  var _purchPager=pgBar(_purchPage,_allPuRows.length,'_purchPage');

  // Pending deliveries section — grouped by invoice like Sales pending supply
  // Check for completed deliveries where inventory item is missing (repair section)
  var missingInv=(DB.pendingDeliveries||[]).filter(function(d){
    if(d.qtyReceived<=0)return false;
    var invItem=DB.inventory.find(function(i){return i.id==d.itemId;});

            '<div style="font-weight:500">'+esc(d.itemName)+'</div>'+

            '<div style="text-align:center;color:#dc2626;font-weight:700">'+d.qtyPending+'</div>'+

            '<div>Item</div><div style="text-align:center">Ordered</div><div style="text-align:center">Received</div><div style="text-align:center">Pending</div><div>Progress</div><div></div>'+
          '</div>'+
          itemRows+
        '</div>';
      }).join('');
      pendingRows='<p class="sec-title" style="margin-top:1.5rem;color:var(--warning-text)">📦 Pending Deliveries ('+openPending.length+' items · '+Object.keys(pendingGroups).length+' invoices)</p>'+groupHtml;
    }
  }

  return kpiHtml+repairSection+'<p class="sec-title">Record new purchase</p>'+
    '<div class="fg" style="grid-template-columns:1fr 1fr 1fr"><div class="form-group"><label>Supplier <span style="color:var(--danger)">*</span></label>'+
    '<div style="position:relative">'+
      '<input type="text" id="pu-sup-search" autocomplete="off" placeholder="Type to search supplier..." oninput="filterSupDd(this.value)" onfocus="filterSupDd(this.value,true)" onblur="setTimeout(function(){var d=document.getElementById(\'pu-sup-dd\');if(d)d.style.display=\'none\';},200)" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;box-sizing:border-box">'+
      '<input type="hidden" id="pu-supplier" value="">'+
      '<div id="pu-sup-dd" style="display:none;position:absolute;left:0;right:0;top:100%;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9999;max-height:200px;overflow-y:auto;margin-top:2px"></div>'+
    '</div></div>'+

function processPurchaseReturn(purchId){
  var pu=DB.purchases.find(function(p){return p.id==purchId;});
  if(!pu){alert('Purchase not found.');return;}
  var reason=(document.getElementById('pur-reason')||{}).value||'';
  if(!reason.trim()){alert('Please enter a reason for the return.');return;}
  var returnType=document.getElementById('pur-type').value;
  var dateVal=document.getElementById('pur-date').value;
  var date=dateVal?new Date(dateVal).toLocaleDateString():new Date().toLocaleDateString();
  var month=dateVal?dateVal.slice(0,7):new Date().toISOString().slice(0,7);

  // Collect returned items
  var returnedItems=[];
  var totalValue=0;
  pu.items.forEach(function(l,i){
    var qtyInp=document.getElementById('pur-qty-'+i);
    if(!qtyInp)return;
    var qty=parseInt(qtyInp.value)||0;
    if(qty<=0)return;
    var cost=l.cost||0;
    returnedItems.push({name:l.name,qty:qty,cost:cost,total:qty*cost,itemId:l.itemId||null});
    totalValue+=qty*cost;
  });

  if(!returnedItems.length){alert('Select at least one item to return.');return;}

  // Exchange details
  var exchStatus='';
  var exchDesc='';
  if(returnType==='exchange'){
    var exchRadio=document.querySelector('input[name="pur-exch-status"]:checked');
    exchStatus=exchRadio?exchRadio.value:'pending';
    exchDesc=(document.getElementById('pur-exch-desc')||{}).value||'';
  }

  // Deduct returned stock from inventory
  returnedItems.forEach(function(ri){
    var invItem=ri.itemId?DB.inventory.find(function(i){return i.id==ri.itemId;}):
      DB.inventory.find(function(i){return i.name===ri.name;});
    if(invItem){
      var before=invItem.qty;
      invItem.qty=Math.max(0,invItem.qty-ri.qty);
      DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'remove',
        reason:'Purchase return to '+pu.supName+' — '+reason,
        before:before,change:-ri.qty,after:invItem.qty,date:date,by:DB.currentUser.name});
    }
  });

  // Handle supplier account
  var sup=DB.suppliers.find(function(s){return s.id==pu.supId;});
  if(sup){
    if(returnType==='credit'){
      // Reduce what we owe the supplier
      sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-totalValue);
      DB.cashflow.push({id:uid(),desc:'Purchase return credit — '+sup.name+' Invoice #'+(pu.invoiceNum||'-'),
        amount:totalValue,type:'in',cat:'Purchase Return',payMode:'credit',date:date,month:month});
    } else if(returnType==='refund'){
      // Supplier refunds us
      sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-totalValue);
      DB.cashflow.push({id:uid(),desc:'Purchase return refund — '+sup.name+' Invoice #'+(pu.invoiceNum||'-'),
        amount:totalValue,type:'in',cat:'Purchase Return',payMode:'cash',date:date,month:month});
    }
    // Exchange: no immediate credit — goods to be received
  }

  // Save return record
  if(!DB.purchaseReturns)DB.purchaseReturns=[];
  DB.purchaseReturns.push({
    id:uid(),purchaseId:purchId,purchaseInvoice:pu.invoiceNum,
    supId:pu.supId,supName:pu.supName,
    items:returnedItems,totalValue:totalValue,
    returnType:returnType,reason:reason,
    exchangeStatus:returnType==='exchange'?exchStatus:null,
    exchangeDesc:returnType==='exchange'?exchDesc:null,
    date:date,month:month,by:DB.currentUser.name
  });

  logActivity('Purchase return',
    'Returned '+returnedItems.map(function(r){return r.name+' x'+r.qty;}).join(', ')+
    ' to '+pu.supName+' ('+returnType+'). Value: '+fmt(totalValue),returnType);

  document.getElementById('pu-ret-modal').remove();
  saveData();renderApp();
  var typeLabel=returnType==='credit'?'Supplier credit applied':
    returnType==='refund'?'Refund recorded':
    exchStatus==='received'?'Exchange received':'Exchange pending';
  showToast('Return processed — '+typeLabel+'. Value: '+fmt(totalValue));
}

function markPurchReturnReceived(retId){
  var r=(DB.purchaseReturns||[]).find(function(x){return x.id===retId;});
  if(!r){alert('Return record not found.');return;}
  if(!confirm('Mark exchange goods as RECEIVED from '+r.supName+'?\n\nExpected: '+r.exchangeDesc))return;
  r.exchangeStatus='received';
  r.receivedDate=new Date().toLocaleDateString();
  logActivity('Exchange received','Replacement goods received from '+r.supName+' — Return of Invoice #'+r.purchaseInvoice,'exchange');
  saveData();renderApp();
  showToast('Exchange marked as received from '+r.supName);
}

function buildPurchaseReturnsSection(){
  if(!DB.purchaseReturns||!DB.purchaseReturns.length)return '';
  var rows=DB.purchaseReturns.slice().reverse().map(function(r){
    var typeBadge=r.returnType==='refund'?
      '<span class="badge ok">Refund</span>':
      r.returnType==='credit'?
      '<span class="badge" style="background:#7c3aed;color:#fff">Supplier Credit</span>':
      '<span class="badge info">Exchange</span>';
    var exchStatus='';
    if(r.returnType==='exchange'){
      exchStatus=r.exchangeStatus==='received'?
        '<span class="badge ok" style="font-size:10px">&#10003; Received</span>':
        '<span class="badge low" style="font-size:10px;cursor:pointer" onclick="markPurchReturnReceived(\''+r.id+'\')" title="Click to mark as received">Pending &#128466;</span>';
    }
    return '<tr style="background:#fff5f5">'+
      '<td>'+r.date+'</td>'+
      '<td><b>'+(r.purchaseInvoice||'-')+'</b></td>'+
      '<td>'+(r.supName||'-')+'</td>'+
      '<td style="font-size:11px">'+r.items.map(function(i){return i.name+' ×'+i.qty;}).join(', ')+'</td>'+
      '<td>'+typeBadge+'</td>'+
      '<td style="text-align:right;font-weight:700;color:#dc2626">'+fmt(r.totalValue)+'</td>'+
      '<td>'+(r.reason||'-')+'</td>'+
      '<td>'+exchStatus+'</td>'+
      '<td>'+esc(r.by)+'</td>'+
    '</tr>';
  }).join('');
  return '<p class="sec-title" style="margin-top:1.5rem;color:#dc2626">&#8617; Purchase Returns ('+DB.purchaseReturns.length+')</p>'+
    '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>Date</th><th>Invoice #</th><th>Supplier</th><th>Items</th><th>Type</th>'+
      '<th style="text-align:right">Value</th><th>Reason</th><th>Exchange Status</th><th>By</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

      (isAdmin()?'<div style="display:flex;align-items:center;gap:6px;margin-left:auto"><label style="font-size:12px;color:var(--text2)">Manage categories:</label><input type="text" id="ex-cat-new" placeholder="New category" style="width:160px;font-size:12px"><button class="btn sm" onclick="addExpenseCat()">+ Add</button></div>':'')+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
      '<p class="sec-title" style="margin:0">Expense history</p>'+
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
        '<input type="date" value="'+expFilterFrom+'" onchange="expFilterFrom=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">'+
        '<span style="font-size:12px;color:var(--text3)">to</span>'+
        '<input type="date" value="'+expFilterTo+'" onchange="expFilterTo=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">'+
        '<select onchange="expFilterCat=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)"><option value="">All categories</option>'+catOpts+'</select>'+
        '<button class="btn sm" onclick="expFilterFrom=\'\';expFilterTo=\'\';expFilterCat=\'\';renderPanel()">Clear</button>'+
      '</div>'+
    '</div>'+
    '<div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-bottom:1rem">'+mc('Total expenses',fmt(totalExp),'Filtered period','red')+mc('Transactions',filtered.length,'Records','')+'</div>'+
    (rows?'<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th>Mode</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No expenses found for this filter.</div>');
}
function addExpense(){
  var desc=document.getElementById('ex-desc').value.trim(),amt=parseFloat(document.getElementById('ex-amt').value)||0,cat=document.getElementById('ex-cat').value,pm=document.getElementById('ex-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('ex-bankid')?document.getElementById('ex-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('ex-posid')?document.getElementById('ex-posid').value:''):null;
  if(!desc){alert('Enter a description.');return;}if(amt<=0){alert('Enter a valid amount.');return;}
  var exDateEl=document.getElementById('ex-date');
  var exDateVal=exDateEl?exDateEl.value:'';
  var date,month;
  if(exDateVal){var dp=exDateVal.split('-');var cd=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));date=cd.toLocaleDateString();month=exDateVal.slice(0,7);}
  else{date=new Date().toLocaleDateString();month=new Date().toISOString().slice(0,7);}
  DB.cashflow.push({id:uid(),desc:desc,amount:amt,type:'out',cat:cat,payMode:pm,bankId:bankId,posId:posId,date:date,month:month});
  saveData();renderApp();
}

  ov.onclick=function(ev){if(ev.target===ov)ov.remove();};

    '<div style="background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3)">'+

      '</div>'+

      '<div class="form-group"><label>Amount (₦)</label><input type="number" id="ee-amt" value="'+e.amount+'" style="width:100%"></div>'+
      '<div class="form-group"><label>Category</label><select id="ee-cat" style="width:100%">'+catOpts+'</select></div>'+
      '<div class="form-group"><label>Payment Mode</label>'+
        '<select id="ee-mode" style="width:100%" onchange="(function(){var m=document.getElementById(\'ee-mode\').value;document.getElementById(\'ee-bank-row\').style.display=m===\'transfer\'?\'block\':\'none\';document.getElementById(\'ee-pos-row\').style.display=m===\'pos\'?\'block\':\'none\';})()">' +
          '<option value="cash"'+((!e.payMode||e.payMode==='cash')?' selected':'')+'>Cash</option>'+
          '<option value="transfer"'+(e.payMode==='transfer'?' selected':'')+'>Bank Transfer</option>'+
          '<option value="pos"'+(e.payMode==='pos'?' selected':'')+'>POS</option>'+
        '</select></div>'+
      '<div id="ee-bank-row" style="display:'+(e.payMode==='transfer'?'block':'none')+'" class="form-group"><label>Bank</label><select id="ee-bank" style="width:100%">'+bankOpts+'</select></div>'+
      '<div id="ee-pos-row" style="display:'+(e.payMode==='pos'?'block':'none')+'" class="form-group"><label>POS Terminal</label><select id="ee-pos" style="width:100%">'+posOpts+'</select></div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem">'+
        '<button onclick="document.getElementById(\'edit-expense-modal\').remove()" class="btn">Cancel</button>'+
        '<button onclick="saveEditedExpense(\''+id+'\')" class="btn primary">💾 Save changes</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
}

function saveEditedExpense(id){
  var e=DB.cashflow.find(function(c){return String(c.id)===String(id);});
  if(!e)return;
  var desc=document.getElementById('ee-desc').value.trim();
  var amt=parseFloat(document.getElementById('ee-amt').value)||0;
  var cat=document.getElementById('ee-cat').value;
  var mode=document.getElementById('ee-mode').value;
  var bankId=mode==='transfer'?(document.getElementById('ee-bank')||{}).value||null:null;
  var posId=mode==='pos'?(document.getElementById('ee-pos')||{}).value||null:null;
  if(!desc){alert('Enter a description.');return;}
  if(amt<=0){alert('Enter a valid amount.');return;}
  e.desc=desc;e.amount=amt;e.cat=cat;e.payMode=mode;e.bankId=bankId;e.posId=posId;
  logActivity('Expense edited',desc+' — '+fmt(amt)+' ('+cat+' via '+mode+')','');
  saveData();
  document.getElementById('edit-expense-modal').remove();
  renderApp();
  showToast('✅ Expense updated.');
}

function deleteExpense(id){
  var e=DB.cashflow.find(function(c){return String(c.id)===String(id);});
  if(!e)return;
  showConfirm({
    type:'danger',
    title:'Delete expense?',
    msg:'The expense will be moved to the Recycle Bin.',
    detail:'💸 '+e.desc+' — '+fmt(e.amount)+' ('+e.cat+')',
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('expense',e,'Expenses');
    DB.cashflow=DB.cashflow.filter(function(c){return String(c.id)!==String(id);});
    saveData();renderApp();
  });
}
function addExpenseCat(){var inp=document.getElementById('ex-cat-new');if(!inp)return;var v=inp.value.trim();if(!v)return;if(DB.expenseCats.indexOf(v)>-1){alert('Category already exists.');return;}DB.expenseCats.push(v);inp.value='';saveData();renderApp();}

function buildFinance(){
  if(!canDo('finance'))return '<div class="empty">Access denied.</div>';
  var now=new Date(),curMonth=now.toISOString().slice(0,7);
  var finFilter=window._finFilter||'month';
  var finMonth=window._finMonth||curMonth;
  var finFrom=window._finFrom||'';
  var finTo=window._finTo||'';

  // ── Apply date filter to a record given its stored date string ──
  function inRange(dateStr, monthStr) {
    if(finFilter==='today')  return dateStr===now.toLocaleDateString();
    if(finFilter==='month')  return (monthStr||'')===finMonth;
    if(finFilter==='range'){
      if(!finFrom&&!finTo) return true;
      return dateInRange(dateStr, finFrom, finTo);
    }
    return true; // 'all'
  }

  var salesF  = DB.sales.filter(function(s){ return inRange(s.date, s.month); });
  var expF    = DB.cashflow.filter(function(c){ return c.type==='out'&&c.cat!=='Restock'&&c.cat!=='Supplier Payment'&&c.cat!=='Supplier Deposit'&&inRange(c.date,c.month); });
  // Use DB.purchases grandTotal directly — includes paid, credit, part-payment, pending supply
  var purchF  = (DB.purchases||[]).filter(function(p){
    if(finFilter==='today') return p.date===now.toLocaleDateString();
    if(finFilter==='month'){
      if((p.month||'')=== finMonth) return true;
      var pd=parseDate(p.date);
      return pd&&(pd.getFullYear()+'-'+String(pd.getMonth()+1).padStart(2,'0'))===finMonth;
    }
    if(finFilter==='range'){
      if(!finFrom&&!finTo) return true;
      return dateInRange(p.date,finFrom,finTo);
    }
    return true; // 'all'
  });

  var rev           = salesF.reduce(function(a,s){return a+s.total;},0);
  var profit        = salesF.reduce(function(a,s){return a+s.profit;},0);
  // Group by invoice to get accurate credit/part-payment outstanding
  var invMap={};
  salesF.forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!invMap[k])invMap[k]={total:0,payment:s.payment,partPayment:s.partPayment||0,depositApplied:s.depositApplied||0};
    invMap[k].total+=s.total;
  });
  var creditOwed=Object.values(invMap).reduce(function(a,inv){
    if(inv.payment==='credit')return a+Math.max(0,inv.total-(inv.depositApplied||0));
    if(inv.payment==='part')return a+Math.max(0,inv.total-(inv.partPayment||0)-(inv.depositApplied||0));
    return a;
  },0);
  var pendingSupplyTotal = salesF.filter(function(s){return s.pendingSupply;}).reduce(function(a,s){return a+s.total;},0);
  // Use actual cashflow income (captures part-payment overpayments correctly)
  var cashflowInF   = DB.cashflow.filter(function(c){return c.type==='in'&&c.cat==='Sales'&&!c.isDepositApplied&&!c.isExchange&&inRange(c.date,c.month);});
  var cashIn        = cashflowInF.reduce(function(a,c){return a+c.amount;},0);
  var expTotal      = expF.reduce(function(a,c){return a+c.amount;},0);
  var purchTotal    = purchF.reduce(function(a,p){return a+(p.grandTotal||0);},0);
  var depAppliedF   = DB.cashflow.filter(function(c){return c.isDepositApplied&&c.type==='in'&&inRange(c.date,c.month);});
  var depAppliedTotal = depAppliedF.reduce(function(a,c){return a+c.amount;},0);
  var collectedAmt=Object.values(invMap).reduce(function(a,inv){
    if(inv.payment==='credit')return a;
    if(inv.payment==='part')return a+(inv.partPayment||0);
    return a+inv.total;
  },0);
  var netCash       = cashIn-expTotal;
  var netProfit     = profit-expTotal;  // Gross Profit minus Operating Expenses
  var discTotal     = salesF.reduce(function(a,s){return a+(s.discAmt||0);},0);

  // Month selector options (last 24 months)
  var monthOpts='';
  for(var i=0;i<24;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var mv=d.toISOString().slice(0,7);
    monthOpts+='<option value="'+mv+'"'+(mv===finMonth?' selected':'')+'>'+d.toLocaleString('default',{month:'long',year:'numeric'})+'</option>';
  }

  // Active style helper
  function btnStyle(f){ return finFilter===f?'background:var(--primary);color:#fff;border-color:var(--primary)':''; }

  // Build period label for display
  var periodLabel = finFilter==='today' ? 'Today ('+now.toLocaleDateString()+')' :
                    finFilter==='month' ? (function(){ var d=new Date(finMonth+'-02'); return d.toLocaleString('default',{month:'long',year:'numeric'}); })() :
                    finFilter==='range' && (finFrom||finTo) ? (finFrom||'start')+' → '+(finTo||'today') :
                    'All time';

  var filterBar =
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.875rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)">'+
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:'+(finFilter==='month'||finFilter==='range'?'10px':'0')+'">'+
        '<span style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:4px">Period:</span>'+
        '<button class="btn sm" onclick="window._finFilter=\'today\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('today')+'">Today</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'month\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('month')+'">Month</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'all\';window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="'+btnStyle('all')+'">All time</button>'+
        '<button class="btn sm" onclick="window._finFilter=\'range\';renderPanel()" style="'+btnStyle('range')+'">📅 Custom range</button>'+
        (finFilter==='month'?
          '<select onchange="window._finMonth=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">'+monthOpts+'</select>'
        :'')+
      '</div>'+
      (finFilter==='range'?
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">'+
          '<span style="font-size:12px;color:var(--text2);font-weight:600">From:</span>'+
          '<input type="date" value="'+finFrom+'" onchange="window._finFrom=this.value;renderPanel()" style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border)">'+
          '<span style="font-size:12px;color:var(--text2);font-weight:600">To:</span>'+
          '<input type="date" value="'+finTo+'" onchange="window._finTo=this.value;renderPanel()" style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border)">'+
          ((finFrom||finTo)?'<button class="btn sm" onclick="window._finFrom=\'\';window._finTo=\'\';renderPanel()" style="color:var(--danger);border-color:#f5c2c7">✕ Clear</button>':'')+
        '</div>'
      :'')+
      '<div style="margin-top:'+(finFilter==='month'||finFilter==='range'?'8':'4')+'px;font-size:11.5px;color:var(--text3)">'+
        '📊 Showing: <b style="color:var(--dark)">'+periodLabel+'</b> &nbsp;·&nbsp; '+salesF.length+' sale(s) &nbsp;·&nbsp; '+expF.length+' expense(s)'+
      '</div>'+
    '</div>';

  var explainerBox=
    '<div style="background:var(--primary-bg);border:1px solid #93c5fd;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--text2)">'+
      '<div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:13px">📘 How to read this dashboard</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px">'+
        '<div>💰 <b>Revenue</b> — total of all invoices raised</div>'+
        '<div>📦 <b>Gross Profit</b> — Revenue minus what the goods cost you</div>'+
        '<div>✅ <b>Cash Received</b> — what customers actually paid (no credit)</div>'+
        '<div>⏳ <b>Credit Owed</b> — invoices not yet paid by customers</div>'+
        '<div>💸 <b>Expenses</b> — running costs (transport, food, etc)</div>'+
        '<div>🛒 <b>Restocking</b> — money spent buying new stock (shown separately)</div>'+
        '<div>🏦 <b>Net Cash</b> — all money received minus expenses (can exceed revenue if old debts were collected)</div>'+
        '<div>📈 <b>Net Profit</b> — Gross Profit minus Expenses (true profit before restocking)</div>'+
      '</div>'+
    '</div>';

  return filterBar+explainerBox+
  '<div class="metrics">'+
    mc('Revenue',fmt(rev),'All sales this period — invoiced total','')+
    mc('Gross profit',fmt(profit),pct(profit,rev)+' margin — Revenue minus cost of goods',profit>=0?'green':'red')+
    mc('Cash received',fmt(collectedAmt),'Money actually collected (paid invoices only)','')+
    mc('Credit owed',fmt(creditOwed),'Customers have not paid yet','amber')+
    mc('Expenses',fmt(expTotal),'Operating costs paid this period','red')+
    mc('Restocking',fmt(purchTotal),'Stock purchased — separate from expenses','red')+
    mc('Net cash',fmt(netCash),(netCash>rev?'⚠ Higher than revenue — includes old debts collected':'Cashflow in (incl. old debts collected) minus expenses'),netCash>=0?'green':'red')+
    mc('Net profit',fmt(netProfit),pct(netProfit,rev)+' margin — Gross profit minus expenses',netProfit>=0?'green':'red')+
    '</div>'+
    // Reconciliation row - use payment breakdown which always equals revenue
    (function(){
      var cashPay=collectedAmt;
      var total=cashPay+creditOwed;
      var diff=Math.abs(rev-total);
      return '<div style="background:var(--surface2);border-radius:8px;padding:8px 14px;margin-bottom:1rem;font-size:12px;color:var(--text2)">'+
        '📊 <b>Revenue reconciliation:</b> '+
        fmt(cashPay)+' collected + '+fmt(creditOwed)+' owed'+
        (depAppliedTotal>0?' + '+fmt(depAppliedTotal)+' deposits':'')+ 
        ' = <b>'+fmt(total)+'</b>'+
        (diff>1?' <span style="color:var(--warning)">⚠ Δ'+fmt(diff)+'</span>':' <span style="color:#15803d;font-weight:700">✅ Balanced</span>')+
      '</div>';
    }())+
    '<div class="metrics">'+
    mc('Discounts given',fmt(discTotal),'Total given','amber')+
  '</div>'+
  (pendingSupplyTotal>0?'<div style="background:var(--warning-bg);border:1px solid #ffe69c;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#664d03"><b>⏳ Goods not yet supplied:</b> '+fmt(pendingSupplyTotal)+' — payment received but stock not yet deducted</div>':'')+
  // ── 7-day Revenue & Profit Chart setup (no output) ───────
  (function(){
    var days=[];
    for(var di=6;di>=0;di--){
      var dd=new Date();dd.setDate(dd.getDate()-di);
      var dstr=dd.toLocaleDateString();
      var dlbl=dd.toLocaleDateString('default',{weekday:'short'});
      var dRev=0,dProfit=0;
      DB.sales.forEach(function(s){if(s.date===dstr){dRev+=s.total;dProfit+=s.profit;}});
      days.push({lbl:dlbl,rev:dRev,profit:dProfit});
    }
    var maxD=days.reduce(function(m,d){return Math.max(m,d.rev,d.profit);},1);
    window._finChartDays=days;
    window._finChartMax=maxD;
    return '';  // prevent undefined in string concatenation
  })()+
  '<div class="sec-title">Revenue &amp; Profit — Last 7 Days</div>'+
  '<div style="display:flex;gap:6px;align-items:flex-end;height:120px;padding:0 4px 0">'+
  window._finChartDays.map(function(d){
    var revH=window._finChartMax>0?Math.max(2,Math.round((d.rev/window._finChartMax)*100)):2;
    var proH=window._finChartMax>0?Math.max(d.profit>0?2:0,Math.round((d.profit/window._finChartMax)*100)):0;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%">'+
      '<div style="flex:1;display:flex;align-items:flex-end;gap:2px;width:100%">'+
        '<div title="Revenue: '+fmt(d.rev)+'" style="flex:1;background:#c0392b;border-radius:3px 3px 0 0;height:'+revH+'%;min-height:'+(d.rev>0?'3px':'0')+';transition:height .4s;cursor:pointer"></div>'+
        '<div title="Profit: '+fmt(d.profit)+'" style="flex:1;background:#16a34a;border-radius:3px 3px 0 0;height:'+proH+'%;min-height:'+(d.profit>0?'3px':'0')+';transition:height .4s;cursor:pointer"></div>'+
      '</div>'+
      '<div style="font-size:9px;color:var(--text3);margin-top:3px">'+d.lbl+'</div>'+
    '</div>';
  }).join('')+
  '</div>'+
  '<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;padding-left:4px">'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:#c0392b;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Revenue</span>'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Profit</span>'+
    '<span style="margin-left:auto;font-size:10px;color:var(--text3)">Hover bars for amounts</span>'+
  '</div>'+
  '</div>'+

  '<p class="sec-title">Payment breakdown</p>'+
  (function(){
    var cashTotal=0,posTotal=0,transferTotal=0;
    salesF.forEach(function(s){
      if(s.payMode==='split'&&s.splitPayment){
        var sp=s.splitPayment;
        var ratio=s.total/(sp.amt1+sp.amt2)||1;
        if(sp.mode1==='cash')cashTotal+=sp.amt1*ratio;
        else if(sp.mode1==='pos')posTotal+=sp.amt1*ratio;
        else if(sp.mode1==='transfer')transferTotal+=sp.amt1*ratio;
        if(sp.mode2==='cash')cashTotal+=sp.amt2*ratio;
        else if(sp.mode2==='pos')posTotal+=sp.amt2*ratio;
        else if(sp.mode2==='transfer')transferTotal+=sp.amt2*ratio;
      } else if(s.payment!=='credit'){
        if(s.payMode==='cash')cashTotal+=s.total;
        else if(s.payMode==='pos')posTotal+=s.total;
        else if(s.payMode==='transfer')transferTotal+=s.total;
      }
    });
    return '<div class="metrics" style="grid-template-columns:repeat(3,1fr)">'+
      mc('Cash',fmt(cashTotal),'','')+
      mc('POS',fmt(posTotal),'','')+
      mc('Transfer',fmt(transferTotal),'','')+'</div>';
  })()
}

var supPaySearch='';
var supPayDateFrom='';
var supPayDateTo='';
var supPayFilterSup='';

/* ── SUPPLIER OVERVIEW ─────────────────────────────────────── */
var supOvSearch='';
var supOvFilter='all'; // all | balance | cleared | active

function buildSupplierOverview(){
  if(!canDo('suppliers'))return '<div class="empty">Access denied.</div>';

  var suppliers=DB.suppliers||[];
  var purchases=DB.purchases||[];
  var payments=DB.supplierPayments||[];
  var pending=(DB.pendingDeliveries||[]).filter(function(d){return d.status!=='complete';});

  // ── Per-supplier aggregates ──────────────────────────────────
  var supMap={};
  suppliers.forEach(function(s){
    supMap[s.id]={
      id:s.id,name:s.name,phone:s.phone||s.contact||'—',
      owedToSupplier:s.owedToSupplier||0,
      totalPurchased:0,totalPaid:0,invoiceCount:0,lastPurchase:null,
      pendingCount:0
    };
  });
  purchases.forEach(function(p){
    if(!supMap[p.supId])return;
    supMap[p.supId].totalPurchased+=(p.grandTotal||0);
    supMap[p.supId].invoiceCount++;
    var d=parseDate(p.date);
    if(!supMap[p.supId].lastPurchase||d>supMap[p.supId].lastPurchase)supMap[p.supId].lastPurchase=d;
  });
  payments.forEach(function(p){
    if(!supMap[p.supId])return;
    supMap[p.supId].totalPaid+=(p.amount||0);
  });
  pending.forEach(function(d){
    if(!supMap[d.supId])return;
    supMap[d.supId].pendingCount++;
  });

  var rows=Object.values(supMap);

  // totals KPIs
  var totalOwed=rows.reduce(function(a,r){return a+r.owedToSupplier;},0);
  var totalPaidEver=rows.reduce(function(a,r){return a+r.totalPaid;},0);
  var totalPurchaseVal=rows.reduce(function(a,r){return a+r.totalPurchased;},0);
  var activeCount=rows.filter(function(r){return r.invoiceCount>0;}).length;

  // ── Filter & search ──────────────────────────────────────────
  var filtered=rows.filter(function(r){
    if(supOvSearch){
      var t=supOvSearch.toLowerCase();
      if(r.name.toLowerCase().indexOf(t)<0&&r.phone.toLowerCase().indexOf(t)<0)return false;
    }
    if(supOvFilter==='balance')return r.owedToSupplier>0;
    if(supOvFilter==='cleared')return r.owedToSupplier<=0;
    if(supOvFilter==='active')return r.invoiceCount>0;
    return true;
  });

  // ── Table rows ───────────────────────────────────────────────
  var tableRows=filtered.map(function(r){
    var status=r.owedToSupplier>0
      ?'<span style="background:var(--warning-bg);color:#92400e;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">HAS BALANCE</span>'
      :'<span style="background:var(--success-bg);color:#15803d;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">CLEARED</span>';
    var lastP=r.lastPurchase?r.lastPurchase.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
    var payBtn=r.owedToSupplier>0
      ?'<button class="btn sm" style="color:#15803d;border-color:#86efac;font-size:11px" onclick="paySupplier('+r.id+')">💳 Pay</button> '
      :'';
    return '<tr>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+r.phone+'</td>'+
      '<td style="text-align:right">'+fmt(r.totalPurchased)+'</td>'+
      '<td style="text-align:right;color:#15803d">'+fmt(r.totalPaid)+'</td>'+
      '<td style="text-align:right;color:'+(r.owedToSupplier>0?'#dc2626':'#374151')+'"><b>'+fmt(r.owedToSupplier)+'</b></td>'+
      '<td>'+lastP+'</td>'+
      '<td style="text-align:center">'+r.invoiceCount+'</td>'+
      '<td style="text-align:center">'+r.pendingCount+'</td>'+
      '<td>'+status+'</td>'+
      '<td>'+payBtn+'</td>'+
    '</tr>';
  }).join('');

  // ── Top 5 suppliers bar chart ────────────────────────────────
  var top5=[].concat(rows).sort(function(a,b){return b.totalPurchased-a.totalPurchased;}).slice(0,5);
  var maxVal=top5[0]?top5[0].totalPurchased:1;
  var barChart=top5.map(function(r,i){
    var pct=maxVal>0?Math.round(r.totalPurchased/maxVal*100):0;
    var colors=['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b'];
    return '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
        '<span style="font-weight:600;color:#374151">'+esc(r.name)+'</span>'+
        '<span style="color:#6b7280">'+fmt(r.totalPurchased)+'</span>'+
      '</div>'+
      '<div style="background:var(--surface2);border-radius:6px;height:10px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:100%;background:'+colors[i]+';border-radius:6px;transition:width .4s"></div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ── Monthly spend last 6 months ──────────────────────────────
  var now=new Date();
  var months=[];
  for(var m=5;m>=0;m--){
    var d=new Date(now.getFullYear(),now.getMonth()-m,1);
    months.push({label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),year:d.getFullYear(),month:d.getMonth(),total:0});
  }
  payments.forEach(function(p){
    var d=parseDate(p.date);
    if(!d)return;
    months.forEach(function(mb){if(d.getFullYear()===mb.year&&d.getMonth()===mb.month)mb.total+=p.amount;});
  });
  var maxMonth=Math.max.apply(null,months.map(function(mb){return mb.total;}));
  if(maxMonth===0)maxMonth=1;
  var monthBars=months.map(function(mb){
    var pct=Math.round(mb.total/maxMonth*100);
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:4px">'+
      '<div style="font-size:10px;color:#6b7280;font-weight:600">'+fmt(mb.total)+'</div>'+
      '<div style="width:100%;display:flex;align-items:flex-end;height:60px">'+
        '<div style="width:100%;height:'+(pct||2)+'%;min-height:3px;background:#6366f1;border-radius:4px 4px 0 0"></div>'+
      '</div>'+
      '<div style="font-size:10px;color:#9ca3af">'+mb.label+'</div>'+
    '</div>';
  }).join('');

  // ── Pending deliveries summary ───────────────────────────────
  var pendingBySupplier={};
  pending.forEach(function(d){
    if(!pendingBySupplier[d.supId])pendingBySupplier[d.supId]={name:d.supName,items:[],totalCost:0};
    pendingBySupplier[d.supId].items.push(d);
    pendingBySupplier[d.supId].totalCost+=(d.cost*d.qtyPending||0);
  });
  var pendingRows=Object.values(pendingBySupplier).map(function(ps){
    return '<tr>'+
      '<td><b>'+ps.name+'</b></td>'+
      '<td style="text-align:center">'+ps.items.length+'</td>'+
      '<td>'+ps.items.slice(0,3).map(function(i){return i.itemName;}).join(', ')+(ps.items.length>3?' …':'')+'</td>'+
      '<td style="text-align:right;color:#dc2626">'+fmt(ps.totalCost)+'</td>'+
    '</tr>';
  }).join('');

  // ── Recent 10 supplier payments ──────────────────────────────
  var recentPays=[].concat(payments).sort(function(a,b){
    return (parseDate(b.date)||0)-(parseDate(a.date)||0);
  }).slice(0,10);
  var recentRows=recentPays.map(function(p){
    var modeIcons={cash:'💵',transfer:'🏦',pos:'💳',cheque:'📝'};
    var icon=modeIcons[p.payMode]||'💰';
    return '<tr>'+
      '<td>'+(parseDate(p.date)?parseDate(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—')+'</td>'+
      '<td><b>'+esc(p.supName)+'</b></td>'+
      '<td>'+icon+' '+(p.payMode||'—')+'</td>'+
      '<td style="text-align:right;color:#15803d;font-weight:700">'+fmt(p.amount)+'</td>'+
      '<td style="color:#9ca3af;font-size:12px">'+(p.note||'—')+'</td>'+
    '</tr>';
  }).join('');

  // ── Build HTML ───────────────────────────────────────────────
  var filterBtns=['all','balance','cleared','active'].map(function(f){
    var labels={all:'All',balance:'Has Balance',cleared:'Cleared',active:'Active'};
    var active=supOvFilter===f;
    return '<button onclick="supOvFilter=\''+f+'\';renderPanel()" style="padding:6px 14px;border-radius:20px;border:1px solid '+(active?'var(--primary)':'var(--border)')+';background:'+(active?'var(--primary)':'var(--white)')+';color:'+(active?'#fff':'var(--text2)')+';font-size:12px;font-weight:600;cursor:pointer">'+labels[f]+'</button>';
  }).join('');

  return (
    // ── KPI Cards ──────────────────────────────────────────────
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px">'+
      kpiCard('🏭','Total Suppliers',suppliers.length,'','#6366f1')+
      kpiCard('💰','Total Purchase Value',fmt(totalPurchaseVal),'','#0ea5e9')+
      kpiCard('✅','Total Paid',fmt(totalPaidEver),'','#10b981')+
      kpiCard('⏳','Total Outstanding',fmt(totalOwed),totalOwed>0?'⚠️':'','#f59e0b')+
      kpiCard('🔥','Active Suppliers',activeCount,'','#8b5cf6')+
      kpiCard('📦','Pending Deliveries',pending.length,'','#dc2626')+
    '</div>'+

    // ── Charts Row ─────────────────────────────────────────────
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px">'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 14px">🏆 Top 5 Suppliers by Purchase Value</p>'+
        (top5.length?barChart:'<div class="empty">No data yet.</div>')+
      '</div>'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 14px">📅 Monthly Supplier Payments (Last 6 Months)</p>'+
        '<div style="display:flex;gap:6px;align-items:flex-end;height:100px;padding-bottom:4px">'+monthBars+'</div>'+
      '</div>'+
    '</div>'+

    // ── Supplier Table ─────────────────────────────────────────
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:22px">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px">'+
        '<p class="sec-title" style="margin:0">📋 Supplier Performance</p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
          filterBtns+
          '<div style="position:relative"><span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3)">🔍</span>'+
          '<input type="text" placeholder="Search suppliers..." value="'+supOvSearch+'" oninput="supOvSearch=this.value;renderPanel()" style="padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:12px;width:180px"></div>'+
        '</div>'+
      '</div>'+
      (filtered.length
        ?'<div class="tbl-wrap"><table><thead><tr>'+
            '<th>Supplier</th><th>Phone</th><th style="text-align:right">Total Purchases</th>'+
            '<th style="text-align:right">Total Paid</th><th style="text-align:right">Outstanding</th>'+
            '<th>Last Purchase</th><th style="text-align:center">Invoices</th><th style="text-align:center">Pending</th>'+
            '<th>Status</th><th>Action</th>'+
          '</tr></thead><tbody>'+tableRows+'</tbody></table></div>'
        :'<div class="empty">No suppliers match.</div>')+
    '</div>'+

    // ── Bottom Row: Pending Deliveries + Recent Payments ──────
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px">'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 12px">📦 Pending Deliveries by Supplier</p>'+
        (pendingRows
          ?'<div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th style="text-align:center">Items</th><th>Products</th><th style="text-align:right">Est. Cost</th></tr></thead><tbody>'+pendingRows+'</tbody></table></div>'
          :'<div class="empty">No pending deliveries.</div>')+
      '</div>'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 12px">🕐 Recent 10 Supplier Payments</p>'+
        (recentRows
          ?'<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Supplier</th><th>Mode</th><th style="text-align:right">Amount</th><th>Note</th></tr></thead><tbody>'+recentRows+'</tbody></table></div>'
          :'<div class="empty">No payments recorded.</div>')+
      '</div>'+
    '</div>'
  );
}

function kpiCard(icon,label,value,badge,color){
  return '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;border-left:4px solid '+color+'">'+
    '<div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">'+icon+' '+label+(badge?' '+badge:'')+'</div>'+
    '<div style="font-size:20px;font-weight:800;color:#1e293b">'+value+'</div>'+
  '</div>';
}
/* ── END SUPPLIER OVERVIEW ─────────────────────────────────── */

/* ── CUSTOMER OVERVIEW ─────────────────────────────────────── */
var custOvSearch='';
var custOvFilter='all'; // all | balance | cleared | active

function buildCustomerOverview(){
  if(!canDo('customers'))return '<div class="empty">Access denied.</div>';

  var customers=DB.customers||[];
  var sales=DB.sales||[];
  var creditPayments=DB.creditPayments||[];

  // ── Per-customer aggregates ──────────────────────────────────
  var custMap={};
  customers.forEach(function(c){
    custMap[c.id]={
      id:c.id,name:c.name,phone:c.phone||'—',type:c.type||'retail',
      creditBalance:c.creditBalance||0,
      totalSpent:0,totalCreditCollected:0,invoiceCount:0,lastPurchase:null
    };
  });

  // Sales are stored per line item — group by invoiceNum first, then attribute to customer
  var invGroups={};
  sales.forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!invGroups[k])invGroups[k]={custId:s.custId,date:s.date,total:0};
    invGroups[k].total+=(s.total||0);
  });
  Object.values(invGroups).forEach(function(inv){
    if(!inv.custId||!custMap[inv.custId])return;
    custMap[inv.custId].totalSpent+=inv.total;
    custMap[inv.custId].invoiceCount++;
    var d=parseDate(inv.date);
    if(d&&(!custMap[inv.custId].lastPurchase||d>custMap[inv.custId].lastPurchase))
      custMap[inv.custId].lastPurchase=d;
  });

  creditPayments.forEach(function(p){
    if(!p.custId||!custMap[p.custId])return;
    if(p.payMode!=='writeoff')custMap[p.custId].totalCreditCollected+=(p.amount||0);
  });

  var rows=Object.values(custMap);

  // ── KPI totals ───────────────────────────────────────────────
  var totalRevenue=rows.reduce(function(a,r){return a+r.totalSpent;},0);
  var totalCreditOwed=rows.filter(function(r){return r.creditBalance>0;}).reduce(function(a,r){return a+r.creditBalance;},0);
  var totalCreditCollected=rows.reduce(function(a,r){return a+r.totalCreditCollected;},0);
  var activeCount=rows.filter(function(r){return r.invoiceCount>0;}).length;
  var withBalanceCount=rows.filter(function(r){return r.creditBalance>0;}).length;

  // ── Filter & search ──────────────────────────────────────────
  var filtered=rows.filter(function(r){
    if(custOvSearch){
      var t=custOvSearch.toLowerCase();
      if(r.name.toLowerCase().indexOf(t)<0&&r.phone.toLowerCase().indexOf(t)<0)return false;
    }
    if(custOvFilter==='balance')return r.creditBalance>0;
    if(custOvFilter==='cleared')return r.creditBalance<=0;
    if(custOvFilter==='active')return r.invoiceCount>0;
    return true;
  });

  // ── Table rows ───────────────────────────────────────────────
  var tableRows=filtered.map(function(r){
    var status=r.creditBalance>0
      ?'<span style="background:var(--danger-bg);color:#dc2626;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">HAS BALANCE</span>'
      :'<span style="background:var(--success-bg);color:#15803d;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">CLEARED</span>';
    var typeLabel=r.type==='wholesale'?'🏭 Wholesale':r.type==='vip'?'⭐ VIP':'🛒 Retail';
    var lastP=r.lastPurchase?r.lastPurchase.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
    var collectBtn=r.creditBalance>0
      ?'<button class="btn sm" style="color:#dc2626;border-color:#fca5a5;font-size:11px" onclick="switchTab(\'creditcust\')">💳 Collect</button>'
      :'';
    return '<tr>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+r.phone+'</td>'+
      '<td style="font-size:11px;color:#6b7280">'+typeLabel+'</td>'+
      '<td style="text-align:right">'+fmt(r.totalSpent)+'</td>'+
      '<td style="text-align:right;color:#15803d">'+fmt(r.totalCreditCollected)+'</td>'+
      '<td style="text-align:right;color:'+(r.creditBalance>0?'#dc2626':'#374151')+'"><b>'+fmt(r.creditBalance)+'</b></td>'+
      '<td>'+lastP+'</td>'+
      '<td style="text-align:center">'+r.invoiceCount+'</td>'+
      '<td>'+status+'</td>'+
      '<td>'+collectBtn+'</td>'+
    '</tr>';
  }).join('');

  // ── Top 5 customers by spend ─────────────────────────────────
  var top5=[].concat(rows).sort(function(a,b){return b.totalSpent-a.totalSpent;}).slice(0,5);
  var maxVal=top5[0]?top5[0].totalSpent:1;
  var custColors=['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b'];
  var barChart=top5.map(function(r,i){
    var pct=maxVal>0?Math.round(r.totalSpent/maxVal*100):0;
    return '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
        '<span style="font-weight:600;color:#374151">'+esc(r.name)+'</span>'+
        '<span style="color:#6b7280">'+fmt(r.totalSpent)+'</span>'+
      '</div>'+
      '<div style="background:var(--surface2);border-radius:6px;height:10px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:100%;background:'+custColors[i]+';border-radius:6px;transition:width .4s"></div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ── Monthly revenue last 6 months ────────────────────────────
  var now=new Date();
  var months=[];
  for(var m=5;m>=0;m--){
    var d=new Date(now.getFullYear(),now.getMonth()-m,1);
    months.push({label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),year:d.getFullYear(),month:d.getMonth(),total:0});
  }
  sales.forEach(function(s){
    var d=parseDate(s.date);
    if(!d)return;
    months.forEach(function(mb){if(d.getFullYear()===mb.year&&d.getMonth()===mb.month)mb.total+=(s.total||0);});
  });
  var maxMonth=Math.max.apply(null,months.map(function(mb){return mb.total;}));
  if(maxMonth===0)maxMonth=1;
  var monthBars=months.map(function(mb){
    var pct=Math.round(mb.total/maxMonth*100);
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:4px">'+
      '<div style="font-size:10px;color:#6b7280;font-weight:600">'+fmt(mb.total)+'</div>'+
      '<div style="width:100%;display:flex;align-items:flex-end;height:60px">'+
        '<div style="width:100%;height:'+(pct||2)+'%;min-height:3px;background:#6366f1;border-radius:4px 4px 0 0"></div>'+
      '</div>'+
      '<div style="font-size:10px;color:#9ca3af">'+mb.label+'</div>'+
    '</div>';
  }).join('');

  // ── Customers with outstanding balance ───────────────────────
  var debtors=[].concat(rows).filter(function(r){return r.creditBalance>0;})
    .sort(function(a,b){return b.creditBalance-a.creditBalance;});
  var debtorRows=debtors.map(function(r){
    var lastP=r.lastPurchase?r.lastPurchase.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
    var pct=r.totalSpent>0?Math.round(r.creditBalance/r.totalSpent*100):0;
    return '<tr>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+r.phone+'</td>'+
      '<td style="text-align:right">'+fmt(r.totalSpent)+'</td>'+
      '<td style="text-align:right;color:#dc2626;font-weight:700">'+fmt(r.creditBalance)+'</td>'+
      '<td style="text-align:center"><span style="background:var(--danger-bg);color:#dc2626;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">'+pct+'%</span></td>'+
      '<td>'+lastP+'</td>'+
      '<td><button class="btn sm" style="color:#dc2626;border-color:#fca5a5;font-size:11px" onclick="switchTab(\'creditcust\')">💳 Collect</button></td>'+
    '</tr>';
  }).join('');

  // ── Recent 10 credit payments ────────────────────────────────
  var recentPays=[].concat(creditPayments)
    .filter(function(p){return p.payMode!=='writeoff';})
    .sort(function(a,b){return (parseDate(b.date)||0)-(parseDate(a.date)||0);})
    .slice(0,10);
  var modeIcons={cash:'💵',transfer:'🏦',pos:'💳',cheque:'📝'};
  var recentRows=recentPays.map(function(p){
    var icon=modeIcons[p.payMode]||'💰';
    return '<tr>'+
      '<td>'+(parseDate(p.date)?parseDate(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—')+'</td>'+
      '<td><b>'+p.custName+'</b></td>'+
      '<td>'+icon+' '+(p.payMode||'—')+'</td>'+

var invValFilter='all'; // all | low | out | over
