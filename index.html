function buildProformas(){
  if(!canDo('sales'))return '<div class="empty">Access denied.</div>';
  var proformas=(DB.proformas||[]).slice().sort(function(a,b){return (parseSaleDate(b.date)||0)-(parseSaleDate(a.date)||0);});
  var pending=proformas.filter(function(p){return p.status==='pending';});
  var converted=proformas.filter(function(p){return p.status==='converted';});
  var cancelled=proformas.filter(function(p){return p.status==='cancelled';});
  var totalVal=pending.reduce(function(a,p){return a+p.grandTotal;},0);

  function statusBadge(p){
    if(p.status==='converted')return '<span style="background:var(--success-bg);color:#15803d;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">CONVERTED</span>';
    if(p.status==='cancelled')return '<span style="background:var(--surface2);color:#6b7280;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">CANCELLED</span>';
    var validUntil=new Date((new Date(p.date).getTime()||parseSaleDate(p.date))+(p.validDays||7)*86400000);
    var expired=validUntil<new Date();
    return expired
      ?'<span style="background:var(--danger-bg);color:#dc2626;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">EXPIRED</span>'
      :'<span style="background:var(--warning-bg);color:#92400e;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">PENDING</span>';
  }

  function validUntilStr(p){
    var d=new Date((new Date(p.date).getTime()||parseSaleDate(p.date))+(p.validDays||7)*86400000);
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  var rows=proformas.map(function(p){
    var itemSummary=p.items.slice(0,2).map(function(i){return i.name+' ×'+i.qty;}).join(', ')+(p.items.length>2?' +'+( p.items.length-2)+' more':'');
    var actions='<button onclick="printProforma(\''+p.prfNum+'\')" style="padding:4px 10px;background:var(--primary-bg);color:#0369a1;border:1px solid #bae6fd;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600">🖨️ Print</button> '+
      '<button onclick="shareProformaWhatsApp(\''+p.prfNum+'\')" style="padding:4px 10px;background:var(--success-bg);color:#15803d;border:1px solid #86efac;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600">📲 Share</button> ';
    if(p.status==='pending'){
      actions+='<button onclick="convertProforma(\''+p.prfNum+'\')" style="padding:4px 10px;background:#7c3aed;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600">✅ Convert</button> '+
        '<button onclick="cancelProforma(\''+p.prfNum+'\')" style="padding:4px 10px;background:var(--danger-bg);color:#dc2626;border:1px solid #fca5a5;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600">✕ Cancel</button>';
    } else if(p.status==='converted'){
      actions+='<span style="font-size:11px;color:#15803d">→ Invoice #'+p.convertedInvNum+'</span>';
    }
    return '<tr>'+
      '<td><b>'+p.prfNum+'</b></td>'+
      '<td>'+p.date+'</td>'+
      '<td>'+(p.custName||'Walk-in')+'</td>'+
      '<td style="font-size:11px;color:#6b7280">'+itemSummary+'</td>'+
      '<td style="text-align:center">'+p.items.length+'</td>'+
      '<td style="text-align:right;font-weight:700">'+fmt(p.grandTotal)+'</td>'+
      '<td style="font-size:11px;color:#6b7280">'+validUntilStr(p)+'</td>'+
      '<td>'+statusBadge(p)+'</td>'+
      '<td style="font-size:11px;color:#9ca3af">'+esc(p.by)+'</td>'+
      '<td style="white-space:nowrap">'+actions+'</td>'+
    '</tr>';
  }).join('');

  return (
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px">'+
      kpiCard('📄','Total Proformas',proformas.length,'','#7c3aed')+
      kpiCard('⏳','Pending',pending.length,'','#f59e0b')+
      kpiCard('✅','Converted',converted.length,'','#10b981')+
      kpiCard('❌','Cancelled',cancelled.length,'','#94a3b8')+
      kpiCard('💰','Pending Value',fmt(totalVal),'','#0ea5e9')+
    '</div>'+
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
        '<p class="sec-title" style="margin:0">📄 All Proforma Invoices</p>'+
        '<button onclick="switchTab(\'sales\')" class="btn primary" style="font-size:12px;padding:7px 14px">+ Create New</button>'+
      '</div>'+
      (proformas.length?
        '<div class="tbl-wrap"><table><thead><tr>'+
          '<th>PRF #</th><th>Date</th><th>Customer</th><th>Items</th>'+
          '<th style="text-align:center">Count</th><th style="text-align:right">Total</th>'+
          '<th>Valid Until</th><th>Status</th><th>By</th><th>Actions</th>'+
        '</tr></thead><tbody>'+rows+'</tbody></table></div>'

function shareProformaWhatsApp(prfNum){
  var p=(DB.proformas||[]).find(function(x){return x.prfNum==prfNum;});
  if(!p){alert('Proforma not found.');return;}
  var validUntil=new Date((new Date(p.date).getTime()||parseSaleDate(p.date))+(p.validDays||7)*86400000);
  var validStr=validUntil.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  var lines=['📄 *PROFORMA INVOICE*','','*'+prfNum+'*','Date: '+p.date,'Customer: '+(p.custName||'Walk-in'),'','*Items:*'];
  p.items.forEach(function(i,idx){lines.push((idx+1)+'. '+esc(i.name)+' ×'+i.qty+' = '+fmt(i.price*i.qty-(i.discAmt||0)));});
  lines.push('','*Grand Total: '+fmt(p.grandTotal)+'*');
  lines.push('Valid until: '+validStr);
  lines.push('','_Great Chid Electro (Nig.) — 08035158594_');
  var msg=encodeURIComponent(lines.join('\n'));
  window.open('https://wa.me/?text='+msg,'_blank');
}

function convertProforma(prfNum){
  var p=(DB.proformas||[]).find(function(x){return x.prfNum==prfNum;});
  if(!p){alert('Proforma not found.');return;}
  if(p.status!=='pending'){alert('This proforma has already been '+p.status+'.');return;}
  if(!confirm('Convert proforma '+prfNum+' to a real invoice?\n\nThis will open the Sales tab with all items pre-loaded.'))return;
  // Load items into invoiceItems
  invoiceItems=JSON.parse(JSON.stringify(p.items));
  // Set customer
  if(p.custId){
    saleCustomerType='registered';
    window._saleRegCustId=p.custId;
    window._pendingProformaConvert=prfNum;
  } else {
    saleCustomerType='walkin';
    window._pendingProformaConvert=prfNum;
  }
  switchTab('sales');
  showToast('Proforma '+prfNum+' loaded — complete the sale to convert it.');
}

function cancelProforma(prfNum){
  if(!confirm('Cancel proforma '+prfNum+'? This cannot be undone.'))return;
  var p=(DB.proformas||[]).find(function(x){return x.prfNum==prfNum;});
  if(p){p.status='cancelled';saveData();renderPanel();showToast('Proforma '+prfNum+' cancelled.');}
}

function markProformaConverted(prfNum,invNum){
  var p=(DB.proformas||[]).find(function(x){return x.prfNum==prfNum;});
  if(p){p.status='converted';p.convertedInvNum=invNum;saveData();}
}

function recordCreditPayment(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amtEl=document.getElementById('cp-amt-'+custId);
  var modeEl=document.getElementById('cp-mode-'+custId);
  var bankEl=document.getElementById('cp-bank-'+custId);
  var posEl=document.getElementById('cp-pos-'+custId);
  var amt=parseFloat(amtEl?amtEl.value:0)||0;
  var mode=modeEl?modeEl.value:'cash';
  var bankId=mode==='transfer'&&bankEl?bankEl.value:'';
  var posId=mode==='pos'&&posEl?posEl.value:'';
  if(amt<=0){alert('Enter a valid amount.');return;}
  if(amt>cust.creditBalance){
    if(!confirm('Amount ('+fmt(amt)+') is more than what is owed ('+fmt(cust.creditBalance)+'). The excess will be stored as customer credit (overpayment). Continue?'))return;
  }
  if(mode==='transfer'&&DB.banks.length&&!bankId){alert('Select the bank for transfer.');return;}
  if(mode==='pos'&&DB.posTerminals.length&&!posId){alert('Select the POS terminal.');return;}
  var dateEl=document.getElementById('cp-date-'+custId);
  var rawDate=dateEl&&dateEl.value?new Date(dateEl.value):new Date();
  var date=rawDate.toLocaleDateString();
  var month=rawDate.toISOString().slice(0,7);
  // Reduce credit balance
  cust.creditBalance=Math.round((cust.creditBalance-amt)*100)/100;
  // Store payment record
  if(!DB.creditPayments)DB.creditPayments=[];
  DB.creditPayments.push({id:uid(),custId:custId,custName:cust.name,amount:amt,payMode:mode,bankId:bankId,posId:posId,date:date,month:month,by:DB.currentUser.name});
  // Record in cashflow as income
  DB.cashflow.push({id:uid(),desc:'Credit payment — '+cust.name,amount:amt,type:'in',cat:'Credit Payment',payMode:mode,bankId:bankId,posId:posId,date:date,month:month});
  saveData();
  alert('Payment of '+fmt(amt)+' recorded for '+cust.name+'. Remaining balance: '+fmt(Math.max(0,cust.creditBalance)));
  logActivity('Credit payment','Payment of '+fmt(amt)+' from '+cust.name+'. Balance: '+fmt(Math.max(0,cust.creditBalance)),mode);
  renderApp();
}

function showSupplyQtyModal(invoiceNum, saleId){
  var sale=DB.sales.find(function(s){return s.id==saleId;});
  if(!sale){alert('Record not found.');return;}
  var pending=sale.pendingQty!==undefined?sale.pendingQty:sale.qty;
  if(pending<=0){alert('This item is already fully supplied.');return;}
  var invItem=DB.inventory.find(function(i){return i.id==sale.itemId;});
  var available=invItem?Math.max(0,invItem.qty):0;
  if(available<=0){alert('No stock available for '+sale.name+'. Please restock first.');return;}
  var maxQty=Math.min(pending,available);
  // Remove existing modal if any
  var old=document.getElementById('supply-qty-overlay');
  if(old)old.remove();
  var overlay=document.createElement('div');
  overlay.id='supply-qty-overlay';
  overlay.className='confirm-overlay';
  overlay.innerHTML=
    '<div class="confirm-box" onclick="event.stopPropagation()" style="min-width:320px">'+
      '<div class="confirm-icon info">📦</div>'+
      '<div class="confirm-title">Supply quantity</div>'+
      '<div class="confirm-msg">'+sale.name+'</div>'+
      '<div class="confirm-detail" style="text-align:left;line-height:1.8">'+
        '🔢 Pending: <b>'+pending+'</b> &nbsp;·&nbsp; 📦 In stock: <b>'+available+'</b>'+
      '</div>'+
      '<div style="margin:14px 0 4px;text-align:left">'+
        '<label style="font-size:11px;font-weight:700;color:#6c757d;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px">Qty to supply</label>'+
        '<input id="supply-qty-input" type="number" min="1" max="'+maxQty+'" value="'+maxQty+'" '+
          'style="width:100%;font-size:15px;padding:8px 12px;border:1.5px solid #0d6efd;border-radius:6px;font-weight:700;text-align:center;color:#0d6efd">'+
        '<div style="font-size:11px;color:#6c757d;margin-top:4px">Max: '+maxQty+' ('+available+' available, '+pending+' pending)</div>'+
      '</div>'+
      '<div class="confirm-btns">'+
        '<button class="btn-cancel" onclick="document.getElementById(\'supply-qty-overlay\').remove()">Cancel</button>'+
        '<button class="btn-confirm success" id="supply-qty-ok">✓ Supply now</button>'+
      '</div>'+
    '</div>';
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
  var inp=document.getElementById('supply-qty-input');
  inp.focus();inp.select();
  document.getElementById('supply-qty-ok').onclick=function(){
    var qty=parseInt(inp.value)||0;
    if(qty<1){alert('Enter at least 1.');inp.focus();return;}
    if(qty>maxQty){alert('Cannot supply more than '+maxQty+'.');inp.focus();return;}
    overlay.remove();
    supplyNow(invoiceNum,saleId,qty);
  };
}

function supplyNow(invoiceNum, saleId, overrideQty){
  // Use loose == to match whether saleId comes in as string or number
  var sale=DB.sales.find(function(s){return s.id==saleId;});
  if(!sale){
    // Fallback: try matching by invoiceNum if direct id match fails
    var fallback=DB.sales.filter(function(s){
      return (s.invoiceNum==invoiceNum||String(s.invoiceNum)===String(invoiceNum))&&
             (s.supplyStatus==='pending'||s.supplyStatus==='partial')&&
             (s.pendingQty||0)>0;
    });
    if(fallback.length===1){sale=fallback[0];}
    else{alert('Record not found. Try using "Supply all" instead.');return;}
  }
  var pending=sale.pendingQty!==undefined?sale.pendingQty:sale.qty;
  if(pending<=0){alert('This item is already fully supplied.');return;}
  // Check stock
  var invItem=DB.inventory.find(function(i){return i.id==sale.itemId;});
  var available=invItem?Math.max(0,invItem.qty):0;
  if(available<=0){alert('No stock available for '+sale.name+'. Please restock first.');return;}
  var toSupply=overrideQty!==undefined?overrideQty:Math.min(pending,available);
  var detail='Supply '+toSupply+' × '+sale.name+(toSupply<pending?' ('+( pending-toSupply)+' will still be pending)':' (fully supplied)');
  showConfirm({
    type:'success',
    title:'Confirm supply',
    msg:'This will deduct '+toSupply+' from inventory.',
    detail:detail,
    confirmLabel:'✓ Supply now',
    cancelLabel:'Cancel'
  },function(){
  // Deduct stock
  if(invItem)invItem.qty-=toSupply;
  // Update sale record
  var prevSupplied=sale.suppliedQty||0;
  sale.suppliedQty=prevSupplied+toSupply;
  sale.pendingQty=pending-toSupply;
  if(sale.pendingQty<=0){
    sale.supplyStatus='supplied';
    sale.supplyDate=new Date().toLocaleDateString();
    sale.pendingSupply=false;
  } else {
    sale.supplyStatus='partial';
  }
  // Adj log
  if(invItem){DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'remove',reason:'Supplied — Invoice #'+invoiceNum,before:invItem.qty+toSupply,change:-toSupply,after:invItem.qty,date:new Date().toLocaleDateString(),by:DB.currentUser.name});}
  saveData();
  alert(toSupply+' '+sale.name+' supplied successfully!'+(sale.pendingQty>0?' ('+sale.pendingQty+' still pending)':''));
  renderApp();
  }); // end showConfirm
}

function supplyAllNow(invoiceNum){
  var items=DB.sales.filter(function(s){return s.invoiceNum===invoiceNum&&(s.supplyStatus==='pending'||s.supplyStatus==='partial')&&(s.pendingQty||0)>0;});
  if(!items.length){alert('No pending items for this invoice.');return;}
  var msg='Supply all pending items for Invoice #'+invoiceNum+'?\n\n';
  var canSupply=[];
  var noStock=[];
  items.forEach(function(s){
    var pending=s.pendingQty||0;
    var inv=DB.inventory.find(function(i){return i.id==s.itemId;});
    var available=inv?Math.max(0,inv.qty):0;
    var toSupply=Math.min(pending,available);
    if(toSupply>0)canSupply.push({sale:s,inv:inv,toSupply:toSupply,pending:pending});
    else noStock.push(s.name);
  });
  if(canSupply.length===0){alert('No stock available for any pending items. Please restock first.');return;}
  var detail='';
  canSupply.forEach(function(x){detail+=x.sale.name+': '+x.toSupply+(x.toSupply<x.pending?' ('+(x.pending-x.toSupply)+' remain)':'')+'\n';});
  if(noStock.length)detail+='No stock: '+noStock.join(', ');
  showConfirm({
    type:'info',
    title:'Supply all pending items?',
    msg:'Invoice #'+invoiceNum+' — This will deduct stock from inventory.',
    detail:detail.trim(),
    confirmLabel:'✓ Supply all',
    cancelLabel:'Cancel'
  },function(){
  canSupply.forEach(function(x){
    if(x.inv)x.inv.qty-=x.toSupply;
    var prevSupplied=x.sale.suppliedQty||0;
    x.sale.suppliedQty=prevSupplied+x.toSupply;
    x.sale.pendingQty=x.pending-x.toSupply;
    if(x.sale.pendingQty<=0){x.sale.supplyStatus='supplied';x.sale.supplyDate=new Date().toLocaleDateString();x.sale.pendingSupply=false;}
    else{x.sale.supplyStatus='partial';}
    if(x.inv){DB.adjLog.push({id:uid(),itemId:x.inv.id,itemName:x.inv.name,type:'remove',reason:'Supplied — Invoice #'+invoiceNum,before:x.inv.qty+x.toSupply,change:-x.toSupply,after:x.inv.qty,date:new Date().toLocaleDateString(),by:DB.currentUser.name});}
  });
  saveData();
  alert('Supply completed for Invoice #'+invoiceNum+'!');
  renderApp();
  }); // end showConfirm
}

/* ── One-time repair: record opening balance clearances missing from cashflow ── */
function repairOpeningBalanceClearances(){
  if(!DB.currentUser)return; // not logged in yet
  var repaired=false;
  (DB.customers||[]).forEach(function(cust){
    var openingBal=cust.openingBalance||0;
    if(openingBal<=0)return; // no opening balance

    // Calculate total credit payments already recorded for this customer
    var totalCreditPaid=(DB.creditPayments||[]).filter(function(p){
      return String(p.custId)==String(cust.id)&&p.payMode!=='writeoff';
    }).reduce(function(a,p){return a+(p.amount||0);},0);

    // Calculate total part-payment overpayments already recorded as credit payments
    // (these would have note containing 'overpayment')
    var overpaymentsPaid=(DB.creditPayments||[]).filter(function(p){
      return String(p.custId)==String(cust.id)&&(p.note||'').indexOf('overpayment')>=0;
    }).reduce(function(a,p){return a+(p.amount||0);},0);

    // If creditBalance is 0 or negative but no credit payment exists covering the opening balance
    var currentBalance=cust.creditBalance||0;
    if(currentBalance<=0 && totalCreditPaid<openingBal){
      // Opening balance was cleared but not recorded — find what cleared it
      // Look for part-payment invoices where partPayment > invoice total
      var covered=totalCreditPaid;
      var invoicesForCust=(DB.sales||[]).filter(function(s){
        return String(s.custId)==String(cust.id)&&s.payment==='part'&&(s.partPayment||0)>0;
      });
      // Group by invoice
      var invMap={};
      invoicesForCust.forEach(function(s){
        var k=s.invoiceNum||s.id;
        if(!invMap[k])invMap[k]={total:0,partPayment:s.partPayment||0,date:s.date,month:s.month,payMode:s.payMode,bankId:s.bankId,posId:s.posId,invoiceNum:k};
        invMap[k].total+=s.total;
      });
      Object.values(invMap).forEach(function(inv){
        var overpay=inv.partPayment-inv.total;
        if(overpay>0&&covered<openingBal){
          var toRecord=Math.min(overpay,openingBal-covered);
          // Check if already recorded
          var alreadyRecorded=(DB.creditPayments||[]).some(function(p){
            return String(p.custId)==String(cust.id)&&(p.note||'').indexOf(inv.invoiceNum)>=0&&(p.note||'').indexOf('overpayment')>=0;
          });
          if(!alreadyRecorded&&toRecord>0){
            // Record the missing cashflow entry
            DB.cashflow.push({id:uid(),desc:'Opening balance cleared — '+cust.name+' via overpayment on Invoice #'+inv.invoiceNum,amount:toRecord,type:'in',cat:'Sales',payMode:inv.payMode||'transfer',bankId:inv.bankId||null,posId:inv.posId||null,date:inv.date,month:inv.month});
            // Record the missing credit payment entry
            DB.creditPayments.push({id:uid(),custId:cust.id,custName:cust.name,amount:toRecord,payMode:inv.payMode||'transfer',bankId:inv.bankId||null,posId:inv.posId||null,date:inv.date,month:inv.month,by:'System repair',note:'Opening balance cleared via overpayment on Invoice #'+inv.invoiceNum});
            covered+=toRecord;
            repaired=true;
          }
        }
      });
    }
  });
  if(repaired){
    saveData();
    console.log('✅ Opening balance clearances repaired and saved.');
  }
}
/* ── End repair ─────────────────────────────────────────────── */

window.onload=function(){
  applyDarkMode();
  loadData();
  // Run data repair for opening balance clearances not recorded in cashflow
  setTimeout(repairOpeningBalanceClearances, 2000);
  // Check backup reminder every minute
  setInterval(function(){
    if(DB.currentUser)checkBackupReminder();
  },60000);

  // ── Offline / Online handling ──────────────────────────────
  window.addEventListener('offline',function(){
    updateSyncStatus('offline');
    showOfflineBanner(true);
  });
  window.addEventListener('online',function(){
    showOfflineBanner(false);
    updateSyncStatus('connecting');
    // Flush any pending local saves to Firebase per-collection
    var pending=localStorage.getItem(STORAGE_KEY+'_pending');
    if(pending){
      GCE_COLLECTIONS.forEach(function(c){ fbDirtyCollections.add(c); });
      fbSyncDirty(function(ok){
        if(ok){
          fbLastSync=new Date();
          updateSyncStatus('synced');
          localStorage.removeItem(STORAGE_KEY+'_pending');
          showToast('✅ Back online — all changes synced to Firebase!');
        } else {
          updateSyncStatus('error');
        }
      });
    } else {
      startFirebaseListener();
    }
  });
};
