<style>
:root{
  /* ── Bootstrap Professional Standard Palette ── */
  --bg:#f8f9fa;
  --sidebar:#343a40;
  --sidebar-border:#2c3136;
  --sidebar-hover:#3d4349;
  --sidebar-active:#2c3136;
  --surface:#ffffff;
  --surface2:#f8f9fa;
  --surface3:#e9ecef;
  --border:#dee2e6;
  --border2:#e9ecef;
  --text:#212529;
  --text2:#495057;
  --text3:#6c757d;

  /* Bootstrap semantic colors */
  --primary:#0d6efd;
  --primary-dark:#0b5ed7;
  --primary-bg:#e7f1ff;
  --secondary:#6c757d;
  --secondary-bg:#f8f9fa;
  --success:#198754;
  --success-bg:#d1e7dd;
  --danger:#dc3545;
  --danger-bg:#f8d7da;
  --warning:#ffc107;
  --warning-bg:#fff3cd;
  --warning-text:#664d03;
  --info:#0dcaf0;
  --info-dark:#0aa2c0;
  --info-bg:#cff4fc;
  --info-text:#055160;
  --dark:#343a40;
  --light:#f8f9fa;
  --white:#ffffff;

  /* Accent = Primary blue for highlights */
  --accent:var(--primary);
  --accent2:var(--primary-dark);
  --accent-glow:rgba(13,110,253,.15);

  /* Alias mappings */
  --blue:var(--primary);
  --blue-bg:var(--primary-bg);
  --green:var(--success);
  --green-bg:var(--success-bg);
  --red:var(--danger);
  --red-bg:var(--danger-bg);
  --amber:var(--warning-text);
  --amber-bg:var(--warning-bg);
  --purple:#6f42c1;
  --purple-bg:#e8e0f8;

  --radius:8px;--radius-sm:6px;--radius-lg:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 25px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.08);
  --font:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100vh}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ===== LAYOUT ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:235px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.main{margin-left:235px;flex:1;display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.65rem 1.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.page-content{padding:1.5rem;max-width:1320px;flex:1}

/* ===== SIDEBAR ===== */
.sidebar-logo{padding:1.1rem 1rem 1rem;border-bottom:1px solid var(--sidebar-border);display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:.5px;flex-shrink:0;box-shadow:0 2px 8px var(--accent-glow)}
.logo-text{font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.logo-sub{font-size:9.5px;color:#adb5bd;font-weight:400}
.sidebar-section{padding:.4rem 0;border-bottom:1px solid var(--sidebar-border)}
.sidebar-label{font-size:9px;font-weight:700;color:#868e96;text-transform:uppercase;letter-spacing:.1em;padding:.5rem 1rem .25rem}
.nav-item{display:flex;align-items:center;gap:9px;padding:.5rem .875rem;cursor:pointer;font-size:12.5px;font-weight:400;color:#adb5bd;transition:all .15s;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item:hover{color:#fff;background:var(--sidebar-hover)}
.nav-item.active{color:#fff;background:var(--primary);font-weight:600}
.nav-item.active:hover{background:var(--primary-dark)}
.nav-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0;opacity:.9}
.nav-badge{margin-left:auto;font-size:9.5px;padding:1px 7px;border-radius:99px;background:var(--danger);color:#fff;font-weight:700}
.sidebar-bottom{margin-top:auto;padding:.75rem;border-top:1px solid var(--sidebar-border)}
.user-block{display:flex;align-items:center;gap:9px;padding:.6rem .75rem;background:rgba(255,255,255,.07);border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.user-block:hover{background:rgba(255,255,255,.13)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:9.5px;color:#adb5bd}

/* ===== TOPBAR ===== */
.topbar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:14.5px;font-weight:700;color:var(--dark)}
.save-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--success)}
.save-dot-circle{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* ===== BUTTONS ===== */
.btn{font-size:12.5px;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-family:var(--font);font-weight:500;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow)}
.btn:hover{background:var(--surface3);border-color:#ced4da;color:var(--text)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px var(--accent-glow)}
.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.btn.success:hover{background:#157347;border-color:#146c43}
.btn.danger{background:var(--white);color:var(--danger);border-color:#f5c2c7;font-size:12px;padding:5px 10px}
.btn.danger:hover{background:var(--danger-bg)}
.btn.info{background:var(--white);color:var(--primary);border-color:#b6d4fe;font-size:12px;padding:5px 10px}
.btn.info:hover{background:var(--primary-bg)}
.btn.secondary{background:var(--secondary);color:#fff;border-color:var(--secondary)}
.btn.secondary:hover{background:#5a6268}
.btn.sm{font-size:11.5px;padding:4px 10px}
.btn.lg{font-size:14px;padding:9px 20px}

/* ===== METRICS ===== */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:1.5rem}
.mc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.125rem;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s}
.mc:hover{box-shadow:var(--shadow-md)}
.mc::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--primary);border-radius:var(--radius-lg) 0 0 var(--radius-lg)}
.ml{font-size:10.5px;color:var(--text3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mv{font-size:22px;font-weight:700;color:var(--dark);line-height:1}
.mv.green{color:var(--success)}.mv.red{color:var(--danger)}.mv.amber{color:#856404}
.ms{font-size:10.5px;color:var(--text3);margin-top:4px}

/* ===== TABLES ===== */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem;background:var(--white);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--text3);padding:9px 13px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}
td{padding:9px 13px;border-bottom:1px solid var(--border2);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f1f3ff}

/* ===== FORMS ===== */
.form-group label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:13px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid #ced4da;background:var(--white);color:var(--text);font-family:var(--font);transition:all .15s;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
input::placeholder{color:#adb5bd}
input.inline-edit{border:1.5px solid var(--primary);border-radius:5px;padding:4px 7px;font-size:12px;width:90px}
.fg{display:grid;gap:10px;align-items:end;margin-bottom:1.25rem}
.fg.c2{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr 1fr}
.fg.c4{grid-template-columns:1fr 1fr 1fr 1fr}.fg.c5{grid-template-columns:1fr 1fr 1fr 1fr auto}

/* ===== BADGES ===== */
.badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;font-weight:600;letter-spacing:.02em}
.badge.ok{background:var(--success-bg);border:1px solid #a3cfbb}
.badge.low{background:var(--warning-bg);color:var(--warning-text);border:1px solid #ffe69c}
.badge.out{background:var(--danger-bg);color:#58151c;border:1px solid #f1aeb5}
.badge.owing{background:var(--danger-bg);color:#58151c;border:1px solid #f1aeb5}
.badge.info{background:var(--primary-bg);color:#084298;border:1px solid #b6d4fe}
.badge.walk{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.badge.purple{background:var(--purple-bg);color:#432874;border:1px solid #d0bdf8}

/* ===== CARDS ===== */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.125rem 1.25rem;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-title{font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';display:inline-block;width:3px;height:13px;background:var(--primary);border-radius:2px}

/* ===== ALERTS ===== */
.alert{background:var(--warning-bg);border:1px solid #ffe69c;border-radius:var(--radius-sm);padding:.7rem 1rem;font-size:12.5px;color:var(--warning-text);margin-bottom:.75rem}
.alert.danger{background:var(--danger-bg);border-color:#f1aeb5;color:#58151c}
.alert.info{background:var(--primary-bg);border-color:#b6d4fe;color:#084298}
.alert.success{background:var(--success-bg);border-color:#a3cfbb}

/* ===== MISC ===== */
.profit-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.profit-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border2);font-size:13px;color:var(--text2)}
.profit-row:last-child{border-bottom:none;font-weight:700;font-size:14px;color:var(--dark)}
.ledger-row{display:flex;justify-content:space-between;padding:9px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:5px;border:1px solid transparent}
.ledger-row.in{background:var(--success-bg);border-color:#a3cfbb}
.ledger-row.out{background:var(--danger-bg);border-color:#f1aeb5;color:var(--text2)}
.empty{text-align:center;padding:3rem 2rem;color:var(--text3);font-size:13px}
.reminder-banner{background:var(--danger-bg);border:1px solid #f1aeb5;border-radius:var(--radius-sm);padding:.7rem 1.25rem;margin-bottom:1rem;font-size:13px;color:#58151c;display:flex;justify-content:space-between;align-items:center}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-label{min-width:100px;color:var(--text3);text-align:right;font-size:11px}
.bar-track{flex:1;background:var(--surface3);border-radius:99px;height:20px;overflow:hidden}
.bar-fill{height:20px;border-radius:99px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;background:linear-gradient(90deg,var(--primary),#0dcaf0)}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.perm-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.perm-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--primary)}
.sale-summary{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem;margin:8px 0;font-size:13px}
.sale-summary-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--text2)}
.sale-summary-row.total{font-weight:700;border-top:1px solid var(--border);margin-top:5px;padding-top:7px;color:var(--dark)}
.cust-bar-wrap{background:var(--surface3);border-radius:99px;height:6px;margin:8px 0 4px;overflow:hidden}
.cust-bar{height:6px;border-radius:99px;transition:width .4s}
.pay-form{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:10px}
.count-status{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.count-status.match{background:var(--success-bg)}
.count-status.diff{background:var(--danger-bg);color:#58151c}
.count-status.pending{background:var(--warning-bg);color:var(--warning-text)}
.section-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.125rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.cust-detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px}
.cust-detail-label{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.cust-detail-val{font-size:13px;font-weight:600;color:var(--dark)}
.ctype-toggle{display:flex;gap:10px;margin-bottom:1rem}
.ctype-btn{flex:1;padding:11px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--white);cursor:pointer;text-align:center;transition:all .15s;box-shadow:var(--shadow)}
.ctype-btn:hover{border-color:#b6d4fe;background:var(--primary-bg)}
.ctype-btn.active{border-color:var(--primary);background:var(--primary-bg)}
.ctype-label{font-size:13px;font-weight:600;color:var(--dark)}
.ctype-btn.active .ctype-label{color:var(--primary)}
.ctype-sub{font-size:11px;color:var(--text3);margin-top:2px}
.ctype-btn.active .ctype-sub{color:var(--primary)}
.subtabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.subtab{font-size:12px;padding:5px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;box-shadow:var(--shadow)}
.subtab:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.subtab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px var(--accent-glow)}
.divider{border:none;border-top:1px solid var(--border);margin:1.25rem 0}

/* ===== AUTH ===== */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%)}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:2.5rem;width:400px;box-shadow:var(--shadow-lg)}
.auth-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:1.75rem}
.auth-logo{width:48px;height:48px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
.auth-title{font-size:20px;font-weight:700;color:var(--dark)}
.auth-sub{font-size:12.5px;color:var(--text3);margin-top:2px}
.auth-hint{font-size:11px;color:var(--text3);margin-top:1.25rem;text-align:center;padding:.6rem;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}

/* ===== VERSION NOTES PANEL ===== */
.vn-panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.5rem;overflow:hidden;box-shadow:var(--shadow)}
.vn-header{display:flex;align-items:center;gap:10px;padding:.875rem 1.25rem;background:var(--dark);border-bottom:1px solid var(--sidebar-border)}
.vn-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--primary);color:#fff;letter-spacing:.04em}
.vn-title{font-size:13px;font-weight:600;color:#fff}
.vn-date{font-size:11px;color:#adb5bd;margin-left:auto}
.vn-body{padding:1rem 1.25rem}
.vn-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vn-list li{font-size:12px;color:var(--text2);display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.vn-list li::before{content:'▸';color:var(--primary);font-size:10px;margin-top:2px;flex-shrink:0}
.vn-history{padding:0 1.25rem 1rem;border-top:1px solid var(--border)}
.vn-history-item{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-top:1px solid var(--border2);font-size:12px;color:var(--text3)}
.vn-history-ver{font-weight:700;color:var(--text2);min-width:35px}

/* ===== FIREBASE SYNC ===== */
.fb-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99999;display:none}
.fb-modal{background:var(--white);border-radius:14px;padding:2rem;width:520px;max-width:95vw;box-shadow:var(--shadow-lg)}
.fb-modal h2{font-size:17px;font-weight:700;color:var(--dark);margin-bottom:6px}
.fb-modal p{font-size:12.5px;color:var(--text2);margin-bottom:1rem;line-height:1.6}
.fb-step{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;margin-bottom:10px;font-size:12.5px;color:var(--text2)}
.fb-step b{color:var(--dark);display:block;margin-bottom:3px;font-size:13px}
.fb-step code{background:var(--surface3);padding:1px 6px;border-radius:4px;font-size:11.5px;color:var(--primary)}
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:var(--white);cursor:default}
.sync-badge.connected{border-color:#a3cfbb;background:var(--success-bg);color:#0a3622}
.sync-badge.error{border-color:#f1aeb5;background:var(--danger-bg);color:#58151c}
.sync-badge.local{border-color:var(--border);color:var(--text3)}

/* ===== PRINT ===== */
@media print{
  .sidebar,.topbar,.no-print,.reminder-banner{display:none!important}
  .main{margin-left:0}
  body{background:#fff;color:#000}
}
</style>

// Parse stored date strings correctly regardless of locale format.
// Sales/expenses store dates as toLocaleDateString() e.g. "07/05/2026" (DD/MM/YYYY in Nigeria).
// Date filter inputs give "YYYY-MM-DD". This function handles both.
function parseDate(str){
  if(!str)return null;
  str=str.trim();
  // ISO format YYYY-MM-DD from date input
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)){
    var p=str.split('-');
    return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  }
  // Handle M/D/YYYY or MM/DD/YYYY or DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)){
    var pts=str.split('/');
    var a=parseInt(pts[0]),b=parseInt(pts[1]),yr=parseInt(pts[2]);
    // Detect locale: if first part > 12 it must be DD/MM/YYYY
    // If second part > 12 it must be MM/DD/YYYY
    // Otherwise default to toLocaleDateString() which on most devices is M/D/YYYY
    if(a>12){return new Date(yr,b-1,a);} // definitely DD/MM
    if(b>12){return new Date(yr,a-1,b);} // definitely MM/DD
    // Ambiguous — use a test to detect locale
    var testDate=new Date().toLocaleDateString();
    var testParts=testDate.split('/');
    if(testParts.length===3&&parseInt(testParts[0])===new Date().getMonth()+1){
      // Locale is M/D/YYYY (US style) — treat as MM/DD/YYYY
      return new Date(yr,a-1,b);
    }
    // Default: treat as DD/MM/YYYY (Nigerian locale)
    return new Date(yr,b-1,a);
  }
  // Try native parse as last resort
  var d=new Date(str);
  return isNaN(d.getTime())?null:d;
}

// Compare a stored date string against a filter date string (YYYY-MM-DD from input)
function dateInRange(storedDateStr, fromStr, toStr){
  var d=parseDate(storedDateStr);
  if(!d)return true; // can't parse → don't filter out
  if(fromStr){var f=parseDate(fromStr);if(f&&d<f)return false;}
  if(toStr){var t=parseDate(toStr);if(t){t.setHours(23,59,59,999);if(d>t)return false;}}
  return true;
}

var STORAGE_KEY = 'gce_business_data';

var fbApp = null;
var fbDb  = null;

var fbConnected  = false;
var fbUnsubscribe = null;
var fbSaveTimer  = null;
var fbLastSync   = null;
var fbLastOwnSaveTime = 0;

// ---- Initialise Firebase ----
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') { console.warn('Firebase SDK not loaded'); return false; }
    if (firebase.apps && firebase.apps.length > 0) {
      fbApp = firebase.apps[0];
    } else {
      fbApp = firebase.initializeApp(GCE_FIREBASE_CONFIG);
    }
    fbDb = firebase.firestore(fbApp);
    fbDb.enablePersistence({ synchronizeTabs: true }).catch(function(e) {
      console.log('Offline persistence not enabled:', e.code);
    });
    fbConfigured = true;
    startFirebaseListener();
    return true;
  } catch(e) {
    console.error('Firebase init failed:', e);
    return false;
  }
}

// ---- Real-time listener ----
var fbLastSavedAt = null;
function startFirebaseListener() {
  if (!fbDb) return;
  if (fbUnsubscribe) { try { fbUnsubscribe(); } catch(e) {} }
  updateSyncStatus('connecting');
  fbUnsubscribe = fbDb.doc(FB_DOC_PATH).onSnapshot(function(doc) {
    fbConnected = true;
    if (!doc.exists) { updateSyncStatus('synced'); return; }
    var snapshot = doc.data();
    if (!snapshot) { updateSyncStatus('synced'); return; }
    // Ignore our own saves - check device ID
    if (snapshot._deviceId === FB_DEVICE_ID) { updateSyncStatus('synced'); return; }
    // Ignore if this is the same data we already have (same timestamp)
    if (snapshot._savedAt && snapshot._savedAt === fbLastSavedAt) { updateSyncStatus('synced'); return; }
    // Ignore updates within 8 seconds of our own save (Firebase echo buffer)
    if (Date.now() - fbLastOwnSaveTime < 8000) { updateSyncStatus('synced'); return; }
    // Only update if the remote data is actually newer than what we have
    if (snapshot._savedAt && DB._savedAt && snapshot._savedAt <= DB._savedAt) { updateSyncStatus('synced'); return; }
    // This is a genuine update from another device - apply it
    fbLastSavedAt = snapshot._savedAt;
    applySnapshot(snapshot);
    fbLastSync = new Date();
    updateSyncStatus('synced');
    // Only re-render if user is not actively typing/interacting
    var active = document.activeElement;
    var isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
    if (!isTyping) {
      renderApp();
    } else {
      // Queue a render for when user finishes
      clearTimeout(window._fbRenderTimer);
      window._fbRenderTimer = setTimeout(renderApp, 3000);
    }
  }, function(error) {
    fbConnected = false;
    console.error('Firebase listener error:', error);
    updateSyncStatus('error');
  });
}

// ---- Sync status indicator ----
function updateSyncStatus(status) {
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  var icons   = { synced:'🟢', saving:'🔄', connecting:'🔵', error:'🔴', local:'💾' };
  var labels  = { synced:'Synced', saving:'Saving...', connecting:'Connecting...', error:'Sync error', local:'Local only' };
  var time    = (fbLastSync && status === 'synced') ? ' · ' + fbLastSync.toLocaleTimeString() : '';
  el.innerHTML = '<span style="font-size:12px">' + (icons[status]||'⚪') + ' ' + (labels[status]||status) + time + '</span>';
  el.className = 'sync-badge ' + (status === 'synced' ? 'connected' : status === 'error' ? 'error' : 'local');
}

// ---- saveData: writes to Firestore + localStorage ----
function saveData() {
  var snapshot = buildSnapshot();
  // Track our own savedAt for comparison
  DB._savedAt = snapshot._savedAt;
  fbLastSavedAt = snapshot._savedAt;
  // Always save locally first
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch(e) {}

  if (!fbConfigured || !fbDb) { updateSyncStatus('local'); return; }

  fbLastOwnSaveTime = Date.now();
  snapshot._deviceId = FB_DEVICE_ID;
  updateSyncStatus('saving');
  clearTimeout(fbSaveTimer);
  fbSaveTimer = setTimeout(function() {
    fbDb.doc(FB_DOC_PATH).set(snapshot)
      .then(function() { fbLastSync = new Date(); updateSyncStatus('synced'); })
      .catch(function(e) { console.error('Firebase save failed:', e); updateSyncStatus('error'); });
  }, 400);
}

// ---- loadData: localStorage first, then Firebase listener updates live ----
function loadData() {
  // Load from localStorage immediately so app works offline
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var snapshot = JSON.parse(raw);
      if (snapshot) applySnapshot(snapshot);
    }
  } catch(e) {
    console.warn('Could not load from localStorage:', e);
  }
  // Connect to Firebase (listener will update if newer data exists)
  if (typeof firebase !== 'undefined') {
    initFirebase();
  }
  renderAuth();
}

function applySnapshot(snapshot) {
  if (!snapshot) return;
  DB.users = snapshot.users || DB.users;
  DB.inventory = snapshot.inventory || [];
  DB.sales = snapshot.sales || [];
  DB.purchases = snapshot.purchases || [];
  DB.cashflow = snapshot.cashflow || [];
  DB.suppliers = snapshot.suppliers || [];
  DB.customers = snapshot.customers || [];
  DB.creditCustomers = snapshot.creditCustomers || [];
  DB.adjLog = snapshot.adjLog || [];
  DB.salesReturns = snapshot.salesReturns || [];
  DB.transferLog = snapshot.transferLog || [];
  DB.warehouse = snapshot.warehouse || [];
  DB.stockCounts = snapshot.stockCounts || [];
  DB.banks = snapshot.banks || DB.banks;
  DB.posTerminals = snapshot.posTerminals || DB.posTerminals;
  DB.categories = snapshot.categories || DB.categories;
  DB.expenseCats = snapshot.expenseCats || DB.expenseCats;
  DB.invoiceCounter = snapshot.invoiceCounter || DB.invoiceCounter;
  DB.drafts = snapshot.drafts || [];
  DB.pendingDeliveries = snapshot.pendingDeliveries || [];
}

function buildSnapshot() {
  var now = new Date().toISOString();
  DB._savedAt = now;
  return {
    users: DB.users, inventory: DB.inventory, sales: DB.sales,
    purchases: DB.purchases, cashflow: DB.cashflow, drafts: DB.drafts || [],
    pendingDeliveries: DB.pendingDeliveries || [],
    suppliers: DB.suppliers, customers: DB.customers,
    creditCustomers: DB.creditCustomers, adjLog: DB.adjLog, salesReturns: DB.salesReturns,
    transferLog: DB.transferLog, warehouse: DB.warehouse,
    stockCounts: DB.stockCounts, banks: DB.banks,
    posTerminals: DB.posTerminals, categories: DB.categories,
    expenseCats: DB.expenseCats,
    invoiceCounter: DB.invoiceCounter,
    _savedAt: now,
  };
}

function exportBackup() {
  var snapshot = buildSnapshot();
  snapshot.exportedAt = new Date().toISOString();
  snapshot.version = 'v18';
  var blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'gce_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var snapshot = JSON.parse(e.target.result);
      if (!snapshot.inventory && !snapshot.sales) { alert('Invalid backup file.'); return; }
      if (!confirm('This will replace ALL current data with the backup. Continue?')) return;
      applySnapshot(snapshot);
      saveData();
      alert('Backup restored! Exported on: ' + (snapshot.exportedAt || 'unknown date'));
      renderApp();
    } catch(ex) { alert('Failed to read backup. Make sure it is a valid JSON backup.'); }
  };
  reader.readAsText(file);
}

function processTransfer(direction){
  var fromStore=direction==='to_warehouse'?DB.inventory:DB.warehouse;
  var toStore=direction==='to_warehouse'?DB.warehouse:DB.inventory;
  var fromLabel=direction==='to_warehouse'?'Shop':'Warehouse';
  var toLabel=direction==='to_warehouse'?'Warehouse':'Shop';
  var note=document.getElementById('tr-note').value.trim();
  var waybill=document.getElementById('tr-waybill').value.trim();
  if(!waybill){alert('Please enter a Waybill Number.');return;}
  var date=new Date().toLocaleDateString();
  var transferred=[];
  fromStore.forEach(function(fromItem){
    var inp=document.getElementById('tr-qty-'+fromItem.id);
    var qty=parseInt(inp?inp.value:0)||0;
    if(qty<=0)return;
    if(qty>fromItem.qty)qty=fromItem.qty;
    var toItem=toStore.find(function(i){return i.name.toLowerCase()===fromItem.name.toLowerCase();});
    if(toItem){toItem.qty+=qty;}
    else{toStore.push({id:uid(),name:fromItem.name,qty:qty,cost:fromItem.cost,sell:fromItem.sell,minQty:fromItem.minQty||1,supId:fromItem.supId,cat:fromItem.cat});}
    fromItem.qty=Math.max(0,fromItem.qty-qty);
    transferred.push({name:fromItem.name,qty:qty});
    DB.transferLog.push({id:uid(),date:date,direction:direction,itemName:fromItem.name,itemCat:fromItem.cat||'',qty:qty,waybill:waybill,note:note,by:DB.currentUser.name});
  });
  if(!transferred.length){alert('Enter at least one qty to transfer.');return;}
  saveData();
  document.getElementById('transfer-modal').remove();
  renderApp();
  alert('✅ Transfer complete!\n\n'+transferred.map(function(t){return t.name+' × '+t.qty;}).join('\n')+'\n\n'+fromLabel+' → '+toLabel);
}

function filterWhTable(){
  var term=whSearch.toLowerCase().trim();

  if(!tbody)return;
  tbody.querySelectorAll('tr[data-wh-name]').forEach(function(row){
    var name=row.getAttribute('data-wh-name')||'';
    var cat=row.getAttribute('data-wh-cat')||'';
    row.style.display=(!term||name.indexOf(term)>-1||cat.indexOf(term)>-1)?'':'none';
  });
}

  if(activeTab==='inventory'&&invSearch){setTimeout(filterInventoryTable,0);}

}

function getCatOpts(sel){var o=DB.categories.slice().reverse().map(function(c){return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+c+'</option>';}).join('');return '<option value="">-- Category --</option>'+o+'<option value="__new__">+ New category...</option>';}
function handleCatChange(s,nid){var ni=document.getElementById(nid);if(ni)ni.style.display=s==='__new__'?'block':'none';}
function resolveCategory(sid,nid){
  var s=document.getElementById(sid);if(!s)return '';
  if(s.value==='__new__'){
    var ni=document.getElementById(nid);var nc=ni?ni.value.trim():'';
    if(!nc){alert('Enter a name for the new category.');return null;}
    var dup=DB.categories.find(function(c){return c.toLowerCase()===nc.toLowerCase();});
    if(dup){alert('Category "'+dup+'" already exists. Please select it from the list.');return null;}
    DB.categories.push(nc);return nc;
  }
  return s.value;
}
function addItem(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('Item name is required.');return;}
  var dupItem=DB.inventory.find(function(i){return i.name.toLowerCase()===name.toLowerCase();});
  if(dupItem){alert('An item named "'+dupItem.name+'" already exists.\n\nTo add more stock, use Stock Management \u2192 Stock Adjustment instead.');return;}
  var qty=parseInt(document.getElementById('f-qty').value)||0,cost=parseFloat(document.getElementById('f-cost').value)||0,sell=parseFloat(document.getElementById('f-sell').value)||0,minQty=parseInt(document.getElementById('f-minqty').value)||5,supId=document.getElementById('f-supplier').value;
  var cat=resolveCategory('f-cat','f-cat-new');
  if(cat===null)return;
  if(cost<=0){alert('\u274c Cost price is required.');return;}
  if(sell<=0){alert('\u274c Selling price is required.');return;}
  if(sell<cost){alert('\u274c Selling price ('+fmt(sell)+') cannot be less than cost price ('+fmt(cost)+').');return;}
  DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
  ['f-name','f-qty','f-cost','f-sell','f-minqty'].forEach(function(id){document.getElementById(id).value='';});renderApp();
}

function filterInventoryTable(){

  var countEl=document.getElementById('inv-search-count');
  var clearBtn=document.getElementById('inv-clear-btn');
  if(!tbody)return;
  var rows=tbody.querySelectorAll('tr');
  var visible=0;
  rows.forEach(function(row){
    if(row.getAttribute('data-empty')){
      row.style.display=term?'none':'';
      return;
    }
    var name=(row.getAttribute('data-name')||'').toLowerCase();
    var cat=(row.getAttribute('data-cat')||'').toLowerCase();
    var sup=(row.getAttribute('data-sup')||'').toLowerCase();
    var match=!term||name.indexOf(term)>-1||cat.indexOf(term)>-1||sup.indexOf(term)>-1;
    row.style.display=match?'':'none';
    if(match)visible++;
  });
  if(countEl){
    var total=rows.length-(rows[rows.length-1]&&rows[rows.length-1].getAttribute('data-empty')?1:0);
    countEl.textContent=term?(visible+' of '+total+' items'):(total+' item'+(total!==1?'s':''));

}

// Dynamically load SheetJS from multiple CDN fallbacks
function loadXLSX(callback){
  if(typeof XLSX!=='undefined'){callback(null);return;}
  var cdns=[
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  var idx=0;
  function tryNext(){
    if(idx>=cdns.length){callback(new Error('Could not load Excel library. Please check your internet connection and try again.'));return;}
    var s=document.createElement('script');
    s.src=cdns[idx++];
    s.onload=function(){callback(null);};
    s.onerror=function(){tryNext();};
    document.head.appendChild(s);
  }
  tryNext();
}

function importInventoryExcel(file){
  if(!file)return;
  loadXLSX(function(err){
    if(err){alert(err.message);return;}
    var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){alert('The file appears empty. Make sure it has a header row and at least one item.');return;}

      // Detect header row — find the row containing "Item Name" or "Name"
      var headerRow=0;
      for(var r=0;r<Math.min(5,rows.length);r++){
        var rStr=rows[r].join('|').toLowerCase();
        if(rStr.indexOf('item')!==-1||rStr.indexOf('name')!==-1){headerRow=r;break;}
      }
      var headers=rows[headerRow].map(function(h){return String(h).toLowerCase().trim();});

      // Map columns flexibly
      function col(keywords){
        for(var i=0;i<headers.length;i++){
          for(var j=0;j<keywords.length;j++){
            if(headers[i].indexOf(keywords[j])!==-1)return i;
          }
        }
        return -1;
      }
      var cName=col(['item name','name','product','description','item']);
      var cCat=col(['category','cat','type','group']);
      var cQty=col(['qty','quantity','stock','units']);
      var cMinQty=col(['min qty','minimum','min stock','reorder','restock']);
      var cCost=col(['cost price','cost','buy price','buying price','purchase price','buying','buy']);
      var cSell=col(['sell price','selling price','sale price','sell','selling','sale']);
      var cSup=col(['supplier','vendor','sup']);

      // If both cost and sell resolve to the same column, try to fix by position
      // Template order: Item Name, Category, Qty, Min Qty, Cost Price, Sell Price, Supplier
      if(cCost===cSell){
        // Find all columns containing 'price' and assign by order
        var priceCols=[];
        for(var pi=0;pi<headers.length;pi++){if(headers[pi].indexOf('price')!==-1)priceCols.push(pi);}
        if(priceCols.length>=2){cCost=priceCols[0];cSell=priceCols[1];}
      }
      var cSup=col(['supplier','vendor','sup']);

      if(cName===-1){alert('Could not find an "Item Name" column. Make sure your Excel file has a column named "Item Name" or "Name".');return;}
      if(cCost===-1){alert('Could not find a "Cost Price" column. Make sure you have a column named "Cost" or "Cost Price".');return;}
      if(cSell===-1){alert('Could not find a "Sell Price" column. Make sure you have a column named "Sell" or "Sell Price".');return;}

      var modeEl=document.querySelector('input[name="inv-import-mode"]:checked');
      var importMode=window._importMode||(modeEl?modeEl.value:'skip');
      window._importMode=null;

      var added=0,skipped=0,updated=0;
      var skippedNames=[];
      var results=[];

      for(var i=headerRow+1;i<rows.length;i++){
        var row=rows[i];
        var name=String(row[cName]||'').trim();
        if(!name)continue; // skip empty rows

        var cost=parseFloat(row[cCost])||0;
        var sell=parseFloat(row[cSell])||0;
        var qty=parseInt(row[cQty])||0;
        var minQty=parseInt(row[cMinQty])||5;
        var cat=cCat>=0?String(row[cCat]||'').trim():'';
        var supName=cSup>=0?String(row[cSup]||'').trim():'';

        if(cost<=0){skipped++;skippedNames.push(name+' (no cost price)');continue;}
        if(sell<=0){skipped++;skippedNames.push(name+' (no sell price)');continue;}

        // Add category if new
        if(cat&&!DB.categories.find(function(c){return c.toLowerCase()===cat.toLowerCase();})){
          DB.categories.push(cat);
        }

        // Find supplier ID by name
        var supId='';
        if(supName){
          var sup=DB.suppliers.find(function(s){return s.name.toLowerCase()===supName.toLowerCase();});
          if(sup)supId=sup.id;
        }

        // Check for duplicate
        var existing=DB.inventory.find(function(inv){return inv.name.toLowerCase()===name.toLowerCase();});
        if(existing){
          if(importMode==='skip'){
            // Leave existing item completely untouched
            skipped++;skippedNames.push(name+' (already exists — skipped)');
          } else if(importMode==='prices'){
            // Only update cost and sell price — never touch qty, minQty, cat, supplier
            existing.cost=cost;existing.sell=sell;
            updated++;results.push({name:name,status:'prices updated'});
          } else {
            // 'full' mode — update everything
            existing.cost=cost;existing.sell=sell;existing.qty=qty;existing.minQty=minQty;
            if(cat)existing.cat=cat;if(supId)existing.supId=supId;
            updated++;results.push({name:name,status:'fully updated'});
          }
        } else {
          DB.inventory.push({id:uid(),name:name,qty:qty,cost:cost,sell:sell,minQty:minQty,supId:supId,cat:cat});
          added++;results.push({name:name,status:'added'});
        }
      }

      saveData();
      var modeDesc=importMode==='skip'?'New items added only (existing untouched)':importMode==='prices'?'New items added + prices updated on existing items':'New items added + existing items fully updated';
      var msg='✅ Import complete!\n\n'+
        'Mode: '+modeDesc+'\n\n'+
        '• '+added+' new item(s) added\n'+
        (updated>0?'• '+updated+' existing item(s) '+( importMode==='prices'?'had prices updated':'were fully updated')+'\n':'')+
        (skipped>0?'• '+skipped+' row(s) skipped:\n  '+skippedNames.slice(0,10).join('\n  ')+(skippedNames.length>10?'\n  ...and '+(skippedNames.length-10)+' more':''):'');
      alert(msg);
      // Reset file input so same file can be re-imported with different mode
      var fileInput=document.getElementById('inv-import-file');if(fileInput)fileInput.value='';
      renderApp();
    }catch(ex){
      alert('Failed to read the Excel file.\n\nError: '+ex.message+'\n\nMake sure the file is a valid .xlsx or .csv file.');
    }
  };
  reader.readAsArrayBuffer(file);
  }); // end loadXLSX
}

function startCount(){countSession=DB.inventory.map(function(i){return{id:i.id,name:i.name,systemQty:i.qty,countedQty:null};});countStarted=true;renderApp();}
function saveCount(){if(!countSession.every(function(c){return c.countedQty!==null&&!isNaN(c.countedQty);})){alert('Enter qty for all items.');return;}var date=new Date().toLocaleDateString();var details=[];countSession.forEach(function(c){var item=DB.inventory.find(function(i){return i.id===c.id;});if(!item)return;var diff=parseInt(c.countedQty)-c.systemQty;details.push({id:c.id,name:item.name,systemQty:c.systemQty,countedQty:parseInt(c.countedQty),diff:diff});if(diff!==0){DB.adjLog.push({id:uid(),itemId:c.id,itemName:item.name,type:'count',reason:'Stock count',before:c.systemQty,change:diff,after:parseInt(c.countedQty),date:date,by:DB.currentUser.name});item.qty=parseInt(c.countedQty);}});DB.stockCounts.push({id:uid(),date:date,items:countSession.length,variances:details.filter(function(d){return d.diff!==0;}).length,by:DB.currentUser.name,details:details});countSession=[];countStarted=false;saveData();renderApp();}

function saveCatCount(cat){
  var catItems=DB.inventory.filter(function(i){return (i.cat||'Uncategorised')===cat;});
  var date=new Date().toLocaleDateString();
  var variances=0;
  var details=[];
  catItems.forEach(function(i){
    var inp=document.getElementById('cc-'+i.id);
    if(!inp||inp.value==='')return;
    var counted=parseInt(inp.value);
    if(isNaN(counted))return;
    var diff=counted-i.qty;
    details.push({id:i.id,name:i.name,systemQty:i.qty,countedQty:counted,diff:diff});
    if(diff!==0){
      DB.adjLog.push({id:uid(),itemId:i.id,itemName:i.name,type:'count',reason:'Category count: '+cat,before:i.qty,change:diff,after:counted,date:date,by:DB.currentUser.name});
      i.qty=counted;variances++;
    }
  });
  DB.stockCounts.push({id:uid(),date:date,items:catItems.length,variances:variances,by:DB.currentUser.name,cat:cat,details:details});
  saveData();
  alert('✅ Stock count saved for category "'+cat+'".\n'+catItems.length+' items checked, '+variances+' variance(s) corrected.');
  renderApp();
}

}

  cust.name=name;

  cust.email=document.getElementById('ec-email').value.trim();
  cust.address=document.getElementById('ec-address').value.trim();
  cust.biz=document.getElementById('ec-biz').value.trim();
  cust.notes=document.getElementById('ec-notes').value.trim();
  cust.type=document.getElementById('ec-type').value;
  var newLimit=parseFloat(document.getElementById('ec-credit-limit').value)||0;
  cust.creditLimit=newLimit;
  saveData();
  alert('Customer updated successfully.');

  activeCustSub='profile';
  renderApp();
}

        '<div style="font-size:12px;color:#666;margin-top:2px">'+(cust.biz?cust.biz+' · ':'')+tb+' · '+balanceLabel+'</div></div></div>'+

  return nav+content;

function printCustomerInvoice(invNum,custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum&&s.custId==custId;});
  if(!invSales.length){alert('Invoice not found.');return;}
  var s0=invSales[0];
  var d=new Date(s0.date),day=d.getDate(),mon=d.getMonth()+1,yr=d.getFullYear();
  var rows=invSales.map(function(s,i){return '<tr><td class="center">'+(i+1)+'</td><td>'+s.name+'</td><td class="center">'+s.qty+'</td><td class="right">'+fmt(s.salePrice)+'</td><td class="right" style="background:#fff5f5">'+(s.discAmt>0?fmt(s.discAmt):'')+'</td><td class="right"><b>'+fmt(s.total)+'</b></td></tr>';}).join('');
  var grandTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var emptyRows='';for(var i=invSales.length;i<12;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  var html=buildInvoiceHTML({invoiceNum:invNum,custName:s0.printName||(cust?cust.name:'Unknown'),custAddr:cust?cust.address||'':'',day:day,month:mon,year:yr,rows:rows+emptyRows,grandTotal:grandTotal,payment:s0.payment,payMode:s0.payMode,bankId:s0.bankId,posId:s0.posId,seller:s0.seller,pendingSupply:s0.pendingSupply||false,wasEverPending:s0.wasEverPending||false,supplyDate:s0.supplyDate||null});
  var w=window.open('','_blank','width=600,height=850');w.document.write(html);w.document.close();setTimeout(function(){w.print();},500);
}

function printCustomerReport(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust)return;
  var custSales=DB.sales.filter(function(s){return s.custId==custId;});
  var invGroups={};custSales.forEach(function(s){var k=s.invoiceNum||s.id;if(!invGroups[k])invGroups[k]={invoiceNum:k,date:s.date,items:[],total:0,payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,seller:s.seller,_s:s};invGroups[k].items.push(s);invGroups[k].total+=s.total;});
  var invKeys=Object.keys(invGroups).sort();
  var rows=invKeys.map(function(k){var g=invGroups[k];var items=g.items.map(function(s){return s.name+' ×'+s.qty;}).join(', ');return '<tr><td>'+g.invoiceNum+'</td><td>'+g.date+'</td><td>'+items+'</td><td style="text-align:right">'+fmt(g.total)+'</td><td>'+(g.payment==='credit'?'Credit':'Cash')+' / '+payModeLabel(g)+'</td><td>'+g.seller+'</td></tr>';}).join('');

var invoiceItems=[]; // current invoice line items being built
var invoiceDrafts=DB.drafts||[]; // saved drafts

function saveDraft(){
  if(!invoiceItems.length){alert('Add at least one item before saving as draft.');return;}
  var invNum=document.getElementById('s-inv-num')?document.getElementById('s-inv-num').value.trim():'';
  var custId=null,custName='Walk-in';
  if(saleCustomerType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)custId=sel.value;var rc=DB.customers.find(function(c){return c.id==custId;});if(rc)custName=rc.name;}
  var draftId=uid();
  var draft={id:draftId,invoiceNum:invNum,custId:custId,custName:custName,custType:saleCustomerType,items:JSON.parse(JSON.stringify(invoiceItems)),savedAt:new Date().toLocaleString()};
  if(!DB.drafts)DB.drafts=[];
  DB.drafts.push(draft);
  invoiceItems=[];
  saveData();
  alert('Draft saved! Invoice items have been saved as a draft. You can load it later from the drafts list below.');
  renderApp();
}

function loadDraft(draftId){
  if(invoiceItems.length){if(!confirm('Loading a draft will clear your current invoice items. Continue?'))return;}
  var draft=DB.drafts.find(function(d){return d.id==draftId;});
  if(!draft){alert('Draft not found.');return;}
  invoiceItems=JSON.parse(JSON.stringify(draft.items));
  saleCustomerType=draft.custType||'walkin';
  DB.drafts=DB.drafts.filter(function(d){return d.id!==draftId;});
  saveData();
  renderApp();
  setTimeout(function(){
    if(draft.invoiceNum){var el=document.getElementById('s-inv-num');if(el)el.value=draft.invoiceNum;}
    if(draft.custId&&draft.custType==='registered'){var sel=document.getElementById('s-reg-customer');if(sel)sel.value=draft.custId;}
    renderInvoiceItems();
  },80);
}

function deleteDraft(draftId){
  if(!confirm('Delete this draft permanently?'))return;
  DB.drafts=DB.drafts.filter(function(d){return d.id!==draftId;});
  saveData();renderApp();
}

function addInvoiceItem(){
  var itemId=document.getElementById('inv-item').value;
  var qty=parseFloat(document.getElementById('inv-qty').value)||0;
  var price=parseFloat(document.getElementById('inv-price').value)||0;
  var item=DB.inventory.find(function(i){return i.id==itemId;});
  if(!item){alert('Select an item.');return;}
  // Enforce cost price exists
  if(!item.cost||item.cost<=0){
    alert('❌ Cannot sell "'+item.name+'"  -  this item has no cost price set.\n\nPlease go to Stock Management → Product Editing and set the cost price first before selling this item.');
    return;
  }
  if(qty<=0||qty>item.qty){alert('Invalid qty. Stock available: '+item.qty);return;}
  if(price<=0){alert('Enter a selling price.');return;}
  // Block selling below cost price (no per-item discount anymore  -  checked at invoice level)
  if(price<item.cost){
    var shortfall=item.cost-price;
    alert('❌ Selling price is below cost price!\n\nItem: '+item.name+'\nCost price: '+fmt(item.cost)+'\nYour selling price: '+fmt(price)+'\nShortfall per unit: '+fmt(shortfall)+'\n\nYou cannot sell below cost price. Please increase the selling price.');
    return;
  }
  var subtotal=price*qty;
  var profit=(price-item.cost)*qty;
  invoiceItems.push({lineId:uid(),itemId:item.id,name:item.name,cost:item.cost,qty:qty,price:price,discAmt:0,total:subtotal,profit:profit});
  document.getElementById('inv-qty').value='';document.getElementById('inv-price').value='';
  document.getElementById('inv-item').value='';
  var s=document.getElementById('inv-item-search');if(s)s.value='';
  renderInvoiceItems();
}

var MAX_INVOICE_DISC_PCT=5; // Maximum allowed invoice discount percentage

function calcInvoiceDiscount(){
  var subtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var discType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var discValInput=document.getElementById('inv-disc-val');
  var discVal=parseFloat(discValInput?discValInput.value:0)||0;
  var warningEl=document.getElementById('inv-disc-warning');

  // Enforce 5% cap
  if(discType==='pct'&&discVal>MAX_INVOICE_DISC_PCT){
    // Clamp the input value
    if(discValInput){discValInput.value=MAX_INVOICE_DISC_PCT;discVal=MAX_INVOICE_DISC_PCT;}
    if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'%</strong>. Value has been capped automatically.</div>';
  } else if(discType==='flat'&&subtotal>0){
    var maxFlatAmt=subtotal*MAX_INVOICE_DISC_PCT/100;
    if(discVal>maxFlatAmt){
      if(discValInput){discValInput.value=Math.round(maxFlatAmt*100)/100;discVal=maxFlatAmt;}
      if(warningEl)warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">❌ Maximum invoice discount is <strong>'+MAX_INVOICE_DISC_PCT+'% ('+fmt(maxFlatAmt)+')</strong> of the subtotal. Value has been capped automatically.</div>';
    } else {
      if(warningEl)warningEl.innerHTML='';
    }
  } else {
    if(warningEl)warningEl.innerHTML='';
  }

  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;

  // Also check below-cost warning
  if(discAmt>0){
    var totalCost=invoiceItems.reduce(function(a,l){return a+(l.cost*l.qty);},0);
    if(finalTotal<totalCost&&warningEl){
      warningEl.innerHTML='<div class="alert danger" style="margin-top:6px">⚠️ Even with this discount, the invoice total ('+fmt(finalTotal)+') is below total cost ('+fmt(totalCost)+'). The sale will be at a loss.</div>';
    }
  }

  // Update summary
  var sumEl=document.getElementById('inv-totals-summary');if(!sumEl)return;
  var totalProfit=invoiceItems.reduce(function(a,l){return a+l.profit;},0)-discAmt;
  sumEl.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--danger)">Invoice discount</span><span style="color:var(--danger)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Grand total</span><span>'+fmt(finalTotal)+'</span></div>'+
    '<div class="sale-summary-row"><span style="color:var(--text2)">Total profit</span><span style="color:'+(totalProfit>=0?'var(--success)':'var(--danger)')+'">'+fmt(totalProfit)+'</span></div>';
}

  if(!invoiceItems.length){el.innerHTML='';return;}
  var subtotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);
  var totalProfit=invoiceItems.reduce(function(a,l){return a+l.profit;},0);

            '<option value="none">No discount</option>'+

      '</div>'+

function submitInvoice(){
  if(!invoiceItems.length){alert('Add at least one item to the invoice.');return;}
  var invNum=document.getElementById('s-inv-num')?document.getElementById('s-inv-num').value.trim():'';
  if(!invNum){alert('Invoice number is required. Please enter an invoice number.');return;}
  // Hard block duplicate invoice numbers
  var existingInv=DB.sales.find(function(s){return String(s.invoiceNum)===String(invNum);});
  if(existingInv){
    alert(
      '⛔ DUPLICATE INVOICE NUMBER!\n\n'+
      'Invoice #'+invNum+' has already been posted.\n\n'+
      'Existing record:\n'+
      '• Date: '+existingInv.date+'\n'+
      '• Customer: '+existingInv.custName+'\n'+
      '• Item: '+existingInv.name+'\n'+
      '• Amount: ₦'+Math.round(existingInv.total).toLocaleString()+'\n'+
      '• Seller: '+existingInv.seller+'\n\n'+
      'Please use a different invoice number to avoid double posting.'
    );
    // Highlight the invoice number field in red
    var invEl=document.getElementById('s-inv-num');
    if(invEl){invEl.style.borderColor='#dc3545';invEl.style.background='#fff5f5';invEl.focus();}
    return;
  }
  // Clear any previous error styling
  var invEl2=document.getElementById('s-inv-num');
  if(invEl2){invEl2.style.borderColor='';invEl2.style.background='';}
  var payment=document.getElementById('s-payment').value;
  var payMode=document.getElementById('s-paymode').value;
  // Enforce: credit payment → credit mode automatically
  if(payment==='credit'){payMode='credit';}
  var bankId=(payMode==='transfer')?(document.getElementById('s-bankid')?document.getElementById('s-bankid').value:''):null;
  var posId=(payMode==='pos')?(document.getElementById('s-posid')?document.getElementById('s-posid').value:''):null;
  if(payMode==='transfer'&&DB.banks.length&&!bankId){alert('Select the bank for transfer.');return;}
  if(payMode==='pos'&&DB.posTerminals.length&&!posId){alert('Select the POS terminal.');return;}
  var custId=null,custName='Walk-in customer',custAddr='',printName='';
  // No walk-in on credit
  if(payment==='credit'&&saleCustomerType==='walkin'){alert('Walk-in customers cannot buy on credit. Please select a registered customer with a credit limit.');return;}
  if(saleCustomerType==='walkin'){
    var walkPrintEl=document.getElementById('s-print-name');
    printName=(walkPrintEl&&walkPrintEl.value.trim())||'';
  }
  if(saleCustomerType==='registered'||saleCustomerType==='credit'){
    var selEl=document.getElementById('s-reg-customer');
    if(selEl)custId=selEl.value;
    if(!custId){alert('Please select a registered customer.');return;}
    var rc=DB.customers.find(function(c){return c.id==custId;});
    if(rc){custName=rc.name;custAddr=rc.address||'';
      // Read optional print-as name
      var printNameEl=document.getElementById('s-print-name');
      printName=(printNameEl&&printNameEl.value.trim())||'';
      // Check credit limit
      if(payment==='credit'){
        var grandTotalCheck=finalGrandTotal;
        var currentOwed=rc.creditBalance||0;
        var creditLimit=rc.creditLimit||0;
        if(creditLimit>0&&(currentOwed+finalGrandTotal)>creditLimit){
          alert('Credit limit exceeded!\nCustomer: '+rc.name+'\nCredit limit: '+fmt(creditLimit)+'\nCurrently owes: '+fmt(currentOwed)+'\nThis purchase: '+fmt(finalGrandTotal)+'\nOver by: '+fmt((currentOwed+finalGrandTotal)-creditLimit)+'\n\nReduce the purchase or increase the credit limit.');
          return;
        }
        if(creditLimit===0){alert('This customer has no credit limit set. Please set a credit limit in the Customers tab before allowing credit purchases.');return;}
      }
    }
  }
  var partPayEl=document.getElementById('s-part-payment');
  var partPayment=partPayEl?parseFloat(partPayEl.value)||0:0;
  // Read invoice-level discount
  var invDiscType=document.getElementById('inv-disc-type')?document.getElementById('inv-disc-type').value:'none';
  var invDiscVal=parseFloat(document.getElementById('inv-disc-val')?document.getElementById('inv-disc-val').value:0)||0;
  var subtotalAll=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty);},0);

  // Hard enforce 5% cap before saving
  if(invDiscType==='pct'&&invDiscVal>MAX_INVOICE_DISC_PCT){
    alert('❌ Discount exceeds the maximum allowed limit.\n\nMaximum invoice discount: '+MAX_INVOICE_DISC_PCT+'%\nYou entered: '+invDiscVal+'%\n\nPlease reduce the discount to '+MAX_INVOICE_DISC_PCT+'% or less.');
    return;
  }
  if(invDiscType==='flat'){
    var maxFlat=subtotalAll*MAX_INVOICE_DISC_PCT/100;
    if(invDiscVal>maxFlat){
      alert('❌ Discount exceeds the maximum allowed limit.\n\nMaximum invoice discount: '+MAX_INVOICE_DISC_PCT+'% = '+fmt(maxFlat)+'\nYou entered: '+fmt(invDiscVal)+'\n\nPlease reduce the discount.');
      return;
    }
  }

  var pendingSupply=document.getElementById('s-pending-supply')&&document.getElementById('s-pending-supply').checked;

  var invoiceDiscAmt=invDiscType==='pct'?(subtotalAll*invDiscVal/100):invDiscType==='flat'?Math.min(invDiscVal,subtotalAll):0;
  var finalGrandTotal=subtotalAll-invoiceDiscAmt;

  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  var invoiceId=uid();
  var grandTotal=finalGrandTotal,grandProfit=0;
  // Distribute discount proportionally across items
  invoiceItems.forEach(function(l){
    var itemSubtotal=l.price*l.qty;
    var itemDisc=subtotalAll>0?(invoiceDiscAmt*(itemSubtotal/subtotalAll)):0;
    var itemTotal=itemSubtotal-itemDisc;
    var itemProfit=(l.price-l.cost)*l.qty-itemDisc;
    grandProfit+=itemProfit;
    // Only deduct stock if goods are being supplied now
    if(!pendingSupply){
      var item=DB.inventory.find(function(i){return i.id==l.itemId;});
      if(item)item.qty-=l.qty;
    }
    DB.sales.push({id:uid(),invoiceId:invoiceId,invoiceNum:invNum,name:l.name,qty:l.qty,itemId:l.itemId,salePrice:l.price,cost:l.cost,discAmt:Math.round(itemDisc*100)/100,total:itemTotal,profit:itemProfit,payment:payment,payMode:payMode,bankId:bankId,posId:posId,custId:custId,custName:custName,printName:printName,custAddr:custAddr,custType:saleCustomerType,date:date,month:month,seller:DB.currentUser.name,partPayment:partPayment,pendingSupply:pendingSupply,supplyStatus:pendingSupply?'pending':'supplied',supplyDate:pendingSupply?null:date});
  });
  var cashReceived = payment==='cash' ? grandTotal : (payment==='part' ? partPayment : 0);
  // creditAmount = how much the customer still owes us after this payment
  // If partPayment > grandTotal → negative = we owe them (overpayment / store credit)
  var creditAmount = payment==='credit' ? grandTotal : (payment==='part' ? (grandTotal - partPayment) : 0);
  var overpayment = (payment==='part' && partPayment > grandTotal) ? (partPayment - grandTotal) : 0;

  if(cashReceived > 0){
    DB.cashflow.push({id:uid(),desc:'Invoice #'+invNum+(invoiceDiscAmt>0?' [disc: '+fmt(invoiceDiscAmt)+']':'')+'  - '+custName,amount:cashReceived,type:'in',cat:'Sales',payMode:payMode==='credit'?'cash':payMode,bankId:bankId,posId:posId,date:date,month:month});
  }
  // Update registered customer
  if(custId){
    var regC=DB.customers.find(function(c){return c.id==custId;});
    if(regC){
      regC.totalPurchases+=invoiceItems.length;
      regC.totalSpent+=grandTotal;
      regC.lastSeen=date;

      if(overpayment > 0){
        // Customer paid MORE than the invoice — excess becomes store credit (we owe them)
        // Invoice is fully settled, and they have credit on account
        regC.creditBalance = (regC.creditBalance||0) - overpayment; // negative = we owe them
        DB.cashflow.push({id:uid(),desc:'Overpayment store credit — '+custName+' Invoice #'+invNum+' (excess: '+fmt(overpayment)+')',amount:overpayment,type:'out',cat:'Sales',payMode:payMode,bankId:bankId,posId:posId,date:date,month:month,isOverpayment:true});
      } else if(creditAmount > 0){
        // Customer still owes us the remaining amount
        var existingCredit=Math.abs(Math.min(0,regC.creditBalance||0)); // store credit we already owe them
        if(existingCredit > 0){
          // Apply their existing store credit first to reduce the new debt
          var appliedCredit=Math.min(existingCredit,creditAmount);
          var remainingCreditDebt=creditAmount-appliedCredit;
          regC.creditBalance=(regC.creditBalance||0)+appliedCredit;
          if(remainingCreditDebt>0){regC.creditBalance=(regC.creditBalance||0)+remainingCreditDebt;}
          if(appliedCredit>0){
            DB.cashflow.push({id:uid(),desc:'Store credit applied — '+custName+' Invoice #'+invNum,amount:appliedCredit,type:'in',cat:'Sales',payMode:'credit',date:date,month:month});
          }
        } else {
          regC.creditBalance=(regC.creditBalance||0)+creditAmount;
        }
      }
      // creditAmount === 0 and no overpayment = exact payment, balance unchanged
      invoiceItems.forEach(function(l){regC.salesHistory.push({date:date,item:l.name,qty:l.qty,total:l.price*l.qty,payMode:payMode});});
    }
  }
  DB._lastInvoice={invoiceId:invoiceId,invoiceNum:invNum,custName:custName,custAddr:custAddr,printName:printName,date:date,items:JSON.parse(JSON.stringify(invoiceItems)),invoiceDiscAmt:invoiceDiscAmt,invoiceDiscType:invDiscType,invoiceDiscVal:invDiscVal,payment:payment,payMode:payMode,bankId:bankId,posId:posId,seller:DB.currentUser.name,grandTotal:grandTotal,grandProfit:grandProfit,subtotalAll:subtotalAll,partPayment:partPayment,pendingSupply:pendingSupply};
  invoiceItems=[];
  saveData();
  var saveMsg='Invoice #'+invNum+' saved!';
  if(pendingSupply){
    saveMsg+='\n\n⏳ GOODS NOT YET SUPPLIED\nPayment recorded. Stock will NOT be deducted until you mark the goods as supplied from the sales ledger.';
  }
  if(overpayment>0){
    saveMsg+='\n\n⚠️ OVERPAYMENT RECORDED\nCustomer paid '+fmt(partPayment)+' but invoice total was '+fmt(grandTotal)+'.\nExcess of '+fmt(overpayment)+' has been saved as store credit on '+custName+'\'s account.\n(You now owe the customer '+fmt(overpayment)+')';
  }
  if(confirm(saveMsg+'\n\nPrint invoice now?')){
    printInvoice(DB._lastInvoice);
  } else {renderApp();}
}

function markAsSupplied(invoiceRef){
  if(!confirm('Mark this invoice as supplied?\n\nThis will deduct the quantities from inventory and cannot be undone.'))return;
  var supplyDate=new Date().toLocaleDateString();
  // Find all sales items belonging to this invoice using any matching field
  var items=DB.sales.filter(function(s){
    return String(s.invoiceId)===String(invoiceRef)||
           String(s.invoiceNum)===String(invoiceRef)||
           String(s.id)===String(invoiceRef);
  });
  if(!items.length){
    items=DB.sales.filter(function(s){
      return s.pendingSupply&&(
        String(s.invoiceId)===String(invoiceRef)||
        String(s.invoiceNum)===String(invoiceRef)
      );
    });
  }
  if(!items.length){alert('Invoice not found.');return;}
  if(!items[0].pendingSupply){alert('This invoice is already marked as supplied.');return;}
  items.forEach(function(s){
    var item=DB.inventory.find(function(i){return i.id==s.itemId;});
    if(item)item.qty-=s.qty;
    s.pendingSupply=false;
    s.wasEverPending=true;
    s.supplyStatus='supplied';
    s.supplyDate=supplyDate;
  });
  saveData();
  renderApp();
  alert('✅ Goods marked as supplied on '+supplyDate+'. Stock has been deducted from inventory.');
}

function processReturn(invoiceId){
  var items=DB.sales.filter(function(s){return s.invoiceId===invoiceId;});
  var reason=document.getElementById('ret-reason').value.trim();
  var refundType=document.getElementById('ret-refund').value;
  if(!reason){alert('Please enter a return reason.');return;}
  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  var totalRefund=0;
  var returnedItems=[];
  items.forEach(function(s){
    var inp=document.getElementById('ret-qty-'+s.id);
    var qty=parseInt(inp?inp.value:0)||0;
    if(qty<=0)return;
    var prev=DB.salesReturns.filter(function(r){return r.invoiceId===invoiceId&&r.itemId===s.id;}).reduce(function(a,r){return a+r.qty;},0);
    var max=s.qty-prev;
    if(qty>max){alert('Cannot return more than '+max+' for "'+s.name+'".');return;}
    var refundAmt=(s.total/s.qty)*qty;
    totalRefund+=refundAmt;
    returnedItems.push({name:s.name,qty:qty,refund:refundAmt,itemId:s.id});
    // Add back to inventory
    var invItem=DB.inventory.find(function(i){return i.id==s.itemId;});
    if(invItem)invItem.qty+=qty;
    // Log adjustment
    if(invItem){DB.adjLog.push({id:uid(),itemId:invItem.id,itemName:invItem.name,type:'add',reason:'Sales return — Invoice #'+items[0].invoiceNum,before:invItem.qty-qty,change:qty,after:invItem.qty,date:date,by:DB.currentUser.name});}
    // Save return record
    DB.salesReturns.push({id:uid(),invoiceId:invoiceId,invoiceNum:items[0].invoiceNum,itemId:s.id,itemName:s.name,qty:qty,refundAmt:refundAmt,refundType:refundType,reason:reason,custId:items[0].custId,custName:items[0].custName,date:date,month:month,by:DB.currentUser.name});
  });
  if(!returnedItems.length){alert('Enter at least one item quantity to return.');return;}
  // Handle refund
  if(refundType==='cash'){
    DB.cashflow.push({id:uid(),desc:'Sales return refund — Invoice #'+items[0].invoiceNum+' ('+items[0].custName+')',amount:totalRefund,type:'out',cat:'Sales',payMode:'cash',date:date,month:month,isReturn:true});
  } else if(refundType==='credit'&&items[0].custId){
    var cust=DB.customers.find(function(c){return c.id==items[0].custId;});
    if(cust)cust.creditBalance=Math.max(0,(cust.creditBalance||0)-totalRefund);
  }
  saveData();
  document.getElementById('return-modal').remove();
  renderApp();
  alert('✅ Return processed!\n\n'+returnedItems.map(function(r){return r.name+' × '+r.qty;}).join('\n')+'\n\nStock has been added back to inventory.'+(totalRefund>0?'\nRefund: ₦'+Math.round(totalRefund).toLocaleString()+' ('+refundType+')':''));
}

function reprintInvoice(invNum){
  var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)==invNum;});
  if(!invSales.length){alert('Invoice not found.');return;}
  var s0=invSales[0];var d=new Date(s0.date),day=d.getDate(),mon=d.getMonth()+1,yr=d.getFullYear();
  var rows=invSales.map(function(s,i){return '<tr><td class="center">'+(i+1)+'</td><td>'+s.name+'</td><td class="center">'+s.qty+'</td><td class="right">'+fmt(s.salePrice)+'</td><td class="right" style="background:#fff5f5">'+(s.discAmt>0?fmt(s.discAmt):'')+'</td><td class="right"><b>'+fmt(s.total)+'</b></td></tr>';}).join('');
  var grandTotal=invSales.reduce(function(a,s){return a+s.total;},0);
  var subtotalAll=invSales.reduce(function(a,s){return a+(s.salePrice*s.qty);},0);
  var invoiceDiscAmt=subtotalAll-grandTotal;
  var emptyRows='';for(var i=invSales.length;i<12;i++)emptyRows+='<tr><td style="height:22px">&nbsp;</td><td></td><td></td><td></td><td style="background:#fff5f5"></td><td></td></tr>';
  var html=buildInvoiceHTML({invoiceNum:invNum,custName:s0.printName||s0.custName,custAddr:s0.custAddr||'',day:day,month:mon,year:yr,rows:rows+emptyRows,subtotalAll:subtotalAll,invoiceDiscAmt:invoiceDiscAmt>0.01?invoiceDiscAmt:0,grandTotal:grandTotal,payment:s0.payment,payMode:s0.payMode,bankId:s0.bankId,posId:s0.posId,seller:s0.seller,pendingSupply:s0.pendingSupply||false,wasEverPending:s0.wasEverPending||false,supplyDate:s0.supplyDate||null});
  var w=window.open('','_blank','width=600,height=850');w.document.write(html);w.document.close();setTimeout(function(){w.print();},500);
}


// PURCHASES
var purchaseItems=[];
function onPurchaseItemSelect(){
  var sel=document.getElementById('pi-select');
  var nameWrap=document.getElementById('pi-name-wrap');
  var nameInput=document.getElementById('pi-name');
  var costInput=document.getElementById('pi-cost');
  if(!sel)return;
  if(sel.value==='__new__'){
    if(nameWrap)nameWrap.style.display='block';
    if(nameInput)nameInput.value='';
    if(costInput)costInput.value='';
  } else if(sel.value===''){
    if(nameWrap)nameWrap.style.display='none';
    if(costInput)costInput.value='';
  } else {
    // existing item selected  -  auto-fill cost
    if(nameWrap)nameWrap.style.display='none';
    var item=DB.inventory.find(function(i){return i.id==sel.value;});
    if(item&&costInput)costInput.value=item.cost;
  }
}

function addPurchaseItem(){
  var sel=document.getElementById('pi-select');
  var qtyOrdered=parseInt(document.getElementById('pi-qty-ordered').value)||0;
  var qtyReceived=parseInt(document.getElementById('pi-qty-received').value)||0;
  var cost=parseFloat(document.getElementById('pi-cost').value)||0;
  if(!sel){alert('Item selector not found.');return;}
  var itemId=null,name='';
  if(sel.value==='__new__'){
    name=document.getElementById('pi-name')?document.getElementById('pi-name').value.trim():'';
    if(!name){alert('Enter a name for the new item.');return;}
  } else if(sel.value===''){
    alert('Please select an existing item or choose "Create new item".');return;
  } else {
    itemId=sel.value;
    var item=DB.inventory.find(function(i){return i.id==itemId;});
    if(!item){alert('Item not found.');return;}
    name=item.name;
  }
  if(qtyOrdered<=0){alert('Enter the quantity ordered (on the invoice).');return;}
  if(qtyReceived<0||qtyReceived>qtyOrdered){alert('Qty received cannot be more than qty ordered ('+qtyOrdered+').');return;}
  if(cost<=0){alert('❌ Cost price is required.');return;}
  var qtyPending=qtyOrdered-qtyReceived;
  purchaseItems.push({
    lineId:uid(),itemId:itemId,name:name,
    qtyOrdered:qtyOrdered,
    qtyReceived:qtyReceived,
    qtyPending:qtyPending,
    qty:qtyReceived, // qty = what goes to stock immediately
    cost:cost,
    total:qtyOrdered*cost, // invoice total based on ordered qty
    totalReceived:qtyReceived*cost,
    isNew:!itemId
  });
  // Reset form
  sel.value='';
  var ps=document.getElementById('pi-search');if(ps)ps.value='';
  document.getElementById('pi-qty-ordered').value='';
  document.getElementById('pi-qty-received').value='';
  document.getElementById('pi-cost').value='';
  var ni=document.getElementById('pi-name');if(ni)ni.value='';
  var nw=document.getElementById('pi-name-wrap');if(nw)nw.style.display='none';
  renderPurchaseItems();
}

function calcPurchaseDiscount(){
  var subtotal=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  var discType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var discVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var discAmt=discType==='pct'?(subtotal*discVal/100):discType==='flat'?Math.min(discVal,subtotal):0;
  var finalTotal=subtotal-discAmt;
  var el=document.getElementById('pu-totals-summary');if(!el)return;
  el.innerHTML=
    (discAmt>0?'<div class="sale-summary-row"><span style="color:var(--text2)">Subtotal</span><span>'+fmt(subtotal)+'</span></div>'+
               '<div class="sale-summary-row"><span style="color:var(--success)">Supplier discount</span><span style="color:var(--success)">− '+fmt(discAmt)+'</span></div>':'')+
    '<div class="sale-summary-row total"><span>Net total payable</span><span>'+fmt(finalTotal)+'</span></div>';
}
function submitPurchase(){
  if(!purchaseItems.length){alert('Add at least one item.');return;}
  var supId=document.getElementById('pu-supplier').value;
  var invNum=document.getElementById('pu-invnum').value.trim();
  var payType=document.getElementById('pu-paytype').value;
  var pm=document.getElementById('pu-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('pu-bankid')?document.getElementById('pu-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('pu-posid')?document.getElementById('pu-posid').value:''):null;
  var partAmt=parseFloat(document.getElementById('pu-part-amt')?document.getElementById('pu-part-amt').value:0)||0;
  if(!supId){alert('Supplier is required. Please select a supplier.');return;}
  if(!invNum){alert('Invoice number is required. Please enter the supplier\'s invoice number.');return;}
  if(pm==='transfer'&&DB.banks.length&&!bankId){alert('Select which bank the transfer was made to.');return;}
  if(pm==='pos'&&DB.posTerminals.length&&!posId){alert('Select which POS terminal was used.');return;}
  if(payType==='part'&&partAmt<=0){alert('Enter the amount paid now for part payment.');return;}
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  var subtotalPu=purchaseItems.reduce(function(a,l){return a+l.total;},0);
  // Read purchase-level supplier discount
  var puDiscType=document.getElementById('pu-disc-type')?document.getElementById('pu-disc-type').value:'none';
  var puDiscVal=parseFloat(document.getElementById('pu-disc-val')?document.getElementById('pu-disc-val').value:0)||0;
  var puDiscAmt=puDiscType==='pct'?(subtotalPu*puDiscVal/100):puDiscType==='flat'?Math.min(puDiscVal,subtotalPu):0;
  var grandTotal=subtotalPu-puDiscAmt;
  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  var purchaseId=uid();
  var creditAmt=payType==='credit'?grandTotal:payType==='part'?(grandTotal-partAmt):0;
  var cashPaid=payType==='cash'?grandTotal:payType==='part'?partAmt:0;
  // Add RECEIVED qty to stock (not ordered qty)
  var belowCostWarnings=[];
  purchaseItems.forEach(function(l){
    var qtyToAdd=l.qtyReceived||l.qty||0; // use received qty
    if(qtyToAdd<=0)return; // nothing received yet for this line
    if(l.itemId){
      var existing=DB.inventory.find(function(i){return i.id==l.itemId;});
      if(existing){
        existing.qty+=qtyToAdd;existing.cost=l.cost;existing.supId=supId||existing.supId;
        if(existing.sell<l.cost){belowCostWarnings.push(existing.name+': sell price '+fmt(existing.sell)+' is now below new cost '+fmt(l.cost));}
      }
    } else {
      var byName=DB.inventory.find(function(i){return i.name.toLowerCase()===l.name.toLowerCase();});
      if(byName){byName.qty+=qtyToAdd;byName.cost=l.cost;if(byName.sell<l.cost)belowCostWarnings.push(byName.name+': sell price '+fmt(byName.sell)+' is now below new cost '+fmt(l.cost));}
      else{DB.inventory.push({id:uid(),name:l.name,qty:qtyToAdd,cost:l.cost,sell:l.cost,minQty:5,supId:supId,cat:''});}
    }
  });

  // Record pending deliveries for items not fully supplied
  var pendingLines=purchaseItems.filter(function(l){return (l.qtyPending||0)>0;});
  if(pendingLines.length){
    if(!DB.pendingDeliveries)DB.pendingDeliveries=[];
    pendingLines.forEach(function(l){
      DB.pendingDeliveries.push({
        id:uid(),
        purchaseId:purchaseId,
        invoiceNum:invNum,
        supId:supId,
        supName:sup?sup.name:'Unknown',
        itemId:l.itemId||null,
        itemName:l.name,
        qtyOrdered:l.qtyOrdered,
        qtyReceived:l.qtyReceived,
        qtyPending:l.qtyPending,
        cost:l.cost,
        dateOrdered:date,
        dateExpected:null,
        status:'pending', // 'pending' | 'partial' | 'complete'
        deliveries:[] // log of partial deliveries received
      });
    });
  }
  // Update supplier
  if(sup){
    sup.totalPurchased+=grandTotal;
    if(creditAmt>0)sup.owedToSupplier+=creditAmt;
    sup.purchases.push({id:purchaseId,desc:purchaseItems.length+' items',invoiceNum:invNum,amount:grandTotal,payment:payType,payMode:pm,bankId:bankId,posId:posId,date:date});
  }
  // Cashflow
  if(cashPaid>0){
    DB.cashflow.push({id:uid(),desc:'Purchase from '+(sup?sup.name:'Supplier')+' Inv#'+invNum,amount:cashPaid,type:'out',cat:'Restock',payMode:pm,bankId:bankId,posId:posId,date:date,month:month});
  }
  // Save purchase record
  DB.purchases.push({id:purchaseId,invoiceNum:invNum,supId:supId,supName:sup?sup.name:'Unknown',items:JSON.parse(JSON.stringify(purchaseItems)),subtotal:subtotalPu,discAmt:puDiscAmt,grandTotal:grandTotal,payType:payType,payMode:pm,bankId:bankId,posId:posId,partAmt:partAmt,creditAmt:creditAmt,cashPaid:cashPaid,date:date,month:month,by:DB.currentUser.name});
  purchaseItems=[];
  saveData();
  var totalReceived=purchaseItems.length; // already cleared so use pendingLines count
  var successMsg='✅ Purchase recorded! Stock updated.\nInvoice #'+invNum+' from '+(sup?sup.name:'supplier')+'.';
  if(pendingLines.length){
    var pendingQty=pendingLines.reduce(function(a,l){return a+l.qtyPending;},0);
    successMsg+='\n\n📦 PENDING DELIVERY: '+pendingLines.length+' item line(s) with '+pendingQty+' unit(s) not yet received.\nThese have been added to the Pending Deliveries tracker. Go to Purchases → Pending Deliveries to record when the supplier brings the remaining items.';
  }
  if(belowCostWarnings.length){
    successMsg+='\n\n⚠️ SELLING PRICE ALERT — '+belowCostWarnings.length+' item(s) now have selling price below new cost:\n'+belowCostWarnings.join('\n')+'\n\nUpdate selling prices in Stock Management before selling.';
  }
  alert(successMsg);
  renderApp();
}
