<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- v28 - Partial qty supply modal | Firebase via REST API (no SDK) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Great Chid Electro — Business Dashboard v28</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Bootstrap Professional Standard Palette ── */
  --bg:#f8f9fa;
  --sidebar:#343a40;
  --sidebar-border:#2c3136;
  --sidebar-hover:#3d4349;
  --sidebar-active:#2c3136;
  --surface:#ffffff;
  --surface2:#f8f9fa;
  --surface3:#e9ecef;
  --border:#dee2e6;
  --border2:#e9ecef;
  --text:#212529;
  --text2:#495057;
  --text3:#6c757d;

  /* Bootstrap semantic colors */
  --primary:#0d6efd;
  --primary-dark:#0b5ed7;
  --primary-bg:#e7f1ff;
  --secondary:#6c757d;
  --secondary-bg:#f8f9fa;
  --success:#198754;
  --success-bg:#d1e7dd;
  --danger:#dc3545;
  --danger-bg:#f8d7da;
  --warning:#ffc107;
  --warning-bg:#fff3cd;
  --warning-text:#664d03;
  --info:#0dcaf0;
  --info-dark:#0aa2c0;
  --info-bg:#cff4fc;
  --info-text:#055160;
  --dark:#343a40;
  --light:#f8f9fa;
  --white:#ffffff;

  /* Accent = Primary blue for highlights */
  --accent:var(--primary);
  --accent2:var(--primary-dark);
  --accent-glow:rgba(13,110,253,.15);

  /* Alias mappings */
  --blue:var(--primary);
  --blue-bg:var(--primary-bg);
  --green:var(--success);
  --green-bg:var(--success-bg);
  --red:var(--danger);
  --red-bg:var(--danger-bg);
  --amber:var(--warning-text);
  --amber-bg:var(--warning-bg);
  --purple:#6f42c1;
  --purple-bg:#e8e0f8;

  --radius:8px;--radius-sm:6px;--radius-lg:12px;--radius-xl:16px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:0 12px 32px rgba(0,0,0,.13),0 4px 10px rgba(0,0,0,.07);
  --shadow-card:0 2px 8px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
  --transition:.18s cubic-bezier(.4,0,.2,1);
  --font:'Inter',system-ui,sans-serif;
}
/* ── Dark Mode ── */
body.dark-mode{
  --bg:#0f1117;
  --sidebar:#1a1d27;
  --sidebar-border:#2a2d3a;
  --sidebar-hover:#252837;
  --sidebar-active:#1e2130;
  --surface:#1e2130;
  --surface2:#252837;
  --surface3:#2a2d3a;
  --border:#2a2d3a;
  --border2:#333649;
  --text:#e2e8f0;
  --text2:#94a3b8;
  --text3:#64748b;
  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --primary-bg:#1e2a40;
  --success:#22c55e;
  --success-bg:#0d2318;
  --danger:#ef4444;
  --danger-bg:#2d0d0d;
  --warning:#f59e0b;
  --warning-bg:#2d1f00;
  --warning-text:#fbbf24;
  --info:#22d3ee;
  --info-bg:#0a2030;
  --info-text:#67e8f9;
  --white:#1e2130;
  --light:#252837;
  --accent-glow:rgba(59,130,246,.2);
  --amber-bg:#2d1f00;
}
body.dark-mode .topbar{background:var(--surface);border-color:var(--border);}
body.dark-mode .card{background:var(--surface);border-color:var(--border);}
body.dark-mode input,body.dark-mode select,body.dark-mode textarea{background:var(--surface2);color:var(--text);border-color:var(--border);}
body.dark-mode table thead tr{background:var(--surface3);}
body.dark-mode .tbl-wrap table tr:nth-child(even) td{background:var(--surface2);}
body.dark-mode .badge.ok{background:#0d2318;color:#22c55e;}
body.dark-mode .badge.owing{background:#2d0d0d;color:#ef4444;}
body.dark-mode .badge.low{background:#2d1f00;color:#f59e0b;}
body.dark-mode .metric-card{background:var(--surface);border-color:var(--border);}
body.dark-mode .subtab{background:var(--surface2);color:var(--text2);border-color:var(--border);}
body.dark-mode .subtab.active{background:var(--primary);color:#fff;}
body.dark-mode .confirm-box{background:var(--surface);}
body.dark-mode .form-group label{color:var(--text2);}
body{transition:background .25s,color .25s;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100vh}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ===== LAYOUT ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:235px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.main{margin-left:235px;flex:1;display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.65rem 1.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.page-content{padding:1.5rem;max-width:1320px;flex:1}

/* ===== SIDEBAR ===== */
.sidebar-logo{padding:1.1rem 1rem 1rem;border-bottom:1px solid var(--sidebar-border);display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:.5px;flex-shrink:0;box-shadow:0 2px 8px var(--accent-glow)}
.logo-text{font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.logo-sub{font-size:9.5px;color:#adb5bd;font-weight:400}
.sidebar-section{padding:.4rem 0;border-bottom:1px solid var(--sidebar-border)}
.sidebar-label{font-size:9px;font-weight:700;color:#868e96;text-transform:uppercase;letter-spacing:.1em;padding:.5rem 1rem .25rem}
.nav-item{display:flex;align-items:center;gap:9px;padding:.45rem .875rem;cursor:pointer;font-size:12.5px;font-weight:400;color:#adb5bd;transition:all var(--transition);border:none;background:none;width:100%;text-align:left;position:relative;border-radius:6px;margin:1px 6px;width:calc(100% - 12px)}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav-item.active{color:#fff;background:rgba(255,255,255,.15);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item.active:hover{background:rgba(255,255,255,.18)}
.nav-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0;opacity:.9}
.nav-badge{margin-left:auto;font-size:9px;padding:1px 7px;border-radius:99px;background:var(--danger);color:#fff;font-weight:700;animation:badgePulse 2s infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,53,69,.4)}50%{box-shadow:0 0 0 4px rgba(220,53,69,0)}}
.sidebar-bottom{margin-top:auto;padding:.75rem;border-top:1px solid var(--sidebar-border)}
.user-block{display:flex;align-items:center;gap:9px;padding:.6rem .75rem;background:rgba(255,255,255,.07);border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.user-block:hover{background:rgba(255,255,255,.13)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:9.5px;color:#adb5bd}

/* ===== TOPBAR ===== */
.topbar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:14.5px;font-weight:700;color:var(--dark)}
.save-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--success)}
.save-dot-circle{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* ===== BUTTONS ===== */
.btn{font-size:12.5px;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-family:var(--font);font-weight:500;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow)}
.btn:hover{background:var(--surface3);border-color:#ced4da;color:var(--text);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px var(--accent-glow)}
.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.btn.success:hover{background:#157347;border-color:#146c43}
.btn.danger{background:var(--white);color:var(--danger);border-color:#f5c2c7;font-size:12px;padding:5px 10px}
.btn.danger:hover{background:var(--danger-bg)}
.btn.info{background:var(--white);color:var(--primary);border-color:#b6d4fe;font-size:12px;padding:5px 10px}
.btn.info:hover{background:var(--primary-bg)}
.btn.secondary{background:var(--secondary);color:#fff;border-color:var(--secondary)}
.btn.secondary:hover{background:#5a6268}
.btn.sm{font-size:11.5px;padding:4px 10px}
.btn.lg{font-size:14px;padding:9px 20px}

/* ===== METRICS ===== */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:1.5rem}
.mc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.125rem;box-shadow:var(--shadow-card);position:relative;overflow:hidden;transition:all var(--transition);cursor:default}
.mc:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:rgba(13,110,253,.2)}
.mc::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--primary);border-radius:var(--radius-lg) 0 0 var(--radius-lg)}
.ml{font-size:10.5px;color:var(--text3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mv{font-size:22px;font-weight:700;color:var(--dark);line-height:1}
.mv.green{color:var(--success)}.mv.red{color:var(--danger)}.mv.amber{color:#856404}
.ms{font-size:10.5px;color:var(--text3);margin-top:4px}

/* ===== TABLES ===== */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem;background:var(--white);box-shadow:var(--shadow-card)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--text3);padding:9px 13px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}
td{padding:9px 13px;border-bottom:1px solid var(--border2);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f0f4ff;transition:background var(--transition)}
tbody tr{transition:background var(--transition)}

/* ===== FORMS ===== */
.form-group label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:13px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid #ced4da;background:var(--white);color:var(--text);font-family:var(--font);transition:all .15s;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
input::placeholder{color:#adb5bd}
input.inline-edit{border:1.5px solid var(--primary);border-radius:5px;padding:4px 7px;font-size:12px;width:90px}
.fg{display:grid;gap:10px;align-items:end;margin-bottom:1.25rem}
.fg.c2{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr 1fr}
.fg.c4{grid-template-columns:1fr 1fr 1fr 1fr}.fg.c5{grid-template-columns:1fr 1fr 1fr 1fr auto}

/* ===== BADGES ===== */
.badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;font-weight:600;letter-spacing:.02em}
.badge.ok{background:var(--success-bg);border:1px solid #a3cfbb}
.badge.low{background:var(--warning-bg);color:var(--warning-text);border:1px solid #ffe69c}
.badge.out{background:var(--danger-bg);color:#58151c;border:1px solid #f1aeb5}
.badge.owing{background:var(--danger-bg);color:#58151c;border:1px solid #f1aeb5}
.badge.info{background:var(--primary-bg);color:#084298;border:1px solid #b6d4fe}
.badge.walk{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.badge.purple{background:var(--purple-bg);color:#432874;border:1px solid #d0bdf8}

/* ===== CARDS ===== */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.125rem 1.25rem;margin-bottom:12px;box-shadow:var(--shadow-card);transition:box-shadow var(--transition)}
.sec-title{font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';display:inline-block;width:3px;height:13px;background:var(--primary);border-radius:2px}

/* ===== ALERTS ===== */
.alert{background:var(--warning-bg);border:1px solid #ffe69c;border-radius:var(--radius-sm);padding:.7rem 1rem;font-size:12.5px;color:var(--warning-text);margin-bottom:.75rem}
.alert.danger{background:var(--danger-bg);border-color:#f1aeb5;color:#58151c}
.alert.info{background:var(--primary-bg);border-color:#b6d4fe;color:#084298}
.alert.success{background:var(--success-bg);border-color:#a3cfbb}

/* ===== MISC ===== */
.profit-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.profit-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border2);font-size:13px;color:var(--text2)}
.profit-row:last-child{border-bottom:none;font-weight:700;font-size:14px;color:var(--dark)}
.ledger-row{display:flex;justify-content:space-between;padding:9px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:5px;border:1px solid transparent}
.ledger-row.in{background:var(--success-bg);border-color:#a3cfbb}
.ledger-row.out{background:var(--danger-bg);border-color:#f1aeb5;color:var(--text2)}
.empty{text-align:center;padding:3rem 2rem;color:var(--text3);font-size:13px}
.reminder-banner{background:var(--danger-bg);border:1px solid #f1aeb5;border-radius:var(--radius-sm);padding:.7rem 1.25rem;margin-bottom:1rem;font-size:13px;color:#58151c;display:flex;justify-content:space-between;align-items:center}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-label{min-width:100px;color:var(--text3);text-align:right;font-size:11px}
.bar-track{flex:1;background:var(--surface3);border-radius:99px;height:20px;overflow:hidden}
.bar-fill{height:20px;border-radius:99px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;background:linear-gradient(90deg,var(--primary),#0dcaf0)}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.perm-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.perm-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--primary)}
.sale-summary{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem;margin:8px 0;font-size:13px}
.sale-summary-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--text2)}
.sale-summary-row.total{font-weight:700;border-top:1px solid var(--border);margin-top:5px;padding-top:7px;color:var(--dark)}
.cust-bar-wrap{background:var(--surface3);border-radius:99px;height:6px;margin:8px 0 4px;overflow:hidden}
.cust-bar{height:6px;border-radius:99px;transition:width .4s}
.pay-form{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:10px}
.count-status{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.count-status.match{background:var(--success-bg)}
.count-status.diff{background:var(--danger-bg);color:#58151c}
.count-status.pending{background:var(--warning-bg);color:var(--warning-text)}
.section-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.125rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.cust-detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px}
.cust-detail-label{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.cust-detail-val{font-size:13px;font-weight:600;color:var(--dark)}
.ctype-toggle{display:flex;gap:10px;margin-bottom:1rem}
.ctype-btn{flex:1;padding:11px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--white);cursor:pointer;text-align:center;transition:all .15s;box-shadow:var(--shadow)}
.ctype-btn:hover{border-color:#b6d4fe;background:var(--primary-bg)}
.ctype-btn.active{border-color:var(--primary);background:var(--primary-bg)}
.ctype-label{font-size:13px;font-weight:600;color:var(--dark)}
.ctype-btn.active .ctype-label{color:var(--primary)}
.ctype-sub{font-size:11px;color:var(--text3);margin-top:2px}
.ctype-btn.active .ctype-sub{color:var(--primary)}
.subtabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.subtab{font-size:12px;padding:5px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;box-shadow:var(--shadow)}
.subtab:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.subtab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px var(--accent-glow)}
.divider{border:none;border-top:1px solid var(--border);margin:1.25rem 0}

/* ===== AUTH ===== */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%)}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:2.5rem;width:400px;box-shadow:var(--shadow-lg)}
.auth-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:1.75rem}
.auth-logo{width:48px;height:48px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
.auth-title{font-size:20px;font-weight:700;color:var(--dark)}
.auth-sub{font-size:12.5px;color:var(--text3);margin-top:2px}
.auth-hint{font-size:11px;color:var(--text3);margin-top:1.25rem;text-align:center;padding:.6rem;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}

/* ===== VERSION NOTES PANEL ===== */
.vn-panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.5rem;overflow:hidden;box-shadow:var(--shadow)}
.vn-header{display:flex;align-items:center;gap:10px;padding:.875rem 1.25rem;background:var(--dark);border-bottom:1px solid var(--sidebar-border)}
.vn-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--primary);color:#fff;letter-spacing:.04em}
.vn-title{font-size:13px;font-weight:600;color:#fff}
.vn-date{font-size:11px;color:#adb5bd;margin-left:auto}
.vn-body{padding:1rem 1.25rem}
.vn-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vn-list li{font-size:12px;color:var(--text2);display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.vn-list li::before{content:'▸';color:var(--primary);font-size:10px;margin-top:2px;flex-shrink:0}
.vn-history{padding:0 1.25rem 1rem;border-top:1px solid var(--border)}
.vn-history-item{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-top:1px solid var(--border2);font-size:12px;color:var(--text3)}
.vn-history-ver{font-weight:700;color:var(--text2);min-width:35px}

/* ===== FIREBASE SYNC ===== */

// Parse stored date strings correctly regardless of locale format.
// Sales/expenses store dates as toLocaleDateString() e.g. "07/05/2026" (DD/MM/YYYY in Nigeria).
// Date filter inputs give "YYYY-MM-DD". This function handles both.
function parseDate(str){
  if(!str)return null;
  str=str.trim();
  // ISO format YYYY-MM-DD from date input
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)){
    var p=str.split('-');
    return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  }
  // Handle M/D/YYYY or MM/DD/YYYY or DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)){
    var pts=str.split('/');
    var a=parseInt(pts[0]),b=parseInt(pts[1]),yr=parseInt(pts[2]);
    // Detect locale: if first part > 12 it must be DD/MM/YYYY
    // If second part > 12 it must be MM/DD/YYYY
    // Otherwise default to toLocaleDateString() which on most devices is M/D/YYYY
    if(a>12){return new Date(yr,b-1,a);} // definitely DD/MM
    if(b>12){return new Date(yr,a-1,b);} // definitely MM/DD
    // Ambiguous — use a test to detect locale
    var testDate=new Date().toLocaleDateString();
    var testParts=testDate.split('/');
    if(testParts.length===3&&parseInt(testParts[0])===new Date().getMonth()+1){
      // Locale is M/D/YYYY (US style) — treat as MM/DD/YYYY
      return new Date(yr,a-1,b);
    }
    // Default: treat as DD/MM/YYYY (Nigerian locale)
    return new Date(yr,b-1,a);
  }
  // Try native parse as last resort
  var d=new Date(str);
  return isNaN(d.getTime())?null:d;
}

// Compare a stored date string against a filter date string (YYYY-MM-DD from input)
function dateInRange(storedDateStr, fromStr, toStr){
  var d=parseDate(storedDateStr);
  if(!d)return true; // can't parse → don't filter out
  if(fromStr){var f=parseDate(fromStr);if(f&&d<f)return false;}
  if(toStr){var t=parseDate(toStr);if(t){t.setHours(23,59,59,999);if(d>t)return false;}}
  return true;
}

// ============================================================
// FIREBASE SYNC — Per-collection REST API (conflict-safe)
// Each collection saves as its own Firestore document.

var GCE_PROJECT_ID   = 'new-great-chid-dashboard';

var GCE_API_KEY_QS   = '?key=' + GCE_API_KEY;

// Collections saved as separate documents (conflict-safe)
// Each has its own lastModified timestamp
var GCE_COLLECTIONS = [
  'sales','inventory','customers','suppliers','purchases','cashflow',
  'creditPayments','deposits','salesReturns','adjLog','stockCounts',
  'supplierPayments','tillSessions','activityLog','settings',

var fbConfigured     = true;

// ── Firestore REST helpers ──────────────────────────────────
function toFirestoreDoc(obj) {
  function convert(val) {
    if (val === null || val === undefined) return { nullValue: null };
    if (typeof val === 'boolean')  return { booleanValue: val };
    if (typeof val === 'number')   return Number.isInteger(val) ? { integerValue: String(val) } : { doubleValue: val };
    if (typeof val === 'string')   return { stringValue: val };
    if (Array.isArray(val))        return { arrayValue: { values: val.map(convert) } };
    if (typeof val === 'object')   return { mapValue: { fields: objToFields(val) } };
    return { stringValue: String(val) };
  }
  function objToFields(o) {
    var f = {};
    Object.keys(o).forEach(function(k) { f[k] = convert(o[k]); });
    return f;
  }
  return { fields: objToFields(obj) };
}

function fromFirestoreDoc(fields) {
  function convert(val) {
    if (!val) return null;
    if ('nullValue'    in val) return null;
    if ('booleanValue' in val) return val.booleanValue;
    if ('integerValue' in val) return parseInt(val.integerValue);
    if ('doubleValue'  in val) return val.doubleValue;
    if ('stringValue'  in val) return val.stringValue;
    if ('arrayValue'   in val) return (val.arrayValue.values || []).map(convert);
    if ('mapValue'     in val) return fieldsToObj(val.mapValue.fields || {});
    return null;
  }
  function fieldsToObj(f) {
    var o = {};
    Object.keys(f).forEach(function(k) { o[k] = convert(f[k]); });
    return o;
  }
  return fieldsToObj(fields || {});
}

// ── Read a single collection doc ────────────────────────────
function fbGetCollection(colName, callback) {
  var url = GCE_REST_BASE + GCE_COL_PATH + colName + GCE_API_KEY_QS;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 12000;
  xhr.onload = function() {
    if (xhr.status === 200) {
      try { var doc=JSON.parse(xhr.responseText); callback(null, fromFirestoreDoc(doc.fields)); }
      catch(e) { callback(e, null); }
    } else if (xhr.status === 404) { callback(null, null); }
    else { callback({ code: xhr.status }, null); }
  };
  xhr.onerror = function() { callback({ code:'network' }, null); };
  xhr.ontimeout = function() { callback({ code:'timeout' }, null); };
  xhr.send();
}

// ── Write a single collection doc ───────────────────────────
function fbSetCollection(colName, data, onSuccess, onError) {
  var url = GCE_REST_BASE + GCE_COL_PATH + colName + GCE_API_KEY_QS;
  var body = JSON.stringify(toFirestoreDoc(data));
  // Size guard: Firestore docs limited to ~1MB; log warning if approaching
  if (body.length > 900000) {
    console.warn('[Firebase] ' + colName + ' payload is ' + Math.round(body.length/1024) + 'KB — near Firestore 1MB limit');
  }
  var xhr = new XMLHttpRequest();
  xhr.open('PATCH', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 20000;
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      if (onSuccess) onSuccess();
    } else {
      var msg = xhr.responseText || '';
      console.error('[Firebase] PATCH ' + colName + ' failed: HTTP ' + xhr.status + ' — ' + msg.slice(0,200));
      if (onError) onError({ code: xhr.status, message: msg.slice(0,200) });
    }
  };
  xhr.onerror = function() { if (onError) onError({ code:'network' }); };
  xhr.ontimeout = function() { if (onError) onError({ code:'timeout' }); };
  xhr.send(body);
}

// ── Legacy single-doc read (for migration) ──────────────────
var GCE_DOC_PATH = 'gce_business/data';
var GCE_DOC_URL  = GCE_REST_BASE + GCE_DOC_PATH + GCE_API_KEY_QS;
function fbGet(callback) {

  xhr.onload = function() {
    if (xhr.status === 200) {

  xhr.ontimeout = function() { callback({ code:'timeout', message:'Timed out' }, null); };

}
function fbSet(data, onSuccess, onError) {
  var body = JSON.stringify(toFirestoreDoc(data));

  xhr.ontimeout = function() { if (onError) onError({ code:'timeout', message:'Timed out' }); };
  xhr.send(body);
}

// ── Build per-collection snapshot ───────────────────────────
function buildCollectionSnapshot(colName) {
  var now = new Date().toISOString();
  var meta = {
    _savedAt: now,
    _deviceId: FB_DEVICE_ID,
    invoiceCounter: DB.invoiceCounter,
    invoiceYear: DB.invoiceYear
  };
  var map = {
    sales: DB.sales,
    inventory: DB.inventory,
    customers: DB.customers,
    suppliers: DB.suppliers,
    purchases: DB.purchases,
    cashflow: DB.cashflow,
    creditPayments: DB.creditPayments||[],
    deposits: DB.deposits||[],
    salesReturns: DB.salesReturns||[],
    adjLog: DB.adjLog||[],
    stockCounts: DB.stockCounts||[],
    supplierPayments: DB.supplierPayments||[],
    tillSessions: DB.tillSessions||[],
    activityLog: (DB.activityLog||[]).slice(0,200), // limit to 200
    settings: DB.settings||{},
    creditCustomers: DB.creditCustomers||[],
    users: DB.users,
    banks: DB.banks,
    posTerminals: DB.posTerminals||[],
    categories: DB.categories||[],
    expenseCats: DB.expenseCats||[],
    transferLog: DB.transferLog||[],
    warehouse: DB.warehouse||[],
    recycleBin: DB.recycleBin||[],
    drafts: DB.drafts||[],
    pendingDeliveries: DB.pendingDeliveries||[],
    meta: meta
  };
  if (colName === 'meta') return meta;
  var data = map[colName];
  return { data: data, _savedAt: now, _deviceId: FB_DEVICE_ID };
}

// ── Apply a fetched collection to DB ────────────────────────
function applyCollection(colName, payload) {
  if (!payload) return;
  var data = payload.data !== undefined ? payload.data : payload;
  if (colName === 'meta') {
    if (data.invoiceCounter) DB.invoiceCounter = data.invoiceCounter;
    if (data.invoiceYear)    DB.invoiceYear    = data.invoiceYear;
    return;
  }
  var map = {
    sales:'sales', inventory:'inventory', customers:'customers',
    suppliers:'suppliers', purchases:'purchases', cashflow:'cashflow',
    creditPayments:'creditPayments', deposits:'deposits',
    salesReturns:'salesReturns', adjLog:'adjLog', stockCounts:'stockCounts',
    supplierPayments:'supplierPayments', tillSessions:'tillSessions',
    activityLog:'activityLog', settings:'settings',
    creditCustomers:'creditCustomers', users:'users', banks:'banks',
    posTerminals:'posTerminals', categories:'categories',
    expenseCats:'expenseCats', transferLog:'transferLog',
    warehouse:'warehouse', recycleBin:'recycleBin',
    drafts:'drafts', pendingDeliveries:'pendingDeliveries'
  };
  if (map[colName] && Array.isArray(data)) DB[map[colName]] = data;
  else if (colName === 'settings' && data && typeof data === 'object') DB.settings = data;
}

// ── Sync: push only dirty collections to Firestore ──────────
var fbSyncInProgress = false;
function fbSyncDirty(onDone) {
  if (!navigator.onLine) return;
  if (fbSyncInProgress) return;
  var cols = Array.from(fbDirtyCollections);
  if (!cols.length) { if(onDone) onDone(true); return; }
  fbSyncInProgress = true;
  fbDirtyCollections.clear();
  var pending = cols.length;
  var allOk = true;
  cols.forEach(function(colName) {
    var payload = buildCollectionSnapshot(colName);
    fbSetCollection(colName, payload, function() {
      pending--;
      if (pending === 0) { fbSyncInProgress=false; if(onDone) onDone(allOk); }
    }, function(e) {
      allOk = false;
      fbDirtyCollections.add(colName); // re-queue failed collection
      pending--;
      if (pending === 0) { fbSyncInProgress=false; if(onDone) onDone(false); }
    });
  });
}

// ── Pull all collections from Firestore ─────────────────────
function fbPullAll(onDone) {
  var cols = GCE_COLLECTIONS.slice();
  var pending = cols.length;
  var anyData = false;
  cols.forEach(function(colName) {
    fbGetCollection(colName, function(err, payload) {
      if (!err && payload) {
        applyCollection(colName, payload);
        anyData = true;
      }
      pending--;
      if (pending === 0) {
        // Also try legacy single-doc for migration
        fbGet(function(err2, legacyData) {
          if (!err2 && legacyData && legacyData._savedAt && !anyData) {
            // Migrate from old single-doc format
            applySnapshot(legacyData);
            // Mark all collections dirty to migrate to new format
            GCE_COLLECTIONS.forEach(function(c){fbDirtyCollections.add(c);});
            console.log('Migrated from legacy single-doc format');
          }
          if (onDone) onDone();
        });
      }
    });
  });
}

// ── Force push all local data to Firestore (one-time migration) ─
function fbForceMigrate(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }
  updateSyncStatus('saving');

  // ── Safety check: compare local vs remote record counts before pushing ──
  var localSales = DB.sales ? DB.sales.length : 0;
  var localInv   = DB.inventory ? DB.inventory.length : 0;

  // First peek at remote sales count
  fbGetCollection('sales', function(err, remoteSalesData) {
    var remoteSales = 0;
    if (!err && remoteSalesData && remoteSalesData.data) {
      remoteSales = Array.isArray(remoteSalesData.data) ? remoteSalesData.data.length : 0;
    }

    // SAFETY GUARD: if local has significantly fewer records than remote, warn user
    if (remoteSales > 0 && localSales < remoteSales) {
      if (btn) { btn.disabled = false; btn.textContent = '📤 Force Push Data'; }
      updateSyncStatus('error');
      var proceed = confirm(
        'WARNING: Local data has FEWER records than Firebase!\n\n' +
        'Local sales:  ' + localSales + ' records\n' +
        'Remote sales: ' + remoteSales + ' records\n\n' +
        'Pushing now will OVERWRITE Firebase with your smaller local copy\n' +
        'and you could LOSE ' + (remoteSales - localSales) + ' sales records!\n\n' +
        'Are you SURE you want to push your local data to Firebase?\n' +
        '(Click Cancel to be safe, then use the Sync button instead)'
      );
      if (!proceed) return;
    }

    // Safety check passed — do a test write first
    if (btn) { btn.textContent = 'Pushing...'; btn.disabled = true; }
    var testPayload = buildCollectionSnapshot('settings');
    fbSetCollection('settings', testPayload, function() {
      // Test write OK — push everything
      GCE_COLLECTIONS.forEach(function(c){ fbDirtyCollections.add(c); });
      fbSyncInProgress = false;
      fbSyncDirty(function(ok) {
        if (ok) {
          fbConnected = true; fbLastSync = new Date();
          updateSyncStatus('synced');
          showToast('✅ All data pushed to Firebase successfully!');
          var overlay = document.getElementById('fb-diag-overlay');
          if (overlay) overlay.remove();
        } else {
          updateSyncStatus('error');
          showToast('❌ Some collections failed — check browser console (F12)');
          if (btn) { btn.disabled = false; btn.textContent = '📤 Force Push Data'; }
        }
      });
    }, function(err) {
      var code = String(err.code || '?');
      var msg  = String(err.message || '');
      var hint = '';
      if (code === '403' || msg.indexOf('PERMISSION_DENIED') > -1) {
        hint = 'FIX: Firebase Console > Firestore > Rules > publish: allow read, write: if true;';
      } else if (code === '404') {
        hint = 'FIX: Collection path not found. Check project ID in Firebase Console.';
      } else if (err.code === 'network' || err.code === 'timeout') {
        hint = 'FIX: Check your internet connection.';
      }
      updateSyncStatus('error');
      alert('❌ Firebase write test failed!\n\nHTTP ' + code + ': ' + msg.slice(0,300) + (hint ? '\n\n' + hint : ''));
      if (btn) { btn.disabled = false; btn.textContent = '📤 Force Push Data'; }
    });
  });
}

// ── Mark collections dirty based on what changed ────────────
function markDirty(collections) {
  if (!Array.isArray(collections)) collections = [collections];
  collections.forEach(function(c) { fbDirtyCollections.add(c); });
  fbDirtyCollections.add('meta');
}

function startFirebaseListener() {
  if (fbPollTimer) clearInterval(fbPollTimer);
  updateSyncStatus('connecting');

  // Pull all collections from Firestore
  fbPullAll(function() {
    fbConnected = true;
    fbLastSync = new Date();
    fbLastSavedAt = new Date().toISOString();
    updateSyncStatus('synced');
    // Check for missing invoices after data loads
    setTimeout(checkInvoiceRecovery, 3000);
    // Flush any pending offline saves
    var pending = localStorage.getItem(STORAGE_KEY+'_pending');
    if (pending) {
      GCE_COLLECTIONS.forEach(function(c){ fbDirtyCollections.add(c); });
      fbSyncDirty(function(ok){
        if(ok){ localStorage.removeItem(STORAGE_KEY+'_pending'); updateSyncStatus('synced'); showToast('\u2705 Offline changes synced!'); }
        else { updateSyncStatus('error'); }
      });
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSnapshot())); } catch(e) {}
    renderApp();
  });

  // ── Claim meta ownership immediately on connect ─────────────
  // Overwrites any stale deviceId left by Force Push or other sessions
  var claimMeta = buildCollectionSnapshot('meta');
  fbSetCollection('meta', claimMeta, function() {
    fbLastSavedAt = claimMeta._savedAt;
  }, null);

  // ── Auto-backup reminder every 4 hours ──────────────────────
  var _lastBackupRem=parseInt(localStorage.getItem('gce_last_bk_rem')||'0');
  setInterval(function(){
    var now=Date.now();var hr=new Date().getHours();
    if(hr>=8&&hr<=20&&now-_lastBackupRem>4*60*60*1000){
      _lastBackupRem=now;
      localStorage.setItem('gce_last_bk_rem',String(now));
      showToast('💾 Backup reminder — click the Backup button to download your data now!',8000);
    }
  },30*60*1000);

  // Poll every 20 seconds — check meta doc for changes from other devices
  var fbLastSeenRemoteSavedAt = null;
  fbPollTimer = setInterval(function() {
    if (!navigator.onLine) return;
    // Skip if we saved recently — our own write still propagating
    if (Date.now() - fbLastOwnSaveTime < 15000) return;
    fbGetCollection('meta', function(err, payload) {
      if (err) { updateSyncStatus('error'); return; }
      fbConnected = true;
      if (!payload || !payload._savedAt) { updateSyncStatus('synced'); return; }
      // Our own device — nothing to do
      if (payload._deviceId === FB_DEVICE_ID) { updateSyncStatus('synced'); return; }
      // Already processed this exact remote save
      if (fbLastSeenRemoteSavedAt && payload._savedAt === fbLastSeenRemoteSavedAt) { updateSyncStatus('synced'); return; }
      // Not newer than what we already have
      if (fbLastSavedAt && payload._savedAt <= fbLastSavedAt) { updateSyncStatus('synced'); return; }
      // Stale meta — older than 5 minutes means leftover from before this session
      var remoteAge = Date.now() - new Date(payload._savedAt).getTime();
      if (remoteAge > 5 * 60 * 1000) {
        fbLastSavedAt = new Date().toISOString();
        fbSetCollection('meta', buildCollectionSnapshot('meta'), null, null);
        updateSyncStatus('synced');
        return;
      }
      // ── Genuine change from another device — show popup, let user decide ──
      fbLastSeenRemoteSavedAt = payload._savedAt;
      var remoteTime = payload._savedAt ? new Date(payload._savedAt).toLocaleTimeString() : 'unknown';
      // Fetch only the sales count from remote to show in popup (don't apply yet)
      fbGetCollection('sales', function(err2, salesPayload) {
        var remoteSalesCount = 0;
        if (!err2 && salesPayload && salesPayload.data) {
          remoteSalesCount = Array.isArray(salesPayload.data) ? salesPayload.data.length : 0;
        }
        // Store the remote savedAt so acceptFbSync knows what to pull
        fbPendingSnapshot = { _savedAt: payload._savedAt, _deviceId: payload._deviceId, _pendingPull: true };
        showSyncPopup(remoteTime, remoteSalesCount);
      });
    });
  }, 20000);
}

function initFirebase() {
  startFirebaseListener();
  return true;
}

function acceptFbSync() {
  if (!fbPendingSnapshot) return;
  var p = document.getElementById('fb-sync-popup');
  if (p) p.innerHTML = '<div style="padding:16px;text-align:center;font-size:13px;color:#0d6efd">&#8987; Syncing data from remote...</div>';
  var savedUser = DB.currentUser;
  var pendingSavedAt = fbPendingSnapshot._savedAt;
  // If it's a pending pull (not yet fetched), pull now
  if (fbPendingSnapshot._pendingPull) {
    fbPullAll(function() {
      fbLastSavedAt = pendingSavedAt;
      fbLastSync = new Date();
      DB.currentUser = savedUser;
      fbPendingSnapshot = null;
      if (p) p.remove();
      updateSyncStatus('synced');
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSnapshot())); } catch(e) {}
      showToast('✅ Synced from remote device!');
      renderPanel();
    });
  } else {
    // Legacy: already have the snapshot
    fbLastSavedAt = pendingSavedAt;
    applySnapshot(fbPendingSnapshot);
    DB.currentUser = savedUser;
    fbLastSync = new Date();
    fbPendingSnapshot = null;
    if (p) p.remove();
    updateSyncStatus('synced');
    renderApp();
  }
}

function dismissFbSync() {
  fbPendingSnapshot = null;
  var p = document.getElementById('fb-sync-popup');
  if (p) p.remove();
  updateSyncStatus('synced');
  // Reclaim meta ownership so the same remote change doesn't trigger again
  var reclaimMeta = buildCollectionSnapshot('meta');
  fbSetCollection('meta', reclaimMeta, function() {
    fbLastSavedAt = reclaimMeta._savedAt;
  }, null);
}

// ---- Sync status indicator ----
function updateSyncStatus(status) {
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  var icons   = { synced:'🟢', saving:'🔄', connecting:'🔵', error:'🔴', local:'💾', pending:'🔔', offline:'🟠' };
  var labels  = { synced:'Synced', saving:'Saving...', connecting:'Connecting...', error:'Sync error — click to retry', local:'Local only', pending:'Sync available', offline:'Offline — saved locally' };
  var time    = (fbLastSync && status === 'synced') ? ' · ' + fbLastSync.toLocaleTimeString() : '';
  el.innerHTML = '<span style="font-size:12px">' + (icons[status]||'⚪') + ' ' + (labels[status]||status) + time + '</span>';
  el.className = 'sync-badge ' + (status === 'synced' ? 'connected' : status === 'error' || status === 'offline' ? 'error' : 'local');
  if (status === 'error' || status === 'local') {
    el.style.cursor = 'pointer';
    el.title = 'Click to retry Firebase connection';
    el.onclick = function() {
      fbConnected = false;
      updateSyncStatus('connecting');
      startFirebaseListener();
    };
  } else {
    el.style.cursor = 'default';
    el.title = '';
    el.onclick = null;
  }
}

// ---- saveData: writes to Firestore REST API + localStorage ----
function saveData() {
  var snapshot = buildSnapshot();
  DB._savedAt = snapshot._savedAt;
  fbLastSavedAt = snapshot._savedAt;
  fbLastOwnSavedAt = snapshot._savedAt;
  // Always save locally first — works offline
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch(e) {}

  // If offline, queue and show indicator
  if(!navigator.onLine){
    updateSyncStatus('offline');
    localStorage.setItem(STORAGE_KEY+'_pending', '1');
    return;
  }

  // Mark all collections dirty (conservative — sync everything on save)
  GCE_COLLECTIONS.forEach(function(c){ fbDirtyCollections.add(c); });

  fbLastOwnSaveTime = Date.now();
  updateSyncStatus('saving');
  clearTimeout(fbSaveTimer);
  // Use shorter delay for critical saves (invoice saves pass urgent=true)
  var _delay = (typeof arguments[0]==='boolean'&&arguments[0]) ? 0 : 400;
  fbSaveTimer = setTimeout(function() {
    fbSyncDirty(function(ok) {
      if (ok) {
        fbLastSync = new Date();
        updateSyncStatus('synced');
        localStorage.removeItem(STORAGE_KEY+'_pending');
      } else {
        updateSyncStatus('error');
        // Retry once after 3 seconds
        setTimeout(function(){
          fbSyncDirty(function(ok2){
            if(ok2){fbLastSync=new Date();updateSyncStatus('synced');}
          });
        }, 3000);
      }
    });
  }, _delay);
}

// ---- loadData: localStorage first, then Firebase per-collection ----
function loadData() {
  // Load from localStorage immediately so app works offline
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var snapshot = JSON.parse(raw);
      if (snapshot) applySnapshot(snapshot);
    }
  } catch(e) {
    console.warn('Could not load from localStorage:', e);
  }
  // Connect to Firestore — pulls all collections
  initFirebase();
  renderAuth();
}

function applySnapshot(snapshot) {
  if (!snapshot) return;
  DB.users = snapshot.users || DB.users;
  DB.inventory = snapshot.inventory || [];
  DB.sales = snapshot.sales || [];
  DB.purchases = snapshot.purchases || [];
  DB.cashflow = snapshot.cashflow || [];
  DB.creditPayments = snapshot.creditPayments || [];
  DB.deposits = snapshot.deposits || [];
  DB.suppliers = snapshot.suppliers || [];
  DB.customers = snapshot.customers || [];
  DB.creditCustomers = snapshot.creditCustomers || [];
  DB.adjLog = snapshot.adjLog || [];
  DB.salesReturns = snapshot.salesReturns || [];
  DB.transferLog = snapshot.transferLog || [];
  DB.warehouse = snapshot.warehouse || [];
  DB.stockCounts = snapshot.stockCounts || [];
  DB.banks = snapshot.banks || DB.banks;
  DB.posTerminals = snapshot.posTerminals || DB.posTerminals;
  DB.categories = snapshot.categories || DB.categories;
  DB.expenseCats = snapshot.expenseCats || DB.expenseCats;
  DB.invoiceCounter = snapshot.invoiceCounter || DB.invoiceCounter;
  DB.invoiceYear = snapshot.invoiceYear || new Date().getFullYear();
  // If no invoiceYear stored yet, derive counter from existing invoices to avoid collision
  if(!snapshot.invoiceYear){
    var currentYr=new Date().getFullYear();
    var yearPrefix=String(currentYr)+'/';
    var existing=DB.sales.filter(function(s){return s.invoiceNum&&String(s.invoiceNum).indexOf(yearPrefix)===0;});
    if(existing.length){
      var maxSeq=existing.reduce(function(mx,s){return Math.max(mx,parseInvNum(s.invoiceNum));},0);
      DB.invoiceCounter=maxSeq+1;
    } else {
      DB.invoiceCounter=1;
    }
    DB.invoiceYear=currentYr;
  }
  DB.activityLog = snapshot.activityLog || [];
  DB.supplierPayments = snapshot.supplierPayments || [];
  DB.tillSessions = snapshot.tillSessions || [];
  DB.recycleBin = snapshot.recycleBin || [];
  DB.drafts = snapshot.drafts || [];
  DB.pendingDeliveries = snapshot.pendingDeliveries || [];

  // ── One-time migration: stamp depositApplied on existing sale records ──
  // Finds negative deposit entries (auto-applied) and patches the matching sale items
  migrateDepositApplied();
}

function migrateDepositApplied(){
  var autoApplied=(DB.deposits||[]).filter(function(d){
    return d.amount<0 && d.note && d.note.indexOf('Auto-applied to Invoice #')===0;
  });
  if(!autoApplied.length)return;
  var patched=0;
  autoApplied.forEach(function(dep){
    var invNum=dep.note.replace('Auto-applied to Invoice #','').trim();
    var invSales=DB.sales.filter(function(s){return (s.invoiceNum||s.id)===invNum||String(s.invoiceNum||s.id)===String(invNum);});
    if(!invSales.length)return;
    var depositAmt=Math.abs(dep.amount);
    var invTotal=invSales.reduce(function(a,s){return a+s.total;},0);
    var alreadyPatched=invSales[0].depositApplied!==undefined&&invSales[0].depositApplied!==0;
    var needsPaymentFix=invSales[0].payment==='credit'&&depositAmt>=invTotal;
    if(alreadyPatched&&!needsPaymentFix)return;
    invSales.forEach(function(s){
      if(!alreadyPatched){
        s.depositApplied=invTotal>0?Math.round((s.total/invTotal)*depositAmt*100)/100:0;
      }
      // If deposit fully or over-covered the invoice, fix payment type so it's not counted as credit owed
      if(depositAmt>=invTotal){
        s.payment='deposit';
        s.payMode='deposit';
      }
    });
    patched++;
  });
  if(patched>0){
    console.log('Migration: fixed '+patched+' deposit-covered invoice(s)');
    saveData();
  }
}

// ── Invoice recovery check ────────────────────────────────────
function checkInvoiceRecovery(){
  try{
    var recovery=JSON.parse(localStorage.getItem('gce_last_invoices')||'[]');
    if(!recovery.length||!DB.sales||!DB.sales.length)return;
    var lastSaved=recovery[0];
    var ageMins=(Date.now()-lastSaved.ts)/(60*1000);
    if(ageMins>60*24)return; // only check if within last 24 hours
    var dbHas=DB.sales.some(function(s){return s.invoiceNum===lastSaved.invNum;});
    if(!dbHas){
      var missing=recovery.filter(function(r){
        return !DB.sales.some(function(s){return s.invoiceNum===r.invNum;});
      });
      if(!missing.length)return;
      var msg='WARNING: Possible data loss detected!\n\n'+
        'These invoices were saved on this device but are NOT in the database:\n\n'+
        missing.map(function(r){
          return '  Invoice #'+r.invNum+' — '+r.custName+' — '+fmt(r.total)+' ('+r.date+')';
        }).join('\n')+
        '\n\nThis may have happened due to a power cut before Firebase synced.\n'+
        'Please re-enter these transactions manually.';
      setTimeout(function(){alert(msg);},2000);
    }
  }catch(e){}
}

function buildSnapshot() {
  var now = new Date().toISOString();
  DB._savedAt = now;
  return {
    users: DB.users, inventory: DB.inventory, sales: DB.sales,
    purchases: DB.purchases, cashflow: DB.cashflow, drafts: DB.drafts || [],
    pendingDeliveries: DB.pendingDeliveries || [],
    suppliers: DB.suppliers, customers: DB.customers,
    creditCustomers: DB.creditCustomers, adjLog: DB.adjLog, salesReturns: DB.salesReturns,
    transferLog: DB.transferLog, warehouse: DB.warehouse,
    stockCounts: DB.stockCounts, banks: DB.banks,
    posTerminals: DB.posTerminals, categories: DB.categories,
    expenseCats: DB.expenseCats,
    invoiceCounter: DB.invoiceCounter,
    invoiceYear: DB.invoiceYear || new Date().getFullYear(),
    creditPayments: DB.creditPayments || [],
    deposits: DB.deposits || [],
    recycleBin: DB.recycleBin || [],
    activityLog: DB.activityLog || [],
    supplierPayments: DB.supplierPayments || [],
    tillSessions: DB.tillSessions || [],
    _savedAt: now,
  };
}

function exportBackup() {
  var snapshot = buildSnapshot();
  snapshot.exportedAt = new Date().toISOString();
  snapshot.version = 'v18';
  var blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'gce_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var snapshot = JSON.parse(e.target.result);
      if (!snapshot.inventory && !snapshot.sales) { alert('Invalid backup file.'); return; }
      if (!confirm('This will replace ALL current data with the backup. Continue?')) return;
      applySnapshot(snapshot);
      saveData();
      alert('Backup restored! Exported on: ' + (snapshot.exportedAt || 'unknown date'));
      renderApp();
    } catch(ex) { alert('Failed to read backup. Make sure it is a valid JSON backup.'); }
  };
  reader.readAsText(file);
}

      '<div class="confirm-msg">'+(opts.msg||'This action cannot be undone.')+'</div>'+
      (opts.detail?'<div class="confirm-detail">'+opts.detail+'</div>':'')+

        '<button class="btn-cancel" id="confirm-cancel-btn">'+(opts.cancelLabel||'Cancel')+'</button>'+
        '<button class="btn-confirm '+type+'" id="confirm-ok-btn">'+(opts.confirmLabel||'Delete')+'</button>'+
      '</div>'+

var BIN_RETENTION_DAYS = 30;

function moveToRecycleBin(type, item, sourceName) {
  if (!DB.recycleBin) DB.recycleBin = [];
  var binItem = {
    binId: uid(),
    type: type,
    sourceName: sourceName || type,
    data: JSON.parse(JSON.stringify(item)),
    deletedAt: new Date().toISOString(),
    deletedBy: DB.currentUser ? DB.currentUser.name : 'Unknown',
    expiresAt: new Date(Date.now() + BIN_RETENTION_DAYS * 86400000).toISOString()
  };
  DB.recycleBin.push(binItem);
}

function autoPurgeBin() {
  if (!DB.recycleBin || !DB.recycleBin.length) return;
  var now = new Date();
  var before = DB.recycleBin.length;
  DB.recycleBin = DB.recycleBin.filter(function(b) {
    return !b.expiresAt || new Date(b.expiresAt) > now;
  });
  // Don't call saveData here (called during renderApp to avoid recursion)
}

function daysUntilExpiry(expiresAt) {
  if (!expiresAt) return BIN_RETENTION_DAYS;
  var diff = new Date(expiresAt) - new Date();
  return Math.max(0, Math.ceil(diff / 86400000));
}

function restoreFromBin(binId) {
  var binItem = (DB.recycleBin||[]).find(function(b){ return b.binId===binId; });
  if (!binItem) { alert('Item not found in bin.'); return; }
  var type = binItem.type;
  var data = binItem.data;

  showConfirm({
    type: 'restore',
    title: 'Restore this item?',
    msg: 'The item will be restored to its original section.',
    detail: '📦 ' + (data.name || data.desc || data.invoiceNum || 'Item') + ' → ' + binItem.sourceName,
    confirmLabel: '♻️ Restore',
    cancelLabel: 'Cancel'
  }, function() {
    if (type === 'inventory') { DB.inventory.push(data); }
    else if (type === 'sale') {
      // Restore all sale items with this invoiceNum
      var restored = data;
      DB.sales.push(restored);
    }
    else if (type === 'invoice') {
      // data is array of sale items for this invoice
      if (Array.isArray(data)) { data.forEach(function(s){ DB.sales.push(s); }); }
      else { DB.sales.push(data); }
    }
    else if (type === 'purchase') { DB.purchases.push(data); }
    else if (type === 'customer') { DB.customers.push(data); }
    else if (type === 'supplier') { DB.suppliers.push(data); }
    else if (type === 'expense') { DB.cashflow.push(data); }
    else if (type === 'user') { DB.users.push(data); }
    DB.recycleBin = DB.recycleBin.filter(function(b){ return b.binId !== binId; });
    saveData();
    renderApp();
    alert('✅ Item restored successfully!');
  });
}

function permanentDeleteFromBin(binId) {
  var binItem = (DB.recycleBin||[]).find(function(b){ return b.binId===binId; });
  if (!binItem) return;
  var data = binItem.data;
  showConfirm({
    type: 'danger',
    title: 'Permanently delete?',
    msg: 'This cannot be undone. The item will be gone forever.',
    detail: (data.name || data.desc || data.invoiceNum || 'Item'),
    confirmLabel: '🗑️ Delete forever',
    cancelLabel: 'Cancel'
  }, function() {
    DB.recycleBin = DB.recycleBin.filter(function(b){ return b.binId !== binId; });
    saveData();
    renderApp();
  });
}

function emptyRecycleBin() {
  if (!DB.recycleBin || !DB.recycleBin.length) { alert('Recycle bin is already empty.'); return; }
  showConfirm({
    type: 'danger',
    title: 'Empty recycle bin?',
    msg: 'All ' + DB.recycleBin.length + ' item(s) will be permanently deleted. This cannot be undone.',
    confirmLabel: '🗑️ Empty bin',
    cancelLabel: 'Cancel'
  }, function() {
    DB.recycleBin = [];
    saveData();
    renderApp();
  });
}

// ── DAILY CLOSING REPORT ─────────────────────────────────────
var closingDate = new Date().toISOString().slice(0,10);

function buildClosingReport(){
  if(!canDo('reports'))return '<div class="empty">Access denied.</div>';
  var d=new Date(closingDate);
  var dateStr=d.toLocaleDateString('en-NG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  // All sales for this date
  var daySales=DB.sales.filter(function(s){return dateInRange(s.date,closingDate,closingDate);});
  // Group by invoice
  var invMap={};
  daySales.forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!invMap[k])invMap[k]={invoiceNum:k,custName:s.printName||s.custName,payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,splitPayment:s.splitPayment||null,total:0,profit:0,partPayment:s.partPayment||0,seller:s.seller};
    invMap[k].total+=s.total;invMap[k].profit+=s.profit;
  });
  var invList=Object.values(invMap);
  var totalRevenue=invList.reduce(function(a,g){return a+g.total;},0);
  var totalProfit=invList.reduce(function(a,g){return a+g.profit;},0);
  // Payment breakdown
  var cash=0,pos=0,transfer=0,credit=0,partPaid=0,deposit=0;
  invList.forEach(function(g){
    if(g.payment==='credit'){credit+=g.total;}
    else if(g.payment==='deposit'){
      // Don't add deposit invoices to deposit bucket —
      // the actual cash collected today comes from topup cashflow entries below
      // (isDepositApplied entries are excluded; topup entries added to cash/pos/transfer)
    }
    else if(g.payment==='part'){
      // Distribute part payment into its actual mode (cash/pos/transfer)
      var pp=g.partPayment||0;
      if(g.payMode==='pos')pos+=pp;
      else if(g.payMode==='transfer')transfer+=pp;
      else cash+=pp;
      credit+=Math.max(0,g.total-pp); // remaining is credit owed
    }
    else if(g.payMode==='split'&&g.splitPayment){
      var sp=g.splitPayment;
      function addSplit(m,a){if(m==='pos')pos+=a;else if(m==='transfer')transfer+=a;else cash+=a;}
      addSplit(sp.mode1,sp.amt1);addSplit(sp.mode2,sp.amt2);
    }
    else if(g.payMode==='pos')pos+=g.total;
    else if(g.payMode==='transfer')transfer+=g.total;
    else cash+=g.total;
  });
  var totalPaid=cash+pos+transfer+deposit; // part payment already in cash/pos/transfer
  // Credit payments received today
  var cpToday=(DB.creditPayments||[]).filter(function(p){return p.payMode!=='writeoff'&&dateInRange(p.date,closingDate,closingDate);});
  var cpTotal=cpToday.reduce(function(a,p){return a+p.amount;},0);
  // Deposits received today
  var depToday=(DB.deposits||[]).filter(function(d){return d.amount>0&&dateInRange(d.date,closingDate,closingDate);});
  var depTotal=depToday.reduce(function(a,d){return a+d.amount;},0);
  // Expenses today
  // Separate expenses from supplier/purchase payments
  var expToday=DB.cashflow.filter(function(c){return c.type==='out'&&!c.isReturn&&c.cat!=='Restock'&&dateInRange(c.date,closingDate,closingDate);});
  var expTotal=expToday.reduce(function(a,e){return a+e.amount;},0);
  // Supplier payments today
  var suppPayToday=DB.cashflow.filter(function(c){return c.type==='out'&&c.cat==='Restock'&&dateInRange(c.date,closingDate,closingDate);});
  var suppPayTotal=suppPayToday.reduce(function(a,e){return a+e.amount;},0);
  // Expense breakdown by payment mode
  var expCash=expToday.filter(function(e){return !e.payMode||e.payMode==='cash';}).reduce(function(a,e){return a+e.amount;},0);
  var expTransfer=expToday.filter(function(e){return e.payMode==='transfer';}).reduce(function(a,e){return a+e.amount;},0);
  var expPos=expToday.filter(function(e){return e.payMode==='pos';}).reduce(function(a,e){return a+e.amount;},0);
  // Supplier payment breakdown
  var suppCash=suppPayToday.filter(function(e){return !e.payMode||e.payMode==='cash';}).reduce(function(a,e){return a+e.amount;},0);
  var suppTransfer=suppPayToday.filter(function(e){return e.payMode==='transfer';}).reduce(function(a,e){return a+e.amount;},0);
  var suppPos=suppPayToday.filter(function(e){return e.payMode==='pos';}).reduce(function(a,e){return a+e.amount;},0);
  // Returns today
  var retToday=(DB.salesReturns||[]).filter(function(r){return dateInRange(r.date,closingDate,closingDate);});
  // Only count actual cash/transfer refunds — exclude exchanges (no money paid out)
  // Use cashflow isReturn entries which are only created when real money leaves
  var retTotal=DB.cashflow.filter(function(c){
    return c.isReturn&&c.type==='out'&&dateInRange(c.date,closingDate,closingDate);
  }).reduce(function(a,c){return a+c.amount;},0);
  // Add exchange balance payments to the appropriate mode totals
  var exchBalToday=DB.cashflow.filter(function(c){
    return c.isExchange&&c.type==='in'&&dateInRange(c.date,closingDate,closingDate);
  });
  // Deposit shortfall topup payments (actual cash collected today for deposit invoices)
  var depTopupToday=DB.cashflow.filter(function(c){
    return !c.isDepositApplied&&!c.isExchange&&c.type==='in'&&c.cat==='Sales'&&
    (c.desc||'').indexOf('shortfall')>=0&&dateInRange(c.date,closingDate,closingDate);
  });
  depTopupToday.forEach(function(c){
    if(c.payMode==='pos')pos+=c.amount;
    else if(c.payMode==='transfer')transfer+=c.amount;
    else cash+=c.amount;
  });
  // Deposit applications today (informational — cash was received earlier)
  var depAppliedToday=DB.cashflow.filter(function(c){
    return c.isDepositApplied&&c.type==='in'&&dateInRange(c.date,closingDate,closingDate);
  });
  var depAppliedTotal=depAppliedToday.reduce(function(a,c){return a+c.amount;},0);
  var exchBalCash=0,exchBalPos=0,exchBalTransfer=0;
  exchBalToday.forEach(function(c){
    if(c.payMode==='pos'){pos+=c.amount;exchBalPos+=c.amount;}
    else if(c.payMode==='transfer'){transfer+=c.amount;exchBalTransfer+=c.amount;}
    else{cash+=c.amount;exchBalCash+=c.amount;}
  });
  // NOTE: isDepositApplied cashflow entries have payMode='deposit' so they are
  // never added to cash/pos/transfer totals — no subtraction needed
  var exchBalTotal=exchBalCash+exchBalPos+exchBalTransfer;
  // Balance after expenses
  var balCash=cash-expCash;
  var balTransfer=transfer-expTransfer;
  var balPos=pos-expPos;
  var balTotal=(cash+pos+transfer+cpTotal+depTotal)-(expTotal+suppPayTotal+retTotal);
  // By staff
  var byStaff={};
  invList.forEach(function(g){byStaff[g.seller]=byStaff[g.seller]||{count:0,total:0,profit:0};byStaff[g.seller].count++;byStaff[g.seller].total+=g.total;byStaff[g.seller].profit+=g.profit;});
  var staffRows=Object.keys(byStaff).map(function(s){var st=byStaff[s];return '<tr><td>'+s+'</td><td style="text-align:center">'+st.count+'</td><td style="text-align:right">'+fmt(st.total)+'</td><td style="text-align:right;color:#15803d">'+fmt(st.profit)+'</td></tr>';}).join('');
  // Invoice rows
  var invRows=invList.map(function(g,i){
    var payBadge=g.payment==='credit'?'<span class="badge owing">Credit</span>':g.payment==='deposit'?'<span class="badge info">Deposit</span>':g.payment==='part'?'<span class="badge low">Part</span>':g.payment==='split'?'<span class="badge" style="background:#6f42c1;color:#fff">Split</span>':g.payMode==='pos'?'<span class="badge" style="background:#0891b2;color:#fff">POS</span>':g.payMode==='transfer'?'<span class="badge" style="background:#0d6efd;color:#fff">Transfer</span>':'<span class="badge ok">Cash</span>';
    return '<tr><td>'+(i+1)+'</td><td style="font-weight:700">'+g.invoiceNum+'</td><td>'+g.custName+'</td><td>'+payBadge+'</td><td style="text-align:right">'+fmt(g.total)+'</td><td style="text-align:right;color:#15803d">'+fmt(g.profit)+'</td><td style="font-size:11px">'+payModeLabel(g)+'</td><td>'+g.seller+'</td></tr>';
  }).join('');

  var grandCashIn=totalPaid+cpTotal+depTotal;

  return '<p class="sec-title">📋 Daily Closing Report</p>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap">'+
      '<input type="date" value="'+closingDate+'" onchange="closingDate=this.value;renderPanel()" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--border)">'+
      '<span style="font-size:13px;color:var(--text3)">'+dateStr+'</span>'+
      '<button onclick="printClosingReport()" style="padding:7px 14px;background:#1a237e;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto">🖨️ Print closing report</button>'+
      '<button onclick="sendDailySummaryWhatsApp()" style="padding:7px 14px;background:#25D366;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">📲 Send summary to owner</button>'+

    '</div>'+
    // Till / Cash float section
    (function(){
      var todaySession=(DB.tillSessions||[]).find(function(t){return t.date===closingDate;});
      var openFloat=todaySession?todaySession.openFloat:0;

            '<div style="font-size:11px;color:#666;margin-bottom:4px">Opening float</div>'+

function setOpeningFloat(){
  var amt=parseFloat(prompt('Enter opening float for '+closingDate+' (cash in till at start of day):'));
  if(isNaN(amt)||amt<0){alert('Enter a valid amount.');return;}
  if(!DB.tillSessions)DB.tillSessions=[];
  var existing=DB.tillSessions.find(function(t){return t.date===closingDate;});
  if(existing){existing.openFloat=amt;}
  else{DB.tillSessions.push({id:uid(),date:closingDate,openFloat:amt,closingCount:null,by:DB.currentUser.name});}
  saveData();renderPanel();
  logActivity('Opening float set',closingDate+' — ₦'+amt.toLocaleString(),'');
}

function recordClosingCount(){
  var amt=parseFloat(prompt('Enter actual cash count in the till at closing:'));
  if(isNaN(amt)||amt<0){alert('Enter a valid amount.');return;}
  if(!DB.tillSessions)DB.tillSessions=[];
  var existing=DB.tillSessions.find(function(t){return t.date===closingDate;});
  if(existing){existing.closingCount=amt;}
  else{DB.tillSessions.push({id:uid(),date:closingDate,openFloat:0,closingCount:amt,by:DB.currentUser.name});}
  saveData();renderPanel();
  logActivity('Closing cash count',closingDate+' — counted ₦'+amt.toLocaleString(),'');
}

function printClosingReport(){
  var d=new Date(closingDate);
  var dateStr=d.toLocaleDateString('en-NG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var daySales=DB.sales.filter(function(s){return dateInRange(s.date,closingDate,closingDate);});
  var invMap={};
  daySales.forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!invMap[k])invMap[k]={invoiceNum:k,custName:s.printName||s.custName,payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,splitPayment:s.splitPayment||null,total:0,profit:0,partPayment:s.partPayment||0,seller:s.seller};
    invMap[k].total+=s.total;invMap[k].profit+=s.profit;
  });
  var invList=Object.values(invMap);
  var totalRevenue=invList.reduce(function(a,g){return a+g.total;},0);
  var totalProfit=invList.reduce(function(a,g){return a+g.profit;},0);
  var cash=0,pos=0,transfer=0,credit=0,partPaid=0;
  invList.forEach(function(g){
    if(g.payment==='credit'){credit+=g.total;}
    else if(g.payment==='part'){partPaid+=g.partPayment||0;}
    else if(g.payMode==='split'&&g.splitPayment){var sp=g.splitPayment;function addSplit(m,a){if(m==='pos')pos+=a;else if(m==='transfer')transfer+=a;else cash+=a;}addSplit(sp.mode1,sp.amt1);addSplit(sp.mode2,sp.amt2);}
    else if(g.payMode==='pos')pos+=g.total;
    else if(g.payMode==='transfer')transfer+=g.total;
    else cash+=g.total;
  });
  var cpTotal=(DB.creditPayments||[]).filter(function(p){return dateInRange(p.date,closingDate,closingDate);}).reduce(function(a,p){return a+p.amount;},0);
  var depTotal=(DB.deposits||[]).filter(function(d){return d.amount>0&&dateInRange(d.date,closingDate,closingDate);}).reduce(function(a,d){return a+d.amount;},0);
  var expToday2=DB.cashflow.filter(function(c){return c.type==='out'&&!c.isReturn&&c.cat!=='Restock'&&dateInRange(c.date,closingDate,closingDate);});
  var expTotal=expToday2.reduce(function(a,e){return a+e.amount;},0);
  var suppPayToday2=DB.cashflow.filter(function(c){return c.type==='out'&&c.cat==='Restock'&&dateInRange(c.date,closingDate,closingDate);});
  var suppPayTotal2=suppPayToday2.reduce(function(a,e){return a+e.amount;},0);
  var expCash2=expToday2.filter(function(e){return !e.payMode||e.payMode==='cash';}).reduce(function(a,e){return a+e.amount;},0);
  var expTransfer2=expToday2.filter(function(e){return e.payMode==='transfer';}).reduce(function(a,e){return a+e.amount;},0);
  var expPos2=expToday2.filter(function(e){return e.payMode==='pos';}).reduce(function(a,e){return a+e.amount;},0);
  var retTotal2=DB.cashflow.filter(function(c){
    return c.isReturn&&c.type==='out'&&dateInRange(c.date,closingDate,closingDate);
  }).reduce(function(a,c){return a+c.amount;},0);
  var balCash2=cash-expCash2; var balPos2=pos-expPos2; var balTransfer2=transfer-expTransfer2;
  var balTotal2=(cash+pos+transfer+cpTotal+depTotal)-(expTotal+suppPayTotal2+retTotal2);
  var byStaff={};
  invList.forEach(function(g){byStaff[g.seller]=byStaff[g.seller]||{count:0,total:0,profit:0};byStaff[g.seller].count++;byStaff[g.seller].total+=g.total;byStaff[g.seller].profit+=g.profit;});
  var staffRows=Object.keys(byStaff).map(function(s){var st=byStaff[s];return '<tr><td>'+s+'</td><td>'+st.count+'</td><td>'+fmt(st.total)+'</td><td>'+fmt(st.profit)+'</td></tr>';}).join('');
  var invRows=invList.map(function(g,i){return '<tr><td>'+(i+1)+'</td><td>'+g.invoiceNum+'</td><td>'+g.custName+'</td><td>'+g.payment+'</td><td>'+fmt(g.total)+'</td><td>'+fmt(g.profit)+'</td><td>'+payModeLabel(g)+'</td><td>'+g.seller+'</td></tr>';}).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Closing Report</title>'+
    '<style>@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px}'+
    '.h{text-align:center;border-bottom:2px solid #1a237e;padding-bottom:8px;margin-bottom:12px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b}.co2{font-size:16px;font-weight:900;color:#1a237e}'+
    '.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}'+
    '.box{border:1px solid #ddd;border-radius:4px;padding:8px;text-align:center}'+
    '.box-label{font-size:9px;color:#666;margin-bottom:2px}.box-val{font-size:14px;font-weight:700}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:10px}'+
    'th{background:#1a237e;color:#fff;padding:4px 6px;font-size:9px;text-align:left}'+
    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even)td{background:#f5f5f5}'+
    '.sec{font-size:11px;font-weight:700;color:#1a237e;margin:10px 0 4px}'+
    '.sign{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}'+
    '.sign-line{border-top:1px solid #000;margin-top:30px;padding-top:4px;font-size:9px;text-align:center}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:12px;font-weight:700;color:#1a237e;margin-top:4px">DAILY CLOSING REPORT</div>'+
      '<div style="font-size:10px;color:#555;margin-top:2px">'+dateStr+' &nbsp;|&nbsp; Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<div class="grid">'+
      '<div class="box"><div class="box-label">Total Invoices</div><div class="box-val">'+invList.length+'</div></div>'+
      '<div class="box"><div class="box-label">Total Revenue</div><div class="box-val" style="color:#1a237e">'+fmt(totalRevenue)+'</div></div>'+

    '</div>'+
    '<div class="sec">Payment Breakdown, Expenses &amp; Balance</div>'+

    (cash>0||expCash2>0?'<tr><td>Cash</td><td style="text-align:right">'+fmt(cash)+'</td><td style="text-align:right;color:#c0392b">'+(expCash2>0?'-'+fmt(expCash2):'-')+'</td><td style="text-align:right;font-weight:700">'+fmt(balCash2)+'</td></tr>':'')+

    (transfer>0||expTransfer2>0?'<tr><td>Transfer</td><td style="text-align:right">'+fmt(transfer)+'</td><td style="text-align:right;color:#c0392b">'+(expTransfer2>0?'-'+fmt(expTransfer2):'-')+'</td><td style="text-align:right;font-weight:700">'+fmt(balTransfer2)+'</td></tr>':'')+

    (retTotal2>0?'<tr><td>Returns Refunded</td><td style="text-align:right">-</td><td style="text-align:right;color:#c0392b">-'+fmt(retTotal2)+'</td><td style="text-align:right;color:#c0392b">-'+fmt(retTotal2)+'</td></tr>':'')+

    (suppPayToday2.length?'<div class="sec">Supplier Payment Detail</div><table><thead><tr><th>Description</th><th>Mode</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+suppPayToday2.map(function(e){return '<tr><td>'+e.desc+'</td><td>'+(e.payMode==='transfer'?'Transfer':e.payMode==='pos'?'POS':'Cash')+'</td><td style="text-align:right;color:#92400e">'+fmt(e.amount)+'</td></tr>';}).join('')+'</tbody></table>':'')+

var activitySearch='';
var activityDateFrom='';
var activityDateTo='';

function buildActivityLog(){
  if(!isAdmin())return '<div class="empty">Admin access only.</div>';
  var filtered=(DB.activityLog||[]).filter(function(a){
    if(activitySearch&&a.action.toLowerCase().indexOf(activitySearch.toLowerCase())===-1&&a.detail.toLowerCase().indexOf(activitySearch.toLowerCase())===-1&&a.user.toLowerCase().indexOf(activitySearch.toLowerCase())===-1)return false;
    if(activityDateFrom&&!dateInRange(a.date,activityDateFrom,''))return false;
    if(activityDateTo&&!dateInRange(a.date,'',activityDateTo))return false;
    return true;
  });
  var actionColors={
    'Invoice saved':'#15803d','Invoice voided':'#c0392b','Credit payment':'#0369a1',
    'Sales return':'#92400e','Login':'#1a237e','Stock adjustment':'#7c3aed'
  };
  var rows=filtered.map(function(a,i){
    var col=actionColors[a.action]||'#374151';
    return '<tr>'+
      '<td style="font-size:10px;color:#999">'+a.date+' '+a.time+'</td>'+
      '<td><span style="background:'+col+';color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap">'+a.action+'</span></td>'+
      '<td style="font-size:12px">'+a.detail+'</td>'+
      '<td style="font-size:11px;color:#555">'+a.extra+'</td>'+
      '<td style="font-weight:600;color:#1a237e">'+a.user+'</td>'+
    '</tr>';
  }).join('');

  return '<p class="sec-title">🔍 User Activity Log</p>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem">'+
      '<input type="text" placeholder="Search action, detail or user..." value="'+activitySearch+'" oninput="activitySearch=this.value;renderPanel()" style="flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px">'+
      '<input type="date" value="'+activityDateFrom+'" onchange="activityDateFrom=this.value;renderPanel()" style="font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--border)">'+
      '<span style="font-size:12px;color:var(--text3)">to</span>'+
      '<input type="date" value="'+activityDateTo+'" onchange="activityDateTo=this.value;renderPanel()" style="font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--border)">'+
      '<button onclick="activitySearch=\'\';activityDateFrom=\'\';activityDateTo=\'\';renderPanel()" class="btn sm">Clear</button>'+
      '<button onclick="clearActivityLog()" class="btn sm danger">🗑 Clear all</button>'+
    '</div>'+
    '<div class="metrics">'+mc('Total actions',(DB.activityLog||[]).length,'All time','')+mc('Showing',filtered.length,'Filtered','')+'</div>'+
    (rows?'<div class="tbl-wrap"><table><thead><tr><th>Date / Time</th><th>Action</th><th>Detail</th><th>Extra</th><th>By</th></tr></thead><tbody>'+rows+'</tbody></table></div>':
    '<div class="empty">No activity recorded yet'+(activitySearch||activityDateFrom||activityDateTo?' for this filter.':'.')+'</div>');
}

function clearActivityLog(){
  if(!confirm('Clear all activity log entries? This cannot be undone.'))return;
  DB.activityLog=[];saveData();renderPanel();
}

function buildRecycleBin() {
  if (!isAdmin()) return '<div class="empty">Access denied. Admins only.</div>';
  autoPurgeBin();
  var bin = DB.recycleBin || [];
  var typeLabels = { inventory:'Inventory', invoice:'Sales invoice', purchase:'Purchase', customer:'Customer', supplier:'Supplier', expense:'Expense', user:'User' };
  var typeIcons = { inventory:'📦', invoice:'🧾', purchase:'🛒', customer:'👥', supplier:'🚛', expense:'💸', user:'🛡️' };
  var typeColors = { inventory:'var(--primary-bg)', invoice:'var(--success-bg)', purchase:'var(--warning-bg)', customer:'#ede9fe', supplier:'var(--info-bg)', expense:'var(--danger-bg)', user:'#f3f4f6' };

  var binRows = bin.length ? bin.slice().reverse().map(function(b) {
    var data = b.data;
    var name = data.name || data.desc || (data.invoiceNum ? 'Invoice #'+data.invoiceNum : null) || data.username || 'Item';
    if (Array.isArray(data) && data.length) name = 'Invoice #'+data[0].invoiceNum;
    var detail = '';
    if (b.type==='inventory') detail = 'Qty: '+data.qty+' · Cost: '+fmt(data.cost||0)+' · Sell: '+fmt(data.sell||0);
    else if (b.type==='invoice') {
      var items = Array.isArray(data)?data:[data];
      detail = items.map(function(s){return s.name;}).join(', ')+' · Total: '+fmt(items.reduce(function(a,s){return a+s.total;},0));
    }
    else if (b.type==='purchase') detail = getSupName(data.supId)+' · Total: '+fmt(data.total||0);
    else if (b.type==='customer') detail = (data.phone||'-')+(data.biz?' · '+data.biz:'');
    else if (b.type==='supplier') detail = (data.phone||'-')+(data.contact?' · '+data.contact:'');
    else if (b.type==='expense') detail = fmt(data.amount||0)+' · '+(data.cat||'-');
    else if (b.type==='user') detail = '@'+(data.username||'-')+' · '+(data.role||'staff');
    var days = daysUntilExpiry(b.expiresAt);
    var deletedDate = b.deletedAt ? new Date(b.deletedAt).toLocaleDateString() : '-';
    return '<tr class="bin-table-row">'+
      '<td><span style="font-size:11.5px;padding:2px 8px;border-radius:99px;background:'+typeColors[b.type]+';font-weight:600">'+typeIcons[b.type]+' '+(typeLabels[b.type]||b.type)+'</span></td>'+
      '<td><b style="font-size:13px">'+name+'</b>'+(detail?'<div style="font-size:11.5px;color:var(--text3);margin-top:2px">'+detail+'</div>':'')+
      '</td>'+
      '<td style="font-size:12px;color:var(--text2)">'+deletedDate+'</td>'+
      '<td style="font-size:12px;color:var(--text2)">'+b.deletedBy+'</td>'+
      '<td><span class="bin-countdown">'+days+' day'+(days!==1?'s':'')+' left</span></td>'+
      '<td><div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="btn sm" onclick="restoreFromBin('+b.binId+')" style="color:var(--success);border-color:#a3cfbb">♻️ Restore</button>'+
        '<button class="btn danger sm" onclick="permanentDeleteFromBin('+b.binId+')">🗑️ Delete</button>'+
      '</div></td>'+
    '</tr>';
  }).join('') : '';

  return '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem">'+

function getPosName(id){var p=DB.posTerminals.find(function(p){return p.id==id;});return p?p.name:' - ';}
function payModeLabel(s){
  if(s.payment==='deposit'||s.payMode==='deposit') return 'Deposit';
  if(s.payment==='credit') return '—'; // credit sales have no payment mode
  if(s.payMode==='split'&&s.splitPayment){
    var sp=s.splitPayment;
    // Use the bank/pos IDs stored on the split object itself
    function modeStr(m,amt){
      if(m==='pos') return 'POS'+(sp.posId?' ('+getPosName(sp.posId)+')':'')+' '+fmt(amt);
      if(m==='transfer') return 'Transfer'+(sp.bankId?' → '+getBankName(sp.bankId):'')+' '+fmt(amt);
      return 'Cash '+fmt(amt);
    }
    return modeStr(sp.mode1,sp.amt1)+' + '+modeStr(sp.mode2,sp.amt2);
  }
  if(s.payMode==='pos')return 'POS'+(s.posId?' ('+getPosName(s.posId)+')':'');
  if(s.payMode==='transfer')return 'Transfer'+(s.bankId?' → '+getBankName(s.bankId):'');
  if(s.payment==='part') return 'Part — '+(s.payMode==='pos'?'POS':s.payMode==='transfer'?'Transfer':'Cash');
  return 'Cash';
}
