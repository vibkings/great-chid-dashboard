  if(!canDo('inventory'))return '<div class="empty">Access denied.</div>';
  var inv=DB.inventory||[];

  // ── Per-item calcs ───────────────────────────────────────────
  var items=inv.map(function(i){
    var costVal=(i.qty||0)*(i.cost||0);
    var sellVal=(i.qty||0)*(i.sell||0);
    var potProfit=sellVal-costVal;
    var margin=sellVal>0?Math.round(potProfit/sellVal*100):0;
    var status=i.qty<=0?'out':i.qty<=i.minQty?'low':i.qty>=(i.minQty||5)*5?'over':'ok';
    return {id:i.id,name:i.name,cat:i.cat||'Uncategorised',qty:i.qty||0,
      cost:i.cost||0,sell:i.sell||0,minQty:i.minQty||0,
      costVal:costVal,sellVal:sellVal,potProfit:potProfit,margin:margin,status:status};
  });

  // ── Filter ───────────────────────────────────────────────────
  var filtered=items.filter(function(it){
    if(invValFilter==='low')return it.status==='low';
    if(invValFilter==='out')return it.status==='out';
    if(invValFilter==='over')return it.status==='over';
    return true;
  });

  // ── KPIs ─────────────────────────────────────────────────────
  var totalSKUs=items.length;
  var totalUnits=items.reduce(function(a,it){return a+it.qty;},0);

    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px">'+

/* ══════════════════════════════════════════════════════════════
   PROFIT & LOSS SUMMARY
══════════════════════════════════════════════════════════════ */
var pandlPeriod='thismonth'; // thismonth | lastmonth | thisyear | custom
var pandlFrom='';
var pandlTo='';

function getPandLRange(){
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth();
  if(pandlPeriod==='thismonth'){
    var f=new Date(y,m,1),t=new Date(y,m+1,0);
    return {from:f.toISOString().slice(0,10),to:t.toISOString().slice(0,10)};
  }
  if(pandlPeriod==='lastmonth'){
    var f=new Date(y,m-1,1),t=new Date(y,m,0);
    return {from:f.toISOString().slice(0,10),to:t.toISOString().slice(0,10)};
  }
  if(pandlPeriod==='thisyear'){
    return {from:y+'-01-01',to:y+'-12-31'};
  }
  return {from:pandlFrom,to:pandlTo};
}

function buildPandL(){
  if(!canDo('finance')&&!canDo('reports'))return '<div class="empty">Access denied.</div>';
  var range=getPandLRange();
  var from=range.from,to=range.to;

  // ── Revenue: use actual cashflow 'in' for accurate cash received (captures overpayments) ──
  var invGroups={};
  (DB.sales||[]).forEach(function(s){
    if(!dateInRange(s.date,from,to))return;
    var k=s.invoiceNum||s.id;
    if(!invGroups[k])invGroups[k]={total:0,cost:0,payment:s.payment,partPayment:s.partPayment||0};
    invGroups[k].total+=(s.total||0);
    invGroups[k].cost+=((s.cost||0)*(s.qty||1));
  });
  // For part-payment invoices use partPayment (actual cash received), not sale total
  var grossRevenue=Object.values(invGroups).reduce(function(a,g){
    if(g.payment==='credit')return a; // credit not received yet
    if(g.payment==='part')return a+(g.partPayment||0);
    return a+g.total;
  },0);
  var cogs=Object.values(invGroups).reduce(function(a,g){return a+g.cost;},0);
  var grossProfit=grossRevenue-cogs;
  var grossMargin=grossRevenue>0?Math.round(grossProfit/grossRevenue*100):0;

  // ── Returns deduction ────────────────────────────────────────
  var totalReturns=(DB.salesReturns||[]).filter(function(r){return dateInRange(r.date,from,to)&&r.refundType==='cash';}).reduce(function(a,r){return a+(r.refundAmt||0);},0);
  var netRevenue=grossRevenue-totalReturns;

  // ── Expenses (non-restock cashflow out) ─────────────────────
  var expLines=(DB.cashflow||[]).filter(function(c){return c.type==='out'&&!c.isReturn&&c.cat!=='Restock'&&c.cat!=='Change'&&c.cat!=='Supplier Payment'&&c.cat!=='Supplier Deposit'&&dateInRange(c.date,from,to);});
  var totalExpenses=expLines.reduce(function(a,e){return a+e.amount;},0);

  // ── Supplier payments (restock) ──────────────────────────────
  var supplierSpend=(DB.purchases||[]).filter(function(p){return dateInRange(p.date,from,to);}).reduce(function(a,p){return a+(p.grandTotal||0);},0);

  // ── Net profit ───────────────────────────────────────────────
  var netProfit=grossProfit-totalExpenses;
  var netMargin=netRevenue>0?Math.round(netProfit/netRevenue*100):0;

  // ── Expense breakdown by category ────────────────────────────
  var expCatMap={};
  expLines.forEach(function(e){
    var cat=e.cat||'Other';
    if(!expCatMap[cat])expCatMap[cat]=0;
    expCatMap[cat]+=e.amount;
  });
  var expCats=Object.entries(expCatMap).sort(function(a,b){return b[1]-a[1];});
  var maxExpCat=expCats[0]?expCats[0][1]:1;
  var expCatColors=['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e'];
  var expCatBars=expCats.map(function(ec,i){
    var pct=Math.round(ec[1]/maxExpCat*100);
    return '<div style="margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
        '<span style="font-weight:600;color:#374151">'+ec[0]+'</span>'+
        '<span style="color:#6b7280">'+fmt(ec[1])+'</span>'+
      '</div>'+
      '<div style="background:var(--surface2);border-radius:6px;height:9px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:100%;background:'+expCatColors[i%expCatColors.length]+';border-radius:6px"></div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ── Monthly P&L (last 6 months) ──────────────────────────────
  var now=new Date();
  var months6=[];
  for(var m=5;m>=0;m--){
    var d=new Date(now.getFullYear(),now.getMonth()-m,1);
    months6.push({label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),year:d.getFullYear(),month:d.getMonth(),rev:0,exp:0,profit:0});
  }
  // Revenue by month
  var mInvGroups={};
  (DB.sales||[]).forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!mInvGroups[k])mInvGroups[k]={date:s.date,cost:0,total:0};
    mInvGroups[k].total+=(s.total||0);
    mInvGroups[k].cost+=((s.cost||0)*(s.qty||1));
  });
  Object.values(mInvGroups).forEach(function(g){
    var d=parseDate(g.date);if(!d)return;
    months6.forEach(function(mb){if(d.getFullYear()===mb.year&&d.getMonth()===mb.month){mb.rev+=g.total;mb.profit+=(g.total-g.cost);}});
  });
  (DB.cashflow||[]).forEach(function(c){
    if(c.type!=='out'||c.isReturn||c.cat==='Restock')return;
    var d=parseDate(c.date);if(!d)return;
    months6.forEach(function(mb){if(d.getFullYear()===mb.year&&d.getMonth()===mb.month)mb.exp+=c.amount;});
  });
  months6.forEach(function(mb){mb.netProfit=mb.profit-mb.exp;});
  var maxBar=Math.max.apply(null,months6.map(function(mb){return Math.max(mb.rev,mb.exp,Math.abs(mb.netProfit));}));
  if(maxBar===0)maxBar=1;

  var chartBars=months6.map(function(mb){
    var revPct=Math.round(mb.rev/maxBar*80);
    var expPct=Math.round(mb.exp/maxBar*80);
    var netPct=Math.round(Math.abs(mb.netProfit)/maxBar*80);
    var netCol=mb.netProfit>=0?'#10b981':'#ef4444';
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:2px">'+

          '<tr style="border-top:1px solid var(--border)"><td style="padding:8px 10px;font-weight:700">Net Revenue</td><td style="padding:8px 10px;text-align:right;font-weight:700">'+fmt(netRevenue)+'</td></tr>'+

function editReturn(rid){
  var r=DB.salesReturns.find(function(x){return x.id==rid;});
  if(!r){alert('Return not found.');return;}
  var m=document.createElement('div');
  m.id='edit-return-modal';
  m.innerHTML=
    '<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem">'+
    '<div style="background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
    '<b style="font-size:15px">✏️ Edit Return</b>'+
    '<button id="close-edit-return" style="background:none;border:none;font-size:22px;cursor:pointer;color:#666">&times;</button>'+
    '</div>'+
    '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Date</label>'+
    '<input type="date" id="er-date" value="'+(r.date||'')+'" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px"></div>'+
    '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Refund Amount (₦)</label>'+
    '<input type="number" id="er-amount" value="'+(r.refundAmt||0)+'" min="0" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px"></div>'+
    '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Reason</label>'+
    '<input type="text" id="er-reason" value="'+esc(r.reason||'')+'" placeholder="Return reason" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px"></div>'+
    '<div style="margin-bottom:20px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Refund Type</label>'+
    '<select id="er-refundtype" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px">'+
    '<option value="cash"'+(r.refundType==='cash'?' selected':'')+'>Cash refund</option>'+
    '<option value="credit"'+(r.refundType==='credit'?' selected':'')+'>Store credit</option>'+
    '<option value="exchange"'+(r.refundType==='exchange'?' selected':'')+'>Exchange</option>'+
    '</select></div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end">'+
    '<button id="cancel-edit-return" style="padding:10px 20px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">Cancel</button>'+
    '<button id="save-edit-return" style="padding:10px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">✅ Save Changes</button>'+
    '</div>'+
    '</div></div>';
  document.body.appendChild(m);
  document.getElementById('close-edit-return').onclick=function(){m.remove();};
  document.getElementById('cancel-edit-return').onclick=function(){m.remove();};
  document.getElementById('save-edit-return').onclick=function(){
    var newDate=document.getElementById('er-date').value;
    var newAmt=parseFloat(document.getElementById('er-amount').value)||0;
    var newReason=document.getElementById('er-reason').value.trim();
    var newType=document.getElementById('er-refundtype').value;
    if(!newDate){alert('Please select a date.');return;}
    r.date=newDate;
    r.month=newDate.slice(0,7);
    r.refundAmt=newAmt;
    r.reason=newReason;
    r.refundType=newType;
    saveData();
    m.remove();
    showToast('✅ Return updated.');
    renderApp();
  };
}

function buildReturnsTracker(){
  if(!canDo('sales')&&!canDo('reports'))return '<div class="empty">Access denied.</div>';
  var returns=DB.salesReturns||[];

  // ── Filter ───────────────────────────────────────────────────
  var filtered=returns.filter(function(r){
    if(retSearch){
      var t=retSearch.toLowerCase();
      if((r.itemName||'').toLowerCase().indexOf(t)<0&&
         (r.custName||'').toLowerCase().indexOf(t)<0&&
         (r.invoiceNum||'').toLowerCase().indexOf(t)<0)return false;
    }
    if(retDateFrom){
      var rFrom=parseDate(retDateFrom);
      var rDate=parseSaleDate(r.date)||0;
      if(!rDate&&r.month){
        // fallback: use month field (YYYY-MM) for comparison
        var fromMonth=retDateFrom.slice(0,7);
        if(r.month<fromMonth)return false;
      } else if(rFrom&&rDate&&rDate<rFrom.getTime())return false;
    }
    if(retDateTo){
      var rTo=parseDate(retDateTo);
      var rDate2=parseSaleDate(r.date)||0;
      if(!rDate2&&r.month){
        var toMonth=retDateTo.slice(0,7);
        if(r.month>toMonth)return false;
      } else if(rTo&&rDate2){rTo.setHours(23,59,59,999);if(rDate2>rTo.getTime())return false;}
    }
    return true;
  }).slice().sort(function(a,b){return (parseDate(b.date)||0)-(parseDate(a.date)||0);});

  // ── KPIs ─────────────────────────────────────────────────────
  var now=new Date();
  var thisMonthStr=now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'));
  var totalRefundVal=returns.reduce(function(a,r){return a+(r.refundAmt||0);},0);
  var thisMonthReturns=returns.filter(function(r){return (r.month||'')===thisMonthStr||(r.date||'').indexOf(thisMonthStr)===0;});
  var thisMonthVal=thisMonthReturns.reduce(function(a,r){return a+(r.refundAmt||0);},0);

  // Most returned item
  var itemRetMap={};
  returns.forEach(function(r){
    if(!itemRetMap[r.itemName])itemRetMap[r.itemName]={name:r.itemName,count:0,val:0};
    itemRetMap[r.itemName].count+=(r.qty||1);
    itemRetMap[r.itemName].val+=(r.refundAmt||0);
  });
  var topItem=Object.values(itemRetMap).sort(function(a,b){return b.count-a.count;})[0];

  // ── Top 5 returned items chart ────────────────────────────────
  var top5Items=Object.values(itemRetMap).sort(function(a,b){return b.count-a.count;}).slice(0,5);
  var maxItemCount=top5Items[0]?top5Items[0].count:1;
  var itemColors=['#ef4444','#f97316','#f59e0b','#8b5cf6','#6366f1'];
  var itemBars=top5Items.map(function(it,i){
    var pct=Math.round(it.count/maxItemCount*100);
    return '<div style="margin-bottom:9px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
        '<span style="font-weight:600;color:#374151">'+it.name+'</span>'+
        '<span style="color:#6b7280">'+it.count+' units · '+fmt(it.val)+'</span>'+
      '</div>'+
      '<div style="background:var(--surface2);border-radius:6px;height:10px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:100%;background:'+itemColors[i]+';border-radius:6px"></div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ── Table rows ───────────────────────────────────────────────
  var refundTypeBadge={
    cash:'<span style="background:var(--success-bg);color:#15803d;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700">CASH</span>',
    credit:'<span style="background:var(--primary-bg);color:#1d4ed8;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700">CREDIT</span>',
    exchange:'<span style="background:var(--warning-bg);color:#92400e;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700">EXCHANGE</span>'
  };
  var tableRows=filtered.map(function(r){
    var d=parseDate(r.date);
    var dateStr=d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
    return '<tr>'+
      '<td>'+dateStr+'</td>'+
      '<td><b>#'+(r.invoiceNum||r.invoiceId||'—')+'</b></td>'+
      '<td>'+(r.custName||'Walk-in')+'</td>'+
      '<td>'+esc(r.itemName)+'</td>'+
      '<td style="text-align:center">'+r.qty+'</td>'+
      '<td style="text-align:right;color:#dc2626;font-weight:700">'+fmt(r.refundAmt||0)+'</td>'+
      '<td style="color:#6b7280;font-size:12px">'+(r.reason||'—')+'</td>'+
      '<td>'+(refundTypeBadge[r.refundType]||refundTypeBadge['cash'])+'</td>'+
      '<td style="color:#9ca3af;font-size:11px">'+(r.by||'—')+'</td>'+
      '<td><button class="btn sm" onclick="editReturn(\''+r.id+'\')" style="font-size:11px;padding:3px 8px;color:#1d4ed8;border-color:#bfdbfe">✏️ Edit</button></td>'+
    '</tr>';
  }).join('');

  return (
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px">'+
      kpiCard('↩️','Total Returns',returns.length,'','#ef4444')+
      kpiCard('💸','Total Refund Value',fmt(totalRefundVal),'','#f97316')+
      kpiCard('📅','This Month Returns',thisMonthReturns.length,'','#8b5cf6')+
      kpiCard('🗓️','This Month Value',fmt(thisMonthVal),'','#f59e0b')+
      kpiCard('🔁','Most Returned',topItem?topItem.name+' ('+topItem.count+'x)':'—','','#dc2626')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px">'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 14px">🔁 Top 5 Most Returned Items</p>'+
        (top5Items.length?itemBars:'<div class="empty">No returns yet.</div>')+
      '</div>'+
      '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'+
        '<p class="sec-title" style="margin:0 0 12px">📊 Returns Breakdown</p>'+
        (function(){
          var types={cash:0,credit:0,exchange:0};
          returns.forEach(function(r){if(types[r.refundType]!==undefined)types[r.refundType]+=(r.refundAmt||0);});
          var total=types.cash+types.credit+types.exchange||1;
          return ['cash','credit','exchange'].map(function(t){
            var pct=Math.round(types[t]/total*100);
            var cols={cash:'#10b981',credit:'#6366f1',exchange:'#f59e0b'};
            var labels={cash:'Cash Refunds',credit:'Store Credit',exchange:'Exchanges'};
            return '<div style="margin-bottom:10px">'+
              '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
                '<span style="font-weight:600">'+labels[t]+'</span>'+
                '<span style="color:#6b7280">'+fmt(types[t])+' ('+pct+'%)</span>'+
              '</div>'+
              '<div style="background:var(--surface2);border-radius:6px;height:9px;overflow:hidden">'+
                '<div style="width:'+pct+'%;height:100%;background:'+cols[t]+';border-radius:6px"></div>'+
              '</div>'+
            '</div>';
          }).join('');
        })()+
      '</div>'+
    '</div>'+
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:22px">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px">'+
        '<p class="sec-title" style="margin:0">📋 Returns Log <span style="font-size:12px;color:#9ca3af;font-weight:400">('+filtered.length+')</span></p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
          '<input type="date" value="'+retDateFrom+'" onchange="retDateFrom=this.value;renderPanel()" style="padding:6px;border:1px solid var(--border);border-radius:7px;font-size:12px">'+
          '<span style="color:#9ca3af">–</span>'+
          '<input type="date" value="'+retDateTo+'" onchange="retDateTo=this.value;renderPanel()" style="padding:6px;border:1px solid var(--border);border-radius:7px;font-size:12px">'+
          '<div style="position:relative"><span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3)">🔍</span>'+
          '<input type="text" placeholder="Search..." value="'+retSearch+'" oninput="retSearch=this.value;renderPanel()" style="padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:12px;width:160px"></div>'+
          '<button onclick="retSearch=\'\';retDateFrom=\'\';retDateTo=\'\';renderPanel()" class="btn sm">Clear</button>'+
        '</div>'+
      '</div>'+
      (filtered.length?
        '<div class="tbl-wrap"><table><thead><tr>'+
          '<th>Date</th><th>Invoice #</th><th>Customer</th><th>Item</th>'+
          '<th style="text-align:center">Qty</th><th style="text-align:right">Refund</th>'+
          '<th>Reason</th><th>Type</th><th>By</th>'+
        '</tr></thead><tbody>'+tableRows+'</tbody></table></div>'
      :'<div class="empty">No returns match.</div>')+
    '</div>'
  );
}

function buildSupplierPayments(){
  if(!canDo('suppliers'))return '<div class="empty">Access denied.</div>';

  // Summary: total owed to all suppliers
  var totalOwed=DB.suppliers.reduce(function(a,s){return a+(s.owedToSupplier||0);},0);
  var totalPaidEver=(DB.supplierPayments||[]).reduce(function(a,p){return a+p.amount;},0);

  // Supplier selector options
  var supOpts='<option value="">All suppliers</option>'+
    DB.suppliers.map(function(s){return '<option value="'+s.id+'"'+(supPayFilterSup==s.id?' selected':'')+'>'+esc(s.name)+(s.owedToSupplier>0?' (owes '+fmt(s.owedToSupplier)+')':'')+'</option>';}).join('');

  // Filter payments
  var filtered=(DB.supplierPayments||[]).filter(function(p){
    if(supPaySearch&&p.supName.toLowerCase().indexOf(supPaySearch.toLowerCase())===-1&&(p.note||'').toLowerCase().indexOf(supPaySearch.toLowerCase())===-1)return false;
    if(supPayFilterSup&&String(p.supId)!==String(supPayFilterSup))return false;
    if(supPayDateFrom&&!dateInRange(p.date,supPayDateFrom,''))return false;
    if(supPayDateTo&&!dateInRange(p.date,'',supPayDateTo))return false;
    return true;
  }).slice().reverse();

  var filteredTotal=filtered.reduce(function(a,p){return a+p.amount;},0);

  // Supplier owed cards
  var owedCards=DB.suppliers.filter(function(s){return (s.owedToSupplier||0)>0;}).map(function(s){
    var paid=(DB.supplierPayments||[]).filter(function(p){return String(p.supId)==String(s.id);}).reduce(function(a,p){return a+p.amount;},0);
    var total=(s.totalPurchased||0);
    var pct=total>0?Math.min(100,Math.round((paid/total)*100)):0;
    return '<div class="card" style="border-left:4px solid #c0392b">'+

function printSupplierPaymentsReport(){
  var filtered=(DB.supplierPayments||[]).filter(function(p){
    if(supPayFilterSup&&String(p.supId)!==String(supPayFilterSup))return false;
    if(supPayDateFrom&&!dateInRange(p.date,supPayDateFrom,''))return false;
    if(supPayDateTo&&!dateInRange(p.date,'',supPayDateTo))return false;
    return true;
  }).slice().reverse();
  var total=filtered.reduce(function(a,p){return a+p.amount;},0);
  var dateRange=(supPayDateFrom||supPayDateTo)?(supPayDateFrom||'...')+' to '+(supPayDateTo||'...'):'All time';
  var rows=filtered.map(function(p,i){return '<tr><td>'+(i+1)+'</td><td>'+p.date+'</td><td style="font-weight:700">'+esc(p.supName)+'</td><td style="text-align:right;color:green;font-weight:700">'+fmt(p.amount)+'</td><td>'+p.mode+'</td><td>'+(p.note||'—')+'</td><td>'+esc(p.by)+'</td></tr>';}).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Supplier Payments</title>'+
    '<style>@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px}'+
    '.h{text-align:center;border-bottom:2px solid #15803d;padding-bottom:6px;margin-bottom:10px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b}.co2{font-size:16px;font-weight:900;color:#1a237e}'+
    'table{width:100%;border-collapse:collapse}th{background:#15803d;color:#fff;padding:4px 6px;font-size:9px;text-align:left}'+
    'td{border:1px solid #ddd;padding:3px 6px}tr:nth-child(even)td{background:#f0fdf4}'+
    '.tr td{font-weight:700;background:#d1fae5;border-top:2px solid #15803d}'+
    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:11px;font-weight:700;color:#15803d;margin-top:4px">SUPPLIER PAYMENTS REPORT</div>'+
      '<div style="font-size:9px;color:#555;margin-top:2px">Period: '+dateRange+' | Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<table><thead><tr><th>#</th><th>Date</th><th>Supplier</th><th style="text-align:right">Amount paid</th><th>Mode</th><th>Reference</th><th>By</th></tr></thead>'+
    '<tbody>'+rows+
    '<tr class="tr"><td colspan="3">TOTAL — '+filtered.length+' payment(s)</td><td style="text-align:right;color:green">'+fmt(total)+'</td><td colspan="3"></td></tr>'+
    '</tbody></table></body></html>';
  var w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(function(){w.print();},400);
}

  var depBal=getSupDepositBalance(sup.id);
  var deps=(DB.supplierDeposits||[]).filter(function(d){return String(d.supId)===String(sup.id);});
  var totalDeposited=deps.reduce(function(a,d){return a+(d._origAmt||d.amount||0);},0);
  var payments=(DB.supplierPayments||[]).filter(function(p){return String(p.supId)===String(sup.id);});
  var totalPaid=payments.reduce(function(a,p){return a+p.amount;},0);
  var purchases=(DB.purchases||[]).filter(function(p){return String(p.supId)===String(sup.id);});

  // Initials avatar
  var initials=sup.name.split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();
  var avatarColor='#1a237e';

  // Purchase history rows
  var purchRows=purchases.slice().reverse().slice(0,20).map(function(p){

      '<td style="text-align:right;font-weight:700">'+fmt(p.grandTotal)+'</td>'+

      '<td style="font-size:11px">'+d.payMode+'</td>'+
      '<td>'+esc(d.by||'')+'</td>'+
      (isAdmin()?'<td><button class="btn danger sm" onclick="deleteSupplierDeposit(\''+d.id+'\')" style="font-size:10px;padding:2px 6px">🗑️</button></td>':'<td></td>')+
    '</tr>';
  }).join('');

  // Payment history rows
  var payRows=payments.slice().reverse().slice(0,20).map(function(p){
    return '<tr>'+
      '<td>'+p.date+'</td>'+
      '<td style="text-align:right;font-weight:700;color:#15803d">'+fmt(p.amount)+'</td>'+

      '<td>'+(p.note||'—')+'</td>'+

      '<button class="subtab active">Supplier Profile</button>'+

function saveSupplierDeposit(supId){
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  if(!sup)return;
  var amount=parseFloat(document.getElementById('sdep-amount').value)||0;
  var mode=document.getElementById('sdep-mode').value;
  var bankId=mode==='transfer'&&document.getElementById('sdep-bank')?document.getElementById('sdep-bank').value:null;
  var posId=mode==='pos'&&document.getElementById('sdep-pos')?document.getElementById('sdep-pos').value:null;
  var note=document.getElementById('sdep-note').value.trim();
  var dateVal=document.getElementById('sdep-date').value;
  if(amount<=0){alert('Enter a valid amount.');return;}
  var dateStr=dateVal?(function(){var dp=dateVal.split('-');return new Date(+dp[0],+dp[1]-1,+dp[2]).toLocaleDateString();}()):new Date().toLocaleDateString();
  var month=dateVal?dateVal.slice(0,7):new Date().toISOString().slice(0,7);
  var dep={
    id:uid(), supId:sup.id, supName:sup.name,
    amount:amount, _origAmt:amount, payMode:mode, bankId:bankId||null, posId:posId||null,
    note:note||'Deposit to supplier', date:dateStr, month:month,
    by:DB.currentUser?DB.currentUser.name:'Admin', applied:false
  };
  if(!DB.supplierDeposits)DB.supplierDeposits=[];
  DB.supplierDeposits.push(dep);
  // Cashflow out
  DB.cashflow.push({id:uid(),desc:'Deposit to '+sup.name+(note?' — '+note:''),amount:amount,type:'out',cat:'Supplier Deposit',payMode:mode,bankId:bankId||null,posId:posId||null,date:dateStr,month:month,by:dep.by});
  logActivity('Supplier deposit','Deposit of '+fmt(amount)+' to '+sup.name,{extra:mode});
  saveData();
  var modal=document.getElementById('sup-deposit-modal');if(modal)modal.remove();
  renderApp();
  showToast('✅ Deposit of '+fmt(amount)+' recorded for '+sup.name);
}

// ── Apply supplier deposit on purchase ──────────────────────
function applySupplierDepositToPurchase(supId, amountToApply, purchaseId, invNum){
  if(!DB.supplierDeposits)return;
  var remaining=amountToApply;
  // Apply oldest deposits first (FIFO)
  DB.supplierDeposits.filter(function(d){
    return String(d.supId)===String(supId)&&!d.applied&&d.amount>0;
  }).sort(function(a,b){return (a.id||0)-(b.id||0);}).forEach(function(d){
    if(remaining<=0)return;
    var use=Math.min(d.amount,remaining);
    d.amount-=use;
    if(d.amount<=0)d.applied=true;
    remaining-=use;
  });
}

function saveSupplierPayment(supId){
  var sup=DB.suppliers.find(function(s){return s.id==supId;});
  if(!sup){alert('Supplier not found.');return;}
  var amt=parseFloat(document.getElementById('sp-amount').value)||0;
  if(amt<=0){alert('Enter a valid amount.');return;}
  var mode=document.getElementById('sp-mode').value;
  var bankId=(document.getElementById('sp-bank')||{}).value||null;
  var posId=(document.getElementById('sp-pos')||{}).value||null;
  var note=(document.getElementById('sp-note')||{}).value||'';
  var dateEl=document.getElementById('sp-date');
  var dateVal=dateEl&&dateEl.value?new Date(dateEl.value).toLocaleDateString():new Date().toLocaleDateString();
  var month=dateEl&&dateEl.value?dateEl.value.slice(0,7):new Date().toISOString().slice(0,7);

  var bank=bankId?(DB.banks||[]).find(function(b){return b.id==bankId;}):null;
  var pos=posId?(DB.posTerminals||[]).find(function(p){return p.id==posId;}):null;
  var modeLabel=mode==='transfer'?'Transfer'+(bank?' ('+(bank.name||bank.bankName)+')':''):mode==='pos'?'POS'+(pos?' ('+pos.name+')':''):mode==='cheque'?'Cheque':'Cash';

  if(!DB.supplierPayments)DB.supplierPayments=[];
  DB.supplierPayments.push({id:uid(),supId:supId,supName:sup.name,amount:amt,
    mode:modeLabel,payMode:mode,bankId:bankId||null,posId:posId||null,
    note:note,date:dateVal,month:month,by:DB.currentUser.name});

  // Record in cashflow as supplier payment outflow (NOT Restock - already counted when purchased)
  DB.cashflow.push({id:uid(),desc:'Supplier payment — '+sup.name+(note?' ('+note+')':''),
    amount:amt,type:'out',cat:'Supplier Payment',payMode:mode,bankId:bankId||null,posId:posId||null,
    date:dateVal,month:month});

  sup.owedToSupplier=Math.max(0,(sup.owedToSupplier||0)-amt);
  logActivity('Supplier payment','Paid '+fmt(amt)+' to '+sup.name+' via '+modeLabel+'. Remaining: '+fmt(sup.owedToSupplier),mode);
  document.getElementById('sup-pay-form-overlay').remove();
  saveData();renderApp();
  showToast('Payment of '+fmt(amt)+' recorded for '+sup.name+'. Remaining: '+fmt(sup.owedToSupplier));
}

  document.body.appendChild(overlay);
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});
}

function addSupplier(){
  var name=document.getElementById('su-name').value.trim();if(!name){alert('Name required.');return;}
  var dup=DB.suppliers.find(function(s){return s.name.toLowerCase()===name.toLowerCase();});
  if(dup){alert('Supplier already exists.');return;}
  var openingBal=parseFloat(document.getElementById('su-opening-bal').value)||0;
  DB.suppliers.push({id:uid(),name:name,contact:document.getElementById('su-contact').value.trim(),phone:document.getElementById('su-phone').value.trim(),address:document.getElementById('su-addr').value.trim(),totalPurchased:0,owedToSupplier:openingBal,openingBalance:openingBal,purchases:[]});
  saveData();renderApp();
}
function removeSupplier(id){
  var s=DB.suppliers.find(function(x){return x.id===id;});
  if(!s)return;
  showConfirm({
    type:'danger',
    title:'Remove supplier?',
    msg:'The supplier will be moved to the Recycle Bin.',
    detail:'🚛 '+esc(s.name)+(s.phone?' · '+s.phone:''),
    confirmLabel:'🗑️ Move to bin',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('supplier',s,'Suppliers');
    DB.suppliers=DB.suppliers.filter(function(x){return x.id!==id;});
    saveData();renderApp();
  });
}

// ============================================================
function buildCreditCust(){
  if(!canDo('creditcust'))return '<div class="empty">Access denied.</div>';
  var custs=DB.customers.filter(function(c){return c.creditLimit>0||c.creditBalance>0;});
  var rows=custs.map(function(c){
    var avail=Math.max(0,(c.creditLimit||0)-(c.creditBalance||0));
    var pct100=c.creditLimit>0?Math.min(100,Math.round(((c.creditBalance||0)/c.creditLimit)*100)):0;
    var barColor=pct100>=100?'var(--danger)':pct100>=75?'var(--warning)':'var(--success)';
    return '<tr>'+
      '<td><b>'+esc(c.name)+'</b>'+(c.biz?'<div style="font-size:10.5px;color:var(--text3)">'+esc(c.biz)+'</div>':'')+'</td>'+
      '<td>'+(c.phone||'-')+'</td>'+
      '<td style="text-align:right">'+fmt(c.creditLimit||0)+'</td>'+
      '<td style="text-align:right;color:var(--danger)"><b>'+fmt(c.creditBalance||0)+'</b></td>'+
      '<td style="text-align:right;color:var(--success)">'+fmt(avail)+'</td>'+
      '<td style="min-width:100px"><div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden"><div style="width:'+pct100+'%;background:'+barColor+';height:100%;border-radius:4px"></div></div><div style="font-size:10px;color:var(--text3);margin-top:2px">'+pct100+'% used</div></td>'+
      (isAdmin()?'<td><button class="btn sm" onclick="clearCredit('+c.id+')" style="color:var(--danger);border-color:#f5c2c7;font-size:11px">Clear debt</button></td>':'<td></td>')+
    '</tr>';
  }).join('');
  var totalOwed=custs.reduce(function(a,c){return a+(c.creditBalance||0);},0);
  return '<div class="metrics" style="grid-template-columns:repeat(3,1fr)">'+mc('Credit customers',custs.length,'With active limits','')+mc('Total owed',fmt(totalOwed),'Outstanding credit','amber')+mc('At limit',custs.filter(function(c){return c.creditBalance>=(c.creditLimit||0)&&c.creditLimit>0;}).length,'Cannot buy more','red')+'</div>'+
    (rows?'<div class="tbl-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th style="text-align:right">Credit limit</th><th style="text-align:right">Amount owed</th><th style="text-align:right">Available</th><th>Usage</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No customers with credit limits yet. Set a credit limit when adding/editing customers.</div>');
}
function clearCredit(id){
  var c=DB.customers.find(function(x){return x.id==id;});if(!c)return;
  showConfirm({
    type:'warning',
    title:'Clear credit balance?',
    msg:'This will mark all outstanding credit as cleared for this customer.',
    detail:'👥 '+esc(c.name)+' — Owed: '+fmt(c.creditBalance||0),
    confirmLabel:'✓ Clear debt',
    cancelLabel:'Cancel'
  },function(){
    c.creditBalance=0;saveData();renderApp();
  });
}

// REPORTS TAB
// ============================================================
function buildReports(){
  if(!canDo('reports'))return '<div class="empty">Access denied.</div>';
  var staffList=[...new Set(DB.sales.map(function(s){return s.seller;}))].filter(Boolean);
  var staffOpts=staffList.map(function(n){return '<option value="'+n+'"'+(reportStaff===n?' selected':'')+'>'+n+'</option>';}).join('');
  // ── Paid Invoice Summary: one row per invoice, no credit ──────
  // ── Returns Report: one row per invoice, grouped ──────────────
  // ── Income Report ────────────────────────────────────────────
  if(reportTab==='trend'){
    // ── Stock Purchase vs Selling Trend ──────────────────────────
    // Per-item: purchases cost vs sales revenue vs profit
    var itemMap={};
    // Gather purchase costs per item
    DB.purchases.forEach(function(p){
      if(!itemMap[p.itemId])itemMap[p.itemId]={name:p.name,costTotal:0,costQty:0,revTotal:0,revQty:0,profit:0};
      itemMap[p.itemId].costTotal+=(p.cost||0)*(p.qty||0);
      itemMap[p.itemId].costQty+=(p.qty||0);
    });
    // Gather sales revenue per item
    DB.sales.forEach(function(s){
      var key=s.itemId||s.name;
      if(!itemMap[key])itemMap[key]={name:s.name,costTotal:0,costQty:0,revTotal:0,revQty:0,profit:0};
      else if(!itemMap[key].name)itemMap[key].name=s.name;
      itemMap[key].revTotal+=(s.total||0);
      itemMap[key].revQty+=(s.qty||0);
      itemMap[key].profit+=(s.profit||0);
    });
    var items=Object.values(itemMap).filter(function(x){return x.revTotal>0||x.costTotal>0;});
    items.sort(function(a,b){return b.profit-a.profit;});
    var top10=items.slice(0,10);
    var maxVal=top10.reduce(function(m,i){return Math.max(m,i.revTotal,i.costTotal);},1);

    // Monthly revenue vs cost chart (last 6 months)
    var months=[];
    for(var mi=5;mi>=0;mi--){
      var d=new Date();d.setMonth(d.getMonth()-mi);
      months.push({label:d.toLocaleString('default',{month:'short'})+' '+d.getFullYear().toString().slice(2),
        month:d.getMonth(),year:d.getFullYear(),rev:0,cost:0,profit:0});
    }
    DB.sales.forEach(function(s){
      var sd=new Date(s.date);
      var m=months.find(function(x){return x.month===sd.getMonth()&&x.year===sd.getFullYear();});
      if(m){m.rev+=(s.total||0);m.profit+=(s.profit||0);}
    });
    DB.purchases.forEach(function(p){
      var pd=new Date(p.date||p.createdAt||'');
      if(isNaN(pd))return;
      var m=months.find(function(x){return x.month===pd.getMonth()&&x.year===pd.getFullYear();});
      if(m)m.cost+=(p.cost||0)*(p.qty||0);
    });
    var maxMonth=months.reduce(function(mx,m){return Math.max(mx,m.rev,m.cost);},1);

    var monthBars=months.map(function(m){
      var revPct=Math.round((m.rev/maxMonth)*100);
      var costPct=Math.round((m.cost/maxMonth)*100);
      var profitPct=Math.round((m.profit/maxMonth)*100);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">'+
        '<div style="width:100%;display:flex;gap:2px;align-items:flex-end;height:80px">'+
          '<div style="flex:1;background:#c0392b;border-radius:3px 3px 0 0;height:'+revPct+'%;min-height:'+(m.rev>0?'3px':'0')+';transition:height .4s" title="Revenue: '+fmt(m.rev)+'"></div>'+
          '<div style="flex:1;background:#1a237e;border-radius:3px 3px 0 0;height:'+costPct+'%;min-height:'+(m.cost>0?'3px':'0')+';transition:height .4s" title="Cost: '+fmt(m.cost)+'"></div>'+
          '<div style="flex:1;background:#16a34a;border-radius:3px 3px 0 0;height:'+profitPct+'%;min-height:'+(m.profit>0?'3px':'0')+';transition:height .4s" title="Profit: '+fmt(m.profit)+'"></div>'+
        '</div>'+
        '<div style="font-size:9px;color:var(--text3);text-align:center;white-space:nowrap">'+m.label+'</div>'+
        '<div style="font-size:9px;color:#16a34a;font-weight:700">'+fmt(m.profit)+'</div>'+
      '</div>';
    }).join('');

    var itemRows=items.map(function(i,idx){
      var margin=i.revTotal>0?Math.round((i.profit/i.revTotal)*100):0;
      var barW=i.revTotal>0?Math.round((i.revTotal/maxVal)*100):0;
      var costBarW=i.costTotal>0?Math.round((i.costTotal/maxVal)*100):0;
      var marginColor=margin>=30?'#16a34a':margin>=15?'#d97706':'#dc2626';
      return '<tr>'+
        '<td style="font-weight:600;font-size:12px">'+(idx+1)+'. '+esc(i.name)+'</td>'+
        '<td style="text-align:right;color:#1a237e">'+fmt(i.costTotal)+'<div style="height:4px;background:#e5e7eb;border-radius:2px;margin-top:3px"><div style="width:'+costBarW+'%;height:100%;background:#1a237e;border-radius:2px"></div></div></td>'+
        '<td style="text-align:right;color:#c0392b">'+fmt(i.revTotal)+'<div style="height:4px;background:#e5e7eb;border-radius:2px;margin-top:3px"><div style="width:'+barW+'%;height:100%;background:#c0392b;border-radius:2px"></div></div></td>'+
        '<td style="text-align:right;color:'+(i.profit>=0?'#16a34a':'#dc2626')+';font-weight:700">'+fmt(i.profit)+'</td>'+
        '<td style="text-align:center"><span style="font-size:11px;font-weight:700;color:'+marginColor+';background:'+(margin>=30?'#f0fdf4':margin>=15?'#fffbeb':'#fff0f0')+';padding:2px 8px;border-radius:99px">'+margin+'%</span></td>'+
        '<td style="text-align:center;color:var(--text3);font-size:12px">'+i.revQty+'</td>'+
      '</tr>';
    }).join('');

    var totCost=items.reduce(function(a,i){return a+i.costTotal;},0);
    var totRev=items.reduce(function(a,i){return a+i.revTotal;},0);
    var totProfit=items.reduce(function(a,i){return a+i.profit;},0);
    var totMargin=totRev>0?Math.round((totProfit/totRev)*100):0;

    var trendContent='<div>'+
      '<div style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)">&#128202; Stock Purchase vs Selling Trend</div>'+
      // Summary cards
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">'+
        '<div class="mc"><div class="ml">Total Cost (Purchases)</div><div class="mv" style="color:#1a237e">'+fmt(totCost)+'</div></div>'+
        '<div class="mc"><div class="ml">Total Revenue (Sales)</div><div class="mv" style="color:#c0392b">'+fmt(totRev)+'</div></div>'+
        '<div class="mc"><div class="ml">Total Gross Profit</div><div class="mv '+(totProfit>=0?'green':'red')+'">'+fmt(totProfit)+'</div></div>'+
        '<div class="mc"><div class="ml">Overall Margin</div><div class="mv" style="color:'+(totMargin>=20?'#16a34a':totMargin>=10?'#d97706':'#dc2626')+'">'+totMargin+'%</div></div>'+
      '</div>'+
      // Monthly chart
      '<div class="card" style="margin-bottom:16px">'+
        '<div class="sec-title">Monthly Performance (Last 6 Months)</div>'+
        '<div style="display:flex;gap:8px;align-items:flex-end;padding:8px 0">'+monthBars+'</div>'+
        '<div style="display:flex;gap:16px;margin-top:8px;font-size:11px">'+
          '<span><span style="display:inline-block;width:10px;height:10px;background:#c0392b;border-radius:2px;margin-right:4px"></span>Revenue</span>'+
          '<span><span style="display:inline-block;width:10px;height:10px;background:#1a237e;border-radius:2px;margin-right:4px"></span>Cost</span>'+
          '<span><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;margin-right:4px"></span>Profit</span>'+
        '</div>'+
      '</div>'+
      // Per-item table
      '<div class="tbl-wrap">'+
        '<div style="padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text2)">All Items — Purchase Cost vs Sales Revenue</div>'+
        '<table><thead><tr>'+
          '<th>Item</th><th style="text-align:right">Cost (Purchased)</th><th style="text-align:right">Revenue (Sold)</th><th style="text-align:right">Gross Profit</th><th style="text-align:center">Margin</th><th style="text-align:center">Units Sold</th>'+
        '</tr></thead><tbody>'+
        (itemRows||'<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text3)">No sales data yet.</td></tr>')+
        '<tr style="background:var(--surface2);font-weight:700">'+
          '<td>TOTALS</td>'+
          '<td style="text-align:right;color:#1a237e">'+fmt(totCost)+'</td>'+
          '<td style="text-align:right;color:#c0392b">'+fmt(totRev)+'</td>'+
          '<td style="text-align:right;color:'+(totProfit>=0?'#16a34a':'#dc2626')+'">'+fmt(totProfit)+'</td>'+
          '<td style="text-align:center;font-weight:800;color:'+(totMargin>=20?'#16a34a':totMargin>=10?'#d97706':'#dc2626')+'">'+totMargin+'%</td>'+
          '<td></td>'+
        '</tr>'+
        '</tbody></table>'+
      '</div>'+
    '</div>';

    // Build the tab buttons and wrap with navigation
    var trendTabBtns=
      '<button class="btn sm" onclick="reportTab=\'all\';renderPanel()">All sales</button> '+
      '<button class="btn sm" onclick="reportTab=\'paid\';renderPanel()">Paid invoices</button> '+
      '<button class="btn sm" onclick="reportTab=\'paidinv\';renderPanel()">Paid invoice summary</button> '+
      '<button class="btn sm" onclick="reportTab=\'credit\';renderPanel()">Credit only</button> '+
      '<button class="btn sm" onclick="reportTab=\'staff\';renderPanel()">By staff</button> '+
      '<button class="btn sm" onclick="reportTab=\'returns\';renderPanel()">Returns</button> '+
      '<button class="btn sm" onclick="reportTab=\'income\';renderPanel()" style="background:#065f46;color:#fff;border-color:#065f46">&#128181; Income</button> '+
      '<button class="btn sm" onclick="reportTab=\'trend\';renderPanel()" style="background:#6f42c1;color:#fff;border-color:#6f42c1">&#128202; Stock Trend</button>';
    return '<div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">'+trendTabBtns+'</div>'+trendContent;
  }




  if(reportTab==='income'){
    // Collect all income events: sales invoices (summarised), credit payments, deposits
    var incEvents=[];

    // 1. Sales invoices — summarised by invoice number
    var saleMap={};
    DB.sales.filter(function(s){
      if(reportDateFrom&&!dateInRange(s.date,reportDateFrom,''))return false;
      if(reportDateTo&&!dateInRange(s.date,'',reportDateTo))return false;
      return true;
    }).forEach(function(s){
      var k=s.invoiceNum||s.id;
      if(!saleMap[k])saleMap[k]={date:s.date,desc:'Invoice #'+k+' — '+(s.printName||s.custName),payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,splitPayment:s.splitPayment||null,total:0,partPayment:s.partPayment||0,depositApplied:0};
      saleMap[k].total+=s.total;
      saleMap[k].depositApplied+=(s.depositApplied||0);
    });
    Object.values(saleMap).forEach(function(g){
      if(g.payment==='credit')return; // credit invoices — no cash received yet
      if(g.payment==='deposit')return; // fully settled by deposit — already recorded on deposit date, skip
      // For all other payments, subtract any deposit applied so we don't double-count
      var depositUsed=g.depositApplied||0;
      var amtIn=g.payment==='part'?(g.partPayment||0):g.total;
      var newCash=Math.max(0,amtIn-depositUsed); // only the new money received on this invoice date
      if(newCash<=0)return; // nothing new came in — all covered by prior deposit
      var cat=g.payment==='part'?'Part payment':'Sales';
      var desc=g.desc+(depositUsed>0?' (deposit ₦'+Math.round(depositUsed).toLocaleString()+' excluded)':'');
      incEvents.push({date:g.date,desc:desc,cat:cat,amount:newCash,mode:payModeLabel(g)});
    });

    // 2. Credit payments received
    (DB.creditPayments||[]).filter(function(p){
      if(reportDateFrom&&!dateInRange(p.date,reportDateFrom,''))return false;
      if(reportDateTo&&!dateInRange(p.date,'',reportDateTo))return false;
      return true;
    }).forEach(function(p){
      if(p.payMode!=='writeoff')incEvents.push({date:p.date,desc:'Credit payment — '+p.custName,cat:'Credit payment',amount:p.amount,mode:payModeLabel(p)});
    });

    // 3. Customer deposits (new deposits, not applied ones)
    (DB.deposits||[]).filter(function(d){
      if(d.amount<=0)return false; // skip deductions
      if(reportDateFrom&&!dateInRange(d.date,reportDateFrom,''))return false;
      if(reportDateTo&&!dateInRange(d.date,'',reportDateTo))return false;
      return true;
    }).forEach(function(d){
      incEvents.push({date:d.date,desc:'Customer deposit — '+d.custName+(d.note?' ('+d.note+')':''),cat:'Deposit',amount:d.amount,mode:payModeLabel(d)});
    });

    // 4. Exchange balance payments (customer paid extra during exchange)
    (DB.cashflow||[]).filter(function(c){
      if(!c.isExchange||c.type!=='in')return false;
      if(reportDateFrom&&!dateInRange(c.date,reportDateFrom,''))return false;
      if(reportDateTo&&!dateInRange(c.date,'',reportDateTo))return false;
      return true;
    }).forEach(function(c){
      incEvents.push({date:c.date,desc:c.desc||'Exchange balance payment',cat:'Exchange balance',amount:c.amount,mode:c.payMode==='pos'?'POS':c.payMode==='transfer'?'Transfer':'Cash'});
    });

    // Sort by date desc
    incEvents.sort(function(a,b){return parseSaleDate(b.date)-parseSaleDate(a.date);});

    var incGrandTotal=incEvents.reduce(function(a,e){return a+e.amount;},0);

    // Breakdown by category
    var byCat={};
    incEvents.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});

    var incRows=incEvents.map(function(e,i){
      var catColor=e.cat==='Sales'?'#1a237e':e.cat==='Credit payment'?'#15803d':e.cat==='Deposit'?'#0369a1':'#92400e';
      return '<tr>'+
        '<td>'+(i+1)+'</td>'+
        '<td>'+e.date+'</td>'+
        '<td>'+e.desc+'</td>'+
        '<td><span style="background:'+catColor+';color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">'+e.cat+'</span></td>'+
        '<td style="text-align:right;font-weight:700;color:#15803d">'+fmt(e.amount)+'</td>'+
        '<td style="font-size:11px">'+e.mode+'</td>'+
      '</tr>';
    }).join('');

    var catBreakdown=Object.keys(byCat).map(function(k){return mc(k,fmt(byCat[k]),'','green');}).join('');

    var incTabBtns=
      '<button class="btn sm" onclick="reportTab=\'all\';renderPanel()">All sales</button> '+
      '<button class="btn sm" onclick="reportTab=\'paid\';renderPanel()">Paid invoices</button> '+
      '<button class="btn sm" onclick="reportTab=\'paidinv\';renderPanel()">Paid invoice summary</button> '+
      '<button class="btn sm" onclick="reportTab=\'credit\';renderPanel()">Credit only</button> '+
      '<button class="btn sm" onclick="reportTab=\'staff\';renderPanel()">By staff</button> '+
      '<button class="btn sm" onclick="reportTab=\'returns\';renderPanel()">Returns</button> '+
      '<button class="btn sm" onclick="reportTab=\'income\';renderPanel()" style="background:#065f46;color:#fff;border-color:#065f46">&#128181; Income</button> '+
      '<button class="btn sm" onclick="reportTab=\'trend\';renderPanel()" style="background:#6f42c1;color:#fff;border-color:#6f42c1">&#128202; Stock Trend</button>';

    var out='<div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">'+incTabBtns+'</div>';
    out+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem">';
    out+='<input type="date" value="'+reportDateFrom+'" onchange="reportDateFrom=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">';
    out+='<span style="font-size:12px;color:var(--text3)">to</span>';
    out+='<input type="date" value="'+reportDateTo+'" onchange="reportDateTo=this.value;renderPanel()" style="font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">';
    out+='<button class="btn sm" onclick="reportDateFrom=\'\';reportDateTo=\'\';renderPanel()">Clear</button>';
    out+='<button class="btn sm" onclick="printIncomeReport()" style="color:#065f46;border-color:#6ee7b7">&#128438; Print report</button>';
    out+='</div>';
    out+='<div class="metrics">'+mc('Total income',fmt(incGrandTotal),'All sources','green')+catBreakdown+'</div>';
    if(incRows){
      out+='<div class="tbl-wrap"><table><thead><tr>';
      out+='<th>#</th><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th>Mode</th>';
      out+='</tr></thead><tbody>'+incRows;
      out+='<tr style="background:var(--success-bg);font-weight:700;border-top:2px solid #065f46"><td colspan="4">TOTAL</td><td style="text-align:right;color:#15803d">'+fmt(incGrandTotal)+'</td><td></td></tr>';
      out+='</tbody></table></div>';
    } else {
      out+='<div class="empty">No income recorded for this period.</div>';
    }
    return out;
  }

  if(reportTab==='returns'){
    var allReturns=(DB.salesReturns||[]);
    var retFiltered=allReturns.filter(function(r){
      if(reportDateFrom&&!dateInRange(r.date,reportDateFrom,''))return false;
      if(reportDateTo&&!dateInRange(r.date,'',reportDateTo))return false;
      return true;
    });
    var retMap={};
    retFiltered.forEach(function(r){
      var k=(r.invoiceNum||r.invoiceId||r.id);
      if(!retMap[k])retMap[k]={invoiceNum:k,date:r.date,custName:r.custName||'Walk-in',items:[],totalRefund:0,refundType:r.refundType,by:r.by};
      retMap[k].items.push((r.itemName||r.name||'Item')+' ×'+(r.qty||1));
      retMap[k].totalRefund+=(r.refundAmt||0);
    });

// ── Monthly Summary Report (standalone) ────────────────
function buildMonthlyReport(){
  console.log('buildMonthlyReport called, activeTab='+activeTab);
var now=new Date();
var selMonth=window._monthSumMonth||(now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0')));
var selD=new Date(selMonth+'-02');
var selM=selD.getMonth(),selY=selD.getFullYear();
var monthLabel=selD.toLocaleString('default',{month:'long',year:'numeric'});

// Build last 24 months for selector
var mOpts='';
for(var mi=0;mi<24;mi++){
  var md=new Date(now.getFullYear(),now.getMonth()-mi,1);
  var mv=md.getFullYear()+'-'+String(md.getMonth()+1).padStart(2,'0');
  mOpts+='<option value="'+mv+'"'+(mv===selMonth?' selected':'')+'>'+md.toLocaleString('default',{month:'long',year:'numeric'})+'</option>';
}

// Helper: is date in selected month
var inSelMonth=function(dateStr){
  var d=parseDate(dateStr);
  return d&&d.getMonth()===selM&&d.getFullYear()===selY;
};

// ── Revenue & Profit ──────────────────────────────────────
var mSales=DB.sales.filter(function(s){return inSelMonth(s.date);});
var invMapM={};
mSales.forEach(function(s){
  var k=s.invoiceNum||s.id;
  if(!invMapM[k]){
    invMapM[k]={
      total:0,profit:0,
      payment:s.payment,
      payMode:s.payMode||'cash',
      splitPayment:s.splitPayment||null,
      partPayment:s.partPayment||0,
      depositApplied:s.depositApplied||0
    };
  }
  // partPayment only set on first line — always take the max found across lines
  if(s.partPayment)invMapM[k].partPayment=Math.max(invMapM[k].partPayment,s.partPayment);
  invMapM[k].total+=s.total;
  invMapM[k].profit+=s.profit;
});
var invListM=Object.values(invMapM);
var mRev=invListM.reduce(function(a,g){return a+g.total;},0);
var mGrossProfit=invListM.reduce(function(a,g){return a+g.profit;},0);

// ── Still Owed: use live creditCustomers & creditPayments for accuracy ──
// New credit invoices raised this month
var mCreditOwed=invListM.filter(function(g){return g.payment==='credit';}).reduce(function(a,g){return a+Math.max(0,g.total-(g.depositApplied||0));},0);
var mPartOwed=invListM.filter(function(g){return g.payment==='part';}).reduce(function(a,g){return a+Math.max(0,g.total-g.partPayment-(g.depositApplied||0));},0);
var mTotalOwed=mCreditOwed+mPartOwed;

// ── Cash Received: only from paid invoices this month ────
var mCashIn=invListM.filter(function(g){return g.payment!=='credit';}).reduce(function(a,g){
  if(g.payment==='part')return a+(g.partPayment||0);
  return a+g.total;
},0);
// Credit payments collected this month (old debts paid)
var mCreditPaid=(DB.creditPayments||[]).filter(function(p){return inSelMonth(p.date)&&p.payMode!=='writeoff';}).reduce(function(a,p){return a+(p.amount||0);},0);

// ── Expenses ─────────────────────────────────────────────
var mExpLines=DB.cashflow.filter(function(c){return c.type==='out'&&!c.isReturn&&c.cat!=='Restock'&&c.cat!=='Change'&&c.cat!=='Supplier Payment'&&c.cat!=='Supplier Deposit'&&inSelMonth(c.date);});
var mExpTotal=mExpLines.reduce(function(a,e){return a+e.amount;},0);
var mRestocking=(DB.purchases||[]).filter(function(p){return inSelMonth(p.date);}).reduce(function(a,p){return a+(p.grandTotal||0);},0);
var mNetProfit=mGrossProfit-mExpTotal;
// Net cash = invoices collected + old debts collected - expenses
var mNetCash=mCashIn+mCreditPaid-mExpTotal;

// ── Expense breakdown ────────────────────────────────────
var mExpCats={};
mExpLines.forEach(function(e){var cat=e.cat||'Other';if(!mExpCats[cat])mExpCats[cat]=0;mExpCats[cat]+=e.amount;});
var mExpCatRows=Object.entries(mExpCats).sort(function(a,b){return b[1]-a[1];}).map(function(ec){
  return '<tr><td style="font-size:12px">'+esc(ec[0])+'</td><td style="text-align:right;font-size:12px">'+fmt(ec[1])+'</td></tr>';
}).join('');

// ── Top 5 items by revenue ───────────────────────────────
var itemMapM={};
mSales.forEach(function(s){
  var k=s.itemId||s.name;
  if(!itemMapM[k])itemMapM[k]={name:s.name,qty:0,rev:0,profit:0};
  itemMapM[k].qty+=s.qty||1;
  itemMapM[k].rev+=s.total;
  itemMapM[k].profit+=s.profit;
});
var topItems=Object.values(itemMapM).sort(function(a,b){return b.rev-a.rev;}).slice(0,5);
var topRows=topItems.map(function(it,i){
  return '<tr>'+
    '<td style="font-size:12px"><b>'+(i+1)+'.</b> '+esc(it.name)+'</td>'+
    '<td style="text-align:center;font-size:12px">'+it.qty+'</td>'+
    '<td style="text-align:right;font-size:12px">'+fmt(it.rev)+'</td>'+
    '<td style="text-align:right;font-size:12px;color:#15803d">'+fmt(it.profit)+'</td>'+
  '</tr>';
}).join('');

// ── Credit summary ───────────────────────────────────────
var creditCusts=DB.customers.filter(function(c){return (c.creditBalance||0)>0;}).sort(function(a,b){return (b.creditBalance||0)-(a.creditBalance||0);}).slice(0,5);
var creditRows=creditCusts.map(function(c){
  return '<tr>'+
    '<td style="font-size:12px">'+esc(c.name)+'</td>'+
    '<td style="font-size:12px;color:#6b7280">'+(c.phone||'—')+'</td>'+
    '<td style="text-align:right;font-size:12px;color:#dc2626;font-weight:700">'+fmt(c.creditBalance||0)+'</td>'+
  '</tr>';
}).join('');
var totalCreditAllTime=DB.customers.reduce(function(a,c){return a+(c.creditBalance||0);},0); // kept for WhatsApp/print functions

// ── Payment mode breakdown — same method as Financial Dashboard ─
var pmCash=0,pmPos=0,pmTransfer=0;
mSales.forEach(function(s){
  if(s.payMode==='split'&&s.splitPayment){
    var sp=s.splitPayment;
    var ratio=s.total/((sp.amt1||0)+(sp.amt2||0))||1;
    if(sp.mode1==='cash')pmCash+=sp.amt1*ratio;
    else if(sp.mode1==='pos')pmPos+=sp.amt1*ratio;
    else if(sp.mode1==='transfer')pmTransfer+=sp.amt1*ratio;
    if(sp.mode2==='cash')pmCash+=sp.amt2*ratio;
    else if(sp.mode2==='pos')pmPos+=sp.amt2*ratio;
    else if(sp.mode2==='transfer')pmTransfer+=sp.amt2*ratio;
  } else if(s.payment!=='credit'){
    if(s.payMode==='cash')pmCash+=s.total;
    else if(s.payMode==='pos')pmPos+=s.total;
    else if(s.payMode==='transfer')pmTransfer+=s.total;
  }
});

// ── Staff performance ────────────────────────────────────
var staffMapM={};
invListM.forEach(function(g){});
mSales.forEach(function(s){
  var k=s.seller||'Unknown';
  if(!staffMapM[k])staffMapM[k]={name:k,invoices:new Set(),rev:0,profit:0};
  staffMapM[k].invoices.add(s.invoiceNum||s.id);
  staffMapM[k].rev+=s.total;
  staffMapM[k].profit+=s.profit;
});
var staffRows=Object.values(staffMapM).sort(function(a,b){return b.rev-a.rev;}).map(function(st){
  return '<tr>'+
    '<td style="font-size:12px">'+esc(st.name)+'</td>'+
    '<td style="text-align:center;font-size:12px">'+st.invoices.size+'</td>'+
    '<td style="text-align:right;font-size:12px">'+fmt(st.rev)+'</td>'+
    '<td style="text-align:right;font-size:12px;color:#15803d">'+fmt(st.profit)+'</td>'+
  '</tr>';
}).join('');

// Store computed data for print/WhatsApp functions
window._monthlySummaryData={
  monthLabel:monthLabel, selMonth:selMonth,
  mRev:mRev, mGrossProfit:mGrossProfit, mNetProfit:mNetProfit,
  mNetCash:mNetCash, mCashIn:mCashIn, mCreditPaid:mCreditPaid,
  mExpTotal:mExpTotal, mRestocking:mRestocking,
  mCreditOwed:mCreditOwed, mPartOwed:mPartOwed, mTotalOwed:mTotalOwed,
  invCount:invListM.length, topItems:topItems,
  pmCash:pmCash, pmPos:pmPos, pmTransfer:pmTransfer,
  mExpCats:mExpCats, totalCreditAllTime:totalCreditAllTime,
  creditCusts:creditCusts
};

    '</style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="co2">GLOBAL DOORS LTD</div>'+
      '<div style="font-size:11px;font-weight:700;margin-top:4px;color:#0369a1">PAID INVOICE SUMMARY REPORT</div>'+
      '<div style="font-size:9px;margin-top:2px;color:#555">Period: '+dateRange+' &nbsp;|&nbsp; Printed: '+new Date().toLocaleString()+'</div>'+

function printIncomeReport(){
  var incEvents=[];
  var saleMap={};
  DB.sales.filter(function(s){
    if(reportDateFrom&&!dateInRange(s.date,reportDateFrom,''))return false;
    if(reportDateTo&&!dateInRange(s.date,'',reportDateTo))return false;
    return true;
  }).forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!saleMap[k])saleMap[k]={date:s.date,desc:'Invoice #'+k+' — '+(s.printName||s.custName),payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,splitPayment:s.splitPayment||null,total:0,partPayment:s.partPayment||0};
    saleMap[k].total+=s.total;
  });
  Object.values(saleMap).forEach(function(g){
    if(g.payment==='credit')return;
    if(g.payment==='deposit')return; // already recorded on deposit date
    var depositUsed=g.depositApplied||0;
    var amtIn=g.payment==='part'?(g.partPayment||0):g.total;
    var newCash=Math.max(0,amtIn-depositUsed);
    if(newCash<=0)return;
    var cat=g.payment==='part'?'Part payment':'Sales';
    var desc=g.desc+(depositUsed>0?' (dep. \u20a6'+Math.round(depositUsed).toLocaleString()+' excl.)':'');
    incEvents.push({date:g.date,desc:desc,cat:cat,amount:newCash,mode:payModeLabel(g)});

  (DB.creditPayments||[]).filter(function(p){

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Income Report</title>'+

    '</style></head><body>'+

function saveProfile(){
  var u=DB.currentUser;
  var name=document.getElementById('up-name').value.trim(),uname=document.getElementById('up-user').value.trim(),pass=document.getElementById('up-pass').value,pass2=document.getElementById('up-pass2').value;
  if(!name||!uname){alert('Name and username required.');return;}
  var dup=DB.users.find(function(x){return x.username===uname&&x.id!==u.id;});if(dup){alert('Username taken.');return;}
  if(pass&&pass!==pass2){alert('Passwords do not match.');return;}
  u.name=name;u.username=uname;if(pass)u.password=pass;
  var idx=DB.users.findIndex(function(x){return x.id===u.id;});if(idx>-1)DB.users[idx]=u;
  saveData();alert('Profile updated!');renderApp();
}
function adminResetPassword(userId){
  var usr=DB.users.find(function(x){return x.id==userId;});
  if(!usr){alert('User not found.');return;}
  var newPass=prompt('Reset password for '+usr.name+'.\n\nEnter new password:');
  if(!newPass)return;
  if(newPass.length<4){alert('Password must be at least 4 characters.');return;}
  usr.password=newPass;
  saveData();
  logActivity('Password reset','Admin reset password for '+usr.name,'');
  alert('Password reset for '+usr.name+'. Make sure to inform them of their new password.');
}
function addUser(){
  var name=document.getElementById('nu-name').value.trim(),uname=document.getElementById('nu-user').value.trim(),pass=document.getElementById('nu-pass').value,role=document.getElementById('nu-role').value;
  if(!name||!uname||!pass){alert('All fields required.');return;}
  var dup=DB.users.find(function(x){return x.username===uname;});if(dup){alert('Username already taken.');return;}
  var perms={};Object.keys(ALL_PERMS).forEach(function(p){perms[p]=false;});
  DB.users.push({id:uid(),name:name,username:uname,password:pass,role:role,permissions:perms});
  saveData();renderApp();
}
function removeUser(id){
  var u=DB.users.find(function(x){return x.id===id;});
  if(!u)return;
  showConfirm({
    type:'danger',
    title:'Remove user?',
    msg:'This user will be moved to the Recycle Bin. They will lose access immediately.',
    detail:'🛡️ '+esc(u.name)+' (@'+u.username+') — '+(u.role==='admin'?'Administrator':'Staff'),
    confirmLabel:'🗑️ Remove user',
    cancelLabel:'Cancel'
  },function(){
    moveToRecycleBin('user',u,'Users');
    DB.users=DB.users.filter(function(x){return x.id!==id;});
    saveData();renderApp();
  });
}
function togglePerm(id,perm,val){var u=DB.users.find(function(x){return x.id==id;});if(!u)return;u.permissions[perm]=val;saveData();}

function filterSalesTable(){

  var rows=document.querySelectorAll('#sales-ledger-table tbody tr');

  rows.forEach(function(r){

function recordDeposit(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amt=parseFloat(document.getElementById('dep-amt').value)||0;
  if(amt<=0){alert('Enter a valid amount.');document.getElementById('dep-amt').focus();return;}
  var mode=document.getElementById('dep-mode').value;
  var bankId='',posId='';
  if(mode==='transfer'){bankId=(document.getElementById('dep-bank')||{}).value||'';if(!bankId){alert('Please select a bank.');return;}}
  if(mode==='pos'){posId=(document.getElementById('dep-pos')||{}).value||'';if(!posId){alert('Please select a POS terminal.');return;}}
  var note=(document.getElementById('dep-note').value||'').trim();
  var depDateVal=document.getElementById('dep-date')?document.getElementById('dep-date').value:'';
  var depDateObj=depDateVal?new Date(depDateVal):new Date();
  var date=depDateObj.toLocaleDateString();
  var month=depDateObj.toLocaleString('default',{month:'short',year:'numeric'});
  if(!DB.deposits)DB.deposits=[];
  DB.deposits.push({id:uid(),custId:custId,custName:cust.name,amount:amt,payMode:mode,bankId:bankId,posId:posId,note:note,date:date,month:month,by:DB.currentUser.name});
  var ov=document.getElementById('deposit-modal-overlay');if(ov)ov.remove();
  saveData();
  renderApp();
  setTimeout(function(){
    showConfirm({type:'success',title:'Deposit recorded',msg:'',detail:fmt(amt)+' deposit saved for '+esc(cust.name)+'. Balance updated.',confirmLabel:'OK',cancelLabel:null},function(){});
  },100);
}

function writeOffCredit(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amtEl=document.getElementById('cp-amt-'+custId);
  var dateEl=document.getElementById('cp-date-'+custId);
  var balance=cust.creditBalance||0;
  // Use entered amount if available, else offer full balance
  var suggested=amtEl&&amtEl.value?parseFloat(amtEl.value):balance;
  var amt=parseFloat(prompt(
    'Write-off / Discount for '+esc(cust.name)+'\nCurrent balance owed: '+fmt(balance)+'\n\nEnter amount to write off as discount:',
    Math.round(suggested)
  ));
  if(isNaN(amt)||amt<=0)return;
  if(amt>balance){alert('Cannot write off more than the outstanding balance ('+fmt(balance)+').');return;}
  if(!confirm('Write off '+fmt(amt)+' from '+cust.name+"'s balance as a discount?\n\nThis will NOT be recorded as cash received.\nRemaining balance after write-off: "+fmt(balance-amt)))return;

  var rawDate=dateEl&&dateEl.value?new Date(dateEl.value):new Date();
  var date=rawDate.toLocaleDateString();
  var month=rawDate.toISOString().slice(0,7);

  // Reduce credit balance
  cust.creditBalance=Math.round((balance-amt)*100)/100;

  // Record as write-off in credit payments (mode = writeoff, not added to cashflow income)
  if(!DB.creditPayments)DB.creditPayments=[];
  DB.creditPayments.push({
    id:uid(),custId:custId,custName:cust.name,
    amount:amt,payMode:'writeoff',
    date:date,month:month,
    note:'Write-off / Discount',
    by:DB.currentUser.name
  });

  logActivity('Credit write-off',
    'Discount of '+fmt(amt)+' applied to '+esc(cust.name)+'. Remaining balance: '+fmt(Math.max(0,cust.creditBalance)),
    'writeoff');
  saveData();
  renderApp();
  alert('Write-off of '+fmt(amt)+' applied to '+cust.name+'.\nRemaining balance: '+fmt(Math.max(0,cust.creditBalance)));
}

function saveCommissionEntry(invNum, custId, custName){
  var desc=(document.getElementById('cm-desc')||{}).value.trim();
  var amt=parseFloat((document.getElementById('cm-amount')||{}).value)||0;
  var note=(document.getElementById('cm-note')||{}).value.trim();
  var payNow=(document.getElementById('cm-pay-now')||{}).checked;
  var payAmt=parseFloat((document.getElementById('cm-pay-amt')||{}).value)||amt; // default = full amount
  var payMode=(document.getElementById('cm-pay-mode')||{}).value||'cash';
  var bankId=(document.getElementById('cm-bank-id')||{}).value||null;
  var posId=(document.getElementById('cm-pos-id')||{}).value||null;

  if(!desc){alert('Enter a description.');return;}
  if(!amt||amt<=0){alert('Enter a valid commission amount.');return;}
  if(payNow&&payAmt>amt){alert('Pay amount cannot exceed commission amount ('+fmt(amt)+')');return;}

  var now=new Date();
  var date=now.toLocaleDateString();
  var month=now.toISOString().slice(0,7);
  var cust=(DB.customers||[]).find(function(c){return c.id==custId;});

  // Record commission earned
  DB.commissionLedger.push({id:uid(),custId:custId,custName:custName,invoiceNum:invNum,description:desc,amount:amt,note:note,type:'earned',date:date,month:month,by:DB.currentUser.name});
  if(cust)cust.commissionBalance=(cust.commissionBalance||0)+amt;

  // If paying now, record payout immediately
  if(payNow&&payAmt>0){
    var payNote='Commission payout — Invoice #'+invNum+(note?' ('+note+')':'');
    DB.commissionLedger.push({id:uid(),custId:custId,custName:custName,invoiceNum:invNum,description:'Commission payout',amount:payAmt,note:payNote,type:'paid',date:date,month:month,by:DB.currentUser.name});
    if(cust)cust.commissionBalance=(cust.commissionBalance||0)-payAmt;
    // Auto-record as expense
    DB.cashflow.push({id:uid(),desc:'Commission paid — '+custName+' Invoice #'+invNum,amount:payAmt,type:'out',cat:'Commission',payMode:payMode,bankId:bankId,posId:posId,date:date,month:month,by:DB.currentUser.name});
  }

  saveData();
  document.getElementById('commission-modal').remove();
  var msg='✅ Commission of '+fmt(amt)+' added for '+custName+'.';
  if(payNow&&payAmt>0)msg+='\n💸 '+fmt(payAmt)+' paid out via '+payMode+' and recorded as expense.';
  alert(msg);
}

function applyCommissionToDebt(custId){
  var cust=(DB.customers||[]).find(function(c){return c.id==custId;});
  if(!cust)return;
  var commBal=cust.commissionBalance||0;
  var debt=cust.creditBalance||0;
  if(commBal<=0){alert('No commission balance available.');return;}
  if(debt<=0){alert('Customer has no outstanding debt.');return;}
  var amtInput=parseFloat((document.getElementById('pcm-amt')||{}).value)||0;
  var apply=Math.min(amtInput||commBal, commBal, debt);
  if(apply<=0){alert('Enter a valid amount.');return;}
  if(!confirm('Apply '+fmt(apply)+' commission to '+esc(cust.name)+'\'s outstanding debt of '+fmt(debt)+'?\n\nNew debt: '+fmt(Math.max(0,debt-apply))+'\nRemaining commission: '+fmt(commBal-apply)))return;
  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  // Reduce commission balance
  cust.commissionBalance=Math.max(0,commBal-apply);
  // Reduce credit balance (outstanding debt)
  cust.creditBalance=Math.max(0,debt-apply);
  // Log commission as paid (used for debt)
  DB.commissionLedger.push({id:uid(),custId:cust.id,custName:cust.name,type:'paid',amount:apply,note:'Applied to outstanding debt',date:date,month:month,by:DB.currentUser?DB.currentUser.name:'Admin'});
  // Log as credit payment
  DB.creditPayments.push({id:uid(),custId:cust.id,custName:cust.name,amount:apply,payMode:'commission',date:date,month:month,note:'Commission applied to debt',by:DB.currentUser?DB.currentUser.name:'Admin'});
  // Cashflow in
  DB.cashflow.push({id:uid(),desc:'Commission applied to debt — '+cust.name,amount:apply,type:'in',cat:'Credit Payment',payMode:'commission',date:date,month:month});
  logActivity('Commission applied to debt',esc(cust.name)+' — '+fmt(apply)+' commission offset against outstanding debt','commission');
  saveData();
  var modal=document.getElementById('pay-commission-modal');if(modal)modal.remove();
  renderApp();
  showToast('✅ '+fmt(apply)+' commission applied to '+cust.name+'\'s debt. New balance: '+fmt(Math.max(0,debt-apply)));
}

function recordCommissionPayout(custId){
  var cust=(DB.customers||[]).find(function(c){return c.id==custId;});
  if(!cust){alert('Customer not found.');return;}
  var amt=parseFloat((document.getElementById('pcm-amt')||{}).value)||0;
  var mode=(document.getElementById('pcm-mode')||{}).value||'cash';
  var bankId=(document.getElementById('pcm-bank')||{}).value||null;
  var posId=(document.getElementById('pcm-pos')||{}).value||null;
  var note=(document.getElementById('pcm-note')||{}).value.trim()||'Commission payout — '+cust.name;
  if(!amt||amt<=0){alert('Enter a valid amount.');return;}
  if(amt>(cust.commissionBalance||0)){alert('Amount exceeds commission balance ('+fmt(cust.commissionBalance)+')');return;}
  var now=new Date();
  var date=now.toLocaleDateString();
  var month=now.toISOString().slice(0,7);
  // Record commission ledger payout entry
  DB.commissionLedger.push({id:uid(),custId:custId,custName:cust.name,invoiceNum:null,description:'Commission payout',amount:amt,note:note,type:'paid',date:date,month:month,by:DB.currentUser.name});
  // Reduce customer commissionBalance
  cust.commissionBalance=(cust.commissionBalance||0)-amt;
  // Auto-record as expense in cashflow
  DB.cashflow.push({id:uid(),desc:'Commission paid — '+cust.name+(note?' ('+note+')':''),amount:amt,type:'out',cat:'Commission',payMode:mode,bankId:bankId||null,posId:posId||null,date:date,month:month,by:DB.currentUser.name});
  saveData();
  document.getElementById('pay-commission-modal').remove();
  renderApp();
  alert('✅ Commission of '+fmt(amt)+' paid to '+cust.name+' and recorded as expense.');
}

function genProformaNum(){
  var yr=new Date().getFullYear();
  var existing=(DB.proformas||[]).filter(function(p){return (p.prfNum||'').indexOf('PRF/'+yr+'/')===0;});
  var next=existing.length+1;
  return 'PRF/'+yr+'/'+String(next).padStart(4,'0');
}

function saveAsProforma(){
  if(!invoiceItems.length){alert('Add at least one item before saving as proforma.');return;}
  var custId=null,custName='Walk-in customer';
  if(saleCustomerType==='registered'){
    var sel=document.getElementById('s-reg-customer');
    if(sel)custId=sel.value;
    var rc=DB.customers.find(function(c){return String(c.id)==String(custId);});
    if(rc)custName=rc.name;
  }
  var validDays=parseInt(prompt('Valid for how many days? (default: 7)','7'))||7;
  var now=new Date();
  var date=now.toISOString().slice(0,10); // ISO format for reliable date math
  var month=now.toISOString().slice(0,7);
  var prfNum=genProformaNum();
  var grandTotal=invoiceItems.reduce(function(a,l){return a+(l.price*l.qty-(l.discAmt||0));},0);
  DB.proformas.push({
    id:uid(),prfNum:prfNum,custId:custId,custName:custName,
    items:JSON.parse(JSON.stringify(invoiceItems)),
    grandTotal:grandTotal,date:date,month:month,
    validDays:validDays,status:'pending',
    convertedInvNum:null,by:DB.currentUser.name
  });
  saveData();
  if(confirm('✅ Proforma '+prfNum+' saved!\n\nPrint it now?'))printProforma(prfNum);
  invoiceItems=[];
  renderInvoiceItems();
}

function generateDemoInvoiceNum(){
  var year=new Date().getFullYear();
  if(!DB.demoInvoiceCounter)DB.demoInvoiceCounter=1;
  // Scan existing demo sales for max used
  var allNums=(DB.demoSales||[]).map(function(s){return parseInt((s.invoiceNum||'').split('/').pop())||0;});
  var maxUsed=allNums.length?Math.max.apply(null,allNums):0;
  var next=Math.max(DB.demoInvoiceCounter,maxUsed+1);
  return 'DM/'+year+'/'+String(next).padStart(4,'0');
}

function filterDemoItemDd(val, showAll){
  var dd=document.getElementById('demo-item-dd');
  if(!dd)return;
  var term=(val||'').toLowerCase().trim();
  var matches=DB.inventory.filter(function(i){
    if(!showAll&&!term)return false;
    return !term||i.name.toLowerCase().indexOf(term)>-1||(i.cat||'').toLowerCase().indexOf(term)>-1;
  }).slice(0,20);
  if(!matches.length){dd.style.display='none';return;}
  dd.innerHTML=matches.map(function(i){
    return '<div data-iid="'+i.id+'" data-iname="'+i.name.replace(/"/g,'&quot;')+'" data-iprice="'+i.sell+'" class="demo-dd-item" '+
      'style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between" '+
      'onmouseover="this.style.background=\'var(--surface2)\'" onmouseout="this.style.background=\'#fff\'">'+
      '<span><b>'+esc(i.name)+'</b> <span style="color:#9ca3af;font-size:11px">'+(i.cat||'')+'</span></span>'+
      '<span style="color:#15803d;font-size:12px;font-weight:600">'+fmt(i.sell)+' · '+i.qty+' in stock</span>'+
    '</div>';
  }).join('');
  dd.style.display='block';
  dd.querySelectorAll('.demo-dd-item').forEach(function(el){
    el.addEventListener('mousedown',function(e){
      e.preventDefault();
      var inp=document.getElementById('demo-item-search');
      var hid=document.getElementById('demo-item-id');
      var prc=document.getElementById('demo-price');
      if(inp)inp.value=this.getAttribute('data-iname').replace(/&quot;/g,'"');
      if(hid)hid.value=this.getAttribute('data-iid');
      if(prc)prc.value=this.getAttribute('data-iprice');
      dd.style.display='none';
    });
  });
}

function addDemoItem(){
  var id=document.getElementById('demo-item-id').value;
  var name=document.getElementById('demo-item-search').value.trim();
  var qty=parseInt(document.getElementById('demo-qty').value)||1;
  var price=parseFloat(document.getElementById('demo-price').value)||0;
  if(!id&&!name){showToast('Search and select an item first.');return;}
  var item=id?DB.inventory.find(function(i){return String(i.id)===String(id);}):DB.inventory.find(function(i){return i.name===name;});
  if(!item){showToast('Item not found in inventory.');return;}
  if(qty<=0){showToast('Enter a valid quantity.');return;}
  if(qty>item.qty){showToast('Only '+item.qty+' in stock.');return;}
  // Auto-merge same item + same price
  var existing=demoItems.find(function(l){return l.itemId==item.id&&l.price===price;});
  if(existing){
    if(existing.qty+qty>item.qty){showToast('Only '+item.qty+' in stock total.');return;}
    existing.qty+=qty;existing.total=existing.price*existing.qty;
  } else {
    demoItems.push({itemId:item.id,name:item.name,cost:item.cost,qty:qty,price:price,total:price*qty});
  }
  // Reset fields
  document.getElementById('demo-item-search').value='';
  document.getElementById('demo-item-id').value='';
  document.getElementById('demo-qty').value='1';
  document.getElementById('demo-price').value='0';
  renderPanel();
}
