function receiveDelivery(pendingId){
  var pd=DB.pendingDeliveries.find(function(p){return p.id==pendingId;});
  if(!pd){alert('Pending delivery not found.');return;}
  var inpId='pd-qty-'+pendingId;
  var inp=document.getElementById(inpId);
  var qtyNow=parseInt(inp?inp.value:0)||0;
  if(qtyNow<=0){alert('Enter the quantity now being received (1 or more).');return;}
  if(qtyNow>pd.qtyPending){
    alert('You are trying to receive '+qtyNow+' but only '+pd.qtyPending+' are pending.\nReceiving all '+pd.qtyPending+' remaining.');
    qtyNow=pd.qtyPending;
  }
  var date=new Date().toLocaleDateString();
  // Add to stock
  if(pd.itemId){
    var existing=DB.inventory.find(function(i){return i.id==pd.itemId;});
    if(existing)existing.qty+=qtyNow;
  } else {
    var byName=DB.inventory.find(function(i){return i.name.toLowerCase()===pd.itemName.toLowerCase();});
    if(byName)byName.qty+=qtyNow;
    else DB.inventory.push({id:uid(),name:pd.itemName,qty:qtyNow,cost:pd.cost,sell:pd.cost,minQty:5,supId:pd.supId,cat:''});
  }
  // Update pending record
  pd.qtyPending-=qtyNow;
  pd.qtyReceived=(pd.qtyReceived||0)+qtyNow;
  pd.deliveries.push({qty:qtyNow,date:date,by:DB.currentUser?DB.currentUser.name:'Unknown'});
  if(pd.qtyPending<=0){
    pd.status='complete';
    pd.dateCompleted=date;
  } else {
    pd.status='partial';
  }
  // Cashflow note
  DB.cashflow.push({id:uid(),desc:'Delivery received: '+pd.itemName+' x'+qtyNow+' (Inv#'+pd.invoiceNum+' from '+pd.supName+')',amount:qtyNow*pd.cost,type:'out',cat:'Restock',payMode:'cash',date:date,month:new Date().toISOString().slice(0,7)});
  saveData();
  var msg='✅ Received '+qtyNow+' unit(s) of '+pd.itemName+'. Stock updated.';
  if(pd.qtyPending<=0){msg+='\n\n✅ This item is now fully delivered!';}
  else{msg+='\n\nStill pending: '+pd.qtyPending+' unit(s) remaining.';}
  alert(msg);
  renderApp();
}

function markDeliveryComplete(pendingId){
  if(!confirm('Mark this pending delivery as complete? No additional stock will be added.'))return;
  var pd=DB.pendingDeliveries.find(function(p){return p.id==pendingId;});
  if(!pd)return;
  pd.status='complete';pd.qtyPending=0;pd.dateCompleted=new Date().toLocaleDateString();
  saveData();renderApp();
}

function buildPurchases(){
  if(!canDo('purchases'))return '<div class="empty">Access denied.</div>';
  var totalSpent=DB.purchases.reduce(function(a,p){return a+p.grandTotal;},0);
  var creditOwed=DB.purchases.reduce(function(a,p){return a+(p.creditAmt||0);},0);
  var pendingList=(DB.pendingDeliveries||[]).filter(function(p){return p.status!=='complete';});
  var so=DB.suppliers.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('');
  var puBankSub='<div class="form-group" id="pu-bank-wrap" style="display:none"><label>Which bank? <span style="color:var(--danger)">*</span></label><select id="pu-bankid"><option value="">Select bank...</option>'+bankOpts()+'</select></div>';
  var puPosSub='<div class="form-group" id="pu-pos-wrap" style="display:none"><label>Which POS? <span style="color:var(--danger)">*</span></label><select id="pu-posid"><option value="">Select terminal...</option>'+posOpts()+'</select></div>';
  var puItems='<div id="pi-items-table"><div style="text-align:center;padding:1.5rem;color:#888;font-size:13px;border:1px dashed #ccc;border-radius:8px">No items added yet.</div></div>';
  setTimeout(function(){renderPurchaseItems();},50);

  // Pending deliveries section
  var pendingSection='';
  if(pendingList.length){
    var pendingCards=pendingList.map(function(pd){

var expenseCats=['Transport','Salary','Rent','Utilities','Maintenance','Advertising','Office supplies','Other'];
// expenseCats is now stored in DB.expenseCats for persistence; this array is the fallback default

function addExpense(){
  var desc=document.getElementById('ex-desc').value.trim();
  var amount=parseFloat(document.getElementById('ex-amount').value)||0;
  var cat=document.getElementById('ex-cat').value;
  var pm=document.getElementById('ex-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('ex-bankid')?document.getElementById('ex-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('ex-posid')?document.getElementById('ex-posid').value:''):null;
  if(!desc){alert('Enter a description for this expense.');return;}
  if(amount<=0){alert('Enter the expense amount.');return;}
  if(pm==='transfer'&&DB.banks.length&&!bankId){alert('Select which bank the transfer was made from.');return;}
  if(pm==='pos'&&DB.posTerminals.length&&!posId){alert('Select which POS terminal was used.');return;}
  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  DB.cashflow.push({id:uid(),desc:desc,amount:amount,type:'out',cat:cat,payMode:pm,bankId:bankId,posId:posId,date:date,month:month,by:DB.currentUser?DB.currentUser.name:'Unknown',isExpense:true});
  document.getElementById('ex-desc').value='';
  document.getElementById('ex-amount').value='';
  saveData();renderApp();
}

function applyExpenseShortcut(label){
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth(),day=now.getDate();
  var pad=function(n){return String(n).padStart(2,'0');};
  var today=y+'-'+pad(m+1)+'-'+pad(day);
  var from=today,to=today;
  if(label==='This week'){
    var dow=now.getDay()===0?6:now.getDay()-1;
    var mon=new Date(y,m,day-dow);
    from=mon.getFullYear()+'-'+pad(mon.getMonth()+1)+'-'+pad(mon.getDate());
  } else if(label==='This month'){
    from=y+'-'+pad(m+1)+'-01';
  } else if(label==='Last month'){
    var lm=new Date(y,m-1,1),lme=new Date(y,m,0);
    from=lm.getFullYear()+'-'+pad(lm.getMonth()+1)+'-01';
    to=lme.getFullYear()+'-'+pad(lme.getMonth()+1)+'-'+pad(lme.getDate());
  } else if(label==='This year'){
    from=y+'-01-01';
  }
  expFilterFrom=from;expFilterTo=to;expFilterCat='';renderApp();
}
function applyExpenseFilters(){
  expFilterFrom=document.getElementById('ef-from')?document.getElementById('ef-from').value:'';
  expFilterTo=document.getElementById('ef-to')?document.getElementById('ef-to').value:'';
  expFilterCat=document.getElementById('ef-cat')?document.getElementById('ef-cat').value:'';
  renderApp();
}
function clearExpenseFilters(){expFilterFrom='';expFilterTo='';expFilterCat='';renderApp();}

function addExpenseCat(){
  var inp=document.getElementById('ec-new-name');
  var name=inp?inp.value.trim():'';
  if(!name){alert('Enter a category name.');return;}
  if(DB.expenseCats.find(function(c){return c.toLowerCase()===name.toLowerCase();})){alert('Category already exists.');return;}
  DB.expenseCats.push(name);
  inp.value='';
  saveData();renderApp();
}
function removeExpenseCat(name){
  if(DB.expenseCats.length<=1){alert('Keep at least one category.');return;}
  var inUse=DB.cashflow.find(function(c){return c.cat===name&&c.isExpense;});
  if(inUse){
    if(!confirm('"'+name+'" is used in existing expenses. Removing it will not affect past records but it won\'t appear as an option going forward.\n\nRemove anyway?'))return;
  }
  DB.expenseCats=DB.expenseCats.filter(function(c){return c!==name;});
  saveData();renderApp();
}
function startEditExpenseCat(name){
  var el=document.getElementById('ec-label-'+btoa(name).replace(/=/g,''));
  var editEl=document.getElementById('ec-edit-'+btoa(name).replace(/=/g,''));
  if(el)el.style.display='none';
  if(editEl)editEl.style.display='flex';
}
function saveEditExpenseCat(oldName){
  var key=btoa(oldName).replace(/=/g,'');
  var inp=document.getElementById('ec-inp-'+key);
  var newName=inp?inp.value.trim():'';
  if(!newName){alert('Enter a name.');return;}
  if(newName!==oldName&&DB.expenseCats.find(function(c){return c.toLowerCase()===newName.toLowerCase();})){alert('That name already exists.');return;}
  var idx=DB.expenseCats.indexOf(oldName);
  if(idx>-1)DB.expenseCats[idx]=newName;
  // Update existing expense records with the old category name
  DB.cashflow.forEach(function(c){if(c.cat===oldName)c.cat=newName;});
  saveData();renderApp();
}
function cancelEditExpenseCat(name){
  var key=btoa(name).replace(/=/g,'');
  var el=document.getElementById('ec-label-'+key);
  var editEl=document.getElementById('ec-edit-'+key);
  if(el)el.style.display='flex';
  if(editEl)editEl.style.display='none';
}

function buildExpenses(){
  if(!canDo('expenses'))return '<div class="empty" style="padding:4rem 2rem"><div style="font-size:48px;margin-bottom:1rem">&#128274;</div><div style="font-size:16px;font-weight:700;color:var(--dark)">Access Restricted</div><p style="color:var(--text3);margin-top:8px">Ask your administrator to grant you access to Expenses.</p></div>';

  // All expenses (never Restock)
  var allExpenses=DB.cashflow.filter(function(c){return c.type==='out'&&c.cat!=='Restock'&&!c.isOverpayment;});

  // Apply filters
  var filtered=allExpenses.filter(function(c){
    if(!dateInRange(c.date, expFilterFrom, expFilterTo))return false;
    if(expFilterCat&&c.cat!==expFilterCat)return false;
    return true;
  });

  var isFiltered=expFilterFrom||expFilterTo||expFilterCat;
  var thisMonth=new Date().toISOString().slice(0,7);

  // Metrics always show ALL-TIME totals (unfiltered) for context
  var totalExp=allExpenses.reduce(function(a,c){return a+c.amount;},0);
  var monthExp=allExpenses.filter(function(c){return c.month===thisMonth;}).reduce(function(a,c){return a+c.amount;},0);

  // Category totals use FILTERED data so they reflect the current view
  var filteredTotal=filtered.reduce(function(a,c){return a+c.amount;},0);
  var catTotals={};
  filtered.forEach(function(c){if(!catTotals[c.cat])catTotals[c.cat]=0;catTotals[c.cat]+=c.amount;});
  var catRows=Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a];}).map(function(k){
    var p=filteredTotal>0?Math.round((catTotals[k]/filteredTotal)*100):0;

      '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="font-size:11px;color:var(--text3)">'+p+'%</span>'+

  var catOpts=DB.expenseCats.map(function(c){return '<option>'+c+'</option>';}).join('');
  var filterCatOpts='<option value="">All categories</option>'+DB.expenseCats.map(function(c){return '<option value="'+c+'"'+(expFilterCat===c?' selected':'')+'>'+c+'</option>';}).join('');

  // Manage categories panel

    '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">'+
    DB.expenseCats.map(function(c){
      var key=btoa(c).replace(/=/g,'');
      return '<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm)">'+
        '<div id="ec-label-'+key+'" style="display:flex;align-items:center;gap:8px;flex:1">'+
          '<span style="font-size:13px;color:var(--text);flex:1">'+c+'</span>'+
          '<button class="btn sm" style="font-size:11px;padding:2px 8px;color:var(--primary);border-color:#b6d4fe" onclick="startEditExpenseCat(\''+c.replace(/'/g,"\\'")+'\')" >&#9998;</button>'+
          '<button class="btn danger sm" style="font-size:11px;padding:2px 8px" onclick="removeExpenseCat(\''+c.replace(/'/g,"\\'")+'\')">&#10005;</button>'+
        '</div>'+
        '<div id="ec-edit-'+key+'" style="display:none;align-items:center;gap:6px;flex:1">'+
          '<input type="text" id="ec-inp-'+key+'" value="'+c+'" style="flex:1;font-size:12px;padding:4px 8px">'+
          '<button class="btn sm primary" style="font-size:11px;padding:3px 8px" onclick="saveEditExpenseCat(\''+c.replace(/'/g,"\\'")+'\')">Save</button>'+
          '<button class="btn sm" style="font-size:11px;padding:3px 8px" onclick="cancelEditExpenseCat(\''+c.replace(/'/g,"\\'")+'\')">Cancel</button>'+
        '</div>'+
      '</div>';
    }).join('')+
    '</div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      '<input type="text" id="ec-new-name" placeholder="New category name" style="flex:1;font-size:13px">'+

// ========== FINANCIAL DASHBOARD ==========
var finPeriod='daily';
function setFinPeriod(p){finPeriod=p;renderApp();}
function getDateRange(period){
  var now=new Date(),from,to=new Date(now);
  to.setHours(23,59,59,999);
  if(period==='daily'){from=new Date(now);from.setHours(0,0,0,0);}
  else if(period==='weekly'){from=new Date(now);var day=from.getDay(),diff=day===0?6:day-1;from.setDate(from.getDate()-diff);from.setHours(0,0,0,0);}
  else{from=new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0);}
  return {from:from,to:to};
}
function inRange(dateStr,range){
  if(!dateStr)return false;
  // Build an array of all date strings in the range to compare against stored format
  var d=parseDate(dateStr);
  if(!d)return false;
  // Normalise both sides to midnight for comparison
  var ds=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var fs=new Date(range.from.getFullYear(),range.from.getMonth(),range.from.getDate());
  var ts=new Date(range.to.getFullYear(),range.to.getMonth(),range.to.getDate());
  return ds>=fs&&ds<=ts;
}
function addCash(){
  var desc=document.getElementById('c-desc').value.trim(),amount=parseFloat(document.getElementById('c-amount').value)||0,type=document.getElementById('c-type').value,cat=document.getElementById('c-cat').value,pm=document.getElementById('c-paymode').value;
  var bankId=pm==='transfer'?(document.getElementById('c-bankid')?document.getElementById('c-bankid').value:''):null;
  var posId=pm==='pos'?(document.getElementById('c-posid')?document.getElementById('c-posid').value:''):null;
  if(!desc||amount<=0){alert('Fill description and amount.');return;}
  if(pm==='transfer'&&DB.banks.length&&!bankId){alert('Select the bank.');return;}
  if(pm==='pos'&&DB.posTerminals.length&&!posId){alert('Select the POS terminal.');return;}
  DB.cashflow.push({id:uid(),desc:desc,amount:amount,type:type,cat:cat,payMode:pm,bankId:bankId,posId:posId,date:new Date().toLocaleDateString(),month:new Date().toISOString().slice(0,7)});
  document.getElementById('c-desc').value='';document.getElementById('c-amount').value='';renderApp();
}

  var range=getDateRange(finPeriod);
  var periodLabel=finPeriod==='daily'?'Today':finPeriod==='weekly'?'This Week':'This Month';
  var periodSales=DB.sales.filter(function(s){return inRange(s.date,range);});
  var periodCash=DB.cashflow.filter(function(c){return inRange(c.date,range);});
  var periodPurchases=DB.purchases.filter(function(p){return inRange(p.date,range);});
  var totalRevenue=periodSales.reduce(function(a,s){return a+s.total;},0);
  var totalCOGS=periodSales.reduce(function(a,s){return a+(s.cost*s.qty);},0);
  var totalDiscounts=periodSales.reduce(function(a,s){return a+(s.discAmt||0);},0);
  var grossProfit=totalRevenue-totalCOGS;
  var grossMargin=totalRevenue>0?Math.round((grossProfit/totalRevenue)*100):0;
  var totalIn=periodCash.filter(function(c){return c.type==='in';}).reduce(function(a,c){return a+c.amount;},0);
  var totalOverpayments=periodCash.filter(function(c){return c.type==='out'&&c.isOverpayment;}).reduce(function(a,c){return a+c.amount;},0);
  var totalOut=periodCash.filter(function(c){return c.type==='out'&&!c.isOverpayment;}).reduce(function(a,c){return a+c.amount;},0);
  var netCash=totalIn-(totalOut+totalOverpayments);
  var totalPurchaseSpend=periodPurchases.reduce(function(a,p){return a+p.grandTotal;},0);
  var totalSupplierDebt=DB.suppliers.reduce(function(a,s){return a+(s.owedToSupplier||0);},0);
  var totalItemsSold=periodSales.reduce(function(a,s){return a+s.qty;},0);
  var totalInvoices=[].concat(periodSales.map(function(s){return s.invoiceNum;})).filter(function(v,i,a){return a.indexOf(v)===i;}).length;
  var creditSalesAmt=periodSales.filter(function(s){return (s.payment==='credit'||s.payment==='part')&&!s.pendingSupply;}).reduce(function(a,s){return a+s.total;},0);
  var pendingSupplyAmt=periodSales.filter(function(s){return s.pendingSupply;}).reduce(function(a,s){return a+s.total;},0);
  var pendingSupplyCount=[...new Set(periodSales.filter(function(s){return s.pendingSupply;}).map(function(s){return s.invoiceId;}))].length;
  var cashMode=periodCash.filter(function(c){return c.type==='in'&&c.payMode==='cash';}).reduce(function(a,c){return a+c.amount;},0);
  var posMode=periodCash.filter(function(c){return c.type==='in'&&c.payMode==='pos';}).reduce(function(a,c){return a+c.amount;},0);
  var transferMode=periodCash.filter(function(c){return c.type==='in'&&c.payMode==='transfer';}).reduce(function(a,c){return a+c.amount;},0);
  var totalCollected=cashMode+posMode+transferMode+creditSalesAmt+pendingSupplyAmt||1;
  var expByCategory={};
  periodCash.filter(function(c){return c.type==='out'&&!c.isOverpayment;}).forEach(function(c){var cat=c.cat||'Other';if(!expByCategory[cat])expByCategory[cat]=0;expByCategory[cat]+=c.amount;});
  if(totalOverpayments>0)expByCategory['Store Credit (Overpayments)']=totalOverpayments;

  var topItems=Object.keys(itemMap).map(function(k){return{name:k,qty:itemMap[k].qty,revenue:itemMap[k].revenue,profit:itemMap[k].profit};}).sort(function(a,b){return b.revenue-a.revenue;}).slice(0,6);
  var maxRev=topItems.length?topItems[0].revenue:1;

  var chartHtml='';

    var daysInMonth=new Date(range.to.getFullYear(),range.to.getMonth()+1,0).getDate();
    var dailyRevenue=[];
    for(var dd=1;dd<=daysInMonth;dd++){var dayD=new Date(range.from.getFullYear(),range.from.getMonth(),dd);var dayStr=dayD.toLocaleDateString();var dayRev=DB.sales.filter(function(s){return s.date===dayStr;}).reduce(function(a,s){return a+s.total;},0);dailyRevenue.push({day:dd,rev:dayRev});}
    var maxDay=Math.max.apply(null,dailyRevenue.map(function(x){return x.rev;}))||1;

  // Payment mode bars

function recordCreditPayment(id){var cust=DB.creditCustomers.find(function(c){return c.id==id;}),inp=document.getElementById('cp-'+id),amount=parseFloat(inp?inp.value:0)||0;if(!cust||amount<=0){alert('Enter amount.');return;}var actual=Math.min(amount,cust.balance);cust.balance=Math.max(0,cust.balance-actual);cust.totalPaid+=actual;cust.transactions.push({id:uid(),desc:'Payment received',amount:actual,type:'pay',date:new Date().toLocaleDateString()});DB.cashflow.push({id:uid(),desc:'Payment from '+cust.name,amount:actual,type:'in',cat:'Sales',payMode:'cash',date:new Date().toLocaleDateString(),month:new Date().toISOString().slice(0,7)});renderApp();}
function recordRegisteredCreditPayment(custId){
  var cust=DB.customers.find(function(c){return c.id==custId;});
  var inp=document.getElementById('rcp-'+custId);
  var amount=parseFloat(inp?inp.value:0)||0;
  if(!cust){alert('Customer not found.');return;}
  if(amount<=0){alert('Enter the payment amount received.');return;}

  var currentBalance=cust.creditBalance||0;
  // currentBalance > 0  = customer owes US
  // currentBalance < 0  = WE owe customer (advance/overpayment)
  var date=new Date().toLocaleDateString();
  var month=new Date().toISOString().slice(0,7);
  var msg='';

  if(currentBalance>0){
    // Customer owes us — paying some or all of their debt
    var newBalance=currentBalance-amount;

    if(Math.abs(newBalance)<0.01){
      // Exact payment — fully cleared
      cust.creditBalance=0;
      msg='✅ Payment of '+fmt(amount)+' recorded for '+cust.name+'.\n\nAccount fully cleared. Balance: ₦0';

    } else if(newBalance>0){
      // Partial payment — still owes us
      cust.creditBalance=newBalance;
      msg='✅ Payment of '+fmt(amount)+' recorded for '+cust.name+'.\n\nRemaining balance owed to you: '+fmt(newBalance);

    } else {
      // Overpayment — customer paid more than they owed
      var overpaid=Math.abs(newBalance);
      cust.creditBalance=newBalance; // negative = we owe them
      msg='✅ Payment of '+fmt(amount)+' recorded for '+cust.name+'.\n\n'+
          'Debt cleared: '+fmt(currentBalance)+'\n'+
          '⚠️ OVERPAYMENT: Customer paid '+fmt(overpaid)+' MORE than their balance.\n\n'+
          'We now owe the customer '+fmt(overpaid)+'.\n'+
          'This has been recorded as a credit in their account (store credit).';
    }
  } else if(currentBalance<0){
    // We already owe this customer — they're paying against our debt to them
    // In this case, their "payment" reduces what we owe them (or creates new debt if more)
    var weOwe=Math.abs(currentBalance);
    var newBal2=currentBalance+amount; // currentBalance is negative, adding payment reduces it
    // But wait — if we owe them, receiving payment doesn't make sense
    // This case: customer has store credit, they're now paying for a purchase using cash
    // Record as normal payment, apply against their positive store credit or add to what we owe
    cust.creditBalance=newBal2;
    if(newBal2<0){
      msg='✅ Payment of '+fmt(amount)+' recorded.\n\nWe still owe '+cust.name+': '+fmt(Math.abs(newBal2));
    } else if(newBal2===0){
      msg='✅ Payment recorded. Account balanced — ₦0 owed either way.';
    } else {
      msg='✅ Payment recorded.\n\nAfter applying against store credit, '+cust.name+' now owes: '+fmt(newBal2);
    }
  } else {
    // Balance is exactly 0 — no debt either way, this is an advance payment
    cust.creditBalance=-amount; // customer has store credit = we owe them
    msg='✅ Advance payment of '+fmt(amount)+' recorded for '+cust.name+'.\n\n'+
        'No outstanding debt existed. This has been saved as store credit.\n'+
        'We now owe the customer: '+fmt(amount);
  }

  // Record in cashflow as money coming in
  DB.cashflow.push({id:uid(),desc:'Payment from '+cust.name+(currentBalance>0?' (credit settlement)':' (advance/overpayment)'),amount:amount,type:'in',cat:'Sales',payMode:'cash',date:date,month:month});

  // Add to customer history
  cust.salesHistory.push({date:date,item:'Payment received',qty:1,total:-amount,payMode:'cash'});

  saveData();
  alert(msg);
  renderApp();
}
function buildCreditCust(){
  if(!canDo('creditcust'))return '<div class="empty">Access denied.</div>';
  var creditCustomers=DB.customers.filter(function(c){return (c.creditLimit||0)>0||(c.creditBalance||0)!==0;});
  var totalOwedToUs=DB.customers.reduce(function(a,c){return a+Math.max(0,c.creditBalance||0);},0);
  var totalWeOwe=DB.customers.reduce(function(a,c){return a+Math.abs(Math.min(0,c.creditBalance||0));},0);
  var atLimit=DB.customers.filter(function(c){return (c.creditLimit||0)>0&&(c.creditBalance||0)>=(c.creditLimit||0);}).length;

  var cards=creditCustomers.length?creditCustomers.map(function(c){
    var cb=c.creditBalance||0,cl=c.creditLimit||0;
    var weOweThem=cb<0;
    var theyOweUs=cb>0;
    var cleared=cb===0;

    // Status badge
    var status=cleared
      ?'<span class="badge ok">Cleared</span>'
      :theyOweUs
        ?(cl>0&&cb>=cl?'<span class="badge out">At limit</span>':'<span class="badge owing">Owes you '+fmt(cb)+'</span>')
        :'<span class="badge info" style="background:#dbeafe;color:#1e40af;border:1px solid #93c5fd">You owe '+fmt(Math.abs(cb))+'</span>';

    // Credit bar (only for customers who owe us)
    var bar='';
    if(cl>0&&theyOweUs){
      var up=Math.min(100,Math.round((cb/cl)*100));
      var bc=up>=100?'#dc2626':up>=70?'#d97706':'#16a34a';
      bar='<div class="cust-bar-wrap"><div class="cust-bar" style="width:'+up+'%;background:'+bc+'"></div></div>'+
          '<div style="font-size:10px;color:#888;margin-bottom:6px">'+fmt(cb)+' of '+fmt(cl)+' credit used</div>';
    }

    // Balance summary box
    var balanceBox='';
    if(weOweThem){
      balanceBox='<div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:7px;padding:8px 10px;margin-bottom:8px;font-size:12.5px">'+
        '<span style="color:#1e40af;font-weight:700">&#9432; We owe this customer '+fmt(Math.abs(cb))+'</span><br>'+
        '<span style="font-size:11px;color:#3b82f6">The customer overpaid or made an advance payment. This store credit will be applied against their next purchase, or you can refund them.</span>'+
      '</div>';
    }

    // Payment form — always show (works for credit debt, advance payment, or zero balance)
    var payLabel=theyOweUs?'Amount received (₦)':weOweThem?'Additional payment (₦)':'Record advance payment (₦)';
    var payHint=theyOweUs
      ?'<div style="font-size:11px;color:var(--text3);margin-top:4px">Outstanding: <b>'+fmt(cb)+'</b>. Paying more than this will be saved as store credit (we will owe them).</div>'
      :weOweThem
      ?'<div style="font-size:11px;color:#3b82f6;margin-top:4px">We currently owe them <b>'+fmt(Math.abs(cb))+'</b>. This will be added to the store credit.</div>'
      :'<div style="font-size:11px;color:var(--text3);margin-top:4px">No outstanding balance. Payment will be saved as store credit.</div>';

    var paySection='<div style="margin-top:8px">'+
      '<div class="pay-form">'+
        '<input type="number" id="rcp-'+c.id+'" placeholder="'+payLabel+'" min="0">'+
        '<button class="btn success" onclick="recordRegisteredCreditPayment('+c.id+')">Record payment</button>'+
      '</div>'+payHint+'</div>';

    // Invoice table
    var custSales=DB.sales.filter(function(s){return s.custId==c.id&&(s.payment==='credit'||s.payment==='part');});
    var invGroups={};
    custSales.forEach(function(s){var k=s.invoiceNum||s.id;if(!invGroups[k])invGroups[k]={invoiceNum:k,date:s.date,items:[],total:0,_s:s};invGroups[k].items.push(s);invGroups[k].total+=s.total;});
    var invRows=Object.values(invGroups).slice(0,5).map(function(g){
      var il=g.items.map(function(s){return s.name+' x'+s.qty;}).join(', ');
      return '<tr><td>'+g.date+'</td><td><b>'+g.invoiceNum+'</b></td><td style="font-size:11px">'+il+'</td><td style="text-align:right">'+fmt(g.total)+'</td><td><button class="btn sm" onclick="reprintInvoice(\''+g.invoiceNum+'\')" style="color:#1a237e;border-color:#93c5fd;font-size:11px">Print</button></td></tr>';
    }).join('');
    var invTable=invRows?'<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Date</th><th>Invoice #</th><th>Items</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>'+invRows+'</tbody></table></div>':'';

    return '<div class="card" style="border-left:4px solid '+(weOweThem?'#3b82f6':theyOweUs?'#dc3545':'#198754')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'+
      '<div><b style="font-size:14px">'+c.name+'</b>'+(c.phone?' <span style="font-size:11px;color:#888">'+c.phone+'</span>':'')+'</div>'+
      status+'</div>'+
      bar+balanceBox+paySection+invTable+
    '</div>';
  }).join(''):'<div class="empty">No customers with credit limit or outstanding balance.</div>';

  return '<div class="metrics">'+
    mc('Customers with credit',creditCustomers.length,'','')+
    mc('Customers owe you',fmt(totalOwedToUs),'Outstanding','amber')+
    mc('You owe customers',fmt(totalWeOwe),'Store credit / overpaid',totalWeOwe>0?'blue':'')+
    mc('At credit limit',atLimit,'',atLimit>0?'red':'')+
    '</div>'+
    (totalWeOwe>0?
      '<div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:8px;padding:.75rem 1rem;font-size:13px;color:#1e40af;margin-bottom:1.25rem">'+
      '<b>&#9432; You owe money to '+DB.customers.filter(function(c){return (c.creditBalance||0)<0;}).length+' customer(s)</b> — total: '+fmt(totalWeOwe)+'. These customers have overpaid or made advance payments. Their store credit will automatically reduce their next credit purchase, or you can refund them in cash.'+
      '</div>'
    :'')+
    '<div style="background:var(--blue-bg);border:1px solid rgba(59,130,246,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--blue);margin-bottom:1.25rem">'+
    'All registered customers with a credit limit appear here. To add a new credit customer, go to <button class="btn sm" onclick="switchTab(\'customers\')">Customers tab</button> and set a credit limit.</div>'+
    '<p class="sec-title">Credit accounts</p>'+cards;
}

function setReportTab(t){reportTab=t;renderApp();}
function applyReportFilters(){
  reportDateFrom=document.getElementById('r-from')?document.getElementById('r-from').value:'';
  reportDateTo=document.getElementById('r-to')?document.getElementById('r-to').value:'';
  reportStaff=document.getElementById('r-staff')?document.getElementById('r-staff').value:'';
  renderApp();
}
function filterSales(sales){
  return sales.filter(function(s){
    if(!dateInRange(s.date, reportDateFrom, reportDateTo))return false;
    if(reportStaff&&s.seller!==reportStaff)return false;
    return true;
  });
}

  } else if(reportTab==='all'){
    var allSales=filterSales(DB.sales);

    var allKeys=Object.keys(allGroups).reverse();
    var allRows=allKeys.map(function(k){var g=allGroups[k];var il=g.items.map(function(s){return s.name+' ×'+s.qty;}).join(', ');var pt=g.payment==='credit'?'<span class="badge owing">Credit</span>':g.payment==='part'?'<span class="badge low">Part</span>':'<span class="badge ok">Cash</span>';return '<tr><td>'+g.date+'</td><td><b>'+g.invoiceNum+'</b></td><td>'+g.custName+'</td><td>'+il+'</td><td style="text-align:right">'+fmt(g.total)+'</td><td style="text-align:right;color:var(--success)">'+fmt(g.profit)+'</td><td>'+pt+'</td><td>'+payModeLabel(g)+'</td><td>'+g.seller+'</td><td><button class="btn sm" onclick="reprintInvoice(\''+k+'\')" style="color:#1a237e;border-color:#93c5fd;font-size:11px">Print</button></td></tr>';}).join('');
    var im={};allSales.forEach(function(s){if(!im[s.name])im[s.name]={qty:0,rev:0};im[s.name].qty+=s.qty;im[s.name].rev+=s.total;});
    var ia=Object.keys(im).map(function(k){return{name:k,qty:im[k].qty,rev:im[k].rev};}).sort(function(a,b){return b.rev-a.rev;}).slice(0,6);
    var mr=ia.length?ia[0].rev:1;
    var bars=ia.length?ia.map(function(t){var w=Math.round((t.rev/mr)*100);return '<div class="bar-row"><span class="bar-label">'+t.name.slice(0,12)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:#3b82f6">'+fmt(t.rev)+'</div></div><span style="font-size:11px;color:#888">×'+t.qty+'</span></div>';}).join(''):'<div class="empty" style="padding:1rem">No sales.</div>';

    content='<div class="metrics">'+mc('Total revenue',fmt(allTotal),'All sales','')+mc('Total profit',fmt(allProfit),pct(allProfit,allTotal)+' margin',allProfit>=0?'green':'red')+mc('Total invoices',allKeys.length,'',' ')+mc('Items sold',allSales.reduce(function(a,s){return a+s.qty;},0),'','')+'</div>'+
      '<p class="sec-title">Top selling items</p><div style="padding:.75rem;background:#f9f9f9;border-radius:10px;margin-bottom:1.25rem">'+bars+'</div>'+
      '<p class="sec-title">Low stock alert</p>'+lh+

  } else if(reportTab==='bystaff'){

    var staffMap={};staffSales.forEach(function(s){if(!staffMap[s.seller])staffMap[s.seller]={count:0,revenue:0,profit:0,invoices:new Set()};staffMap[s.seller].count++;staffMap[s.seller].revenue+=s.total;staffMap[s.seller].profit+=s.profit;staffMap[s.seller].invoices.add(s.invoiceNum||s.id);});

function printInvoiceReport(){
  var invSales=filterSales(DB.sales);
  var invMap={};
  invSales.forEach(function(s){
    var k=s.invoiceNum||s.id;
    if(!invMap[k]){
      var partPay=s.partPayment||0;
      var cashPaid=s.payment==='cash'?s.total:s.payment==='part'?partPay:0;
      invMap[k]={invoiceNum:s.invoiceNum||' - ',date:s.date,custName:s.custName,items:[],invoiceTotal:0,cashPaid:cashPaid,profit:0,payment:s.payment,payMode:s.payMode,bankId:s.bankId,posId:s.posId,seller:s.seller,partPayment:partPay};
    }
    invMap[k].items.push(s);
    invMap[k].invoiceTotal+=s.total;
    invMap[k].profit+=s.profit;
  });
  Object.keys(invMap).forEach(function(k){
    var g=invMap[k];
    if(g.payment==='cash')g.cashPaid=g.invoiceTotal;
    if(g.payment==='part'&&g.partPayment>g.invoiceTotal)g.cashPaid=g.partPayment;
  });
  var invKeys=Object.keys(invMap).sort(function(a,b){
    return (parseDate(invMap[b].date)||0)-(parseDate(invMap[a].date)||0);
  });

  var grandInvoiceTotal=invKeys.reduce(function(a,k){return a+invMap[k].invoiceTotal;},0);
  var grandCashPaid=invKeys.reduce(function(a,k){return a+invMap[k].cashPaid;},0);
  var grandProfit=invKeys.reduce(function(a,k){return a+invMap[k].profit;},0);
  var grandCredit=invKeys.reduce(function(a,k){var g=invMap[k];return a+(g.payment==='credit'?g.invoiceTotal:g.payment==='part'?Math.max(0,g.invoiceTotal-g.partPayment):0);},0);

  var filterLabel='';
  if(reportDateFrom||reportDateTo){filterLabel+=(reportDateFrom?'From: '+reportDateFrom:'')+(reportDateFrom&&reportDateTo?' to ':reportDateTo?'Up to ':'')+( reportDateTo?reportDateTo:'');}
  if(reportStaff){filterLabel+=(filterLabel?' · ':'')+' Staff: '+reportStaff;}
  if(!filterLabel)filterLabel='All time';

  var rows=invKeys.map(function(k,i){
    var g=invMap[k];
    var payTypeStr=g.payment==='credit'?'Credit':g.payment==='part'?'Part payment':'Cash';
    var modeStr=g.payMode==='pos'?'POS':g.payMode==='transfer'?'Transfer':'Cash';
    var overpaid=g.payment==='part'&&g.partPayment>g.invoiceTotal;
    var stillOwes=g.payment==='credit'||(g.payment==='part'&&g.partPayment<g.invoiceTotal);
    var balNote=overpaid?'Store credit: +'+fmt(g.partPayment-g.invoiceTotal):stillOwes?'Owes: '+fmt(g.invoiceTotal-g.cashPaid):'';
    return '<tr>'+
      '<td style="text-align:center">'+(i+1)+'</td>'+
      '<td>'+g.date+'</td>'+
      '<td><b>'+g.invoiceNum+'</b></td>'+
      '<td>'+g.custName+'</td>'+
      '<td style="text-align:center">'+g.items.length+'</td>'+
      '<td>'+payTypeStr+'</td>'+
      '<td>'+modeStr+'</td>'+
      '<td>'+g.seller+'</td>'+
      '<td style="text-align:right;color:#666">'+fmt(g.invoiceTotal)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+(overpaid?'#198754':'#111')+'">'+fmt(g.cashPaid)+(balNote?'<div style="font-size:8.5px;font-weight:400;color:'+(overpaid?'#198754':'#c0392b')+'">'+balNote+'</div>':'')+'</td>'+
    '</tr>';
  }).join('');

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Invoice Report</title>'+
    '<style>'+
    '@page{size:A4 landscape;margin:10mm}'+
    '*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:Arial,sans-serif;font-size:11px;color:#111}'+
    '.h{border-bottom:3px solid #c0392b;padding-bottom:8px;margin-bottom:10px}'+
    '.co{font-size:16px;font-weight:900;color:#c0392b;line-height:1.2}'+
    '.gd{font-size:12px;font-weight:900;color:#f59e0b;letter-spacing:1px}'+
    '.su{font-size:8.5px;color:#1a237e;font-weight:700;margin-top:2px}'+
    '.meta{display:flex;justify-content:space-between;margin-bottom:10px;font-size:11px}'+
    '.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}'+
    '.sbox{border:1px solid #dee2e6;border-radius:6px;padding:7px 10px;text-align:center}'+
    '.slabel{font-size:8px;color:#666;text-transform:uppercase;margin-bottom:2px}'+
    '.sval{font-size:14px;font-weight:700}'+
    'table{width:100%;border-collapse:collapse}'+
    'th{background:#c0392b;color:#fff;font-size:9px;padding:5px 7px;text-align:left;border:1px solid #c0392b}'+
    'td{border:1px solid #dee2e6;padding:4px 7px;font-size:10px;vertical-align:top}'+
    'tr:nth-child(even) td{background:#f9f9f9}'+
    '.tf td{background:#e9ecef;font-weight:700;font-size:11px;border-top:2px solid #c0392b}'+
    '.r{text-align:right}.c{text-align:center}'+
    '<\/style></head><body>'+
    '<div class="h">'+
      '<div class="co">GREAT CHID ELECTRO (NIG.)</div>'+
      '<div class="gd">GLOBAL DOORS LTD</div>'+
      '<div class="su">Invoice Payment Report &nbsp;·&nbsp; Printed: '+new Date().toLocaleString()+'</div>'+
    '</div>'+
    '<div class="meta">'+
      '<div><b>Period:</b> '+filterLabel+'</div>'+
      '<div><b>Total invoices:</b> '+invKeys.length+'</div>'+
    '</div>'+
    '<div class="summary">'+
      '<div class="sbox"><div class="slabel">Total invoices</div><div class="sval">'+invKeys.length+'</div></div>'+
      '<div class="sbox" style="border-color:#a3cfbb"><div class="slabel">Cash collected</div><div class="sval" style="color:#198754">'+fmt(grandCashPaid)+'</div></div>'+
      '<div class="sbox"><div class="slabel">Invoice value</div><div class="sval" style="color:#666">'+fmt(grandInvoiceTotal)+'</div></div>'+
      '<div class="sbox" style="border-color:#f5c2c7"><div class="slabel">Credit outstanding</div><div class="sval" style="color:#c0392b">'+fmt(grandCredit)+'</div></div>'+
    '</div>'+
    '<table><thead><tr>'+
      '<th class="c" style="width:28px">#</th>'+
      '<th>Date</th>'+
      '<th>Invoice #</th>'+
      '<th>Customer</th>'+
      '<th class="c">Items</th>'+
      '<th>Pay type</th>'+
      '<th>Mode</th>'+
      '<th>By</th>'+
      '<th class="r">Invoice value (&#x20A6;)</th>'+
      '<th class="r">Amount paid (&#x20A6;)</th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr>'+
      '<td colspan="8" class="tf">GRAND TOTAL</td>'+
      '<td class="tf r" style="color:#666">'+fmt(grandInvoiceTotal)+'</td>'+
      '<td class="tf r" style="color:#198754">'+fmt(grandCashPaid)+'</td>'+
    '</tr></tfoot>'+
    '</table></body></html>';

  var w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},400);
}

function printCreditReport(){
  var creditSales=DB.sales.filter(function(s){return s.payment==='credit'||s.payment==='part';});
  var custMap={};creditSales.forEach(function(s){var k=s.custId||s.custName;if(!custMap[k])custMap[k]={name:s.custName,invoices:[],total:0};custMap[k].invoices.push(s.invoiceNum||' - ');custMap[k].total+=s.total;});
  var rows=Object.values(custMap).map(function(c){var invs=[...new Set(c.invoices)].join(', ');return '<tr><td>'+c.name+'</td><td>'+invs+'</td><td style="text-align:right">'+fmt(c.total)+'</td><td style="text-align:right;color:var(--danger)">'+fmt(DB.customers.find(function(x){return x.name===c.name;})?DB.customers.find(function(x){return x.name===c.name;}).creditBalance||0:0)+'</td></tr>';}).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Credit Report</title><style>@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,font-size:11px}.h{text-align:center;border-bottom:3px solid #c0392b;padding-bottom:8px;margin-bottom:12px}.co{font-size:18px;font-weight:900;color:#c0392b}table{width:100%;border-collapse:collapse}th{background:#c0392b;color:#fff;font-size:9px;padding:4px 6px;text-align:left}td{border:1px solid #ddd;padding:3px 6px;font-size:10px}.tr td{font-weight:700;background:#f5f5f5;border-top:2px solid #c0392b}<\/style></head><body><div class="h"><div class="co">GREAT CHID ELECTRO (NIG.)</div><p style="font-size:9px;color:#1a237e;font-weight:700">Credit Report  -  '+new Date().toLocaleString()+'</p></div><table><thead><tr><th>Customer</th><th>Invoice numbers</th><th>Total credit given</th><th>Currently owes</th></tr></thead><tbody>'+rows+'<tr class="tr"><td colspan="2">TOTAL</td><td style="text-align:right">'+fmt(creditSales.reduce(function(a,s){return a+s.total;},0))+'</td><td style="text-align:right;color:var(--danger)">'+fmt(DB.customers.reduce(function(a,c){return a+(c.creditBalance||0);},0))+'</td></tr></tbody></table></body></html>';
  var w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(function(){w.print();},400);
}


// USERS
function addUser(){var name=document.getElementById('u-name').value.trim(),username=document.getElementById('u-username').value.trim(),password=document.getElementById('u-pass').value.trim(),role=document.getElementById('u-role').value;if(!name||!username||!password){alert('Fill all fields.');return;}if(DB.users.find(function(u){return u.username===username;})){alert('Username taken.');return;}var perms={};Object.keys(ALL_PERMS).forEach(function(k){var el=document.getElementById('np-'+k);perms[k]=el?el.checked:false;});DB.users.push({id:uid(),name:name,username:username,password:password,role:role,permissions:perms});['u-name','u-username','u-pass'].forEach(function(id){document.getElementById(id).value='';});renderApp();}
function removeUser(id){if(id===1){alert('Cannot delete main admin.');return;}if(DB.currentUser&&DB.currentUser.id===id){alert('Cannot delete yourself.');return;}DB.users=DB.users.filter(function(u){return u.id!==id;});renderApp();}
function togglePerm(userId,perm){var user=DB.users.find(function(u){return u.id==userId;});if(!user||user.role==='admin')return;user.permissions[perm]=!user.permissions[perm];renderApp();}
function saveProfile(){
  var newName=document.getElementById('prof-name').value.trim();
  var newUsername=document.getElementById('prof-username').value.trim();
  var currentPass=document.getElementById('prof-current-pass').value;
  var newPass=document.getElementById('prof-new-pass').value;
  var confirmPass=document.getElementById('prof-confirm-pass').value;
  var u=DB.currentUser;
  if(!newName){alert('Name cannot be empty.');return;}
  if(!newUsername){alert('Username cannot be empty.');return;}
  var usernameTaken=DB.users.find(function(x){return x.username===newUsername&&x.id!==u.id;});
  if(usernameTaken){alert('That username is already taken by another user.');return;}
  var changingPassword=newPass||confirmPass||currentPass;
  if(changingPassword){
    if(currentPass!==u.password){alert('Current password is incorrect.');return;}
    if(!newPass){alert('Please enter a new password.');return;}
    if(newPass.length<4){alert('New password must be at least 4 characters.');return;}
    if(newPass!==confirmPass){alert('New password and confirm password do not match.');return;}
    u.password=newPass;
  }
  u.name=newName;
  u.username=newUsername;
  saveData();
  ['prof-current-pass','prof-new-pass','prof-confirm-pass'].forEach(function(id){document.getElementById(id).value='';});
  alert('Profile updated successfully!');
  renderApp();
}
